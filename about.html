<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SayonMart - Contact Us</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
.header{background:#fff;padding:16px;position:sticky;top:0;box-shadow:0 2px 10px #0001;display:flex;gap:12px;align-items:center}.back{font-size:25px;text-decoration:none;color:#c99d00}.title{font-size:20px;font-weight:700;color:#c99d00}
.container{max-width:650px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:18px;box-shadow:0 5px 18px #0001;margin-bottom:16px;border-top:4px solid #d4af37}
input,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:11px;margin:7px 0 12px;font-size:15px}textarea{height:140px;resize:vertical}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#d4af37;color:#fff;font-weight:700;font-size:16px}
.info{line-height:1.7;color:#666}.lang{float:right;border:0;background:#fff8d9;padding:7px 10px;border-radius:8px;color:#8b6b00}
</style></head>
<body>
<div class="header"><a class="back" href="profile.html">‹</a><div class="title" data-i18n="contact">Contact Us</div></div>
<div class="container">
<div class="card"><button class="lang" onclick="cycleLanguage()">🌐 <span id="langName">English</span></button>
<h2 data-i18n="title">Contact SayonMart</h2><p class="info" data-i18n="intro">Have a question or need help? Send us a message.</p>
<form onsubmit="sendMessage(event)">
<label data-i18n="name">Name</label><input id="name" required>
<label data-i18n="email">Email</label><input id="email" type="email" required>
<label data-i18n="message">Message</label><textarea id="message" required></textarea>
<button type="submit" data-i18n="send">Send Message</button>
</form></div>
<div class="card"><h3 data-i18n="support">Support</h3><p class="info" data-i18n="supportText">For order-related questions, include your order details in the message so support can understand the issue.</p></div>
</div>
<script>
const T={en:{contact:"Contact Us",title:"Contact SayonMart",intro:"Have a question or need help? Send us a message.",name:"Name",email:"Email",message:"Message",send:"Send Message",support:"Support",supportText:"For order-related questions, include your order details in the message so support can understand the issue."},
bn:{contact:"যোগাযোগ",title:"SayonMart-এর সাথে যোগাযোগ",intro:"কোনো প্রশ্ন বা সাহায্য দরকার? আমাদের একটি বার্তা পাঠান.",name:"নাম",email:"ইমেইল",message:"বার্তা",send:"বার্তা পাঠান",support:"সাপোর্ট",supportText:"অর্ডার সংক্রান্ত প্রশ্ন হলে বার্তার মধ্যে অর্ডারের তথ্য দিন, তাহলে সমস্যা বুঝতে সুবিধা হবে."},
hi:{contact:"संपर्क करें",title:"SayonMart से संपर्क",intro:"कोई सवाल है या मदद चाहिए? हमें संदेश भेजें.",name:"नाम",email:"ईमेल",message:"संदेश",send:"संदेश भेजें",support:"सपोर्ट",supportText:"ऑर्डर से जुड़े सवाल में अपने ऑर्डर की जानकारी संदेश में दें, ताकि समस्या समझने में आसानी हो."}};
let lang=localStorage.getItem("sayonmart_language")||"en";
function apply(){document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=T[lang][e.dataset.i18n]||e.textContent);document.getElementById("langName").textContent={en:"English",bn:"বাংলা",hi:"हिन्दी"}[lang];document.documentElement.lang=lang}
function cycleLanguage(){lang=lang==="en"?"bn":lang==="bn"?"hi":"en";localStorage.setItem("sayonmart_language",lang);apply()}
function sendMessage(e){e.preventDefault();alert(lang==="bn"?"আপনার বার্তা প্রস্তুত হয়েছে।":"Your message is ready to be sent.");}
apply();
</script></body></html>
