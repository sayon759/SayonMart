<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart - Admin Orders</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  padding-bottom:30px;
}

.header{
  background:#000;
  color:#FFD700;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #333;
}

.container{
  padding:15px;
}

.order-card{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.order-id{
  color:#FFD700;
  font-size:14px;
  font-weight:bold;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#4a3b00;
  color:#FFD700;
}

.confirmed{
  background:#063d25;
  color:#4cff9b;
}

.shipped{
  background:#073b55;
  color:#4dcfff;
}

.delivered{
  background:#183d08;
  color:#7dff4d;
}

.cancelled{
  background:#4a1111;
  color:#ff6b6b;
}

.product-box{
  display:flex;
  gap:12px;
  align-items:center;
  background:#111;
  padding:10px;
  border-radius:12px;
  margin-bottom:12px;
}

.product-box img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
  background:#222;
}

.product-info h3{
  margin:0 0 5px;
  font-size:16px;
}

.product-info p{
  margin:3px 0;
  color:#bbb;
  font-size:13px;
}

.info{
  border-top:1px solid #333;
  padding-top:10px;
}

.info p{
  margin:7px 0;
  font-size:14px;
}

.total{
  color:#FFD700;
  font-size:18px;
  font-weight:bold;
}

select{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#222;
  color:#fff;
  border:1px solid #555;
  border-radius:10px;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:40px 10px;
}

.loading{
  text-align:center;
  color:#FFD700;
  padding:30px;
}
</style>
</head>

<body>

<div class="header">
  📦 SayonMart Admin Orders
</div>

<div class="container">

  <div id="orders" class="loading">
    Loading Orders...
  </div>

</div>


<script type="module">

import { db, auth } from "./firebase.js";

import {
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const ordersDiv = document.getElementById("orders");

const ADMIN_UID = "fqQpbMgWScgUbu5Vco4dJ6WuBVL2";


onAuthStateChanged(auth, async (user) => {

  // Login check
  if (!user) {
    ordersDiv.innerHTML = `
      <div class="empty">
        🔒 Admin Login Required
      </div>
    `;
    return;
  }

  // Admin check
  if (user.uid !== ADMIN_UID) {
    ordersDiv.innerHTML = `
      <div class="empty">
        ❌ Access Denied<br><br>
        You are not Admin.
      </div>
    `;
    return;
  }

  loadOrders();

});


async function loadOrders(){

  try{

    const querySnapshot =
      await getDocs(collection(db, "orders"));

    ordersDiv.innerHTML = "";

    if(querySnapshot.empty){

      ordersDiv.innerHTML = `
        <div class="empty">
          📭 No Orders Found
        </div>
      `;

      return;
    }


    querySnapshot.forEach((orderDoc) => {

      const order = orderDoc.data();

      const orderId = orderDoc.id;

      const status =
        order.status || "Pending";


      const statusClass =
        status.toLowerCase();


      const productName =
        order.productName || "Product";


      const image =
        order.productImage ||
        "https://via.placeholder.com/100";


      const price =
        Number(order.price || 0);


      const quantity =
        Number(order.quantity || 1);


      const total =
        Number(
          order.total ||
          price * quantity
        );


      ordersDiv.innerHTML += `

        <div class="order-card">

          <div class="order-top">

            <div class="order-id">
              Order #${orderId.substring(0,8)}
            </div>

            <div class="status ${statusClass}">
              ${status}
            </div>

          </div>


          <div class="product-box">

            <img
              src="${image}"
              onerror="this.src='https://via.placeholder.com/100'"
            >

            <div class="product-info">

              <h3>
                ${productName}
              </h3>

              <p>
                💰 ₹${price}
              </p>

              <p>
                🔢 Quantity: ${quantity}
              </p>

            </div>

          </div>


          <div class="info">

            <p>
              👤 <b>Customer:</b>
              ${order.name || "N/A"}
            </p>

            <p>
              📞 <b>Phone:</b>
              ${order.phone || "N/A"}
            </p>

            <p>
              📍 <b>Address:</b>
              ${order.address || "N/A"}
            </p>

            <p>
              💳 <b>Payment:</b>
              ${order.paymentMethod || "N/A"}
            </p>

            <p class="total">
              💰 Total: ₹${total}
            </p>


            <select
              id="status-${orderId}"
            >

              <option value="Pending"
                ${status === "Pending" ? "selected" : ""}>
                Pending
              </option>

              <option value="Confirmed"
                ${status === "Confirmed" ? "selected" : ""}>
                Confirmed
              </option>

              <option value="Shipped"
                ${status === "Shipped" ? "selected" : ""}>
                Shipped
              </option>

              <option value="Delivered"
                ${status === "Delivered" ? "selected" : ""}>
                Delivered
              </option>

              <option value="Cancelled"
                ${status === "Cancelled" ? "selected" : ""}>
                Cancelled
              </option>

            </select>


            <button
              onclick="updateStatus('${orderId}')"
            >
              💾 Update Order Status
            </button>

          </div>

        </div>

      `;

    });


  }catch(error){

    console.error(error);

    ordersDiv.innerHTML = `
      <div class="empty">
        ❌ Orders Load Failed<br><br>
        ${error.message}
      </div>
    `;

  }

}


// Update order status
window.updateStatus = async function(orderId){

  try{

    const select =
      document.getElementById(
        "status-" + orderId
      );

    const newStatus =
      select.value;


    await updateDoc(
      doc(db, "orders", orderId),
      {
        status: newStatus
      }
    );


    alert(
      "✅ Order status updated!"
    );


    loadOrders();


  }catch(error){

    console.error(error);

    alert(
      "❌ Update failed: " +
      error.message
    );

  }

};

</script>

</body>
</html>
