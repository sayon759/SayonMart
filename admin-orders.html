<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart Admin Orders</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

.header{
  background:#000;
  color:#FFD700;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #333;
}

.container{
  padding:15px;
}

.order-card{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:16px;
  padding:15px;
  margin-bottom:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.order-id{
  color:#FFD700;
  font-size:13px;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#4b3b00;
  color:#FFD700;
}

.confirmed{
  background:#063d25;
  color:#4cff9b;
}

.shipped{
  background:#073b55;
  color:#4dcfff;
}

.delivered{
  background:#183d08;
  color:#7dff4d;
}

.cancelled{
  background:#4a1111;
  color:#ff7070;
}

.product{
  display:flex;
  gap:12px;
  background:#111;
  padding:10px;
  border-radius:12px;
  margin-bottom:12px;
}

.product img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
}

.product h3{
  margin:5px 0;
  font-size:16px;
}

.product p{
  margin:4px 0;
  color:#bbb;
  font-size:13px;
}

.info{
  border-top:1px solid #333;
  padding-top:10px;
}

.info p{
  margin:8px 0;
  font-size:14px;
}

.total{
  color:#FFD700;
  font-size:19px !important;
  font-weight:bold;
}

select{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#222;
  color:white;
  border:1px solid #555;
  border-radius:10px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#FFD700;
  color:#000;
  font-weight:bold;
  font-size:15px;
}

.cancel{
  background:#e53935;
  color:white;
}

.details{
  background:#333;
  color:white;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#aaa;
}

.loading{
  text-align:center;
  padding:30px;
  color:#FFD700;
}

</style>
</head>


<body>

<div class="header">
📦 SayonMart Admin Orders
</div>

<div class="container">

<div id="orders" class="loading">
Loading Orders...
</div>

</div>


<script type="module">

import { db, auth } from "./firebase.js";

import {
  collection,
  getDocs,
  doc,
  updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const ordersDiv =
document.getElementById("orders");


const ADMIN_UID =
"fqQpbMgWScgUbu5Vco4dJ6WuBVL2";


onAuthStateChanged(auth, async (user)=>{

  if(!user){

    ordersDiv.innerHTML=`
      <div class="empty">
        🔒 Admin Login Required
      </div>
    `;

    return;
  }


  if(user.uid !== ADMIN_UID){

    ordersDiv.innerHTML=`
      <div class="empty">
        ❌ Access Denied
        <br><br>
        This page is only for Admin.
      </div>
    `;

    return;
  }


  loadOrders();

});


async function loadOrders(){

  try{

    const snapshot =
    await getDocs(
      collection(db,"orders")
    );


    ordersDiv.innerHTML="";


    if(snapshot.empty){

      ordersDiv.innerHTML=`
        <div class="empty">
          📭 No Orders Found
        </div>
      `;

      return;
    }


    snapshot.forEach((orderDoc)=>{

      const order =
      orderDoc.data();

      const id =
      orderDoc.id;


      const status =
      order.status || "Pending";


      const statusClass =
      status.toLowerCase();


      const productName =
      order.productName || "Product";


      const image =
      order.productImage ||
      "https://via.placeholder.com/100";


      const price =
      Number(order.price || 0);


      const quantity =
      Number(order.quantity || 1);


      const total =
      Number(
        order.total ||
        price * quantity
      );


      ordersDiv.innerHTML += `

      <div class="order-card">

        <div class="top">

          <div class="order-id">
            Order #${id.substring(0,8)}
          </div>

          <div class="status ${statusClass}">
            ${status}
          </div>

        </div>


        <div class="product">

          <img
            src="${image}"
            onerror="
            this.src='https://via.placeholder.com/100'
            "
          >

          <div>

            <h3>
              ${productName}
            </h3>

            <p>
              💰 Price: ₹${price}
            </p>

            <p>
              🔢 Quantity: ${quantity}
            </p>

          </div>

        </div>


        <div class="info">

          <p>
            👤 <b>Customer:</b>
            ${order.name || "N/A"}
          </p>


          <p>
            📞 <b>Phone:</b>
            ${order.phone || "N/A"}
          </p>


          <p>
            📍 <b>Address:</b>
            ${order.address || "N/A"}
          </p>


          <p>
            💳 <b>Payment:</b>
            ${order.paymentMethod || "N/A"}
          </p>


          <p class="total">
            💰 Total: ₹${total}
          </p>


          <button
            class="details"
            onclick="showDetails(
              '${id}',
              '${productName}',
              '${order.name || "N/A"}',
              '${order.phone || "N/A"}',
              '${order.address || "N/A"}',
              '${status}',
              '${total}'
            )"
          >
            👁️ View Order Details
          </button>


          <select
            id="status-${id}"
          >

            <option
              value="Pending"
              ${status==="Pending"?"selected":""}
            >
              Pending
            </option>

            <option
              value="Confirmed"
              ${status==="Confirmed"?"selected":""}
            >
              Confirmed
            </option>

            <option
              value="Shipped"
              ${status==="Shipped"?"selected":""}
            >
              Shipped
            </option>

            <option
              value="Delivered"
              ${status==="Delivered"?"selected":""}
            >
              Delivered
            </option>

            <option
              value="Cancelled"
              ${status==="Cancelled"?"selected":""}
            >
              Cancelled
            </option>

          </select>


          <button
            onclick="updateStatus('${id}')"
          >
            💾 Update Status
          </button>


          <button
            class="cancel"
            onclick="cancelOrder('${id}')"
          >
            ❌ Cancel Order
          </button>

        </div>

      </div>

      `;

    });


  }catch(error){

    console.error(error);

    ordersDiv.innerHTML=`

      <div class="empty">

        ❌ Orders Load Failed

        <br><br>

        ${error.message}

      </div>

    `;

  }

}


/* Update Status */

window.updateStatus =
async function(id){

  try{

    const select =
    document.getElementById(
      "status-"+id
    );


    await updateDoc(
      doc(db,"orders",id),
      {
        status:select.value
      }
    );


    alert(
      "✅ Order status updated!"
    );


    loadOrders();


  }catch(error){

    alert(
      "❌ Update failed: "+
      error.message
    );

  }

};


/* Cancel Order */

window.cancelOrder =
async function(id){

  const confirmCancel =
  confirm(
    "Are you sure you want to cancel this order?"
  );


  if(!confirmCancel){

    return;

  }


  try{

    await updateDoc(
      doc(db,"orders",id),
      {
        status:"Cancelled"
      }
    );


    alert(
      "❌ Order Cancelled"
    );


    loadOrders();


  }catch(error){

    alert(
      "❌ Cancel failed: "+
      error.message
    );

  }

};


/* Order Details */

window.showDetails =
function(
  id,
  product,
  customer,
  phone,
  address,
  status,
  total
){

  alert(

`📦 ORDER DETAILS

Order ID:
${id}

👤 Customer:
${customer}

📞 Phone:
${phone}

📦 Product:
${product}

📍 Address:
${address}

📦 Status:
${status}

💰 Total:
₹${total}`

  );

};

</script>

</body>
</html>
