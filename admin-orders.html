<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>SayonMart - My Orders</title>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

.header{
  background:#000;
  color:#FFD700;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #333;
}

.container{
  padding:15px;
}

.order-card{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:16px;
  padding:15px;
  margin-bottom:18px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.order-id{
  color:#FFD700;
  font-size:13px;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  text-align:center;
}

.pending{
  background:#4b3b00;
  color:#FFD700;
}

.confirmed{
  background:#063d25;
  color:#4cff9b;
}

.packed{
  background:#34205c;
  color:#c99cff;
}

.shipped{
  background:#073b55;
  color:#4dcfff;
}

.out-for-delivery{
  background:#573700;
  color:#ffb84d;
}

.delivered{
  background:#183d08;
  color:#7dff4d;
}

.cancelled{
  background:#4a1111;
  color:#ff7070;
}


/* Product */

.product{
  display:flex;
  gap:12px;
  margin-top:14px;
  background:#111;
  padding:10px;
  border-radius:12px;
}

.product img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
}

.product h3{
  margin:5px 0;
  font-size:16px;
}

.product p{
  margin:5px 0;
  color:#bbb;
  font-size:13px;
}

.total{
  color:#FFD700;
  font-size:18px;
  font-weight:bold;
}


/* Tracking */

.tracking{
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid #333;
}

.track-title{
  color:#FFD700;
  font-weight:bold;
  margin-bottom:20px;
}

.steps{
  display:flex;
  justify-content:space-between;
  position:relative;
}

.steps:before{
  content:"";
  position:absolute;
  top:15px;
  left:6%;
  right:6%;
  height:3px;
  background:#444;
  z-index:0;
}

.step{
  text-align:center;
  width:16.66%;
  position:relative;
  z-index:1;
}

.circle{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#333;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
}

.step.done .circle{
  background:#4cff9b;
  color:#000;
}

.step.current .circle{
  background:#FFD700;
  color:#000;
}

.step p{
  font-size:8px;
  color:#777;
  margin-top:7px;
  line-height:1.2;
}

.step.done p,
.step.current p{
  color:#fff;
}


/* Details */

.details-btn{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#333;
  color:#fff;
  font-weight:bold;
}


/* Empty */

.empty{
  text-align:center;
  color:#aaa;
  padding:50px 10px;
}

.loading{
  text-align:center;
  color:#FFD700;
  padding:40px;
}


/* Bottom */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#000;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.bottom a{
  text-decoration:none;
  color:#888;
  text-align:center;
  font-size:11px;
}

.bottom a div{
  font-size:21px;
  margin-bottom:3px;
}

.bottom a.active{
  color:#FFD700;
}


/* Mobile */

@media(max-width:380px){

  .step p{
    font-size:7px;
  }

  .circle{
    width:27px;
    height:27px;
  }

}

</style>

</head>


<body>


<div class="header">
📦 My Orders
</div>


<div class="container">

<div id="orders" class="loading">
Loading Orders...
</div>

</div>


<nav class="bottom">

<a href="index.html">
<div>⌂</div>
Home
</a>

<a href="products.html">
<div>▦</div>
Products
</a>

<a href="cart.html">
<div>🛒</div>
Cart
</a>

<a href="order.html" class="active">
<div>📦</div>
Orders
</a>

<a href="profile.html">
<div>♙</div>
Profile
</a>

</nav>


<script type="module">


import {
  db,
  auth
}
from "./firebase.js";


import {
  collection,
  getDocs,
  query,
  where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const ordersDiv =
document.getElementById("orders");


/*
  AUTH
*/

onAuthStateChanged(
  auth,
  async (user)=>{

    if(!user){

      ordersDiv.innerHTML=`

        <div class="empty">

          🔒 Please Login First

          <br><br>

          <button
            onclick="location.href='login.html'"
            style="
              padding:12px 25px;
              background:#FFD700;
              border:0;
              border-radius:10px;
              font-weight:bold;
            "
          >
            Login
          </button>

        </div>

      `;

      return;
    }


    loadOrders(user.uid);

  }
);


/*
  LOAD ORDERS
*/

async function loadOrders(uid){

  try{

    const q =
      query(
        collection(db,"orders"),
        where("userId","==",uid)
      );


    const snapshot =
      await getDocs(q);


    ordersDiv.innerHTML="";


    if(snapshot.empty){

      ordersDiv.innerHTML=`

        <div class="empty">

          📭 No Orders Yet

          <br><br>

          <button
            onclick="location.href='products.html'"
            style="
              padding:12px 25px;
              background:#FFD700;
              border:0;
              border-radius:10px;
              font-weight:bold;
            "
          >
            Start Shopping
          </button>

        </div>

      `;

      return;
    }


    let orders=[];


    snapshot.forEach(
      orderDoc=>{

        orders.push({

          id:orderDoc.id,

          data:orderDoc.data()

        });

      }
    );


    /*
      Newest first
    */

    orders.sort((a,b)=>{

      const aTime =
        a.data.createdAt?.seconds || 0;

      const bTime =
        b.data.createdAt?.seconds || 0;

      return bTime-aTime;

    });


    /*
      SHOW
    */

    orders.forEach(item=>{

      const order =
        item.data;

      const id =
        item.id;


      const status =
        order.status || "Pending";


      const productName =
        order.productName ||
        "Product";


      const image =
        order.productImage ||
        "https://via.placeholder.com/100";


      const price =
        Number(order.price || 0);


      const quantity =
        Number(order.quantity || 1);


      const total =
        Number(
          order.total ||
          price * quantity
        );


      ordersDiv.innerHTML += `

        <div class="order-card">


          <div class="order-top">

            <div class="order-id">
              Order #${esc(id.substring(0,8))}
            </div>

            <div class="
              status
              ${statusClass(status)}
            ">
              ${esc(status)}
            </div>

          </div>


          <div class="product">

            <img
              src="${esc(image)}"
              onerror="
                this.onerror=null;
                this.src='https://via.placeholder.com/100';
              "
            >

            <div>

              <h3>
                ${esc(productName)}
              </h3>

              <p>
                💰 ₹${price}
              </p>

              <p>
                🔢 Quantity: ${quantity}
              </p>

            </div>

          </div>


          <p class="total">
            Total: ₹${total}
          </p>


          ${
            status === "Cancelled"

            ?

            `

            <div class="tracking">

              <div class="track-title">
                ❌ Order Cancelled
              </div>

            </div>

            `

            :

            `

            <div class="tracking">

              <div class="track-title">
                🚚 Order Tracking
              </div>


              <div class="steps">


                ${trackingStep(
                  "Pending",
                  status,
                  1
                )}


                ${trackingStep(
                  "Confirmed",
                  status,
                  2
                )}


                ${trackingStep(
                  "Packed",
                  status,
                  3
                )}


                ${trackingStep(
                  "Shipped",
                  status,
                  4
                )}


                ${trackingStep(
                  "Out for Delivery",
                  status,
                  5
                )}


                ${trackingStep(
                  "Delivered",
                  status,
                  6
                )}


              </div>

            </div>

            `

          }


          <button
            class="details-btn"
            onclick="showDetails(
              '${escAttr(id)}',
              '${escAttr(productName)}',
              '${escAttr(order.name || "N/A")}',
              '${escAttr(order.phone || "N/A")}',
              '${escAttr(order.address || "N/A")}',
              '${escAttr(status)}',
              '${total}'
            )"
          >
            👁️ View Order Details
          </button>


        </div>

      `;

    });

  }

  catch(error){

    console.error(error);


    ordersDiv.innerHTML=`

      <div class="empty">

        ❌ Orders Load Failed

        <br><br>

        ${esc(error.message)}

      </div>

    `;

  }

}


/*
  TRACKING
*/

function trackingStep(
  name,
  currentStatus,
  stepNumber
){

  const current =
    getStep(currentStatus);


  let className = "";


  if(stepNumber < current){

    className = "done";

  }

  else if(stepNumber === current){

    className = "current";

  }


  return `

    <div class="step ${className}">

      <div class="circle">

        ${
          stepNumber <= current
          ? "✓"
          : stepNumber
        }

      </div>

      <p>
        ${esc(name)}
      </p>

    </div>

  `;

}


/*
  STATUS NUMBER
*/

function getStep(status){

  switch(status){

    case "Pending":
      return 1;

    case "Confirmed":
      return 2;

    case "Packed":
      return 3;

    case "Shipped":
      return 4;

    case "Out for Delivery":
      return 5;

    case "Delivered":
      return 6;

    default:
      return 0;

  }

}


/*
  STATUS CSS CLASS
*/

function statusClass(status){

  return String(status)
    .toLowerCase()
    .replaceAll(" ","-");

}


/*
  DETAILS
*/

window.showDetails =
function(
  id,
  product,
  customer,
  phone,
  address,
  status,
  total
){

  alert(

`📦 ORDER DETAILS

Order ID:
${id}

📦 Product:
${product}

👤 Customer:
${customer}

📞 Phone:
${phone}

📍 Address:
${address}

📦 Status:
${status}

💰 Total:
₹${total}`

  );

};


/*
  SECURITY HELPERS
*/

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escAttr(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g," ");

}

</script>

</body>
</html>
