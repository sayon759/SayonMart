<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SayonMart Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>🛠️ SayonMart Admin</h2>
</header>

<div class="admin-box">

  <h2>➕ Add New Product</h2>

  <input id="productName" type="text" placeholder="Product Name">

  <input id="productPrice" type="number" placeholder="Price ₹">

  <input id="productImage" type="text"
         placeholder="Product Image URL">

  <select id="productCategory">
    <option value="Fashion">👕 Fashion</option>
    <option value="Shoes">👟 Shoes</option>
    <option value="Mobiles">📱 Mobiles</option>
    <option value="Watches">⌚ Watches</option>
  </select>

  <button onclick="addProduct()">
    ➕ Add Product
  </button>

  <hr>

  <h2>📦 Products</h2>

  <div id="productList"></div>

  <hr>

  <button onclick="window.location.href='admin-orders.html'">
    📦 View Orders
  </button>

  <button onclick="window.location.href='index.html'">
    🏠 Back Home
  </button>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const productList = document.getElementById("productList");


// LOAD PRODUCTS
async function loadProducts() {

  productList.innerHTML = "";

  const snapshot =
    await getDocs(collection(db, "products"));

  snapshot.forEach((item) => {

    const product = item.data();

    productList.innerHTML += `

      <div class="card">

        <img
          src="${product.image}"
          style="width:120px;height:120px;object-fit:cover;border-radius:10px;"
        >

        <h3>${product.name}</h3>

        <p>💰 ₹${product.price}</p>

        <p>📂 ${product.category}</p>

        <button
          onclick="deleteProduct('${item.id}')">
          🗑️ Delete
        </button>

      </div>

    `;

  });

}


// ADD PRODUCT
window.addProduct = async function() {

  const name =
    document.getElementById("productName").value.trim();

  const price =
    document.getElementById("productPrice").value;

  const image =
    document.getElementById("productImage").value.trim();

  const category =
    document.getElementById("productCategory").value;


  if (!name || !price || !image) {

    alert("সব তথ্য পূরণ করো");

    return;

  }


  await addDoc(collection(db, "products"), {

    name: name,

    price: Number(price),

    image: image,

    category: category,

    createdAt: new Date()

  });


  alert("✅ Product Added");


  document.getElementById("productName").value = "";

  document.getElementById("productPrice").value = "";

  document.getElementById("productImage").value = "";


  loadProducts();

};


// DELETE PRODUCT
window.deleteProduct = async function(id) {

  if (!confirm("এই Product Delete করতে চাও?")) {

    return;

  }


  await deleteDoc(doc(db, "products", id));


  alert("🗑️ Product Deleted");


  loadProducts();

};


loadProducts();

</script>

</body>
    </html>
