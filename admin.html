<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart Admin Panel</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
  min-height:100vh;
}

header{
  background:#000;
  color:#FFD700;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.box{
  background:#1d1d1d;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
}

h2{
  color:#FFD700;
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:13px;
  border:none;
  border-radius:9px;
  background:#292929;
  color:white;
  font-size:15px;
}

input:focus{
  outline:2px solid #FFD700;
}

button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn{
  background:#FFD700;
  color:#111;
}

.confirm-btn{
  background:#00c853;
  color:white;
}

.orders-btn{
  background:#673ab7;
  color:white;
}

.home-btn{
  background:#333;
  color:#FFD700;
  border:1px solid #FFD700;
}

#status{
  text-align:center;
  margin-top:15px;
  color:#00e676;
  font-weight:bold;
}

.menu-title{
  color:#FFD700;
  margin-bottom:5px;
}

.menu-text{
  color:#aaa;
  font-size:14px;
  margin-bottom:15px;
}

</style>

</head>


<body>


<header>
  🛒 SayonMart Admin Panel
</header>


<div class="container">


  <!-- PRODUCT -->
  <div class="box">

    <h2>➕ Add Product</h2>

    <label>
      Product Name
    </label>

    <input
      id="productName"
      type="text"
      placeholder="Product Name"
    >


    <label>
      Product Price
    </label>

    <input
      id="productPrice"
      type="number"
      placeholder="Product Price"
    >


    <label>
      Image URL
    </label>

    <input
      id="productImage"
      type="text"
      placeholder="https://..."
    >


    <button
      class="add-btn"
      onclick="addProduct()"
    >
      ➕ Add Product
    </button>


    <div id="status"></div>

  </div>


  <!-- ORDER MANAGEMENT -->
  <div class="box">

    <h2 class="menu-title">
      📦 Order Management
    </h2>

    <p class="menu-text">
      Customer-এর order এখান থেকে manage করুন।
    </p>


    <button
      class="confirm-btn"
      onclick="location.href='confirm-orders.html'"
    >
      ✅ Confirm Orders
    </button>


    <button
      class="orders-btn"
      onclick="location.href='admin-orders.html'"
    >
      📋 All Orders
    </button>

  </div>


  <!-- HOME -->
  <div class="box">

    <button
      class="home-btn"
      onclick="location.href='index.html'"
    >
      🏠 Home
    </button>

  </div>


</div>


<script type="module">


import { auth, db } from "./firebase.js";


import {
  collection,
  addDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



/* ==========================
   ADMIN UID
========================== */


const ADMIN_UID =
"fqQpbMgWScgUbu5Vco4dJ6WuBVL2";



/* ==========================
   CHECK ADMIN
========================== */


onAuthStateChanged(auth, user => {

  if(
    !user ||
    user.uid !== ADMIN_UID
  ){

    alert(
      "❌ শুধু Admin এই page ব্যবহার করতে পারবেন।"
    );

    location.href =
      "index.html";

  }

});



/* ==========================
   ADD PRODUCT
========================== */


window.addProduct =
async function(){

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );


  const image =
    document
      .getElementById("productImage")
      .value
      .trim();



  if(!name){

    alert(
      "Product Name দিন।"
    );

    return;

  }



  if(!price || price <= 0){

    alert(
      "সঠিক Product Price দিন।"
    );

    return;

  }



  if(!image){

    alert(
      "Image URL দিন।"
    );

    return;

  }



  try{

    document
      .getElementById("status")
      .textContent =
      "Product যোগ হচ্ছে...";



    await addDoc(
      collection(
        db,
        "products"
      ),
      {

        name:
          name,

        price:
          price,

        image:
          image,

        createdAt:
          serverTimestamp()

      }
    );



    alert(
      "✅ Product সফলভাবে Add হয়েছে!"
    );



    document
      .getElementById("productName")
      .value = "";



    document
      .getElementById("productPrice")
      .value = "";



    document
      .getElementById("productImage")
      .value = "";



    document
      .getElementById("status")
      .textContent =
      "✅ Product Added";



  }catch(error){

    console.error(error);


    alert(
      "❌ Product Add হয়নি:\n" +
      error.message
    );


    document
      .getElementById("status")
      .textContent =
      "";

  }

}

</script>


</body>

</html>

এখন "admin.html" খুললে Add Product-এর নিচে "✅ Confirm Orders" button দেখা যাবে।

ওই button চাপলে সরাসরি "confirm-orders.html" খুলবে, যেখানে Pending order-এর পাশে Confirm করার ব্যবস্থা থাকবে।
