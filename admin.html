<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SayonMart Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

.header{
  background:#0b1728;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #20324b;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#ffd21f;
}

.logo small{
  display:block;
  color:#aaa;
  font-size:12px;
  margin-top:3px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.title{
  font-size:28px;
  font-weight:bold;
  margin:10px 0 5px;
}

.subtitle{
  color:#9ca9ba;
  margin-bottom:20px;
}

.card{
  background:#0d1b2e;
  border:1px solid #203653;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
}

h2{
  margin-top:0;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

label{
  display:block;
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:6px;
}

input,select{
  width:100%;
  padding:13px;
  background:#0a1627;
  color:white;
  border:1px solid #315070;
  border-radius:8px;
  outline:none;
}

input:focus,select:focus{
  border-color:#2196ff;
}

.image-row{
  display:flex;
  gap:15px;
  align-items:end;
  margin-top:15px;
}

.image-box{
  flex:1;
}

.preview{
  width:120px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #315070;
  display:none;
}

.add-btn{
  background:#19d875;
  color:#07111f;
  border:0;
  border-radius:9px;
  padding:14px 25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn:hover{
  opacity:.9;
}

.search-row{
  display:flex;
  gap:12px;
}

.search-row input{
  flex:1;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.product{
  background:#101f34;
  border:1px solid #263e5b;
  border-radius:12px;
  overflow:hidden;
}

.product img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.product-info{
  padding:13px;
}

.product-name{
  font-weight:bold;
  font-size:16px;
  margin-bottom:7px;
}

.category{
  color:#8fa2b8;
  font-size:13px;
}

.price{
  color:#19e078;
  font-size:18px;
  font-weight:bold;
  margin:8px 0;
}

.buttons{
  display:flex;
  gap:7px;
}

.edit,.delete{
  flex:1;
  padding:9px;
  border:0;
  border-radius:7px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.edit{
  background:#168cff;
}

.delete{
  background:#f2294b;
}

#message{
  margin-top:12px;
  color:#19e078;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#9ca9ba;
  padding:30px;
}

@media(max-width:800px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .products{
    grid-template-columns:1fr 1fr;
  }

  .product img{
    height:130px;
  }

  .image-row{
    flex-direction:column;
    align-items:stretch;
  }

  .preview{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    🛒 SayonMart
    <small>Admin Panel</small>
  </div>
  <div>⚙️</div>
</div>

<div class="container">

  <div class="title">📦 Product Management</div>
  <div class="subtitle">
    Add, edit and manage your store products
  </div>

  <!-- ADD PRODUCT -->

  <div class="card">

    <h2 id="formTitle">➕ Add New Product</h2>

    <div class="form-grid">

      <div>
        <label>Product Name</label>
        <input id="name" placeholder="Enter product name">
      </div>

      <div>
        <label>Price (₹)</label>
        <input id="price" type="number" placeholder="Enter price">
      </div>

      <div>
        <label>Category</label>
        <select id="category">
          <option value="">Select category</option>
          <option>Fashion</option>
          <option>Shoes</option>
          <option>Mobiles</option>
          <option>Watches</option>
          <option>Electronics</option>
          <option>Other</option>
        </select>
      </div>

    </div>

    <div class="image-row">

      <div class="image-box">
        <label>Image URL</label>
        <input
          id="image"
          placeholder="https://example.com/photo.jpg"
        >
      </div>

      <img id="preview" class="preview">

      <button id="saveBtn" class="add-btn">
        ＋ Add Product
      </button>

    </div>

    <div id="message"></div>

  </div>


  <!-- SEARCH -->

  <div class="card">

    <div class="search-row">
      <input
        id="search"
        placeholder="🔍 Search products..."
      >

      <select id="filterCategory">
        <option value="">All Categories</option>
        <option>Fashion</option>
        <option>Shoes</option>
        <option>Mobiles</option>
        <option>Watches</option>
        <option>Electronics</option>
        <option>Other</option>
      </select>
    </div>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>🛍️ All Products</h2>

    <div id="productList" class="products">
      Loading products...
    </div>

  </div>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


let products = [];
let editingId = null;

const nameInput = document.getElementById("name");
const priceInput = document.getElementById("price");
const imageInput = document.getElementById("image");
const categoryInput = document.getElementById("category");

const saveBtn = document.getElementById("saveBtn");
const productList = document.getElementById("productList");
const searchInput = document.getElementById("search");
const filterCategory = document.getElementById("filterCategory");
const preview = document.getElementById("preview");
const message = document.getElementById("message");


/* LOGIN CHECK */

onAuthStateChanged(auth, user => {

  if(!user){

    alert("আগে Login করো");

    location.href="login.html";

    return;
  }

  loadProducts();

});


/* IMAGE PREVIEW */

imageInput.addEventListener("input",()=>{

  const url=imageInput.value.trim();

  if(url){

    preview.src=url;
    preview.style.display="block";

  }else{

    preview.style.display="none";

  }

});


/* ADD / EDIT */

saveBtn.addEventListener("click",async()=>{

  const name=nameInput.value.trim();
  const price=Number(priceInput.value);
  const image=imageInput.value.trim();
  const category=categoryInput.value;

  if(!name || !price || !image || !category){

    message.innerText="⚠️ সব তথ্য পূরণ করো";

    return;
  }

  try{

    saveBtn.disabled=true;

    if(editingId){

      await updateDoc(
        doc(db,"products",editingId),
        {
          name,
          price,
          image,
          category,
          updatedAt:serverTimestamp()
        }
      );

      message.innerText="✅ Product Updated";

      editingId=null;

      document.getElementById("formTitle").innerText=
        "➕ Add New Product";

      saveBtn.innerText="＋ Add Product";

    }else{

      await addDoc(
        collection(db,"products"),
        {
          name,
          price,
          image,
          category,
          createdAt:serverTimestamp()
        }
      );

      message.innerText="✅ Product Added";

    }

    clearForm();

    loadProducts();

  }catch(error){

    console.error(error);

    message.innerText=
      "❌ Error: "+error.message;

  }

  saveBtn.disabled=false;

});


/* LOAD PRODUCTS */

async function loadProducts(){

  productList.innerHTML="Loading products...";

  try{

    const snapshot=
      await getDocs(collection(db,"products"));

    products=[];

    snapshot.forEach(item=>{

      products.push({
        id:item.id,
        ...item.data()
      });

    });

    displayProducts();

  }catch(error){

    console.error(error);

    productList.innerHTML=
      "<div class='empty'>❌ Products load হয়নি</div>";

  }

}


/* DISPLAY */

function displayProducts(){

  const search=
    searchInput.value.toLowerCase().trim();

  const cat=
    filterCategory.value;

  const filtered=products.filter(p=>{

    const matchName=
      (p.name||"")
      .toLowerCase()
      .includes(search);

    const matchCat=
      !cat || p.category===cat;

    return matchName && matchCat;

  });


  if(filtered.length===0){

    productList.innerHTML=
      "<div class='empty'>📦 No Products Found</div>";

    return;
  }


  productList.innerHTML="";


  filtered.forEach(p=>{

    const card=document.createElement("div");

    card.className="product";

    card.innerHTML=`

      <img
        src="${p.image||""}"
        onerror="this.src='https://via.placeholder.com/300'"
      >

      <div class="product-info">

        <div class="product-name">
          ${p.name||"Product"}
        </div>

        <div class="category">
          📂 ${p.category||"Other"}
        </div>

        <div class="price">
          ₹${p.price||0}
        </div>

        <div class="buttons">

          <button
            class="edit"
            data-id="${p.id}">
            ✏️ Edit
          </button>

          <button
            class="delete"
            data-id="${p.id}">
            🗑️ Delete
          </button>

        </div>

      </div>
    `;

    productList.appendChild(card);

  });


  /* EDIT */

  document.querySelectorAll(".edit")
  .forEach(btn=>{

    btn.onclick=()=>{

      const p=
        products.find(x=>x.id===btn.dataset.id);

      if(!p)return;

      editingId=p.id;

      nameInput.value=p.name||"";
      priceInput.value=p.price||"";
      imageInput.value=p.image||"";
      categoryInput.value=p.category||"";

      document.getElementById("formTitle").innerText=
        "✏️ Edit Product";

      saveBtn.innerText=
        "💾 Update Product";

      if(p.image){

        preview.src=p.image;
        preview.style.display="block";

      }

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    };

  });


  /* DELETE */

  document.querySelectorAll(".delete")
  .forEach(btn=>{

    btn.onclick=async()=>{

      if(!confirm("এই Product Delete করতে চাও?"))
        return;

      try{

        await deleteDoc(
          doc(db,"products",btn.dataset.id)
        );

        message.innerText=
          "🗑️ Product Deleted";

        loadProducts();

      }catch(error){

        message.innerText=
          "❌ Delete Error";

      }

    };

  });

}


/* SEARCH */

searchInput.addEventListener(
  "input",
  displayProducts
);

filterCategory.addEventListener(
  "change",
  displayProducts
);


/* CLEAR */

function clearForm(){

  nameInput.value="";
  priceInput.value="";
  imageInput.value="";
  categoryInput.value="";

  preview.style.display="none";

}

</script>

</body>
</html>
