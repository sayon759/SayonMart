header{

/* =========================================

import {

/* =========================================
   ADMIN UID
========================================= */

const ADMIN_UID =
"fqQpbMgWScgUbu5Vco4dJ6WuBVL2";


/* =========================================
   ELEMENTS
========================================= */

const bannerImage =
document.getElementById("bannerImage");

const bannerPreview =
document.getElementById("bannerPreview");

const previewText =
document.getElementById("previewText");

const bannerTitle =
document.getElementById("bannerTitle");

const bannerDescription =
document.getElementById("bannerDescription");

const bannerButton =
document.getElementById("bannerButton");

const bannerLink =
document.getElementById("bannerLink");

document.getElementById("bannerProgressBox");

document.getElementById("bannerProgressBar");

document.getElementById("bannerProgressText");

/* =========================================
   AUTH CHECK
========================================= */

onAuthStateChanged(auth, user => {

  if(!user){

    alert("Please login as admin.");

    location.href =
    "login.html";

    return;
  }


  if(user.uid !== ADMIN_UID){

    alert("You are not an admin.");

    location.href =
    "index.html";

    return;
  }


  showStatus(
    document.getElementById("adminStatus"),
    "✅ Admin login successful",
    "success"
  );


  loadBanners();
  loadProducts();

});


/* =========================================
   STATUS
========================================= */

function showStatus(element,text,type){

  element.textContent = text;

  element.className =
  "status " + type;

  element.style.display =
  "block";

}


function hideStatus(element){

  element.style.display =
  "none";

}


/* =========================================
   IMAGE COMPRESSION
   FIRESTORE VERSION
========================================= */

function compressBannerImage(file){

  return new Promise((resolve,reject)=>{

    if(!file){

      reject(
        new Error("Image পাওয়া যায়নি।")
      );

      return;
    }


    const reader =
    new FileReader();


    reader.onload = event => {

      const img =
      new Image();


      img.onload = () => {

        let width =
        img.width;

        let height =
        img.height;


        /*
          Firestore document limit
          প্রায় 1 MB.

          তাই banner image
          ছোট করে রাখা হচ্ছে.
        */

        const maxWidth =
        900;


        if(width > maxWidth){

          height =
          height *
          maxWidth /
          width;

          width =
          maxWidth;

        }


        const canvas =
        document.createElement(
          "canvas"
        );


        canvas.width =
        width;

        canvas.height =
        height;


        const ctx =
        canvas.getContext("2d");


        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        /*
          JPEG quality 0.55
          রাখছি যাতে Firestore
          document বড় না হয়.
        */

        let dataUrl =
        canvas.toDataURL(
          "image/jpeg",
          0.55
        );


        /*
          যদি এখনও বেশি বড় হয়,
          আরও compress করা হবে.
        */

        if(dataUrl.length > 900000){

          dataUrl =
          canvas.toDataURL(
            "image/jpeg",
            0.40
          );

        }


        /*
          এখনও খুব বড় হলে
          error.
        */

        if(dataUrl.length > 950000){

          reject(
            new Error(
              "ছবিটি অনেক বড়। অন্য একটি ছোট ছবি নির্বাচন করুন।"
            )
          );

          return;
        }


        resolve(dataUrl);

      };


      img.onerror = () => {

        reject(
          new Error(
            "ছবিটি পড়া যায়নি।"
          )
        );

      };


      img.src =
      event.target.result;

    };


    reader.onerror = () => {

      reject(
        new Error(
          "Gallery image পড়তে সমস্যা হয়েছে।"
        )
      );

    };


    reader.readAsDataURL(file);

  });

}


/* =========================================
   BANNER IMAGE PREVIEW
========================================= */

bannerImage.addEventListener(
  "change",
  () => {

    const file =
    bannerImage.files[0];


    if(!file){

      bannerPreview.style.display =
      "none";

      previewText.style.display =
      "block";

      return;
    }


    const reader =
    new FileReader();


    reader.onload = e => {

      bannerPreview.src =
      e.target.result;

      bannerPreview.style.display =
      "block";

      previewText.style.display =
      "none";

    };


    reader.readAsDataURL(file);

  }
);


/* =========================================
   PROGRESS
========================================= */

function setBannerProgress(percent){

  bannerProgressBox.style.display =
  "block";

  bannerProgressBar.style.width =
  percent + "%";

  bannerProgressText.textContent =
  percent + "%";

}


/* =========================================
   SAVE BANNER
   NO FIREBASE STORAGE
========================================= */

saveBannerBtn.addEventListener(
  "click",
  saveBanner
);


async function saveBanner(){

  try{

    hideStatus(bannerStatus);


    const title =
    bannerTitle.value.trim();

    const description =
    bannerDescription.value.trim();

    const button =
    bannerButton.value.trim();

    const link =
    bannerLink.value.trim();

    const file =
    bannerImage.files[0];


    if(!title){

      showStatus(
        bannerStatus,
        "❌ Banner title দিন।",
        "error"
      );

      return;
    }


    /*
      New banner needs image.
      Editing banner can use old image.
    */

    if(!file &&
       !editingBannerImage.value){

      showStatus(
        bannerStatus,
        "❌ Banner image নির্বাচন করুন।",
        "error"
      );

      return;
    }


    saveBannerBtn.disabled =
    true;

    saveBannerBtn.textContent =
    "Saving...";


    setBannerProgress(0);


    let imageData =
    editingBannerImage.value;


    /*
      Gallery image থাকলে
      compress করে data URL বানাবে.
    */

    if(file){

      setBannerProgress(10);


      /*
        ছোট delay যাতে
        progress দেখা যায়.
      */

      await new Promise(
        resolve =>
        setTimeout(resolve,100)
      );


      setBannerProgress(25);


      imageData =
      await compressBannerImage(file);


      setBannerProgress(70);

    }


    const bannerData = {

      title:
      title,

      description:
      description,

      buttonText:
      button,

      link:
      link,

      image:
      imageData,

      updatedAt:
      serverTimestamp()

    };


    /*
      EDIT
    */

    if(editingBannerId.value){

      await updateDoc(

        doc(
          db,
          "banners",
          editingBannerId.value
        ),

        bannerData

      );

      setBannerProgress(95);


      showStatus(
        bannerStatus,
        "✅ Banner updated successfully!",
        "success"
      );

    }

    /*
      NEW
    */

    else{

      bannerData.createdAt =
      serverTimestamp();


      await addDoc(

        collection(
          db,
          "banners"
        ),

        bannerData

      );


      setBannerProgress(95);


      showStatus(
        bannerStatus,
        "✅ Banner saved successfully!",
        "success"
      );

    }


    setBannerProgress(100);


    await new Promise(
      resolve =>
      setTimeout(resolve,500)
    );


    resetBannerForm();

    loadBanners();

  }

  catch(error){

    console.error(
      "Banner Error:",
      error
    );


    let message =
    error.message ||
    "Banner save করতে সমস্যা হয়েছে।";


    if(
      error.code ===
      "permission-denied"
    ){

      message =
      "❌ Permission denied. Firebase Rules check করুন।";

    }


    if(
      error.code ===
      "invalid-argument"
    ){

      message =
      "❌ Image বা data ঠিক নেই।";

    }


    showStatus(
      bannerStatus,
      message,
      "error"
    );


    setBannerProgress(0);

  }

  finally{

    saveBannerBtn.disabled =
    false;

    saveBannerBtn.textContent =
    editingBannerId.value
    ? "💾 Update Banner"
    : "💾 Save Banner";

  }

}


/* =========================================
   RESET BANNER
========================================= */

cancelBannerBtn.addEventListener(
  "click",
  resetBannerForm
);


function resetBannerForm(){

  editingBannerId.value =

  editingBannerImage.value =
  "";

  bannerImage.value =
  "";

  bannerTitle.value =
  "";

  bannerDescription.value =
  "";

  bannerButton.value =
  "";

  bannerLink.value =
  "";


  bannerPreview.src =
  "";

  bannerPreview.style.display =
  "none";

  previewText.style.display =
  "block";


  bannerProgressBox.style.display =
  "none";

  bannerProgressBar.style.width =

  bannerProgressText.textContent =
  "0%";


  saveBannerBtn.textContent =
  "💾 Save Banner";


  hideStatus(bannerStatus);

}


/* =========================================
   LOAD BANNERS
========================================= */

async function loadBanners(){

  try{

    bannerList.innerHTML =
    `<div class="loading">
      Loading banners...
    </div>`;


    const snapshot =
    await getDocs(
      collection(
        db,
        "banners"
      )
    );


    if(snapshot.empty){

      bannerList.innerHTML =
      `<div class="empty">
        No banners found.
      </div>`;

      return;
    }


    bannerList.innerHTML =
    "";


    const banners = [];


    snapshot.forEach(
      item => {

        banners.push({

          id:
          item.id,

          ...item.data()

        });

      }
    );


    /*
      Newest first if createdAt
      exists.
    */

    banners.sort(
      (a,b) => {

        const aTime =
        a.createdAt?.seconds || 0;

        const bTime =
        b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    banners.forEach(
      banner => {

        const div =
        document.createElement(
          "div"

/* =========================================
   PRODUCT IMAGE COMPRESSION
========================================= */

function compressImage(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
      new FileReader();


      reader.onload =
      event => {

        const img =
        new Image();


        img.onload =
        () => {

          const canvas =
          document.createElement(
            "canvas"
          );


          const maxWidth =
          900;


          let width =
          img.width;

          let height =
          img.height;


          if(width > maxWidth){

            height =
            height *
            maxWidth /
            width;

            width =
            maxWidth;

          }


          canvas.width =
          width;

          canvas.height =
          height;


          const ctx =
          canvas.getContext(
            "2d"
          );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              0.75
            )
          );

        };


        img.onerror =
        reject;


        img.src =
        event.target.result;

      };


      reader.onerror =
      reject;


      reader.readAsDataURL(file);

    }
  );

}

/* =========================================
   SAVE PRODUCT
========================================= */

saveProductBtn.addEventListener(
  "click",
  saveProduct

async function saveProduct(){

  try{

    hideStatus(productStatus);


    const name =
    productName.value.trim();

    const price =
    Number(
      productPrice.value
    );

    const oldPrice =
    Number(
      productOldPrice.value
    ) || 0;

    const discount =
    Number(
      productDiscount.value
    ) || 0;

    const rating =
    Number(
      productRating.value
    ) || 4.5;

    const description =
    productDescription.value.trim();


    if(!name){

      showStatus(
        productStatus,
        "❌ Product name দিন।",
        "error"
      );

      return;
    }


    if(!price){

      showStatus(
        productStatus,
        "❌ Product price দিন।",
        "error"
      );

      return;
    }


    const files =
    Array.from(
      productImages.files
    );


    saveProductBtn.disabled =
    true;

    saveProductBtn.textContent =
    "Saving...";


    let images = [];


    /*
      New images
    */

    for(
      const file of files
    ){

      const compressed =
      await compressImage(file);

      images.push(
        compressed
      );

    }


    /*
      EDIT PRODUCT
    */

    if(
      document.getElementById(
        "editingProductId"
      ).value
    ){

      const id =
      document.getElementById(
        "editingProductId"
      ).value;


      const oldDoc =
      await getDoc(
        doc(
          db,
          "products",
          id
        )
      );


      let oldData =
      oldDoc.exists()
      ? oldDoc.data()
      : {};


      if(images.length === 0){

        images =
        oldData.images ||
        [];

      }


      const image =
      images[0] ||
      oldData.image ||
      "";


      await updateDoc(

        doc(
          db,
          "products",
          id
        ),

        {

          name:
          name,

          price:
          price,

          oldPrice:
          oldPrice,

          discount:
          discount,

          rating:
          rating,

          description:
          description,

          images:
          images,

          image:
          image,

          imageUrl:
          image,

          updatedAt:
          serverTimestamp()

        }

      );


      showStatus(
        productStatus,
        "✅ Product updated successfully!",
        "success"
      );

    }

    /*
      NEW PRODUCT
    */

    else{

      if(images.length === 0){

        showStatus(
          productStatus,
          "❌ অন্তত একটি product image নির্বাচন করুন।",
          "error"
        );

        return;

      }


      await addDoc(

        collection(
          db,
          "products"
        ),

        {

          name:
          name,

          price:
          price,

          oldPrice:
          oldPrice,

          discount:
          discount,

          rating:
          rating,

          description:
          description,

          images:
          images,

          image:
          images[0],

          imageUrl:
          images[0],

          createdAt:
          serverTimestamp(),

          updatedAt:
          serverTimestamp()

        }

      );


      showStatus(
        productStatus,
        "✅ Product added successfully!",
        "success"
      );

    }


    resetProductForm();

    loadProducts();

  }

  catch(error){

    console.error(
      "Product error:",
      error
    );


    showStatus(
      productStatus,
      "❌ " +
      (
        error.message ||
        "Product save failed."
      ),
      "error"
    );

  }

  finally{

    saveProductBtn.disabled =
    false;

    saveProductBtn.textContent =
    "➕ Add Product";

  }

}

/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  try{

    productList.innerHTML =
    `<div class="loading">
      Loading products...
    </div>`;


    const snapshot =
    await getDocs(
      collection(
        db,
        "products"
      )
    );


    if(snapshot.empty){

      productList.innerHTML =
      `<div class="empty">
        No products found.
      </div>`;

      return;
    }


    productList.innerHTML =
    "";


    const products = [];


    snapshot.forEach(
      item => {

        products.push({

          id:
          item.id,

          ...item.data()

        });

      }
    );


    products.reverse();


    products.forEach(
      product => {

        const images =
        product.images ||
        [];


        const image =
        images[0] ||
        product.image ||
        product.imageUrl ||
        "";


        const card =
        document.createElement(
          "div"
        );


        card.className =
        "product-card";


        card.innerHTML = `

          <img
            src="${escapeHtml(image)}"
            alt="Product">

          <div class="product-content">

            <h3>
              ${escapeHtml(
                product.name ||
                "Product"
              )}
            </h3>

            <div class="price">

              ₹${Number(
                product.price || 0
              )}

              ${
                product.oldPrice
                ?
                `<span class="old-price">
                  ₹${Number(
                    product.oldPrice
                  )}
                </span>`
                :
                ""
              }

              ${
                product.discount
                ?
                `<span class="discount">
                  ${Number(
                    product.discount
                  )}% OFF
                </span>`
                :
                ""
              }

            </div>

            <p>
              ⭐ ${
                product.rating ||
                4.5
              }
            </p>

            <div class="small-buttons">

              <button
                class="edit-btn">
                ✏️ Edit
              </button>

              <button
                class="delete-btn">
                🗑️ Delete
              </button>

            </div>

            <button
              class="main-btn"
              style="margin-top:8px"
              >
              👁️ Details
            </button>

          </div>

        `;


        const buttons =
        card.querySelectorAll(
          "button"
        );


        buttons[0].addEventListener(
          "click",
          () =>
          editProduct(product)
        );


        buttons[1].addEventListener(
          "click",
          () =>
          deleteProduct(product.id)
        );


        buttons[2].addEventListener(
          "click",
          () =>
          showProductDetails(product)
        );


        productList.appendChild(
          card
        );

      }
    );

  }

  catch(error){

    console.error(error);

    productList.innerHTML =
    `<div class="empty">
      ❌ Product load failed.
    </div>`;

  }

}

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  if(value === null ||
     value === undefined){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
