<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart Admin</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
min-height:100vh;
}

/* HEADER */

.header{
background:#fff;
padding:20px 15px;
text-align:center;
border-bottom:1px solid #ddd;
box-shadow:0 3px 15px rgba(0,0,0,.08);
position:sticky;
top:0;
z-index:100;
}

.header h1{
color:#c99d00;
font-size:30px;
font-weight:800;
}

/* CONTAINER */

.container{
padding:22px 15px 50px;
max-width:1000px;
margin:auto;
}

/* CARD */

.card{
background:#fff;
padding:22px;
border-radius:20px;
margin-bottom:22px;
border:1px solid #e5e5e5;
box-shadow:0 8px 30px rgba(0,0,0,.07);
position:relative;
}

.card::before{
content:"";
position:absolute;
left:0;
top:0;
width:100%;
height:3px;
background:#FFD000;
border-radius:20px 20px 0 0;
}

.card h2{
color:#c99d00;
margin-bottom:20px;
font-size:25px;
}

/* INPUT */

input,
select,
textarea{
width:100%;
padding:15px 16px;
margin:9px 0;
border:1px solid #ddd;
border-radius:12px;
background:#fafafa;
color:#222;
font-size:15px;
outline:none;
transition:.25s;
}

input::placeholder,
textarea::placeholder{
color:#999;
}

input:focus,
select:focus,
textarea:focus{
border-color:#e2b600;
background:#fff;
box-shadow:0 0 0 3px rgba(255,208,0,.12);
}

textarea{
min-height:110px;
resize:vertical;
}

input[type="file"]{
background:#fff;
border:1px dashed #bbb;
padding:12px;
}

/* SECTION */

.section-title{
color:#c99d00;
font-size:16px;
font-weight:bold;
margin-top:18px;
margin-bottom:5px;
}

.optional{
color:#999;
font-size:12px;
margin:3px 0 8px;
}

/* BUTTON */

button{
width:100%;
padding:15px;
margin-top:11px;
border:none;
border-radius:12px;
background:#FFD000;
color:#222;
font-weight:800;
font-size:15px;
cursor:pointer;
transition:.2s;
box-shadow:0 5px 15px rgba(218,174,0,.18);
}

button:hover{
background:#eabd00;
transform:translateY(-1px);
}

button:active{
transform:scale(.98);
}

button.delete{
background:#ef3d3d;
color:#fff;
}

button.edit{
background:#2186e8;
color:#fff;
}

button.cancel{
background:#eee;
color:#555;
border:1px solid #ddd;
}

/* IMAGE PREVIEW */

#previewContainer{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:14px;
}

.preview-img{
width:82px;
height:82px;
object-fit:cover;
border-radius:12px;
border:2px solid #eee;
background:#fafafa;
}

.preview-img:hover{
border-color:#FFD000;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

/* PRODUCT CARD */

.product{
background:#fff;
padding:12px;
border-radius:16px;
border:1px solid #e5e5e5;
cursor:pointer;
transition:.25s;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.product:hover{
transform:translateY(-4px);
border-color:#e0b500;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.product img{
width:100%;
height:165px;
object-fit:cover;
border-radius:11px;
background:#f3f3f3;
}

.product h3{
margin-top:10px;
font-size:16px;
color:#222;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.price{
color:#c99d00;
font-weight:bold;
font-size:17px;
margin-top:7px;
}

.old-price{
color:#999;
text-decoration:line-through;
font-size:12px;
margin-top:3px;
}

.discount{
color:#0a9f52;
font-size:12px;
font-weight:bold;
margin-top:4px;
}

.category{
color:#777;
margin-top:5px;
font-size:13px;
}

/* SMALL BUTTONS */

.small-btns{
display:flex;
gap:7px;
margin-top:7px;
}

.small-btns button{
flex:1;
padding:10px;
font-size:12px;
margin-top:4px;
}

/* MODAL */

.modal{
display:none;
position:fixed;
z-index:999;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
backdrop-filter:blur(5px);
overflow:auto;
}

.modal-content{
background:#fff;
width:92%;
max-width:850px;
margin:30px auto;
border-radius:20px;
padding:20px;
position:relative;
border:1px solid #ddd;
box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.close{
position:absolute;
right:17px;
top:9px;
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#f5f5f5;
border:1px solid #ddd;
font-size:27px;
color:#333;
cursor:pointer;
z-index:10;
}

.close:hover{
color:#c99d00;
border-color:#FFD000;
}

/* MAIN IMAGE */

.main-photo{
width:100%;
max-height:400px;
object-fit:contain;
background:#f7f7f7;
border-radius:14px;
margin-top:15px;
border:1px solid #eee;
}

/* THUMBNAILS */

.photo-thumbs{
display:flex;
gap:8px;
overflow-x:auto;
margin-top:10px;
padding-bottom:6px;
}

.photo-thumbs img{
width:68px;
height:68px;
object-fit:cover;
border-radius:10px;
border:2px solid #eee;
cursor:pointer;
flex-shrink:0;
}

.photo-thumbs img:hover{
border-color:#FFD000;
}

/* DETAILS */

.detail-title{
color:#c99d00;
font-size:26px;
margin-top:18px;
}

.detail-price{
color:#c99d00;
font-size:23px;
font-weight:bold;
margin-top:8px;
}

.detail-old-price{
color:#999;
text-decoration:line-through;
margin-top:5px;
}

.detail-discount{
color:#0a9f52;
font-weight:bold;
margin-top:5px;
}

.detail-row{
border-bottom:1px solid #eee;
padding:13px 0;
display:flex;
justify-content:space-between;
gap:15px;
}

.detail-label{
color:#888;
}

.detail-value{
text-align:right;
word-break:break-word;
color:#333;
}

.description-box{
margin-top:16px;
padding:16px;
background:#fafafa;
border:1px solid #eee;
border-radius:14px;
line-height:1.6;
color:#555;
}

.modal-buttons{
display:flex;
gap:10px;
margin-top:16px;
}

.modal-buttons button{
flex:1;
}

.loading{
color:#999;
text-align:center;
padding:25px;
}

/* MOBILE */

@media(max-width:600px){

.header{
padding:18px 10px;
}

.header h1{
font-size:27px;
}

.container{
padding:16px 10px 40px;
}

.card{
padding:18px 15px;
border-radius:18px;
}

.card h2{
font-size:24px;
}

.products{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.product{
padding:9px;
border-radius:14px;
}

.product img{
height:145px;
}

.product h3{
font-size:14px;
}

.price{
font-size:15px;
}

.small-btns{
flex-direction:column;
gap:2px;
}

.small-btns button{
padding:9px;
}

.modal-content{
width:96%;
margin:15px auto;
padding:16px;
border-radius:18px;
}

}

/* SCROLLBAR */

::-webkit-scrollbar{
width:5px;
height:5px;
}

::-webkit-scrollbar-track{
background:#f5f5f5;
}

::-webkit-scrollbar-thumb{
background:#ccc;
border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
background:#FFD000;
}

::selection{
background:#FFD000;
color:#222;
}

</style>

</head>

<script type="module">

import {
auth,
db
}
from "./firebase.js";


import {
collection,
addDoc,
getDocs,
updateDoc,
deleteDoc,
doc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


let currentUser=null;

let editId=null;

let selectedImages=[];

let allProducts=[];


/* =========================
AUTH
========================= */

auth.onAuthStateChanged(user=>{

if(!user){

alert("Please Login First");

window.location.href="login.html";

return;

}

currentUser=user;

loadProducts();

});


/* =========================
IMAGE SELECT
========================= */

document
.getElementById("productImage")
.addEventListener(
"change",
async function(e){

const files=
Array.from(e.target.files);


if(files.length>10){

alert(
"সর্বোচ্চ ১০টি ছবি নির্বাচন করতে পারবেন।"
);

this.value="";

return;

}


selectedImages=[];


const container=
document.getElementById(
"previewContainer"
);

container.innerHTML="";


for(const file of files){

if(
!file.type.startsWith("image/")
) continue;


try{

const image=
await compressImage(file);


selectedImages.push(image);


const img=
document.createElement("img");


img.src=image;

img.className="preview-img";


container.appendChild(img);

}

catch(error){

console.error(error);

}

}

});


/* =========================
COMPRESS IMAGE
========================= */

function compressImage(file){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();


reader.onload=
function(event){

const img=
new Image();


img.onload=
function(){

const canvas=
document.createElement("canvas");

const maxSize=700;

let width=img.width;

let height=img.height;


if(width>height){

if(width>maxSize){

height=
height*maxSize/width;

width=maxSize;

}

}

else{

if(height>maxSize){

width=
width*maxSize/height;

height=maxSize;

}

}


canvas.width=width;

canvas.height=height;


const ctx=
canvas.getContext("2d");


ctx.drawImage(
img,
0,
0,
width,
height
);


const result=
canvas.toDataURL(
"image/jpeg",
0.65
);


resolve(result);

};


img.onerror=reject;

img.src=event.target.result;

};


reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* =========================
SAVE PRODUCT
========================= */

window.saveProduct=
async function(){

if(!currentUser){

alert("Please login first");

return;

}


const name=
document
.getElementById("productName")
.value
.trim();


const price=
document
.getElementById("productPrice")
.value;


const oldPrice=
document
.getElementById("productOldPrice")
.value;


const discount=
document
.getElementById("productDiscount")
.value;


const category=
document
.getElementById("productCategory")
.value;


const colorsText=
document
.getElementById("productColors")
.value
.trim();


const sizesText=
document
.getElementById("productSizes")
.value
.trim();


const description=
document
.getElementById("productDescription")
.value
.trim();


const colors=
colorsText
.split(",")
.map(x=>x.trim())
.filter(Boolean);


const sizes=
sizesText
.split(",")
.map(x=>x.trim())
.filter(Boolean);


if(!name){

alert("Product name দিন");

return;

}


if(!price){

alert("Price দিন");

return;

}


if(!category){

alert("Category select করুন");

return;

}


try{


/* ADD */

if(!editId){

if(selectedImages.length===0){

alert(
"Gallery থেকে অন্তত ১টি ছবি select করুন"
);

return;

}


const productData={

name:name,

price:Number(price),

category:category,

image:selectedImages[0],

images:selectedImages,

createdAt:Date.now(),

createdBy:currentUser.uid,

createdByEmail:
currentUser.email||""

};


if(oldPrice){

productData.oldPrice=
Number(oldPrice);

}


if(discount){

productData.discount=
Number(discount);

}


if(colors.length>0){

productData.colors=
colors;

}


if(sizes.length>0){

productData.sizes=
sizes;

}


if(description){

productData.description=
description;

}


await addDoc(
collection(db,"products"),
productData
);


alert("✅ Product Added!");

}


/* UPDATE */

else{

const updateData={

name:name,

price:Number(price),

category:category,

oldPrice:
oldPrice
?
Number(oldPrice)
:
null,

discount:
discount
?
Number(discount)
:
null,

colors:colors,

sizes:sizes,

description:description

};


if(selectedImages.length>0){

updateData.image=
selectedImages[0];

updateData.images=
selectedImages;

}


await updateDoc(
doc(db,"products",editId),
updateData
);


alert("✅ Product Updated!");

}


clearForm();

loadProducts();

}

catch(error){

console.error(error);

alert(
"Error: "+error.message
);

}

};


/* =========================
LOAD PRODUCTS
========================= */

window.loadProducts=
async function(){

const box=
document.getElementById(
"products"
);


box.innerHTML=
`
<div class="loading">
Loading...
</div>
`;


try{

const snapshot=
await getDocs(
collection(db,"products")
);


allProducts=[];


snapshot.forEach(item=>{

allProducts.push({

id:item.id,

data:item.data()

});

});


renderProducts();

}

catch(error){

console.error(error);

box.innerHTML=
`
<p>
Products load হচ্ছে না
</p>
`;

}

};


/* =========================
RENDER
========================= */

function renderProducts(){

const box=
document.getElementById(
"products"
);


const search=
document
.getElementById("searchBox")
.value
.toLowerCase()
.trim();


box.innerHTML="";


let count=0;


allProducts.forEach(product=>{

const p=
product.data;


if(
search &&
!String(p.name||"")
.toLowerCase()
.includes(search)
){

return;

}


count++;


const images=
getProductImages(p);


const firstImage=
images[0]||"";


const div=
document.createElement("div");


div.className="product";


div.onclick=
function(){

openDetails(
product.id,
p
);

};


let priceHTML=
`
<div class="price">
₹${p.price||0}
</div>
`;


if(p.oldPrice){

priceHTML+=
`
<div class="old-price">
₹${p.oldPrice}
</div>
`;

}


if(p.discount){

priceHTML+=
`
<div class="discount">
${p.discount}% OFF
</div>
`;

}


div.innerHTML=`

${
firstImage
?
`<img src="${firstImage}">`
:
`
<div style="
height:165px;
display:flex;
align-items:center;
justify-content:center;
background:#f5f5f5;
border-radius:11px;
color:#aaa;
">
No Image
</div>
`
}

<h3>
${escapeHTML(
p.name||"Product"
)}
</h3>

${priceHTML}

<p class="category">
${escapeHTML(
p.category||""
)}
</p>

<p style="
color:#999;
font-size:12px;
margin-top:6px;
">
📷 ${images.length} photo(s)
</p>

<div class="small-btns">

<button
class="edit"
onclick="
event.stopPropagation();
editProduct('${product.id}')
"
>
✏️ Edit
</button>

<button
class="delete"
onclick="
event.stopPropagation();
deleteProduct('${product.id}')
"
>
🗑️ Delete
</button>

</div>

`;


box.appendChild(div);

});


if(count===0){

box.innerHTML=
`
<p>
No Products Found
</p>
`;

}

}


/* =========================
GET IMAGES
========================= */

function getProductImages(p){

if(
Array.isArray(p.images) &&
p.images.length>0
){

return p.images;

}


if(p.image){

return[p.image];

}


return[];

}


/* =========================
DETAILS
========================= */

window.openDetails=
function(id,p){

const images=
getProductImages(p);


const modal=
document.getElementById(
"productModal"
);


const mainImage=
document.getElementById(
"detailMainImage"
);


const thumbs=
document.getElementById(
"detailThumbs"
);


document.getElementById(
"detailName"
)
.textContent=
p.name||"Product";


document.getElementById(
"detailPrice"
)
.textContent=
"₹"+(p.price||0);


/* OLD PRICE */

const oldPriceBox=
document.getElementById(
"detailOldPrice"
);


if(p.oldPrice){

oldPriceBox.textContent=
"₹"+p.oldPrice;

oldPriceBox.style.display=
"block";

}

else{

oldPriceBox.textContent="";

oldPriceBox.style.display=
"none";

}


/* DISCOUNT */

const discountBox=

/* =========================
CLOSE MODAL
========================= */

window.closeModal=
function(){

document.getElementById(
"productModal"
)
.style.display=
"none";

};


window.addEventListener(
"click",
function(event){

const modal=
document.getElementById(
"productModal"
);


if(event.target===modal){

closeModal();

}

});


/* =========================
EDIT
========================= */

window.editProduct=
async function(id){

try{

const found=
allProducts.find(
item=>item.id===id
);


if(!found)return;


const p=
found.data;


document.getElementById(
"productName"
)
.value=
p.name||"";


document.getElementById(
"productPrice"
)
.value=
p.price||"";


document.getElementById(
"productOldPrice"
)
.value=
p.oldPrice||"";


document.getElementById(
"productDiscount"
)
.value=
p.discount||"";


document.getElementById(
"productCategory"
)
.value=
p.category||"";


document.getElementById(
"productColors"
)
.value=
Array.isArray(p.colors)
?
p.colors.join(", ")
:
"";


document.getElementById(
"productSizes"
)
.value=
Array.isArray(p.sizes)
?
p.sizes.join(", ")
:
"";


document.getElementById(
"productDescription"
)
.value=
p.description||"";


selectedImages=
getProductImages(p);


showPreview();


editId=id;


document.getElementById(
"formTitle"
)
.innerText=
"Edit Product";


document.getElementById(
"saveBtn"
)
.innerText=
"💾 Update Product";


document.getElementById(
"cancelBtn"
)
.style.display=
"block";


window.scrollTo({

top:0,

behavior:"smooth"

});

}

catch(error){

alert(error.message);

}

};


/* =========================
PREVIEW
========================= */

function showPreview(){

const container=
document.getElementById(
"previewContainer"
);


container.innerHTML="";


selectedImages.forEach(image=>{

const img=
document.createElement("img");


img.src=image;

img.className=
"preview-img";


container.appendChild(img);

});

}


/* =========================
DELETE
========================= */

window.deleteProduct=
async function(id){

const ok=
confirm(
"এই product delete করবেন?"
);


if(!ok)return;


try{

await deleteDoc(
doc(db,"products",id)
);


alert(
"🗑️ Product Deleted"
);


loadProducts();

}

catch(error){

alert(error.message);

}

};

/* =========================
ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}
