<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart Admin</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#111;
color:white;
}

.header{
background:#000;
padding:18px;
text-align:center;
border-bottom:1px solid #333;
}

.header h1{
color:#FFD700;
}

.container{
padding:20px;
max-width:1000px;
margin:auto;
}

.card{
background:#1b1b1b;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

.card h2{
color:#FFD700;
margin-bottom:15px;
}

input,
select,
textarea{
width:100%;
padding:13px;
margin:8px 0;
border:none;
border-radius:8px;
background:#292929;
color:white;
}

textarea{
min-height:100px;
resize:vertical;
}

input[type="file"]{
padding:10px;
}

button{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:8px;
background:#FFD700;
color:#111;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

button.delete{
background:#e53935;
color:white;
}

button.edit{
background:#2196f3;
color:white;
}

button.cancel{
background:#555;
color:white;
}

#previewContainer{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:12px;
}

.preview-img{
width:85px;
height:85px;
object-fit:cover;
border-radius:8px;
border:2px solid #444;
}

.products{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.product{
background:#222;
padding:12px;
border-radius:12px;
cursor:pointer;
transition:.2s;
}

.product:hover{
transform:translateY(-3px);
box-shadow:0 5px 20px #000;
}

.product img{
width:100%;
height:160px;
object-fit:cover;
border-radius:8px;
}

.product h3{
margin-top:8px;
}

.price{
color:#FFD700;
font-weight:bold;
margin-top:5px;
}

.old-price{
color:#888;
text-decoration:line-through;
font-size:13px;
margin-top:4px;
}

.discount{
color:#00e676;
font-size:13px;
margin-top:4px;
}

.category{
color:#aaa;
margin-top:4px;
}

.small-btns{
display:flex;
gap:7px;
}

.small-btns button{
flex:1;
}

.modal{
display:none;
position:fixed;
z-index:999;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
overflow:auto;
}

.modal-content{
background:#1b1b1b;
width:92%;
max-width:850px;
margin:30px auto;
border-radius:15px;
padding:20px;
position:relative;
}

.close{
position:absolute;
right:18px;
top:10px;
font-size:32px;
color:white;
cursor:pointer;
z-index:10;
}

.main-photo{
width:100%;
max-height:400px;
object-fit:contain;
background:#111;
border-radius:12px;
margin-top:20px;
}

.photo-thumbs{
display:flex;
gap:8px;
overflow-x:auto;
margin-top:10px;
padding-bottom:5px;
}

.photo-thumbs img{
width:70px;
height:70px;
object-fit:cover;
border-radius:8px;
border:2px solid #444;
cursor:pointer;
}

.photo-thumbs img:hover{
border-color:#FFD700;
}

.detail-title{
color:#FFD700;
font-size:25px;
margin-top:20px;
}

.detail-price{
color:#FFD700;
font-size:22px;
font-weight:bold;
margin-top:8px;
}

.detail-old-price{
color:#888;
text-decoration:line-through;
margin-top:5px;
}

.detail-discount{
color:#00e676;
font-weight:bold;
margin-top:5px;
}

.detail-row{
border-bottom:1px solid #333;
padding:12px 0;
display:flex;
justify-content:space-between;
gap:15px;
}

.detail-label{
color:#aaa;
}

.detail-value{
text-align:right;
word-break:break-word;
}

.description-box{
margin-top:15px;
padding:15px;
background:#111;
border-radius:10px;
line-height:1.6;
color:#ddd;
}

.modal-buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.modal-buttons button{
flex:1;
}

.loading{
color:#aaa;
text-align:center;
padding:20px;
}

.optional{
color:#888;
font-size:12px;
margin-top:-3px;
margin-bottom:5px;
}

.section-title{
color:#FFD700;
font-size:15px;
margin-top:15px;
margin-bottom:5px;
}

</style>
</head>

<body>

<div class="header">
<h1>🛒 SayonMart Admin</h1>
</div>

<div class="container">

<!-- ADD PRODUCT -->

<div class="card">

<h2 id="formTitle">
Add Product
</h2>

<input
id="productName"
type="text"
placeholder="Product Name"
>

<input
id="productPrice"
type="number"
placeholder="Price"
>

<input
id="productOldPrice"
type="number"
placeholder="Old Price (Optional)"
>

<input
id="productDiscount"
type="number"
placeholder="Discount % (Optional)"
>

<select id="productCategory">

<option value="">
Select Category
</option>

<option value="Fashion">
Fashion
</option>

<option value="Shoes">
Shoes
</option>

<option value="Mobiles">
Mobiles
</option>

<option value="Watches">
Watches
</option>

<option value="Electronics">
Electronics
</option>

<option value="Other">
Other
</option>

</select>

<div class="section-title">
🎨 Color
</div>

<input
id="productColors"
type="text"
placeholder="Optional — যেমন: Black, Blue, Red"
>

<p class="optional">

</p>

<div class="section-title">
📏 Size
</div>

<input
id="productSizes"
type="text"
placeholder="Optional — যেমন: M, L, XL, XXL"
>

<p class="optional">
একাধিক Size দিতে চাইলে comma দিয়ে লিখুন।
</p>

<div class="section-title">
📝 Description
</div>

<textarea
id="productDescription"
placeholder="Product Description (Optional)"
></textarea>

<input
id="productImage"
type="file"
accept="image/*"
multiple
>

<p style="
color:#aaa;
font-size:13px;
margin-top:5px;
">
📷 সর্বোচ্চ ১০টি ছবি নির্বাচন করুন
</p>

<div id="previewContainer"></div>

<button
id="saveBtn"
onclick="saveProduct()"
>
➕ Add Product
</button>

<button
id="cancelBtn"
class="cancel"
onclick="cancelEdit()"
style="display:none;"
>
Cancel Edit
</button>

</div>


<!-- ALL PRODUCTS -->

<div class="card">

<h2>
All Products
</h2>

<input
id="searchBox"
type="text"
placeholder="🔍 Search Product..."
oninput="renderProducts()"
>

<div
id="products"
class="products"
>

<div class="loading">
Loading...
</div>

</div>

</div>

</div>


<!-- PRODUCT DETAILS MODAL -->

<div
id="productModal"
class="modal"
>

<div class="modal-content">

<span
class="close"
onclick="closeModal()"
>
×
</span>

<img
id="detailMainImage"
class="main-photo"
style="display:none;"
>

<div
id="detailThumbs"
class="photo-thumbs"
></div>

<h2
id="detailName"
class="detail-title"
></h2>

<div
id="detailPrice"
class="detail-price"
></div>

<div
id="detailOldPrice"
class="detail-old-price"
></div>

<div
id="detailDiscount"
class="detail-discount"
></div>


<div
id="detailColorRow"
class="detail-row"
style="display:none;"
>

<span class="detail-label">
🎨 Color
</span>

<span
id="detailColors"
class="detail-value"
></span>

</div>


<div
id="detailSizeRow"
class="detail-row"
style="display:none;"
>

<span class="detail-label">
📏 Size
</span>

<span
id="detailSizes"
class="detail-value"
></span>

</div>


<div class="detail-row">

<span class="detail-label">
Category
</span>

<span
id="detailCategory"
class="detail-value"
></span>

</div>


<div class="detail-row">

<span class="detail-label">
Product ID
</span>

<span
id="detailId"
class="detail-value"
></span>

</div>


<div class="detail-row">

<span class="detail-label">
Added Date
</span>

<span
id="detailDate"
class="detail-value"
></span>

</div>


<div class="detail-row">

<span class="detail-label">
Added By
</span>

<span
id="detailAddedBy"
class="detail-value"
></span>

</div>


<div class="detail-row">

<span class="detail-label">
Total Photos
</span>

<span
id="detailPhotoCount"
class="detail-value"
></span>

</div>


<div
id="detailDescriptionBox"
class="description-box"
style="display:none;"
>

<strong>
📝 Description
</strong>

<p
id="detailDescription"
style="margin-top:8px;"
></p>

</div>


<div class="modal-buttons">

<button
id="modalEditBtn"
class="edit"
>
✏️ Edit Product
</button>

<button
id="modalDeleteBtn"
class="delete"
>
🗑️ Delete Product
</button>

</div>

</div>

</div>


<script type="module">

import {
auth,
db
}
from "./firebase.js";


import {
collection,
addDoc,
getDocs,
updateDoc,
deleteDoc,
doc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


let currentUser = null;

let editId = null;

let selectedImages = [];

let allProducts = [];


// ============================
// AUTH
// ============================

auth.onAuthStateChanged(user => {

if(!user){

alert("Please Login First");

window.location.href =
"login.html";

return;

}

currentUser = user;

loadProducts();

});


// ============================
// IMAGE SELECT
// ============================

document
.getElementById("productImage")
.addEventListener(
"change",
async function(e){

const files =
Array.from(e.target.files);


if(files.length > 10){

alert(
"সর্বোচ্চ ১০টি ছবি নির্বাচন করতে পারবেন।"
);

this.value = "";

return;

}


selectedImages = [];


const container =
document.getElementById(
"previewContainer"
);

container.innerHTML = "";


for(const file of files){

if(
!file.type.startsWith("image/")
) continue;


try{

const image =
await compressImage(file);

selectedImages.push(image);


const img =
document.createElement("img");

img.src = image;

img.className =
"preview-img";

container.appendChild(img);

}

catch(error){

console.error(error);

}

}

});


// ============================
// IMAGE COMPRESS
// ============================

function compressImage(file){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();


reader.onload =
function(event){

const img =
new Image();


img.onload =
function(){

const canvas =
document.createElement(
"canvas"
);

const maxSize = 700;

let width =
img.width;

let height =
img.height;


if(width > height){

if(width > maxSize){

height =
height * maxSize / width;

width = maxSize;

}

}

else{

if(height > maxSize){

width =
width * maxSize / height;

height = maxSize;

}

}


canvas.width = width;

canvas.height = height;


const ctx =
canvas.getContext("2d");


ctx.drawImage(
img,
0,
0,
width,
height
);


const result =
canvas.toDataURL(
"image/jpeg",
0.65
);


resolve(result);

};


img.onerror = reject;

img.src =
event.target.result;

};


reader.onerror = reject;

reader.readAsDataURL(file);

});

}


// ============================
// SAVE PRODUCT
// ============================

window.saveProduct =
async function(){

if(!currentUser){

alert(
"Please login first"
);

return;

}


const name =
document
.getElementById(
"productName"
)
.value
.trim();


const price =
document
.getElementById(
"productPrice"
)
.value;


const oldPrice =
document
.getElementById(
"productOldPrice"
)
.value;


const discount =
document
.getElementById(
"productDiscount"
)
.value;


const category =
document
.getElementById(
"productCategory"
)
.value;


const colorsText =
document
.getElementById(
"productColors"
)
.value
.trim();


const sizesText =
document
.getElementById(
"productSizes"
)
.value
.trim();


const description =
document
.getElementById(
"productDescription"
)
.value
.trim();


const colors =
colorsText
.split(",")
.map(x => x.trim())
.filter(Boolean);


const sizes =
sizesText
.split(",")
.map(x => x.trim())
.filter(Boolean);


if(!name){

alert(
"Product name দিন"
);

return;

}


if(!price){

alert(
"Price দিন"
);

return;

}


if(!category){

alert(
"Category select করুন"
);

return;

}


try{


// ============================
// ADD
// ============================

if(!editId){

if(
selectedImages.length === 0
){

alert(
"Gallery থেকে অন্তত ১টি ছবি select করুন"
);

return;

}


const productData = {

name: name,

price: Number(price),

category: category,

image:
selectedImages[0],

images:
selectedImages,

createdAt:
Date.now(),

createdBy:
currentUser.uid,

createdByEmail:
currentUser.email || ""

};


// OLD PRICE

if(oldPrice){

productData.oldPrice =
Number(oldPrice);

}


// DISCOUNT

if(discount){

productData.discount =
Number(discount);

}


// COLOR

if(colors.length > 0){

productData.colors =
colors;

}


// SIZE

if(sizes.length > 0){

productData.sizes =
sizes;

}


// DESCRIPTION

if(description){

productData.description =
description;

}


await addDoc(
collection(db,"products"),
productData
);


alert(
"✅ Product Added!"
);

}


// ============================
// UPDATE
// ============================

else{

const updateData = {

name: name,

price: Number(price),

category: category

};


// OLD PRICE

if(oldPrice){

updateData.oldPrice =
Number(oldPrice);

}

else{

updateData.oldPrice = null;

}


// DISCOUNT

if(discount){

updateData.discount =
Number(discount);

}

else{

updateData.discount = null;

}


// COLORS

if(colors.length > 0){

updateData.colors =
colors;

}

else{

updateData.colors = [];

}


// SIZES

if(sizes.length > 0){

updateData.sizes =
sizes;

}

else{

updateData.sizes = [];

}


// DESCRIPTION

if(description){

updateData.description =
description;

}

else{

updateData.description = "";

}


// NEW IMAGE

if(selectedImages.length > 0){

updateData.image =
selectedImages[0];

updateData.images =
selectedImages;

}


await updateDoc(
doc(
db,
"products",
editId
),
updateData
);


alert(
"✅ Product Updated!"
);

}


clearForm();

loadProducts();

}

catch(error){

console.error(error);

alert(
"Error: " +
error.message
);

}

};


// ============================
// LOAD PRODUCTS
// ============================

window.loadProducts =
async function(){

const box =
document.getElementById(
"products"
);

box.innerHTML =
`
<div class="loading">
Loading...
</div>
`;


try{

const snapshot =
await getDocs(
collection(
db,
"products"
)
);


allProducts = [];


snapshot.forEach(item => {

allProducts.push({

id: item.id,

data: item.data()

});

});


renderProducts();

}

catch(error){

console.error(error);

box.innerHTML =
`
<p>
Products load হচ্ছে না
</p>
`;

}

};


// ============================
// RENDER PRODUCTS
// ============================

function renderProducts(){

const box =
document.getElementById(
"products"
);


const search =
document
.getElementById(
"searchBox"
)
.value
.toLowerCase()
.trim();


box.innerHTML = "";


let count = 0;


allProducts.forEach(
product => {

const p =
product.data;


if(
search &&
!String(
p.name || ""
)
.toLowerCase()
.includes(search)
){

return;

}


count++;


const images =
getProductImages(p);


const firstImage =
images[0] || "";


const div =
document.createElement(
"div"
);


div.className =
"product";


div.onclick =
function(){

openDetails(
product.id,
p
);

};


let priceHTML =
`
<div class="price">
₹${p.price || 0}
</div>
`;


if(p.oldPrice){

priceHTML +=
`
<div class="old-price">
₹${p.oldPrice}
</div>
`;

}


if(p.discount){

priceHTML +=
`
<div class="discount">
${p.discount}% OFF
</div>
`;

}


div.innerHTML = `

${
firstImage
?
`<img src="${firstImage}">`
:
`
<div style="
height:160px;
display:flex;
align-items:center;
justify-content:center;
background:#111;
border-radius:8px;
color:#777;
">
No Image
</div>
`
}

<h3>
${escapeHTML(
p.name || "Product"
)}
</h3>

${priceHTML}

<p class="category">
${escapeHTML(
p.category || ""
)}
</p>

<p style="
color:#888;
font-size:12px;
margin-top:6px;
">
📷 ${images.length} photo(s)
</p>

<div class="small-btns">

<button
class="edit"
onclick="
event.stopPropagation();
editProduct('${product.id}')
"
>
✏️ Edit
</button>

<button
class="delete"
onclick="
event.stopPropagation();
deleteProduct('${product.id}')
"
>
🗑️ Delete
</button>

</div>

`;


box.appendChild(div);

});


if(count === 0){

box.innerHTML =
`
<p>
No Products Found
</p>
`;

}

}


// ============================
// GET IMAGES
// ============================

function getProductImages(p){

if(
Array.isArray(p.images) &&
p.images.length > 0
){

return p.images;

}


if(p.image){

return [p.image];

}


return [];

}


// ============================
// OPEN DETAILS
// ============================

window.openDetails =
function(id,p){

const images =
getProductImages(p);


const modal =
document.getElementById(
"productModal"
);


const mainImage =
document.getElementById(
"detailMainImage"
);


const thumbs =
document.getElementById(
"detailThumbs"
);


document.getElementById(
"detailName"
)
.textContent =
p.name ||
"Product";


document.getElementById(
"detailPrice"
)
.textContent =
"₹" +
(p.price || 0);


// OLD PRICE

const oldPriceBox =
document.getElementById(
"detailOldPrice"
);


if(p.oldPrice){

oldPriceBox.textContent =
"₹" + p.oldPrice;

oldPriceBox.style.display =
"block";

}

else{

oldPriceBox.textContent =
"";

oldPriceBox.style.display =
"none";

}


// DISCOUNT

const discountBox =
document.getElementById(
"detailDiscount"
);


if(p.discount){

discountBox.textContent =
p.discount +
"% OFF";

discountBox.style.display =
"block";

}

else{

discountBox.textContent =
"";

discountBox.style.display =
"none";

}


// COLORS

const colorRow =
document.getElementById(
"detailColorRow"
);


const colorValue =
document.getElementById(
"detailColors"
);


if(
Array.isArray(p.colors) &&
p.colors.length > 0
){

colorValue.textContent =
p.colors.join(", ");

colorRow.style.display =
"flex";

}

else{

colorValue.textContent =
"";

colorRow.style.display =
"none";

}


// SIZES

const sizeRow =
document.getElementById(
"detailSizeRow"
);


const sizeValue =
document.getElementById(
"detailSizes"
);


if(
Array.isArray(p.sizes) &&
p.sizes.length > 0
){

sizeValue.textContent =
p.sizes.join(", ");

sizeRow.style.display =
"flex";

}

else{

sizeValue.textContent =
"";

sizeRow.style.display =
"none";

}


// CATEGORY

document.getElementById(
"detailCategory"
)
.textContent =
p.category ||
"-";


// ID

document.getElementById(
"detailId"
)
.textContent =
id;


// DATE

let dateText = "-";


if(p.createdAt){

const date =
new Date(
p.createdAt
);

dateText =
date.toLocaleString();

}


document.getElementById(
"detailDate"
)
.textContent =
dateText;


// ADDED BY

document.getElementById(
"detailAddedBy"
)
.textContent =
p.createdByEmail ||
p.createdBy ||
"-";


// PHOTO COUNT

document.getElementById(
"detailPhotoCount"
)
.textContent =
images.length;


// DESCRIPTION

const descriptionBox =
document.getElementById(
"detailDescriptionBox"
);


const descriptionText =
document.getElementById(
"detailDescription"
);


if(p.description){

descriptionText.textContent =
p.description;

descriptionBox.style.display =
"block";

}

else{

descriptionText.textContent =
"";

descriptionBox.style.display =
"none";

}


// THUMBNAILS

thumbs.innerHTML = "";


if(images.length > 0){

mainImage.src =
images[0];

mainImage.style.display =
"block";


images.forEach(image => {

const thumb =
document.createElement(
"img"
);


thumb.src = image;


thumb.onclick =
function(){

mainImage.src =
image;

};


thumbs.appendChild(
thumb
);

});

}

else{

mainImage.style.display =
"none";

}


// EDIT BUTTON

document.getElementById(
"modalEditBtn"
)
.onclick =

// ============================
// EDIT PRODUCT
// ============================

window.editProduct =
async function(id){

try{

const found =
allProducts.find(
item =>
item.id === id
);


if(!found) return;


const p =
found.data;


document.getElementById(
"productName"
)
.value =
p.name || "";


document.getElementById(
"productPrice"
)
.value =
p.price || "";


document.getElementById(
"productOldPrice"
)
.value =
p.oldPrice || "";


document.getElementById(
"productDiscount"
)
.value =
p.discount || "";


document.getElementById(
"productCategory"
)
.value =
p.category || "";


document.getElementById(
"productColors"
)
.value =
Array.isArray(p.colors)
?
p.colors.join(", ")
:
p.color || "";


document.getElementById(
"productSizes"
)
.value =
Array.isArray(p.sizes)
?
p.sizes.join(", ")
:
p.size || "";


document.getElementById(
"productDescription"
)
.value =
p.description || "";


selectedImages =
getProductImages(p);


showPreview();


editId = id;


document.getElementById(
"formTitle"
)
.innerText =
"Edit Product";


document.getElementById(
"saveBtn"
)
.innerText =
"💾 Update Product";


document.getElementById(
"cancelBtn"
)
.style.display =
"block";


window.scrollTo({

top:0,

behavior:"smooth"

});

}

catch(error){

alert(
error.message
);

}

};


// ============================
// SHOW PREVIEW
// ============================

function showPreview(){

const container =
document.getElementById(
"previewContainer"
);


container.innerHTML = "";


selectedImages.forEach(
image => {

const img =
document.createElement(
"img"
);


img.src =
image;


img.className =
"preview-img";


container.appendChild(
img
);

});

}


// ============================
// DELETE
// ============================

window.deleteProduct =
async function(id){

const ok =
confirm(
"এই product delete করবেন?"
);


if(!ok) return;


try{

await deleteDoc(
doc(
db,
"products",
id
)
);


alert(
"🗑️ Product Deleted"
);


loadProducts();

}

catch(error){

alert(
error.message
);

}

};

// ============================
// ESCAPE HTML
// ============================

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
