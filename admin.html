<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SayonMart Admin</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:30px;
}

header{
  background:#080808;
  padding:20px;
  text-align:center;
  border-bottom:1px solid #292929;
}

header h2{
  margin:0;
  color:#ffd000;
}

.admin{
  padding:18px;
  max-width:800px;
  margin:auto;
}

.box{
  background:#19191c;
  border:1px solid #303035;
  border-radius:18px;
  padding:16px;
  margin-bottom:18px;
}

.box h3{
  margin-top:0;
  color:#ffd000;
}

input,select{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #3a3a3e;
  border-radius:11px;
  background:#101012;
  color:white;
  font-size:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold;
}

.primary{
  width:100%;
  margin-top:8px;
  background:#ffd000;
  color:#000;
}

.secondary{
  background:#333;
  color:#fff;
}

.danger{
  background:#c62828;
  color:#fff;
}

.product{
  background:#101012;
  border:1px solid #303035;
  border-radius:15px;
  padding:12px;
  margin-top:12px;
  display:flex;
  gap:12px;
  align-items:center;
}

.product img{
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:11px;
  background:#222;
}

.product-info{
  flex:1;
}

.product-info h4{
  margin:0 0 6px;
}

.product-info p{
  margin:4px 0;
  color:#aaa;
  font-size:13px;
}

.actions{
  display:flex;
  gap:6px;
  margin-top:8px;
  flex-wrap:wrap;
}

.status{
  text-align:center;
  margin-top:12px;
  color:#ffd000;
}

.empty{
  text-align:center;
  color:#999;
  padding:30px;
}

.preview{
  width:100%;
  height:160px;
  object-fit:contain;
  background:#111;
  border-radius:12px;
  margin-top:8px;
  display:none;
}
</style>
</head>

<body>

<header>
  <h2>🛠️ SayonMart Admin</h2>
</header>

<div class="admin">

<div class="box">

<h3 id="title">➕ Add New Product</h3>

<input
  id="name"
  type="text"
  placeholder="Product Name"
>

<input
  id="price"
  type="number"
  min="0"
  placeholder="Price ₹"
>

<input
  id="image"
  type="url"
  placeholder="Image URL"
  oninput="preview()"
>

<img id="previewImg" class="preview">

<select id="category">

<option value="Fashion">👕 Fashion</option>
<option value="Shoes">👟 Shoes</option>
<option value="Mobiles">📱 Mobiles</option>
<option value="Watches">⌚ Watches</option>
<option value="Electronics">🎧 Electronics</option>
<option value="Other">📦 Other</option>

</select>

<button
  id="saveBtn"
  class="primary"
  onclick="saveProduct()"
>
➕ Add Product
</button>

<button
  id="cancelBtn"
  class="secondary"
  onclick="cancelEdit()"
  style="display:none;width:100%;margin-top:8px"
>
✖ Cancel
</button>

<div id="status" class="status"></div>

</div>


<div class="box">

<h3>📦 Products</h3>

<input
  id="search"
  type="text"
  placeholder="🔍 Search Product..."
  oninput="showProducts()"
>

<div id="productList">
  <div class="empty">⏳ Loading...</div>
</div>

</div>


<button
  class="primary"
  onclick="location.href='index.html'"
>
🏠 Back Home
</button>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


let products = [];
let editingId = null;


/* Load Products */

async function loadProducts(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"products")
      );

    products = [];

    snapshot.forEach(item => {

      products.push({
        id:item.id,
        ...item.data()
      });

    });

    showProducts();

  }catch(error){

    console.error(error);

    document.getElementById("productList").innerHTML =
      `<div class="empty">
        ⚠️ Product load হয়নি।
      </div>`;

  }

}


/* Show Products */

window.showProducts = function(){

  const search =
    document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const list =
    products.filter(p =>
      String(p.name || "")
      .toLowerCase()
      .includes(search)
    );


  if(list.length === 0){

    document.getElementById("productList").innerHTML =
      `<div class="empty">
        😕 কোনো Product নেই।
      </div>`;

    return;

  }


  document.getElementById("productList").innerHTML =
    list.map(p => `

      <div class="product">

        <img
          src="${safe(p.image || "https://picsum.photos/200")}"
          onerror="this.src='https://picsum.photos/200'"
        >

        <div class="product-info">

          <h4>
            ${safe(p.name || "Product")}
          </h4>

          <p>
            💰 ₹${Number(p.price || 0).toLocaleString("en-IN")}
          </p>

          <p>
            📂 ${safe(p.category || "Other")}
          </p>

          <div class="actions">

            <button
              class="secondary"
              onclick="editProduct('${p.id}')"
            >
              ✏️ Edit
            </button>

            <button
              class="danger"
              onclick="deleteProduct('${p.id}')"
            >
              🗑️ Delete
            </button>

          </div>

        </div>

      </div>

    `).join("");

};


/* Add / Update */

window.saveProduct = async function(){

  const name =
    document.getElementById("name").value.trim();

  const price =
    Number(document.getElementById("price").value);

  const image =
    document.getElementById("image").value.trim();

  const category =
    document.getElementById("category").value;


  if(!name){

    show("❌ Product Name দাও");
    return;

  }

  if(!Number.isFinite(price) || price < 0){

    show("❌ সঠিক দাম দাও");
    return;

  }

  if(!image){

    show("❌ Image URL দাও");
    return;

  }


  try{

    if(editingId){

      await updateDoc(
        doc(db,"products",editingId),
        {
          name:name,
          price:price,
          image:image,
          category:category,
          updatedAt:serverTimestamp()
        }
      );

      show("✅ Product Updated");

    }else{

      await addDoc(
        collection(db,"products"),
        {
          name:name,
          price:price,
          image:image,
          category:category,
          createdAt:serverTimestamp()
        }
      );

      show("✅ Product Added");

    }


    reset();

    await loadProducts();


  }catch(error){

    console.error(error);

    show("❌ Error: " + error.message);

  }

};


/* Edit */

window.editProduct = function(id){

  const p =
    products.find(x => x.id === id);

  if(!p) return;


  editingId = id;


  document.getElementById("title")
    .textContent = "✏️ Edit Product";


  document.getElementById("name").value =
    p.name || "";


  document.getElementById("price").value =
    p.price || "";


  document.getElementById("image").value =
    p.image || "";


  document.getElementById("category").value =
    p.category || "Other";


  document.getElementById("saveBtn")
    .textContent = "💾 Update Product";


  document.getElementById("cancelBtn")
    .style.display = "block";


  preview();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* Delete */

window.deleteProduct = async function(id){

  const p =
    products.find(x => x.id === id);

  if(!p) return;


  if(!confirm(
    "🗑️ " + p.name +
    " Delete করতে চাও?"
  )) return;


  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    show("🗑️ Product Deleted");

    await loadProducts();

  }catch(error){

    show("❌ Delete হয়নি");

  }

};


/* Cancel */

window.cancelEdit = function(){

  reset();

};


/* Reset */

function reset(){

  editingId = null;

  document.getElementById("title")
    .textContent = "➕ Add New Product";

  document.getElementById("name").value = "";

  document.getElementById("price").value = "";

  document.getElementById("image").value = "";

  document.getElementById("category").value = "Fashion";

  document.getElementById("saveBtn")
    .textContent = "➕ Add Product";

  document.getElementById("cancelBtn")
    .style.display = "none";

  document.getElementById("previewImg")
    .style.display = "none";

}


/* Image Preview */

window.preview = function(){

  const url =
    document.getElementById("image").value.trim();

  const img =
    document.getElementById("previewImg");


  if(url){

    img.src = url;
    img.style.display = "block";

  }else{

    img.style.display = "none";

  }

};


/* Status */

function show(text){

  const status =
    document.getElementById("status");

  status.textContent = text;

  setTimeout(()=>{
    status.textContent = "";
  },2500);

}


/* Security helper */

function safe(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


loadProducts();

</script>

</body>
</html>
