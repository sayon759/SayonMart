<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SayonMart Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}

.header{
  background:#000;
  padding:18px;
  text-align:center;
  border-bottom:1px solid #333;
}

.header h1{
  color:#FFD700;
}

.container{
  padding:20px;
  max-width:900px;
  margin:auto;
}

.card{
  background:#1b1b1b;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
}

.card h2{
  color:#FFD700;
  margin-bottom:15px;
}

input,select{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  background:#292929;
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#FFD700;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

button.delete{
  background:#e53935;
  color:white;
}

button.edit{
  background:#2196f3;
  color:white;
}

button.cancel{
  background:#555;
  color:white;
}

/* PHOTO PREVIEW */

#previewContainer{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.preview-box{
  position:relative;
}

.preview-img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  border:2px solid #444;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.product{
  background:#222;
  padding:12px;
  border-radius:12px;
}

.product img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

.product h3{
  margin-top:8px;
}

.price{
  color:#FFD700;
  font-weight:bold;
  margin-top:5px;
}

.category{
  color:#aaa;
  margin-top:4px;
}

.small-btns{
  display:flex;
  gap:7px;
}

.small-btns button{
  flex:1;
}

.loading{
  color:#aaa;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🛒 SayonMart Admin</h1>
</div>

<div class="container">

  <!-- ADD PRODUCT -->

  <div class="card">

    <h2 id="formTitle">Add Product</h2>

    <input
      id="productName"
      type="text"
      placeholder="Product Name"
    >

    <input
      id="productPrice"
      type="number"
      placeholder="Price"
    >

    <select id="productCategory">

      <option value="">
        Select Category
      </option>

      <option value="Fashion">
        Fashion
      </option>

      <option value="Shoes">
        Shoes
      </option>

      <option value="Mobiles">
        Mobiles
      </option>

      <option value="Watches">
        Watches
      </option>

      <option value="Electronics">
        Electronics
      </option>

      <option value="Other">
        Other
      </option>

    </select>


    <!-- GALLERY -->

    <input
      id="productImage"
      type="file"
      accept="image/*"
      multiple
    >

    <p style="color:#aaa;font-size:13px;margin-top:5px;">
      📷 সর্বোচ্চ ১০টি ছবি নির্বাচন করুন
    </p>


    <!-- PREVIEW -->

    <div id="previewContainer"></div>


    <button
      id="saveBtn"
      onclick="saveProduct()"
    >
      ➕ Add Product
    </button>


    <button
      id="cancelBtn"
      class="cancel"
      onclick="cancelEdit()"
      style="display:none;"
    >
      Cancel Edit
    </button>

  </div>


  <!-- ALL PRODUCTS -->

  <div class="card">

    <h2>All Products</h2>

    <input
      id="searchBox"
      type="text"
      placeholder="🔍 Search Product..."
      oninput="loadProducts()"
    >

    <div
      id="products"
      class="products"
    >
      <div class="loading">
        Loading...
      </div>
    </div>

  </div>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


let currentUser = null;

let editId = null;

let selectedImages = [];



/* =========================
   LOGIN CHECK
========================= */

auth.onAuthStateChanged(user => {

  if(!user){

    alert("Please Login First");

    window.location.href =
      "login.html";

    return;

  }

  currentUser = user;

  loadProducts();

});



/* =========================
   IMAGE SELECT
========================= */

document
.getElementById("productImage")
.addEventListener("change", async function(e){

  const files =
    Array.from(e.target.files);


  /* MAX 10 */

  if(files.length > 10){

    alert(
      "সর্বোচ্চ ১০টি ছবি নির্বাচন করতে পারবেন।"
    );

    this.value = "";

    return;

  }


  selectedImages = [];

  const container =
    document.getElementById(
      "previewContainer"
    );

  container.innerHTML = "";


  for(const file of files){

    if(!file.type.startsWith("image/")){

      continue;

    }


    try{

      const image =
        await compressImage(file);

      selectedImages.push(image);


      const box =
        document.createElement("div");

      box.className =
        "preview-box";


      const img =
        document.createElement("img");

      img.src = image;

      img.className =
        "preview-img";


      box.appendChild(img);

      container.appendChild(box);

    }
    catch(error){

      console.error(error);

    }

  }

});



/* =========================
   COMPRESS IMAGE
========================= */

function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );


              const maxSize = 700;


              let width =
                img.width;

              let height =
                img.height;


              if(width > height){

                if(width > maxSize){

                  height =
                    height *
                    maxSize /
                    width;

                  width =
                    maxSize;

                }

              }
              else{

                if(height > maxSize){

                  width =
                    width *
                    maxSize /
                    height;

                  height =
                    maxSize;

                }

              }


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const result =
                canvas.toDataURL(
                  "image/jpeg",
                  0.65
                );


              resolve(result);

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}



/* =========================
   SAVE PRODUCT
========================= */

window.saveProduct =
async function(){

  if(!currentUser){

    alert(
      "Please login first"
    );

    return;

  }


  const name =
    document
    .getElementById(
      "productName"
    )
    .value
    .trim();


  const price =
    document
    .getElementById(
      "productPrice"
    )
    .value;


  const category =
    document
    .getElementById(
      "productCategory"
    )
    .value;


  const fileInput =
    document
    .getElementById(
      "productImage"
    );


  const files =
    Array.from(
      fileInput.files
    );


  /* VALIDATION */

  if(!name){

    alert(
      "Product name দিন"
    );

    return;

  }


  if(!price){

    alert(
      "Price দিন"
    );

    return;

  }


  if(!category){

    alert(
      "Category select করুন"
    );

    return;

  }


  try{


    /* =====================
       NEW PRODUCT
    ===================== */

    if(!editId){

      if(selectedImages.length === 0){

        alert(
          "Gallery থেকে অন্তত ১টি ছবি select করুন"
        );

        return;

      }


      await addDoc(
        collection(
          db,
          "products"
        ),
        {

          name:name,

          price:Number(price),

          category:category,

          /* FIRST IMAGE
             OLD APP SUPPORT */

          image:
            selectedImages[0],

          /* ALL IMAGES */

          images:
            selectedImages,

          createdAt:
            Date.now(),

          createdBy:
            currentUser.uid

        }
      );


      alert(
        "✅ Product Added!"
      );

    }



    /* =====================
       EDIT PRODUCT
    ===================== */

    else{

      /*
       যদি নতুন ছবি দেওয়া হয়,
       তাহলে নতুন ছবিগুলো save হবে।
      */

      let finalImages =
        selectedImages;


      /*
       নতুন ছবি না দিলে
       পুরোনো ছবি থাকবে।
      */

      if(files.length === 0){

        finalImages =
          selectedImages;

      }


      await updateDoc(

        doc(
          db,
          "products",
          editId
        ),

        {

          name:name,

          price:Number(price),

          category:category,

          image:
            finalImages[0] || "",

          images:
            finalImages

        }

      );


      alert(
        "✅ Product Updated!"
      );

    }


    clearForm();

    loadProducts();

  }
  catch(error){

    console.error(error);

    alert(
      "Error: " +
      error.message
    );

  }

};



/* =========================
   LOAD PRODUCTS
========================= */

window.loadProducts =
async function(){

  const box =
    document.getElementById(
      "products"
    );


  box.innerHTML =
    '<div class="loading">Loading...</div>';


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "products"
        )
      );


    const search =
      document
      .getElementById(
        "searchBox"
      )
      .value
      .toLowerCase();


    box.innerHTML = "";


    let count = 0;


    snapshot.forEach(item => {

      const p =
        item.data();


      if(
        search &&
        !String(
          p.name || ""
        )
        .toLowerCase()
        .includes(search)
      ){

        return;

      }


      count++;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "product";


      /*
       OLD PRODUCT:
       image

       NEW PRODUCT:
       images
      */

      const firstImage =
        p.image ||
        (
          Array.isArray(
            p.images
          )
          ?
          p.images[0]
          :
          ""
        );


      div.innerHTML = `

        ${
          firstImage
          ?
          `
          <img
            src="${firstImage}"
            onerror="this.style.display='none'"
          >
          `
          :
          ""
        }


        <h3>
          ${escapeHTML(
            p.name ||
            "Product"
          )}
        </h3>


        <div class="price">
          ₹${p.price || 0}
        </div>


        <p class="category">
          ${escapeHTML(
            p.category ||
            ""
          )}
        </p>


        <div class="small-btns">

          <button
            class="edit"
            onclick="editProduct('${item.id}')"
          >
            ✏️ Edit
          </button>


          <button
            class="delete"
            onclick="deleteProduct('${item.id}')"
          >
            🗑️ Delete
          </button>

        </div>

      `;


      box.appendChild(div);

    });


    if(count === 0){

      box.innerHTML =
        "<p>No Products Found</p>";

    }

  }
  catch(error){

    console.error(error);

    box.innerHTML =
      "<p>Products load হচ্ছে না</p>";

  }

};



/* =========================
   EDIT PRODUCT
========================= */

window.editProduct =
async function(id){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "products"
        )
      );


    let found = null;


    snapshot.forEach(item => {

      if(item.id === id){

        found =
          item.data();

      }

    });


    if(!found){

      return;

    }


    document
    .getElementById(
      "productName"
    )
    .value =
      found.name || "";


    document
    .getElementById(
      "productPrice"
    )
    .value =
      found.price || "";


    document
    .getElementById(
      "productCategory"
    )
    .value =
      found.category || "";


    /*
      OLD PRODUCT:
      image

      NEW PRODUCT:
      images
    */

    if(
      Array.isArray(
        found.images
      )
      &&
      found.images.length > 0
    ){

      selectedImages =
        found.images;

    }
    else if(found.image){

      selectedImages =
        [found.image];

    }
    else{

      selectedImages =
        [];

    }


    showPreview();


    editId = id;


    document
    .getElementById(
      "formTitle"
    )
    .innerText =
      "Edit Product";


    document
    .getElementById(
      "saveBtn"
    )
    .innerText =
      "💾 Update Product";


    document
    .getElementById(
      "cancelBtn"
    )
    .style.display =
      "block";


    window.scrollTo({

      top:0,

      behavior:"smooth"

    });

  }
  catch(error){

    alert(
      error.message
    );

  }

};



/* =========================
   SHOW PREVIEW
========================= */

function showPreview(){

  const container =
    document.getElementById(
      "previewContainer"
    );


  container.innerHTML = "";


  selectedImages.forEach(image => {

    const box =
      document.createElement(
        "div"
      );


    box.className =
      "preview-box";


    const img =
      document.createElement(
        "img"
      );


    img.src = image;

    img.className =
      "preview-img";


    box.appendChild(img);

    container.appendChild(box);

  });

}



/* =========================
   DELETE PRODUCT
========================= */

window.deleteProduct =
async function(id){

  const ok =
    confirm(
      "এই product delete করবেন?"
    );


  if(!ok){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "products",
        id
      )
    );


    alert(
      "🗑️ Product Deleted"
    );


    loadProducts();

  }
  catch(error){

    alert(
      error.message
    );

  }

};



/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  document
  .getElementById(
    "productName"
  )
  .value = "";


  document
  .getElementById(
    "productPrice"
  )
  .value = "";


  document
  .getElementById(
    "productCategory"
  )
  .value = "";


  document
  .getElementById(
    "productImage"
  )
  .value = "";


  document
  .getElementById(
    "previewContainer"
  )
  .innerHTML = "";


  selectedImages = [];


  editId = null;


  document
  .getElementById(
    "formTitle"
  )
  .innerText =
    "Add Product";


  document
  .getElementById(
    "saveBtn"
  )
  .innerText =
    "➕ Add Product";


  document
  .getElementById(
    "cancelBtn"
  )
  .style.display =
    "none";

}



/* =========================
   CANCEL EDIT
========================= */

window.cancelEdit =
function(){

  clearForm();

};



/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
