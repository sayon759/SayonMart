<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SayonMart Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}
.header{
  background:#e91e63;
  color:white;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}
.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 2px 8px #ddd;
}
input,select{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}
button{
  border:0;
  padding:11px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
.add{
  width:100%;
  background:#e91e63;
  color:white;
}
.product{
  display:flex;
  gap:12px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:12px 0;
}
.product img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:8px;
}
.info{
  flex:1;
}
.price{
  color:#e91e63;
  font-weight:bold;
}
.edit{
  background:#2196f3;
  color:white;
  margin-right:5px;
}
.delete{
  background:#f44336;
  color:white;
}
.preview{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:10px;
  display:none;
}
#message{
  margin:10px 0;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">⚙️ SayonMart Admin Panel</div>

<div class="container">

<div class="card">

<h2 id="formTitle">➕ Add Product</h2>

<input id="name" type="text" placeholder="Product Name">

<input id="price" type="number" placeholder="Price ₹">

<input id="image" type="text" placeholder="Image URL">

<img id="preview" class="preview">

<select id="category">
  <option value="">Select Category</option>
  <option value="Fashion">Fashion</option>
  <option value="Shoes">Shoes</option>
  <option value="Mobiles">Mobiles</option>
  <option value="Watches">Watches</option>
  <option value="Electronics">Electronics</option>
  <option value="Other">Other</option>
</select>

<button class="add" id="saveBtn">➕ Add Product</button>

<div id="message"></div>

</div>


<div class="card">

<h2>📦 Products</h2>

<input
  id="search"
  type="text"
  placeholder="🔍 Search Product..."
>

<div id="productList">
Loading products...
</div>

</div>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const ADMIN_UID = "fqQpbMgWScgUbu5Vco4dJ6WuBVL2";

let editingId = null;
let allProducts = [];

const nameInput = document.getElementById("name");
const priceInput = document.getElementById("price");
const imageInput = document.getElementById("image");
const categoryInput = document.getElementById("category");
const saveBtn = document.getElementById("saveBtn");
const productList = document.getElementById("productList");
const searchInput = document.getElementById("search");
const message = document.getElementById("message");
const preview = document.getElementById("preview");


/* ADMIN CHECK */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    alert("Please login first.");
    location.href = "login.html";
    return;
  }


  loadProducts();

});


/* IMAGE PREVIEW */

imageInput.addEventListener("input", () => {

  const url = imageInput.value.trim();

  if (url) {
    preview.src = url;
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }

});


/* ADD / UPDATE */

saveBtn.addEventListener("click", async () => {

  const name = nameInput.value.trim();
  const price = Number(priceInput.value);
  const image = imageInput.value.trim();
  const category = categoryInput.value;

  if (!name || !price || !image || !category) {
    message.innerText = "⚠️ সব তথ্য পূরণ করো";
    return;
  }

  try {

    saveBtn.disabled = true;

    if (editingId) {

      await updateDoc(
        doc(db, "products", editingId),
        {
          name,
          price,
          image,
          category,
          updatedAt: serverTimestamp()
        }
      );

      message.innerText = "✅ Product updated successfully";

      editingId = null;
      document.getElementById("formTitle").innerText = "➕ Add Product";
      saveBtn.innerText = "➕ Add Product";

    } else {

      await addDoc(
        collection(db, "products"),
        {
          name,
          price,
          image,
          category,
          createdAt: serverTimestamp()
        }
      );

      message.innerText = "✅ Product added successfully";

    }

    clearForm();
    loadProducts();

  } catch (error) {

    console.error(error);
    message.innerText = "❌ Error: " + error.message;

  }

  saveBtn.disabled = false;

});


/* LOAD PRODUCTS */

async function loadProducts() {

  productList.innerHTML = "Loading...";

  try {

    const snapshot = await getDocs(
      collection(db, "products")
    );

    allProducts = [];

    snapshot.forEach((item) => {

      allProducts.push({
        id: item.id,
        ...item.data()
      });

    });

    showProducts(allProducts);

  } catch (error) {

    console.error(error);

    productList.innerHTML =
      "❌ Products load হয়নি";

  }

}


/* SHOW PRODUCTS */

function showProducts(products) {

  if (products.length === 0) {

    productList.innerHTML =
      "📦 No Products Found";

    return;
  }

  productList.innerHTML = "";

  products.forEach(product => {

    const div = document.createElement("div");

    div.className = "product";

    div.innerHTML = `

      <img
        src="${product.image || ''}"
        onerror="this.src='https://via.placeholder.com/100'"
      >

      <div class="info">

        <b>${product.name || "Product"}</b>

        <div class="price">
          ₹${product.price || 0}
        </div>

        <small>
          ${product.category || ""}
        </small>

      </div>

      <div>

        <button
          class="edit"
          data-id="${product.id}">
          Edit
        </button>

        <button
          class="delete"
          data-id="${product.id}">
          Delete
        </button>

      </div>
    `;

    productList.appendChild(div);

  });


  /* EDIT BUTTON */

  document.querySelectorAll(".edit").forEach(button => {

    button.addEventListener("click", () => {

      const product = allProducts.find(
        p => p.id === button.dataset.id
      );

      if (!product) return;

      editingId = product.id;

      nameInput.value = product.name || "";
      priceInput.value = product.price || "";
      imageInput.value = product.image || "";
      categoryInput.value = product.category || "";

      document.getElementById("formTitle").innerText =
        "✏️ Edit Product";

      saveBtn.innerText =
        "💾 Update Product";

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

      if (product.image) {
        preview.src = product.image;
        preview.style.display = "block";
      }

    });

  });


  /* DELETE BUTTON */

  document.querySelectorAll(".delete").forEach(button => {

    button.addEventListener("click", async () => {

      const ok = confirm(
        "এই Product টি Delete করতে চাও?"
      );

      if (!ok) return;

      try {

        await deleteDoc(
          doc(db, "products", button.dataset.id)
        );

        message.innerText =
          "🗑️ Product deleted";

        loadProducts();

      } catch (error) {

        message.innerText =
          "❌ Delete error: " + error.message;

      }

    });

  });

}


/* SEARCH */

searchInput.addEventListener("input", () => {

  const text =
    searchInput.value.toLowerCase().trim();

  const filtered = allProducts.filter(product =>

    (product.name || "")
      .toLowerCase()
      .includes(text)

  );

  showProducts(filtered);

});


/* CLEAR FORM */

function clearForm() {

  nameInput.value = "";
  priceInput.value = "";
  imageInput.value = "";
  categoryInput.value = "";

  preview.style.display = "none";

}

</script>

</body>
</html>
