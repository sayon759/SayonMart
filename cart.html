<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SayonMart Cart</title><style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
  padding-bottom:80px;
}

header{
  background:#e91e63;
  color:white;
  padding:15px;
  font-size:22px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:10;
}

#cart{
  padding:10px;
}

.item{
  background:white;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  display:flex;
  gap:10px;
  box-shadow:0 1px 4px #ddd;
}

.item img{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:8px;
  background:#fafafa;
}

.info{
  flex:1;
}

.name{
  font-weight:bold;
  margin-bottom:5px;
}

.price{
  color:#e91e63;
  font-weight:bold;
  font-size:18px;
}

.qty{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.qty button{
  width:30px;
  height:30px;
  border:0;
  border-radius:6px;
  background:#eee;
  font-size:18px;
}

.delete{
  border:0;
  background:#ffebee;
  color:#e91e63;
  padding:6px 9px;
  border-radius:6px;
}

.order-one{
  width:100%;
  border:0;
  padding:10px;
  background:#FFD21F;
  color:#222;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  margin-top:10px;
}

.summary{
  background:white;
  margin:10px;
  padding:15px;
  border-radius:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

.total{
  border-top:1px solid #ddd;
  padding-top:10px;
  font-size:20px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:#777;
}

.shop-btn{
  width:100%;
  border:0;
  padding:13px;
  background:#e91e63;
  color:white;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  margin-top:10px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:9px 0;
  z-index:20;
}

.bottom a{
  text-decoration:none;
  color:#555;
  font-size:13px;
  text-align:center;
}
</style></head><body><header>🛒 SayonMart Cart</header><div id="cart"></div><div id="summary"></div><div class="bottom">
  <a href="index.html">🏠<br>Home</a>
  <a href="products.html">🛍️<br>Products</a>
  <a href="cart.html">🛒<br>Cart</a>
  <a href="order.html">📦<br>Orders</a>
  <a href="profile.html">👤<br>Profile</a>
</div><script>

const cartBox =
  document.getElementById("cart");

const summaryBox =
  document.getElementById("summary");


// ======================
// LOAD CART
// ======================

function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem("cart") || "[]"
    );

  }catch(e){

    return [];

  }

}


// ======================
// SAVE CART
// ======================

function saveCart(cart){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

}


// ======================
// IMAGE
// ======================

function getImage(item){

  if(item.image)
    return item.image;

  if(item.imageUrl)
    return item.imageUrl;

  if(item.productImage)
    return item.productImage;

  return "https://via.placeholder.com/150?text=Product";

}


// ======================
// SHOW CART
// ======================

function showCart(){

  const cart = getCart();

  if(cart.length === 0){

    cartBox.innerHTML = `
      <div class="empty">

        <div style="font-size:55px">🛒</div>

        <h3>আপনার Cart খালি</h3>

        <p>Product যোগ করুন</p>

        <button
          class="shop-btn"
          onclick="location.href='products.html'">

          🛍️ Product দেখুন

        </button>

      </div>
    `;

    summaryBox.innerHTML = "";

    return;
  }


  let html = "";

  let subtotal = 0;


  cart.forEach((item,index)=>{

    const price =
      Number(item.price || 0);

    const quantity =
      Number(item.quantity || 1);

    const total =
      price * quantity;

    subtotal += total;


    html += `

      <div class="item">

        <img
          src="${getImage(item)}"
          loading="lazy"
          decoding="async"
          alt="Product"
        >

        <div class="info">

          <div class="name">
            ${escapeHTML(item.name || "Product")}
          </div>

          <div class="price">
            ₹${price}
          </div>

          <div class="qty">

            <button
              onclick="changeQty(${index},-1)">
              −
            </button>

            <b>${quantity}</b>

            <button
              onclick="changeQty(${index},1)">
              +
            </button>

            <button
              class="delete"
              onclick="removeItem(${index})">
              🗑️
            </button>

          </div>

          <button
            class="order-one"
            onclick="orderThis(${index})">

            🛍️ Order This

          </button>

        </div>

      </div>

    `;

  });


  cartBox.innerHTML = html;


  /*
    Cart-এর সব product-এর মোট শুধু
    দেখানোর জন্য রাখা হয়েছে।
    Checkout এখানে থেকে হবে না।
  */

  const delivery =
    subtotal >= 499 ? 0 : 40;

  const grandTotal =
    subtotal + delivery;


  summaryBox.innerHTML = `

    <div class="summary">

      <div class="row">
        <span>Cart Subtotal</span>
        <b>₹${subtotal}</b>
      </div>

      <div class="row">
        <span>Delivery</span>
        <b>
          ${delivery === 0
            ? "FREE"
            : "₹" + delivery}
        </b>
      </div>

      <div class="row total">
        <span>Cart Total</span>
        <span>₹${grandTotal}</span>
      </div>

      <div style="
        text-align:center;
        color:#777;
        font-size:12px;
        margin-top:10px;
      ">
        উপরের যে product-টি Order করবেন,
        শুধু সেটিই checkout হবে।
      </div>

    </div>

  `;

}


// ======================
// QUANTITY
// ======================

window.changeQty =
function(index,change){

  const cart = getCart();

  if(!cart[index])
    return;


  cart[index].quantity =
    Number(cart[index].quantity || 1)
    + change;


  if(cart[index].quantity <= 0){

    cart.splice(index,1);

  }


  saveCart(cart);

  showCart();

};


// ======================
// REMOVE
// ======================

window.removeItem =
function(index){

  const cart = getCart();

  if(!cart[index])
    return;


  cart.splice(index,1);

  saveCart(cart);

  showCart();

};


// ======================
// ORDER ONLY THIS PRODUCT
// ======================

window.orderThis =
function(index){

  const cart = getCart();

  if(!cart[index]){

    alert("Product পাওয়া যায়নি।");

    return;

  }


  const selectedProduct = {
    id:
      cart[index].id || "",

    name:
      cart[index].name || "Product",

    price:
      Number(cart[index].price || 0),

    image:
      getImage(cart[index]),

    quantity:
      Number(cart[index].quantity || 1)
  };


  /*
    শুধু নির্বাচিত product
    payment page-এ পাঠানো হবে।
  */

  localStorage.setItem(
    "sayonmartBuyNow",
    JSON.stringify(selectedProduct)
  );


  location.href =
    "payment.html";

};


// ======================
// SAFE TEXT
// ======================

function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


// ======================
// START
// ======================

showCart();

</script></body>
</html>
