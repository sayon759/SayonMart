<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart Cart</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
  padding-bottom:90px;
}

/* HEADER */

header{
  background:#e91e63;
  color:white;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

header h2{
  font-size:20px;
}

/* CONTAINER */

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

/* CART ITEM */

.cart-item{
  background:white;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  display:flex;
  gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.cart-item img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.item-info{
  flex:1;
}

.item-info h3{
  font-size:16px;
  margin-bottom:7px;
}

.item-price{
  color:#e91e63;
  font-weight:bold;
  font-size:17px;
}

/* QUANTITY */

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.quantity button{
  width:32px;
  height:32px;
  border:none;
  border-radius:6px;
  background:#e91e63;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.quantity span{
  min-width:25px;
  text-align:center;
  font-weight:bold;
}

/* REMOVE */

.remove{
  margin-top:8px;
  border:none;
  background:none;
  color:#e53935;
  cursor:pointer;
  font-size:13px;
}

/* SUMMARY */

.summary{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-top:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
}

.total{
  border-top:1px solid #ddd;
  padding-top:14px;
  font-size:20px;
  font-weight:bold;
}

.checkout{
  width:100%;
  padding:15px;
  border:none;
  border-radius:8px;
  background:#e91e63;
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:60px 20px;
  color:#777;
}

.empty h2{
  margin-bottom:10px;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom a{
  text-decoration:none;
  color:#777;
  text-align:center;
  font-size:12px;
}

.bottom a div{
  font-size:22px;
  margin-bottom:2px;
}

.bottom .active{
  color:#e91e63;
}

</style>
</head>

<body>


<!-- HEADER -->

<header>

  <h2>
    🛒 My Cart
  </h2>

  <span
    onclick="location.href='products.html'"
    style="cursor:pointer;"
  >
    Continue Shopping
  </span>

</header>



<div class="container">


  <!-- CART -->

  <div id="cartList"></div>


  <!-- SUMMARY -->

  <div
    id="summary"
    class="summary"
    style="display:none;"
  >

    <div class="row">

      <span>
        Items
      </span>

      <span id="itemCount">
        0
      </span>

    </div>


    <div class="row">

      <span>
        Subtotal
      </span>

      <span>
        ₹<span id="subtotal">0</span>
      </span>

    </div>


    <div class="row">

      <span>
        Delivery
      </span>

      <span id="delivery">
        ₹0
      </span>

    </div>


    <div class="row total">

      <span>
        Total
      </span>

      <span>
        ₹<span id="total">0</span>
      </span>

    </div>


    <button
      class="checkout"
      onclick="checkout()"
    >
      Proceed to Checkout →
    </button>

  </div>

</div>



<!-- BOTTOM NAV -->

<nav class="bottom">

  <a href="index.html">

    <div>⌂</div>

    Home

  </a>


  <a href="products.html">

    <div>▦</div>

    Products

  </a>


  <a
    href="cart.html"
    class="active"
  >

    <div>🛒</div>

    Cart

  </a>


  <a href="order.html">

    <div>▤</div>

    Orders

  </a>


  <a href="profile.html">

    <div>♙</div>

    Profile

  </a>

</nav>



<script>


/* =========================
   GET CART
========================= */

function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem("cart") || "[]"
    );

  }
  catch(error){

    return [];

  }

}



/* =========================
   SAVE CART
========================= */

function saveCart(cart){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

}



/* =========================
   LOAD CART
========================= */

function loadCart(){

  const cart =
    getCart();

  const list =
    document.getElementById(
      "cartList"
    );

  const summary =
    document.getElementById(
      "summary"
    );


  /* EMPTY CART */

  if(cart.length === 0){

    list.innerHTML = `

      <div class="empty">

        <div style="font-size:60px;">
          🛒
        </div>

        <h2>
          Your Cart is Empty
        </h2>

        <p>
          Add some products to your cart.
        </p>

        <button
          onclick="location.href='products.html'"
          style="
            margin-top:20px;
            padding:13px 25px;
            border:none;
            border-radius:8px;
            background:#e91e63;
            color:white;
            font-weight:bold;
          "
        >
          Shop Now
        </button>

      </div>

    `;

    summary.style.display =
      "none";

    return;

  }


  summary.style.display =
    "block";


  list.innerHTML =
    "";


  let subtotal = 0;

  let itemCount = 0;


  /* CART ITEMS */

  cart.forEach(
    (item,index) => {

      const price =
        Number(
          item.price || 0
        );


      const quantity =
        Number(
          item.quantity || 1
        );


      subtotal +=
        price * quantity;


      itemCount +=
        quantity;


      const image =
        item.image || "";


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "cart-item";


      div.innerHTML = `

        ${
          image
          ?
          `
          <img
            src="${image}"
            onerror="
              this.style.display='none'
            "
          >
          `
          :
          `
          <div style="
            width:90px;
            height:90px;
            background:#eee;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
          ">
            📦
          </div>
          `
        }


        <div class="item-info">

          <h3>
            ${escapeHTML(
              item.name ||
              "Product"
            )}
          </h3>


          <div class="item-price">
            ₹${price.toLocaleString("en-IN")}
          </div>


          <div class="quantity">

            <button
              onclick="changeQuantity(${index},-1)"
            >
              −
            </button>


            <span>
              ${quantity}
            </span>


            <button
              onclick="changeQuantity(${index},1)"
            >
              +
            </button>

          </div>


          <button
            class="remove"
            onclick="removeItem(${index})"
          >
            🗑️ Remove
          </button>

        </div>

      `;


      list.appendChild(
        div
      );

    }
  );


  /* DELIVERY */

  let delivery = 0;


  if(subtotal > 0){

    delivery =
      subtotal >= 499
      ? 0
      : 40;

  }


  const total =
    subtotal +
    delivery;


  document
  .getElementById(
    "itemCount"
  )
  .textContent =
    itemCount;


  document
  .getElementById(
    "subtotal"
  )
  .textContent =
    subtotal.toLocaleString(
      "en-IN"
    );


  document
  .getElementById(
    "delivery"
  )
  .textContent =
    delivery === 0
    ? "FREE"
    : "₹" + delivery;


  document
  .getElementById(
    "total"
  )
  .textContent =
    total.toLocaleString(
      "en-IN"
    );

}



/* =========================
   CHANGE QUANTITY
========================= */

window.changeQuantity =
function(index,change){

  const cart =
    getCart();


  if(!cart[index]){

    return;

  }


  let quantity =
    Number(
      cart[index].quantity || 1
    );


  quantity +=
    change;


  if(quantity <= 0){

    cart.splice(
      index,
      1
    );

  }
  else{

    cart[index].quantity =
      quantity;

  }


  saveCart(
    cart
  );


  loadCart();

};



/* =========================
   REMOVE ITEM
========================= */

window.removeItem =
function(index){

  const cart =
    getCart();


  if(!cart[index]){

    return;

  }


  cart.splice(
    index,
    1
  );


  saveCart(
    cart
  );


  loadCart();

};



/* =========================
   CHECKOUT
========================= */

window.checkout =
function(){

  const cart =
    getCart();


  if(cart.length === 0){

    alert(
      "Your cart is empty"
    );

    return;

  }


  /*
    Checkout page
  */

 location.href =
  "payment.html";

};



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================
   START
========================= */

loadCart();

</script>

</body>
</html>
