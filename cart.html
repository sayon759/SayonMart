<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart Cart</title>

<link rel="stylesheet" href="style.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:100px;
}

header{
  background:#050505;
  padding:20px;
  text-align:center;
  border-bottom:1px solid #292929;
}

header h2{
  margin:0;
  color:#ffd000;
  font-size:27px;
}

.cart-container{
  padding:18px;
}

.cart-card{
  background:#19191c;
  border:1px solid #303035;
  border-radius:18px;
  padding:12px;
  display:flex;
  gap:12px;
  margin-bottom:14px;
  align-items:center;
}

.cart-card img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:13px;
  background:#111;
}

.cart-info{
  flex:1;
}

.cart-info h3{
  margin:0 0 7px;
  font-size:16px;
}

.price{
  color:#ffd000;
  font-size:18px;
  font-weight:bold;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.quantity button{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:#ffd000;
  color:#000;
  font-size:18px;
  font-weight:bold;
}

.quantity span{
  min-width:25px;
  text-align:center;
}

.remove{
  background:#333;
  color:#fff;
  border:0;
  border-radius:8px;
  padding:7px 9px;
  margin-top:8px;
}
