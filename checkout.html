<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#ffffff">

<title>SayonMart - Checkout</title>

<script src="language.js"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0 0 105px 0;
  background:#f5f7fb;
  color:#172033;
  font-family:Arial,Helvetica,sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  position:sticky;
  top:0;
  z-index:1000;

  height:68px;

  background:#fff;

  display:flex;
  align-items:center;

  padding:0 15px;

  border-bottom:1px solid #e6e8ed;

  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.back{
  width:42px;
  height:42px;

  border:0;
  background:#f4f6f9;

  border-radius:50%;

  font-size:31px;
  line-height:1;

  color:#172033;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  margin-left:10px;
  font-size:21px;
  font-weight:800;
  color:#172033;
}

.logo span{
  color:#f4ad00;
}

.secure{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:6px;

  color:#147a58;

  font-size:12px;
  font-weight:bold;
}

.secure-icon{
  width:28px;
  height:28px;

  border-radius:50%;

  background:#e9fff5;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:15px;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-wrap{
  background:#fff;
  padding:15px 12px 18px;

  border-bottom:1px solid #e6e8ed;
}

.progress{
  max-width:650px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;
}

.step-item{
  display:flex;
  flex-direction:column;
  align-items:center;

  min-width:65px;

  position:relative;

  z-index:2;
}

.step-circle{
  width:36px;
  height:36px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#edf0f5;
  color:#8992a2;

  font-size:15px;
  font-weight:bold;
}

.step-item.active .step-circle{
  background:#ffbd00;
  color:#172033;

  box-shadow:0 0 0 5px #fff6d8;
}

.step-item.done .step-circle{
  background:#20b77a;
  color:#fff;
}

.step-label{
  margin-top:7px;

  font-size:11px;
  font-weight:bold;

  color:#8a93a3;
}

.step-item.active .step-label,
.step-item.done .step-label{
  color:#172033;
}

.step-line{
  height:3px;

  flex:1;

  max-width:105px;

  background:#e3e6eb;

  margin:0 -4px;

  margin-bottom:19px;
}

.step-line.done{
  background:#20b77a;
}


/* =====================================================
   PAGE
===================================================== */

.page{
  max-width:1100px;

  margin:0 auto;

  padding:15px;
}

.grid{
  display:grid;

  grid-template-columns:1.2fr .8fr;

  gap:15px;

  align-items:start;
}


/* =====================================================
   CARD
===================================================== */

.card{
  background:#fff;

  border-radius:16px;

  border:1px solid #e6e9ef;

  box-shadow:0 3px 15px rgba(18,32,52,.05);

  overflow:hidden;

  margin-bottom:15px;
}

.card-header{
  padding:17px 18px 13px;

  display:flex;
  align-items:center;
  gap:11px;
}

.card-icon{
  width:40px;
  height:40px;

  border-radius:12px;

  background:#fff5d8;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:21px;
}

.card-title{
  font-size:19px;
  font-weight:800;
}

.card-subtitle{
  margin-top:3px;

  color:#7c8595;

  font-size:12px;
}

.card-body{
  padding:0 18px 18px;
}


/* =====================================================
   LOCATION BUTTON
===================================================== */

.location-btn{
  width:100%;

  border:1px solid #ffd05a;

  background:linear-gradient(
    135deg,
    #fffaf0,
    #fffdf8
  );

  border-radius:13px;

  padding:14px;

  display:flex;
  align-items:center;

  text-align:left;

  cursor:pointer;

  margin-bottom:13px;
}

.location-icon{
  width:43px;
  height:43px;

  border-radius:11px;

  background:#ffbf00;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;

  margin-right:12px;
}

.location-text{
  flex:1;
}

.location-title{
  font-size:15px;
  font-weight:bold;

  color:#172033;
}

.location-sub{
  margin-top:4px;

  color:#727c8c;

  font-size:12px;
}

.location-arrow{
  font-size:26px;
  color:#7a8495;
}


/* =====================================================
   INPUT
===================================================== */

.input-group{
  position:relative;

  margin-top:11px;
}

.input{
  width:100%;

  min-height:53px;

  border:1px solid #d9dee7;

  background:#fff;

  border-radius:11px;

  padding:21px 13px 7px 43px;

  outline:none;

  color:#172033;

  font-size:15px;

  font-family:Arial,Helvetica,sans-serif;

  transition:.2s;
}

.input:focus{
  border-color:#ffb900;

  box-shadow:
    0 0 0 3px
    rgba(255,185,0,.12);
}

.input-label{
  position:absolute;

  left:43px;
  top:7px;

  color:#7a8494;

  font-size:11px;

  pointer-events:none;
}

.input-icon{
  position:absolute;

  left:14px;
  top:18px;

  font-size:17px;

  color:#536176;
}

textarea.input{
  min-height:90px;

  resize:none;

  padding-top:23px;
}

.row{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;
}


/* =====================================================
   SAVE ADDRESS
===================================================== */

.save-address{
  margin-top:14px;

  padding:13px;

  background:#f8fafc;

  border:1px solid #e7eaf0;

  border-radius:12px;

  display:flex;
  align-items:center;

  gap:10px;
}

.save-check{
  width:20px;
  height:20px;

  accent-color:#ffb900;
}

.save-text{
  flex:1;

  font-size:14px;
  font-weight:bold;
}

.save-sub{
  display:block;

  margin-top:3px;

  color:#818a99;

  font-size:11px;

  font-weight:normal;
}


/* =====================================================
   MAP INFO
===================================================== */

.map-box{
  margin-top:14px;

  border-radius:13px;

  overflow:hidden;

  border:1px solid #e3e7ed;

  background:#f1f5f8;
}

.map-top{
  height:105px;

  position:relative;

  background:
    linear-gradient(
      135deg,
      #e8eef2,
      #f8fafb
    );
}

.map-road{
  position:absolute;

  height:10px;

  background:#fff;

  transform:rotate(-22deg);

  left:-20px;
  right:-20px;

  top:48px;

  box-shadow:
    0 2px 4px rgba(0,0,0,.04);
}

.map-road.two{
  transform:rotate(25deg);

  top:25px;
}

.map-pin{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-55%);

  width:34px;
  height:34px;

  border-radius:50% 50% 50% 0;

  background:#ffbd00;

  rotate:-45deg;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,.18);
}

.map-pin:after{
  content:"";

  position:absolute;

  width:10px;
  height:10px;

  border-radius:50%;

  background:#fff;

  left:12px;
  top:12px;
}

.map-info{
  padding:11px 13px;

  display:flex;
  align-items:center;

  gap:9px;

  font-size:12px;

  color:#667184;
}

.safe{
  color:#159866;

  font-weight:bold;
}


/* =====================================================
   ADD ADDRESS
===================================================== */

.add-address{
  width:100%;

  margin-top:11px;

  padding:12px;

  border:1px dashed #ccd2dc;

  background:#fff;

  border-radius:10px;

  color:#3d4b60;

  font-size:14px;

  font-weight:bold;

  cursor:pointer;
}


/* =====================================================
   DELIVERY CARD
===================================================== */

.delivery-option{
  border:1px solid #dfe4eb;

  border-radius:12px;

  padding:13px;

  display:flex;
  align-items:center;

  gap:12px;
}

.delivery-round{
  width:42px;
  height:42px;

  border-radius:50%;

  background:#eafff5;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:21px;
}

.delivery-main{
  flex:1;
}

.delivery-name{
  font-size:14px;
  font-weight:bold;
}

.delivery-date{
  margin-top:5px;

  color:#168c66;

  font-size:12px;
}

.delivery-price{
  color:#168c66;

  font-size:13px;
  font-weight:bold;
}


/* =====================================================
   PRODUCT
===================================================== */

.product-card{
  padding:15px 18px;

  display:flex;

  gap:13px;

  border-top:1px solid #edf0f4;
}

.product-image{
  width:86px;
  height:86px;

  border-radius:12px;

  object-fit:cover;

  background:#f2f3f5;

  flex-shrink:0;
}

.product-info{
  min-width:0;

  flex:1;
}

.product-name{
  font-size:14px;

  font-weight:bold;

  line-height:1.35;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;
}

.product-meta{
  margin-top:6px;

  color:#7a8494;

  font-size:11px;

  line-height:1.5;
}

.product-price-row{
  margin-top:8px;

  display:flex;

  align-items:center;

  gap:7px;

  flex-wrap:wrap;
}

.product-price{
  font-size:17px;
  font-weight:800;
}

.old-price{
  color:#9299a5;

  font-size:12px;

  text-decoration:line-through;
}

.discount{
  color:#13885f;

  background:#eafff5;

  border-radius:5px;

  padding:3px 5px;

  font-size:10px;

  font-weight:bold;
}

.qty{
  margin-left:auto;

  display:flex;

  align-items:center;

  gap:8px;

  color:#697386;

  font-size:12px;
}


/* =====================================================
   OFFER
===================================================== */

.offer-strip{
  margin-bottom:15px;

  background:
    linear-gradient(
      135deg,
      #fff6d9,
      #fffdf5
    );

  border:1px solid #ffe19a;

  border-radius:14px;

  padding:12px 15px;

  display:flex;

  align-items:center;

  gap:10px;
}

.offer-icon{
  font-size:22px;
}

.offer-text{
  font-size:13px;

  color:#64521c;
}

.offer-text b{
  color:#168b65;
}


/* =====================================================
   PRICE DETAILS
===================================================== */

.price-row-line{
  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:8px 0;

  color:#606b7d;

  font-size:13px;
}

.price-row-line.discount-line{
  color:#13885f;
}

.price-total{
  margin-top:7px;

  padding-top:13px;

  border-top:1px dashed #dce0e6;

  display:flex;

  justify-content:space-between;

  font-size:18px;

  font-weight:800;

  color:#172033;
}


/* =====================================================
   SECURE BOX
===================================================== */

.secure-box{
  margin-top:13px;

  padding:12px;

  border-radius:11px;

  background:#f0fff8;

  border:1px solid #d1f2e4;

  display:flex;

  gap:9px;

  align-items:flex-start;
}

.secure-box-icon{
  font-size:18px;
}

.secure-box-title{
  font-size:12px;
  font-weight:bold;

  color:#147b58;
}

.secure-box-text{
  margin-top:3px;

  font-size:10px;

  color:#65766f;

  line-height:1.4;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
  background:#fff;

  border-radius:16px;

  padding:70px 20px;

  text-align:center;

  border:1px solid #e4e8ee;

  color:#778193;
}

.empty-icon{
  font-size:48px;
}

.empty-title{
  margin-top:15px;

  font-size:19px;

  font-weight:bold;

  color:#273247;
}

.empty-btn{
  margin-top:18px;

  border:0;

  border-radius:9px;

  background:#ffb900;

  color:#172033;

  padding:12px 22px;

  font-size:14px;

  font-weight:bold;
}


/* =====================================================
   BOTTOM BAR
===================================================== */

.bottom{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:1500;

  min-height:87px;

  background:#fff;

  border-top:1px solid #dfe3e9;

  box-shadow:
    0 -5px 20px
    rgba(0,0,0,.08);

  padding:10px 15px;

  display:flex;

  align-items:center;

  gap:12px;
}

.bottom-info{
  flex:1;
}

.bottom-label{
  color:#7b8594;

  font-size:11px;
}

.bottom-total{
  margin-top:3px;

  font-size:21px;

  font-weight:800;

  color:#172033;
}

.bottom-save{
  margin-top:3px;

  color:#148a62;

  font-size:11px;

  font-weight:bold;
}

.continue{
  min-width:155px;

  height:54px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      #ffc400,
      #ffac00
    );

  color:#172033;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 5px 12px
    rgba(255,180,0,.25);
}

.continue:active{
  transform:scale(.98);
}


/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  left:50%;

  bottom:100px;

  transform:
    translateX(-50%)
    translateY(20px);

  background:#172033;

  color:#fff;

  padding:11px 16px;

  border-radius:9px;

  font-size:12px;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:3000;

  white-space:nowrap;
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .grid{
    display:block;
  }

  .page{
    padding:10px;
  }

  .secure{
    display:none;
  }

  .logo{
    font-size:19px;
  }

  .step-circle{
    width:32px;
    height:32px;
    font-size:13px;
  }

  .step-label{
    font-size:10px;
  }

  .step-line{
    max-width:70px;
  }

  .card{
    border-radius:14px;
  }

  .card-title{
    font-size:17px;
  }

  .product-image{
    width:78px;
    height:78px;
  }

  .continue{
    min-width:145px;
  }

}

@media(max-width:400px){

  .header{
    padding:0 10px;
  }

  .logo{
    font-size:17px;
  }

  .step-line{
    max-width:48px;
  }

  .step-item{
    min-width:54px;
  }

  .step-label{
    font-size:9px;
  }

  .continue{
    min-width:130px;
    font-size:14px;
  }

  .bottom-total{
    font-size:19px;
  }

  .row{
    grid-template-columns:1fr;
    gap:0;
  }

}

</style>

</head>


<body>

     HEADER
===================================================== -->

<header class="header">

  <button
    class="back"
    onclick="history.back()">
    ‹
  </button>

  <div class="logo">
    🛍️ <span>Sayon</span>Mart
  </div>

  <div class="secure">
    <div class="secure-icon">✓</div>
    100% Secure
  </div>

<!-- =====================================================
     PROGRESS
===================================================== -->

<div class="progress-wrap">

  <div class="progress">

    <div class="step-item done">

      <div class="step-circle">

    <div class="step-line done"></div>

    </div>


    <div class="step-line"></div>


    <div class="step-item">

      <div class="step-circle">

      </div>

      <div class="step-label">
        Payment
      </div>

    </div>


    <div class="step-line"></div>


    <div class="step-item">

      <div class="step-circle">
        ✓
      </div>

      <div class="step-label">
        Done
      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">

  <div id="checkout"></div>

</main>


<!-- =====================================================
     BOTTOM BAR
===================================================== -->

<div
  class="bottom"
  id="bottomBar"
  style="display:none">

  <div class="bottom-info">

    <div class="bottom-label">
      Total Amount
    </div>

    <div
      class="bottom-total"
      id="bottomTotal">
      ₹0
    </div>

    <div
      class="bottom-save"
      id="bottomDiscount">
      ₹0 OFF
    </div>

  </div>


  <button
    class="continue"
    onclick="continueOrder()">

    Continue →
    
  </button>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
  class="toast"
  id="toast">
</div>

/* =====================================================
   TRANSLATION FUNCTION
===================================================== */

function t(key){

  if(typeof window.translate === "function"){

    const result =
      window.translate(key);

    if(result && result !== key){

      return result;

    }

  }

  const language =
    localStorage.getItem(
      "sayonmart_language"
    ) || "English";

  return (
    checkoutTranslations[language] ||
    checkoutTranslations.English
  )[key] || key;

}

   GET PRODUCT
===================================================== */

    );

/* =====================================================
   MONEY
===================================================== */

function money(number){

  return "₹" +
    Number(number || 0)
    .toLocaleString("en-IN");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")

    .replace(
      /[&<>"']/g,
      function(char){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[char];

      }
    );

}


/* =====================================================
   DELIVERY DATE
===================================================== */

function deliveryDate(){

  const date = new Date();

  date.setDate(
    date.getDate() + 5
  );

  const language =
    localStorage.getItem(
      "sayonmart_language"
    ) || "English";

  let locale = "en-IN";

  if(language === "Bangla"){
    locale = "bn-IN";
  }

  if(language === "Hindi"){
    locale = "hi-IN";
  }

  return date.toLocaleDateString(
    locale,
    {
      weekday:"long",
      day:"numeric",
      month:"short"
    }
  );

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(function(){

    toast.classList.remove("show");

  },2200);

}


/* =====================================================
   LOAD SAVED ADDRESS
===================================================== */

function loadSavedAddress(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "sayonmart_saved_address"
        ) || "null"
      );

    return saved;

  }catch(error){

    return null;

  }

}

/* =====================================================
   USE MY LOCATION
===================================================== */

window.useMyLocation =
function(){

  if(!navigator.geolocation){

    showToast(
      "Location is not supported on this browser."
    );

    return;

  }


  showToast(
    "Please allow location permission..."
  );


  navigator.geolocation.getCurrentPosition(

    function(){

      /*
        For privacy and reliability, this page does
        not automatically send your exact coordinates
        anywhere.

        We simply focus the address field so the user
        can enter/confirm the delivery address.
      */

      const address =
        document.getElementById(
          "customerAddress"
        );

      if(address){

        address.focus();

      }

      showToast(
        "Location permission allowed. Please confirm your address."
      );

    },

    function(){

      showToast(
        "Location permission was not allowed."
      );

    },

    {
      enableHighAccuracy:false,
      timeout:8000,
      maximumAge:300000
    }

  );

};


/* =====================================================

===================================================== */

window.clearAddressFields =
function(){

  const ids = [

    "house",
    "area",
    "city",
    "pin",
    "customerAddress"

  ];


  ids.forEach(function(id){

    const element =
      document.getElementById(id);

    if(element){

      element.value = "";

    }

  });


  showToast(
    "Enter a new address"
  );


  document.getElementById(
    "house"
  )?.focus();

};


/* =====================================================
   CONTINUE TO PAYMENT
===================================================== */

window.continueOrder =
function(){

  const name =
    document.getElementById(
      "customerName"
    )?.value.trim();


  const phone =
    document.getElementById(
      "customerPhone"
    )?.value.trim();


  const house =
    document.getElementById(
      "house"
    )?.value.trim();


  const area =
    document.getElementById(
      "area"
    )?.value.trim();


  const city =
    document.getElementById(
      "city"
    )?.value.trim();


  const pin =
    document.getElementById(
      "pin"
    )?.value.trim();


  const address =
    document.getElementById(
      "customerAddress"
    )?.value.trim();


  /* REQUIRED */

  if(
    !name ||
    !phone ||
    !house ||
    !area ||
    !city ||
    !pin ||
    !address
  ){

    showToast(
      t("Please fill your details")
    );

    return;

  }


  /* PHONE */

  if(!/^[0-9]{10}$/.test(phone)){

    showToast(
      t("Invalid phone")
    );

    return;

  }


  /* PIN */

  if(!/^[0-9]{6}$/.test(pin)){

    showToast(
      t("Invalid PIN")
    );

    return;

  }


  /* SAVE TO BUY NOW */

  buyNow.customerName =
    name;

  buyNow.phone =
    phone;

  buyNow.house =
    house;

  buyNow.area =
    area;

  buyNow.city =
    city;

  buyNow.pin =
    pin;

  buyNow.address =
    address;


  /* SAVE ADDRESS */

  const saveAddress =
    document.getElementById(
      "saveAddress"
    )?.checked;


  if(saveAddress){

    localStorage.setItem(

      "sayonmart_saved_address",

      JSON.stringify({

        name:name,

        phone:phone,

        house:house,

        area:area,

        city:city,

        pin:pin,

        address:address

      })

    );

  }


  /* SAVE BUY NOW */

  localStorage.setItem(

    "sayonmart_buy_now",

    JSON.stringify(buyNow)

  );


  /* GO PAYMENT */

  location.href =
    "payment.html";

};
