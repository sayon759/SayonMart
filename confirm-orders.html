<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SayonMart - Confirm Orders</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

.header{
  background:#000;
  color:#FFD700;
  padding:18px;
  text-align:center;
  font-size:21px;
  font-weight:bold;
  border-bottom:1px solid #333;
  position:relative;
}

.back{
  position:absolute;
  left:10px;
  top:9px;
  border:0;
  background:none;
  color:#FFD700;
  font-size:32px;
}

.container{
  padding:15px;
  max-width:650px;
  margin:auto;
}

.loading{
  text-align:center;
  color:#FFD700;
  padding:40px 10px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:50px 10px;
}

.order{
  background:#1c1c1c;
  border:1px solid #333;
  border-radius:16px;
  padding:15px;
  margin-bottom:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.order-id{
  color:#FFD700;
  font-size:13px;
  font-weight:bold;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.pending{
  background:#4d3c00;
  color:#FFD700;
}

.confirmed{
  background:#063d25;
  color:#50ff9d;
}

.cancelled{
  background:#4a1111;
  color:#ff7777;
}

.product{
  display:flex;
  gap:12px;
  background:#111;
  padding:10px;
  border-radius:12px;
}

.product img{
  width:75px;
  height:75px;
  border-radius:10px;
  object-fit:cover;
}

.product h3{
  margin:5px 0;
  font-size:16px;
}

.product p{
  margin:5px 0;
  color:#aaa;
  font-size:13px;
}

.customer{
  margin-top:12px;
  color:#ccc;
  font-size:14px;
  line-height:1.7;
}

.total{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #333;
  color:#FFD700;
  font-size:18px;
  font-weight:bold;
}

.confirm{
  width:100%;
  margin-top:14px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#FFD700;
  color:#000;
  font-size:16px;
  font-weight:bold;
}

.confirm:disabled{
  background:#555;
  color:#aaa;
}

</style>
</head>


<body>

<div class="header">

<button
class="back"
onclick="history.back()">
‹
</button>

✅ Confirm Orders

</div>


<div class="container">

<div id="orders"
class="loading">

🔄 Loading Orders...

</div>

</div>


<script type="module">


import {
  db,
  auth
} from "./firebase.js";


import {
  collection,
  getDocs,
  updateDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* তোমার Admin UID */

const ADMIN_UID =
"fqQpbMgWScgUbu5Vco4dJ6WuBVL2";


const ordersBox =
document.getElementById("orders");


/* CHECK ADMIN */

onAuthStateChanged(auth, async(user)=>{

  if(!user){

    ordersBox.innerHTML = `
      <div class="empty">
        🚫 Login করা নেই।
      </div>
    `;

    return;
  }


  if(user.uid !== ADMIN_UID){

    ordersBox.innerHTML = `
      <div class="empty">
        🚫 Access Denied
        <br><br>
        শুধু Admin এই পেজ দেখতে পারবে।
      </div>
    `;

    return;
  }


  loadOrders();

});


/* LOAD ALL ORDERS */

async function loadOrders(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"orders")
      );


    if(snapshot.empty){

      ordersBox.innerHTML = `
        <div class="empty">
          📭 এখনো কোনো Order নেই।
        </div>
      `;

      return;
    }


    let html = "";


    snapshot.forEach(orderDoc=>{

      const o =
        orderDoc.data();

      const id =
        orderDoc.id;


      const status =
        String(
          o.status || "Pending"
        ).trim();


      const statusLower =
        status.toLowerCase();


      const name =
        o.name || "N/A";


      const phone =
        o.phone || "N/A";


      const address =
        o.address || "N/A";


      const product =
        o.productName || "Product";


      const image =
        o.productImage ||
        "https://via.placeholder.com/100";


      const price =
        Number(o.price || 0);


      const quantity =
        Number(o.quantity || 1);


      const total =
        Number(
          o.total ||
          price * quantity
        );


      let statusClass =
        "pending";


      if(statusLower === "confirmed"){
        statusClass = "confirmed";
      }

      if(statusLower === "cancelled"){
        statusClass = "cancelled";
      }


      html += `

      <div class="order">

        <div class="top">

          <div class="order-id">

            Order #${id.substring(0,8)}

          </div>

          <div class="status ${statusClass}">

            ${status}

          </div>

        </div>


        <div class="product">

          <img
            src="${image}"
            onerror="
              this.src='https://via.placeholder.com/100';
            "
          >

          <div>

            <h3>
              ${product}
            </h3>

            <p>
              💰 Price: ₹${price}
            </p>

            <p>
              🔢 Quantity: ${quantity}
            </p>

          </div>

        </div>


        <div class="customer">

          👤 <b>Customer:</b>
          ${name}

          <br>

          📞 <b>Phone:</b>
          ${phone}

          <br>

          📍 <b>Address:</b>
          ${address}

        </div>


        <div class="total">

          Total: ₹${total}

        </div>


        ${
          statusLower === "pending"

          ?

          `
          <button
            class="confirm"
            onclick="confirmOrder('${id}',this)">

            ✅ Confirm Order

          </button>
          `

          :

          statusLower === "confirmed"

          ?

          `
          <button
            class="confirm"
            disabled>

            ✅ Order Confirmed

          </button>
          `

          :

          ""

        }

      </div>

      `;

    });


    ordersBox.innerHTML =
      html;


  }

  catch(error){

    console.error(error);

    ordersBox.innerHTML = `

      <div class="empty">

        ❌ Order Load হচ্ছে না।

        <br><br>

        ${error.message}

      </div>

    `;

  }

}


/* CONFIRM ORDER */

window.confirmOrder =
async function(orderId,button){

  const yes =
    confirm(
      "এই Order Confirm করবেন?"
    );


  if(!yes){
    return;
  }


  button.disabled = true;

  button.innerText =
    "⏳ Confirm হচ্ছে...";


  try{

    await updateDoc(

      doc(
        db,
        "orders",
        orderId
      ),

      {
        status:"Confirmed"
      }

    );


    alert(
      "✅ Order Confirm হয়েছে!"
    );


    loadOrders();

  }

  catch(error){

    console.error(error);

    alert(
      "❌ Confirm করা যায়নি:\n\n" +
      error.message
    );


    button.disabled = false;

    button.innerText =
      "✅ Confirm Order";

  }

};

</script>

</body>

</html>
