<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SayonMart - Confirm Orders</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:30px;
}

.header{
  background:#000;
  color:#FFD700;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #333;
}

.container{
  padding:15px;
}

.loading{
  text-align:center;
  color:#FFD700;
  padding:40px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:50px 10px;
}

.order-card{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:16px;
  padding:15px;
  margin-bottom:18px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.order-id{
  color:#FFD700;
  font-size:13px;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.pending{
  background:#4b3b00;
  color:#FFD700;
}

.confirmed{
  background:#063d25;
  color:#4cff9b;
}

.cancelled{
  background:#4a1111;
  color:#ff7070;
}

.product{
  display:flex;
  gap:12px;
  margin-top:14px;
  background:#111;
  padding:10px;
  border-radius:12px;
}

.product img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
}

.product h3{
  margin:5px 0;
  font-size:16px;
}

.product p{
  margin:5px 0;
  color:#bbb;
  font-size:13px;
}

.total{
  color:#FFD700;
  font-size:18px;
  font-weight:bold;
  margin-top:12px;
}

.info{
  margin-top:10px;
  color:#ccc;
  font-size:14px;
  line-height:1.5;
}

.confirm-btn{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#FFD700;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.confirm-btn:disabled{
  background:#555;
  color:#aaa;
  cursor:not-allowed;
}

.back{
  position:absolute;
  left:12px;
  top:13px;
  background:none;
  border:0;
  color:#FFD700;
  font-size:28px;
  cursor:pointer;
}

</style>

</head>


<body>


<div class="header">

<button
class="back"
onclick="history.back()">
‹
</button>

✅ Confirm Orders

</div>


<div class="container">

<div
id="orders"
class="loading">

Loading Orders...

</div>

</div>


<script type="module">


import {
  db,
  auth
}
from "./firebase.js";


import {
  collection,
  getDocs,
  updateDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/*
  তোমার Admin UID
*/

const ADMIN_UID =
"fqQpbMgWScgUbu5Vco4dJ6WuBVL2";


const ordersDiv =
document.getElementById("orders");


/*
  ADMIN CHECK
*/

onAuthStateChanged(
  auth,
  async(user)=>{

    if(
      !user ||
      user.uid !== ADMIN_UID
    ){

      ordersDiv.innerHTML=`

        <div class="empty">

          🚫 Access Denied

          <br><br>

          এই পেজটি শুধু Admin-এর জন্য।

        </div>

      `;

      return;
    }


    loadOrders();

  }
);


/*
  LOAD ALL ORDERS
*/

async function loadOrders(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"orders")
      );


    ordersDiv.innerHTML="";


    if(snapshot.empty){

      ordersDiv.innerHTML=`

        <div class="empty">

          📭 কোনো Order নেই।

        </div>

      `;

      return;
    }


    let orders=[];


    snapshot.forEach(
      orderDoc=>{

        orders.push({

          id:orderDoc.id,

          data:orderDoc.data()

        });

      }
    );


    /*
      Newest first
    */

    orders.sort((a,b)=>{

      const aTime =
        a.data.createdAt?.seconds || 0;

      const bTime =
        b.data.createdAt?.seconds || 0;

      return bTime-aTime;

    });


    /*
      SHOW ORDERS
    */

    orders.forEach(item=>{

      const order =
        item.data;

      const id =
        item.id;


      const status =
        order.status || "Pending";


      const productName =
        order.productName ||
        "Product";


      const image =
        order.productImage ||
        "https://via.placeholder.com/100";


      const price =
        Number(order.price || 0);


      const quantity =
        Number(order.quantity || 1);


      const total =
        Number(
          order.total ||
          price * quantity
        );


      let statusClass =
        String(status)
        .toLowerCase()
        .replaceAll(" ","-");


      const card =
        document.createElement("div");


      card.className=
        "order-card";


      card.innerHTML=`

        <div class="order-top">

          <div class="order-id">

            Order #${esc(
              id.substring(0,8)
            )}

          </div>


          <div class="
            status
            ${statusClass}
          ">

            ${esc(status)}

          </div>

        </div>


        <div class="product">

          <img
            src="${esc(image)}"
            onerror="
              this.onerror=null;
              this.src='https://via.placeholder.com/100';
            "
          >


          <div>

            <h3>

              ${esc(productName)}

            </h3>


            <p>

              💰 Price:
              ₹${price}

            </p>


            <p>

              🔢 Quantity:
              ${quantity}

            </p>

          </div>

        </div>


        <div class="info">

          👤 <b>Customer:</b>
          ${esc(order.name || "N/A")}

          <br>

          📞 <b>Phone:</b>
          ${esc(order.phone || "N/A")}

          <br>

          📍 <b>Address:</b>
          ${esc(order.address || "N/A")}

        </div>


        <div class="total">

          Total: ₹${total}

        </div>


        ${
          String(status).trim().toLowerCase() === "pending"

          ?

          `

          <button
            class="confirm-btn"
            data-id="${escAttr(id)}">

            ✅ Confirm Order

          </button>

          `

          :

          status === "Confirmed"

          ?

          `

          <button
            class="confirm-btn"
            disabled>

            ✅ Already Confirmed

          </button>

          `

          :

          ""

        }

      `;


      ordersDiv.appendChild(card);

    });


    /*
      CONFIRM BUTTON
    */

    document
    .querySelectorAll(".confirm-btn")
    .forEach(button=>{

      if(
        button.disabled
      ) return;


      button.addEventListener(
        "click",
        ()=>confirmOrder(
          button.dataset.id,
          button
        )
      );

    });


  }

  catch(error){

    console.error(error);


    ordersDiv.innerHTML=`

      <div class="empty">

        ❌ Orders Load Failed

        <br><br>

        ${esc(error.message)}

      </div>

    `;

  }

}


/*
  CONFIRM ORDER
*/

async function confirmOrder(
  orderId,
  button
){

  const ok =
    confirm(
      "আপনি কি এই Order Confirm করতে চান?"
    );


  if(!ok) return;


  button.disabled=true;

  button.innerText=
    "Confirm হচ্ছে...";


  try{

    await updateDoc(

      doc(
        db,
        "orders",
        orderId
      ),

      {
        status:"Confirmed"
      }

    );


    alert(
      "✅ Order Confirm হয়েছে!"
    );


    /*
      আবার Orders load
    */

    loadOrders();


  }

  catch(error){

    console.error(error);


    alert(
      "❌ Order Confirm করা যায়নি।\n\n"+
      error.message
    );


    button.disabled=false;

    button.innerText=
      "✅ Confirm Order";

  }

}


/*
  SECURITY HELPERS
*/

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escAttr(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g," ");

}

</script>


</body>

</html>
