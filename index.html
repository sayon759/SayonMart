<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SayonMart</title>

  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="./manifest.json">

  <link rel="stylesheet" href="./style.css">

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#111;
      color:#fff;
      font-family:Arial,sans-serif;
      padding-bottom:75px;
    }

    header{
      background:#000;
      padding:15px;
      text-align:center;
      position:sticky;
      top:0;
      z-index:100;
    }

    header h1{
      margin:0;
      color:#FFD700;
      font-size:25px;
    }

    .search-box{
      padding:12px;
      background:#111;
    }

    #searchInput{
      width:100%;
      padding:13px;
      border:none;
      outline:none;
      border-radius:10px;
      font-size:16px;
    }

    .banner{
      width:100%;
      overflow:hidden;
      padding:10px;
    }

    .banner img{
      width:100%;
      height:180px;
      object-fit:cover;
      border-radius:12px;
      display:block;
    }

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 14px;
    }

    .section-title h2{
      margin:0;
      color:#FFD700;
      font-size:20px;
    }

    .section-title a{
      color:#fff;
      text-decoration:none;
      font-size:14px;
    }

    .categories{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      padding:10px;
    }

    .category{
      background:#222;
      border-radius:10px;
      padding:15px 5px;
      text-align:center;
      cursor:pointer;
    }

    .category div{
      font-size:28px;
    }

    .category span{
      display:block;
      margin-top:5px;
      font-size:12px;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      padding:10px;
    }

    .product{
      position:relative;
      background:#222;
      border-radius:12px;
      overflow:hidden;
      cursor:pointer;
      min-width:0;
    }

    .product-img{
      width:100%;
      height:170px;
      object-fit:cover;
      display:block;
      background:#333;
    }

    .heart{
      position:absolute;
      right:8px;
      top:8px;
      width:34px;
      height:34px;
      border:0;
      border-radius:50%;
      background:#fff;
      color:#e91e63;
      font-size:20px;
      z-index:5;
      cursor:pointer;
    }

    .product-info{
      padding:10px;
    }

    .product-name{
      font-size:15px;
      font-weight:bold;
      margin-bottom:7px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .price{
      color:#FFD700;
      font-size:18px;
      font-weight:bold;
      margin-bottom:9px;
    }

    .product-buttons{
      display:flex;
      gap:6px;
    }

    .product-buttons button{
      flex:1;
      border:0;
      padding:9px 4px;
      border-radius:7px;
      font-size:12px;
      cursor:pointer;
    }

    .add-btn{
      background:#333;
      color:#fff;
    }

    .buy-btn{
      background:#FFD700;
      color:#000;
      font-weight:bold;
    }

    .empty{
      grid-column:1/-1;
      text-align:center;
      padding:30px 10px;
      color:#aaa;
    }

    .bottom-nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      height:65px;
      background:#000;
      display:flex;
      justify-content:space-around;
      align-items:center;
      z-index:999;
      border-top:1px solid #333;
    }

    .bottom-nav a{
      color:#fff;
      text-decoration:none;
      text-align:center;
      font-size:12px;
    }

    .bottom-nav span{
      display:block;
      font-size:22px;
      margin-bottom:2px;
    }

    @media(max-width:350px){
      .products{
        gap:8px;
        padding:8px;
      }

      .product-img{
        height:145px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>🛍️ SayonMart</h1>
  </header>

  <!-- SEARCH -->
  <div class="search-box">
    <input
      id="searchInput"
      type="search"
      placeholder="🔍 Product search করুন..."
      oninput="searchProduct()">
  </div>

  <!-- BANNER -->
  <div class="banner">
    <img
      id="bannerImage"
      src="https://picsum.photos/800/300?random=1"
      alt="SayonMart Banner">
  </div>

  <!-- CATEGORIES -->
  <div class="section-title">
    <h2>Categories</h2>
  </div>

  <div class="categories">

    <div class="category" onclick="goCategory('Fashion')">
      <div>👕</div>
      <span>Fashion</span>
    </div>

    <div class="category" onclick="goCategory('Shoes')">
      <div>👟</div>
      <span>Shoes</span>
    </div>

    <div class="category" onclick="goCategory('Mobiles')">
      <div>📱</div>
      <span>Mobiles</span>
    </div>

    <div class="category" onclick="goCategory('Watches')">
      <div>⌚</div>
      <span>Watches</span>
    </div>

  </div>

  <!-- TOP DEALS -->
  <div class="section-title">
    <h2>🔥 Today's Top Deals</h2>
    <a href="./products.html">See All</a>
  </div>

  <div id="topDeals" class="products">
    <div class="empty">Loading products...</div>
  </div>

  <!-- TOP PRODUCTS -->
  <div class="section-title">
    <h2>⭐ Top Products</h2>
    <a href="./products.html">See All</a>
  </div>

  <div id="products" class="products">
    <div class="empty">Loading products...</div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">

    <a href="./index.html">
      <span>🏠</span>
      Home
    </a>

    <a href="./products.html">
      <span>🛍️</span>
      Products
    </a>

    <a href="./cart.html">
      <span>🛒</span>
      Cart
    </a>

    <a href="./profile.html">
      <span>👤</span>
      Profile
    </a>

  </div>


  <script type="module">

    /*
      =====================================
      FIRESTORE REST API
      =====================================
    */

    const FIRESTORE_URL =
      "https://firestore.googleapis.com/v1/projects/sayonmart-90156/databases/(default)/documents/products";


    let allProducts = [];


    /*
      =====================================
      FIRESTORE VALUE CONVERTER
      =====================================
    */

    function firestoreValue(v){

      if(!v) return null;

      if("stringValue" in v)
        return v.stringValue;

      if("integerValue" in v)
        return Number(v.integerValue);

      if("doubleValue" in v)
        return Number(v.doubleValue);

      if("booleanValue" in v)
        return v.booleanValue;

      if("nullValue" in v)
        return null;

      if("timestampValue" in v)
        return v.timestampValue;

      if("referenceValue" in v)
        return v.referenceValue;

      if("arrayValue" in v){

        return (v.arrayValue.values || [])
          .map(firestoreValue);

      }

      if("mapValue" in v){

        const out = {};

        for(
          const [key,val]
          of Object.entries(v.mapValue.fields || {})
        ){

          out[key] = firestoreValue(val);

        }

        return out;
      }

      return "";
    }


    /*
      =====================================
      FIRESTORE DOCUMENT CONVERTER
      =====================================
    */

    function firestoreDoc(doc){

      const id =
        doc.name.split("/").pop();

      const data = {
        id:id
      };

      for(
        const [key,value]
        of Object.entries(doc.fields || {})
      ){

        data[key] =
          firestoreValue(value);

      }

      return data;
    }


    /*
      =====================================
      ESCAPE HTML
      =====================================
    */

    function esc(value){

      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }


    /*
      =====================================
      OPEN PRODUCT DETAILS
      =====================================
    */

    window.openProduct = function(id){

      if(!id){

        alert("Product ID পাওয়া যায়নি।");

        return;
      }

      location.href =
        "./product.html?id=" +
        encodeURIComponent(id);

    };


    /*
      =====================================
      PRODUCT CARD
      =====================================
    */

    function productCard(p){

      const id = p.id;

      const name =
        p.name ||
        p.title ||
        "Product";

      const price =
        Number(p.price || 0);

      let image =
        p.image ||
        p.imageUrl ||
        "";

      if(
        !image &&
        Array.isArray(p.images) &&
        p.images.length
      ){

        image = p.images[0];

      }

      if(!image){

        image =
          "https://picsum.photos/500/500";

      }


      const idJS =
        JSON.stringify(id);

      const nameJS =
        JSON.stringify(name);

      const imageJS =
        JSON.stringify(image);


      return `

        <div
          class="product"
          role="button"
          tabindex="0"
          onclick='openProduct(${idJS})'
          onkeydown='
            if(event.key==="Enter" || event.key===" "){
              event.preventDefault();
              openProduct(${idJS});
            }
          '>

          <button
            class="heart"
            onclick='
              event.stopPropagation();
              addWishlist(
                ${idJS},
                ${nameJS},
                ${price},
                ${imageJS}
              );
            '>
            ♡
          </button>


          <img
            class="product-img"
            src="${esc(image)}"
            alt="${esc(name)}"
            loading="lazy"
            decoding="async"
            onerror="
              this.onerror=null;
              this.src='https://picsum.photos/500/500';
            ">


          <div class="product-info">

            <div class="product-name">
              ${esc(name)}
            </div>

            <div class="price">
              ₹${price}
            </div>


            <div class="product-buttons">

              <button
                class="add-btn"
                onclick='
                  event.stopPropagation();
                  addToCart(
                    ${idJS},
                    ${nameJS},
                    ${price},
                    ${imageJS}
                  );
                '>
                🛒 Cart
              </button>


              <button
                class="buy-btn"
                onclick='
                  event.stopPropagation();
                  buyNow(
                    ${idJS},
                    ${nameJS},
                    ${price},
                    ${imageJS}
                  );
                '>
                Buy Now
              </button>

            </div>

          </div>

        </div>

      `;
    }


    /*
      =====================================
      LOAD PRODUCTS FROM FIREBASE
      =====================================
    */

    async function loadProducts(){

      const productsBox =
        document.getElementById("products");

      const dealsBox =
        document.getElementById("topDeals");


      try{

        productsBox.innerHTML =
          '<div class="empty">Loading products...</div>';

        dealsBox.innerHTML =
          '<div class="empty">Loading products...</div>';


        const response =
          await fetch(
            FIRESTORE_URL,
            {
              cache:"no-store"
            }
          );


        if(!response.ok){

          throw new Error(
            "Firestore HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        allProducts =
          (data.documents || [])
            .map(firestoreDoc);


        if(allProducts.length === 0){

          productsBox.innerHTML =
            '<div class="empty">কোনো Product পাওয়া যায়নি।</div>';

          dealsBox.innerHTML =
            '<div class="empty">কোনো Product পাওয়া যায়নি।</div>';

          return;
        }


        renderProducts(allProducts);

      }

      catch(error){

        console.error(
          "Product loading error:",
          error
        );


        productsBox.innerHTML =
          `
          <div class="empty">
            ⚠️ Products load হচ্ছে না।<br>
            Firebase check করুন।
          </div>
          `;


        dealsBox.innerHTML =
          `
          <div class="empty">
            ⚠️ Products load হচ্ছে না।
          </div>
          `;

      }

    }


    /*
      =====================================
      RENDER PRODUCTS
      =====================================
    */

    function renderProducts(list){

      const productsBox =
        document.getElementById("products");

      const dealsBox =
        document.getElementById("topDeals");


      if(!list.length){

        productsBox.innerHTML =
          '<div class="empty">Product পাওয়া যায়নি।</div>';

        dealsBox.innerHTML =
          '<div class="empty">Product পাওয়া যায়নি।</div>';

        return;
      }


      /*
        TOP PRODUCTS
      */

      productsBox.innerHTML =
        list
          .map(productCard)
          .join("");


      /*
        TOP DEALS
        প্রথম 4টি Product
      */

      dealsBox.innerHTML =
        list
          .slice(0,4)
          .map(productCard)
          .join("");

    }


    /*
      =====================================
      SEARCH PRODUCT
      =====================================
    */

    window.searchProduct = function(){

      const input =
        document.getElementById(
          "searchInput"
        );


      const text =
        input.value
          .trim()
          .toLowerCase();


      if(!text){

        renderProducts(allProducts);

        return;
      }


      const filtered =
        allProducts.filter(p => {

          const name =
            (
              p.name ||
              p.title ||
              ""
            )
            .toString()
            .toLowerCase();


          return name.includes(text);

        });


      renderProducts(filtered);

    };


    /*
      =====================================
      ADD TO CART
      =====================================
    */

    window.addToCart = function(
      id,
      name,
      price,
      image
    ){

      const cart =
        JSON.parse(
          localStorage.getItem("cart") ||
          "[]"
        );


      const existing =
        cart.find(
          item => item.id === id
        );


      if(existing){

        existing.qty =
          Number(existing.qty || 1) + 1;

      }else{

        cart.push({

          id:id,
          name:name,
          price:Number(price || 0),
          image:image,
          qty:1

        });

      }


      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );


      alert(
        "Product cart-এ যোগ হয়েছে!"
      );

    };


    /*
      =====================================
      BUY NOW
      =====================================
    */

    window.buyNow = function(
      id,
      name,
      price,
      image
    ){

      const item = {

        id:id,
        name:name,
        price:Number(price || 0),
        image:image,
        qty:1

      };


      localStorage.setItem(
        "buyNow",
        JSON.stringify(item)
      );


      location.href =
        "./order.html";

    };


    /*
      =====================================
      WISHLIST
      =====================================
    */

    window.addWishlist = function(
      id,
      name,
      price,
      image
    ){

      const wishlist =
        JSON.parse(
          localStorage.getItem("wishlist") ||
          "[]"
        );


      const exists =
        wishlist.some(
          item => item.id === id
        );


      if(!exists){

        wishlist.push({

          id:id,
          name:name,
          price:Number(price || 0),
          image:image

        });


        localStorage.setItem(
          "wishlist",
          JSON.stringify(wishlist)
        );


        alert(
          "Wishlist-এ যোগ হয়েছে ❤️"
        );

      }else{

        alert(
          "এটি আগে থেকেই Wishlist-এ আছে।"
        );

      }

    };


    /*
      =====================================
      CATEGORY
      =====================================
    */

    window.goCategory = function(category){

      location.href =
        "./products.html?category=" +
        encodeURIComponent(category);

    };


    /*
      =====================================
      BANNER SLIDER
      =====================================
    */

    const banners = [

      "https://picsum.photos/800/300?random=1",

      "https://picsum.photos/800/300?random=2",

      "https://picsum.photos/800/300?random=3"

    ];


    let bannerIndex = 0;


    setInterval(function(){

      bannerIndex++;

      if(
        bannerIndex >= banners.length
      ){

        bannerIndex = 0;

      }


      const banner =
        document.getElementById(
          "bannerImage"
        );


      if(banner){

        banner.src =
          banners[bannerIndex];

      }

    },3000);


    /*
      =====================================
      START
      =====================================
    */

    loadProducts();

  </script>

</body>
</html>
