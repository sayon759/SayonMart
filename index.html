<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SayonMart</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f8fa;
  color:#151515;
  padding-bottom:78px;
}

/* HEADER */
header{
  background:#111;
  color:#fff;
  padding:18px 16px 16px;
  border-radius:0 0 26px 26px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logoIcon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#ffd21f;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

.logoText b{
  font-size:25px;
}

.logoText b span{
  color:#ffd21f;
}

.logoText small{
  display:block;
  color:#aaa;
  margin-top:2px;
}

.topBtns{
  display:flex;
  gap:8px;
}

.topBtns button{
  border:0;
  background:#222;
  color:#fff;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:21px;
}

/* SEARCH */
.search{
  margin-top:17px;
  background:#fff;
  border-radius:28px;
  padding:5px 7px 5px 16px;
  display:flex;
  align-items:center;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  font-size:16px;
  background:transparent;
  min-width:0;
}

.search button{
  border:0;
  background:#ffd21f;
  width:48px;
  height:44px;
  border-radius:24px;
  font-size:22px;
}

/* MAIN */
main{
  padding:16px;
}

/* BANNER */
.banner{
  height:190px;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  background:#ffe99a;
  margin-bottom:12px;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.dots{
  display:flex;
  gap:6px;
  justify-content:center;
  margin:9px 0 16px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#d0d4da;
}

.dot.active{
  background:#ffd21f;
  width:20px;
  border-radius:8px;
}

/* SECTION */
.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 2px 12px;
}

.sectionHead h2{
  font-size:20px;
  margin:0;
}

.sectionHead a{
  color:#555;
  text-decoration:none;
  font-size:14px;
}

/* CATEGORY */
.categories{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:2px 1px 8px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  min-width:78px;
  text-align:center;
  cursor:pointer;
}

.catImg{
  width:68px;
  height:68px;
  margin:auto;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  background:#eee;
}

.cat:nth-child(1) .catImg{background:#dceeff}
.cat:nth-child(2) .catImg{background:#eee}
.cat:nth-child(3) .catImg{background:#fff0b9}
.cat:nth-child(4) .catImg{background:#ffdce9}
.cat:nth-child(5) .catImg{background:#d8f5e9}
.cat:nth-child(6) .catImg{background:#e6ddff}
.cat:nth-child(7) .catImg{background:#dff5d8}

.catName{
  font-size:12px;
  font-weight:bold;
  margin-top:7px;
}

/* FLASH SALE */
.flash{
  margin-top:15px;
  padding:17px;
  border-radius:20px;
  background:linear-gradient(100deg,#ff4b4b,#ff2525);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.flash h2{
  margin:0;
  font-size:24px;
}

.flash p{
  margin:4px 0 0;
  color:#ffeaea;
  font-size:13px;
}

.flash button{
  border:0;
  border-radius:20px;
  background:#fff;
  color:#e52a2a;
  padding:10px 14px;
  font-weight:bold;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
  position:relative;
}

.cardImg{
  height:155px;
  background:#f1f2f4;
  position:relative;
}

.cardImg img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* LIKE */
.wish{
  position:absolute;
  right:8px;
  top:8px;
  border:0;
  background:#fff;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  cursor:pointer;
}

.wish.liked{
  font-size:20px;
}

.cardBody{
  padding:11px;
}

.card h3{
  font-size:15px;
  margin:0 0 7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price{
  font-weight:bold;
  font-size:18px;
}

.add{
  width:100%;
  margin-top:9px;
  border:0;
  background:#ffd21f;
  padding:10px;
  border-radius:15px;
  font-weight:bold;
}

/* OFFER */
.offer{
  margin-top:18px;
  min-height:115px;
  border-radius:20px;
  padding:18px;
  background:linear-gradient(100deg,#d7ffad,#b8f18b);
  display:flex;
  align-items:center;
  justify-content:space-between;
  overflow:hidden;
}

.offer b{
  font-size:25px;
}

.offer p{
  margin:5px 0;
  font-size:13px;
}

.offer .bags{
  font-size:58px;
}

.loading,
.empty{
  text-align:center;
  padding:35px 10px;
  color:#777;
}

/* BOTTOM NAV */
.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -3px 15px rgba(0,0,0,.10);
  z-index:50;
}

.nav{
  border:0;
  background:none;
  color:#555;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav span{
  font-size:22px;
}

.nav.active{
  color:#111;
  font-weight:bold;
}

.nav.active span{
  background:#ffd21f;
  border-radius:13px;
  padding:2px 9px;
}

@media(min-width:700px){
  main{
    max-width:900px;
    margin:auto;
  }

  .products{
    grid-template-columns:repeat(4,1fr);
  }

  .banner{
    height:260px;
  }
}
</style>
</head>

<body>

<header>

  <div class="top">

    <div class="logo">

      <div class="logoIcon">S</div>

      <div class="logoText">
        <b>Sayon<span>Mart</span></b>
        <small>Better Products • Better Life</small>
      </div>

    </div>

    <div class="topBtns">

      <button onclick="location.href='notifications.html'">
        🔔
      </button>

      <button onclick="location.href='cart.html'" id="cartTop">
        🛒
      </button>

    </div>

  </div>


  <div class="search">

    <input
      id="search"
      type="search"
      placeholder="পছন্দের পণ্য খুঁজুন..."
      oninput="searchProduct()"
    >

    <button>⌕</button>

  </div>

</header>


<main>

  <!-- BANNER -->

  <div class="banner">

    <img
      id="banner"
      src="https://picsum.photos/900/420?random=31"
      alt="SayonMart Offer"
    >

  </div>


  <div class="dots">

    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>

  </div>


  <!-- CATEGORY -->

  <div class="sectionHead">

    <h2>Categories</h2>

    <a href="products.html">
      View All →
    </a>

  </div>


  <div class="categories">

    <div class="cat" onclick="openCategory('Mobiles')">
      <div class="catImg">📱</div>
      <div class="catName">Mobile</div>
    </div>

    <div class="cat" onclick="openCategory('Electronics')">
      <div class="catImg">🎧</div>
      <div class="catName">Electronics</div>
    </div>

    <div class="cat" onclick="openCategory('Fashion')">
      <div class="catImg">👕</div>
      <div class="catName">Fashion</div>
    </div>

    <div class="cat" onclick="openCategory('Beauty')">
      <div class="catImg">💄</div>
      <div class="catName">Beauty</div>
    </div>

    <div class="cat" onclick="openCategory('Home')">
      <div class="catImg">🛋️</div>
      <div class="catName">Home</div>
    </div>

    <div class="cat" onclick="openCategory('Shoes')">
      <div class="catImg">👟</div>
      <div class="catName">Shoes</div>
    </div>

    <div class="cat" onclick="openCategory('Grocery')">
      <div class="catImg">🛍️</div>
      <div class="catName">Grocery</div>
    </div>

  </div>


  <!-- FLASH SALE -->

  <div class="flash">

    <div>
      <h2>⚡ Flash Sale</h2>
      <p>Limited Time Offer</p>
    </div>

    <button onclick="location.href='products.html'">
      Shop Now →
    </button>

  </div>


  <!-- TRENDING -->

  <div class="sectionHead">

    <h2>🔥 Trending Products</h2>

    <a href="products.html">
      View All →
    </a>

  </div>


  <div id="products" class="products">

    <div class="loading">
      Products loading...
    </div>

  </div>


  <!-- OFFER -->

  <div class="offer">

    <div>

      <b>Up to 70% OFF</b>

      <p>
        On selected products
      </p>

    </div>

    <div class="bags">
      🛍️
    </div>

  </div>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <button
    class="nav active"
    onclick="location.href='index.html'"
  >
    <span>⌂</span>
    Home
  </button>


  <button
    class="nav"
    onclick="location.href='products.html'"
  >
    <span>▦</span>
    Categories
  </button>


  <button
    class="nav"
    onclick="location.href='wishlist.html'"
  >
    <span>♡</span>
    Wishlist
  </button>


  <button
    class="nav"
    onclick="location.href='orders.html'"
  >
    <span>□</span>
    Orders
  </button>


  <button
    class="nav"
    onclick="location.href='settings.html'"
  >
    <span>♙</span>
    Account
  </button>

</nav>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs,
  limit,
  query
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const productsBox =
  document.getElementById("products");


const CACHE_KEY =
  "sayonmart_products_cache";


let allProducts = [];


/* SECURITY */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));

}


function escapeAttr(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}


/* CART */

function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem("cart") || "[]"
    );

  }catch{

    return [];

  }

}


function updateCartBadge(){

  const cart = getCart();

  const count =
    cart.reduce(
      (sum,item) =>
        sum + (Number(item.quantity)||1),
      0
    );

  const btn =
    document.getElementById("cartTop");

  if(btn){

    btn.title =
      `Cart ${count}`;

  }

}


/* ADD CART */

window.addToCart =
function(id,name,price,image){

  const cart = getCart();

  const found =
    cart.find(x => x.id === id);


  if(found){

    found.quantity =
      (Number(found.quantity)||1) + 1;

  }else{

    cart.push({

      id:id,

      name:name,

      price:Number(price)||0,

      image:image,

      quantity:1

    });

  }


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  updateCartBadge();


  alert("🛒 Cart-এ যোগ হয়েছে");

};


/* LIKE / WISHLIST */

window.addWishlist =
function(id,name,price,image,button){

  let list = [];

  try{

    list =
      JSON.parse(
        localStorage.getItem("wishlist") || "[]"
      );

  }catch{}


  const index =
    list.findIndex(
      x => x.id === id
    );


  if(index === -1){

    list.push({

      id:id,

      name:name,

      price:Number(price)||0,

      image:image

    });


    if(button){

      button.textContent = "♥";

      button.classList.add("liked");

      button.setAttribute(
        "aria-label",
        "Unlike"
      );

    }


    alert("❤️ Like করা হয়েছে");

  }else{

    list.splice(index,1);


    if(button){

      button.textContent = "♡";

      button.classList.remove("liked");

      button.setAttribute(
        "aria-label",
        "Like"
      );

    }


    alert("💔 Like সরানো হয়েছে");

  }


  localStorage.setItem(
    "wishlist",
    JSON.stringify(list)
  );

};


/* RENDER PRODUCTS */

function renderProducts(list){

  if(!list.length){

    productsBox.innerHTML =
      '<div class="empty" style="grid-column:1/-1">কোনো Product পাওয়া যায়নি</div>';

    return;

  }


  productsBox.innerHTML =
    list.map(p => {

      const id =
        escapeAttr(p.id);

      const name =
        escapeAttr(p.name);

      const image =
        escapeAttr(p.image);

      const price =
        Number(p.price)||0;


      let liked = false;


      try{

        const wishlist =
          JSON.parse(
            localStorage.getItem("wishlist") || "[]"
          );

        liked =
          wishlist.some(
            x => x.id === p.id
          );

      }catch{}


      return `

        <div class="card">

          <div class="cardImg">

            <img
              src="${image}"
              alt="${name}"
              loading="lazy"
              onerror="this.src='https://picsum.photos/400/400?random=${encodeURIComponent(p.id)}'"
            >


            <button
              class="wish ${liked ? "liked" : ""}"
              aria-label="${liked ? "Unlike" : "Like"}"
              onclick="addWishlist(
                '${id}',
                '${name}',
                ${price},
                '${image}',
                this
              )"
            >
              ${liked ? "♥" : "♡"}
            </button>

          </div>


          <div class="cardBody">

            <h3>
              ${escapeHTML(p.name)}
            </h3>


            <div class="price">
              ₹${price.toLocaleString("en-IN")}
            </div>


            <button
              class="add"
              onclick="addToCart(
                '${id}',
                '${name}',
                ${price},
                '${image}'
              )"
            >
              🛒 Add to Cart
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* CACHE */

function loadProductsFromCache(){

  try{

    const cached =
      JSON.parse(
        localStorage.getItem(CACHE_KEY) || "[]"
      );


    if(
      Array.isArray(cached) &&
      cached.length
    ){

      allProducts = cached;

      renderProducts(
        allProducts
      );

      return true;

    }

  }catch{}


  return false;

}


function saveProductsToCache(data){

  try{

    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(data)
    );

  }catch{}

}


/* FIREBASE */

async function loadProductsFromFirebase(){

  try{

    const q =
      query(
        collection(db,"products"),
        limit(24)
      );


    const snap =
      await getDocs(q);


    const data =
      snap.docs
        .map(doc => ({
          id:doc.id,
          ...doc.data()
        }))
        .filter(p => p.name);


    allProducts = data;


    saveProductsToCache(data);


    renderProducts(data);

  }catch(error){

    console.error(error);


    if(!allProducts.length){

      productsBox.innerHTML =
        '<div class="empty" style="grid-column:1/-1">Product load করা যাচ্ছে না। Firebase connection check করুন।</div>';

    }

  }

}


/* SEARCH */

window.searchProduct =
function(){

  const term =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    allProducts.filter(p =>
      String(p.name || "")
        .toLowerCase()
        .includes(term)
    );


  renderProducts(filtered);

};


/* CATEGORY */

window.openCategory =
function(category){

  localStorage.setItem(
    "selectedCategory",
    category
  );


  location.href =
    "products.html";

};


/* START */

updateCartBadge();

loadProductsFromCache();

loadProductsFromFirebase();


/* BANNER SLIDER */

const banners = [

  "https://picsum.photos/900/420?random=31",

  "https://picsum.photos/900/420?random=32",

  "https://picsum.photos/900/420?random=33",

  "https://picsum.photos/900/420?random=34",

  "https://picsum.photos/900/420?random=35"

];


let bannerIndex = 0;


const banner =
  document.getElementById("banner");


const dots =
  document.querySelectorAll(".dot");


setInterval(() => {

  bannerIndex =
    (bannerIndex + 1) %
    banners.length;


  banner.src =
    banners[bannerIndex];


  dots.forEach((d,i) => {

    d.classList.toggle(
      "active",
      i === bannerIndex
    );

  });

},3000);

</script>

</body>
</html>
