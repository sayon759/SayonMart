<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f7f7;
  color:#222;
  font-family:Arial,sans-serif;
  padding-bottom:75px;
}

/* HEADER */
.header{
  background:#fff;
  padding:14px 15px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 8px #ddd;
}

.logo{
  color:#e91e63;
  font-size:21px;
  font-weight:bold;
}

.header-icons{
  display:flex;
  gap:18px;
  font-size:22px;
}

/* SEARCH */
.search-box{
  background:#fff;
  padding:10px 15px 15px;
}

.search{
  width:100%;
  padding:13px 16px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:14px;
  outline:none;
  background:#f5f5f5;
}

/* BANNER */
.banner{
  margin:12px;
  height:175px;
  border-radius:15px;
  overflow:hidden;
  background:#e91e63;
  color:white;
  position:relative;
}

.banner-content{
  padding:25px 18px;
}

.banner h1{
  margin:0;
  font-size:28px;
}

.banner p{
  margin:8px 0;
}

.shop-btn{
  border:0;
  background:#ffd600;
  color:#111;
  padding:10px 18px;
  border-radius:20px;
  font-weight:bold;
}

/* CATEGORIES */
.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 15px;
}

.title h2{
  margin:0;
  font-size:19px;
}

.title span{
  color:#e91e63;
  font-size:13px;
}

.categories{
  display:flex;
  overflow-x:auto;
  gap:12px;
  padding:5px 15px 15px;
}

.category{
  min-width:70px;
  text-align:center;
}

.cat-icon{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  box-shadow:0 2px 8px #ddd;
  margin:auto;
}

.category p{
  font-size:12px;
  margin:6px 0;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:5px 12px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px #ddd;
  position:relative;
}

.card img{
  width:100%;
  height:155px;
  object-fit:cover;
  background:#eee;
}

.card-info{
  padding:10px;
}

.card h3{
  margin:0;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price{
  margin:7px 0 2px;
  font-size:17px;
  font-weight:bold;
}

.old-price{
  color:#999;
  text-decoration:line-through;
  font-size:11px;
}

.rating{
  color:#e91e63;
  font-size:11px;
}

.add-btn{
  width:100%;
  border:0;
  background:#e91e63;
  color:white;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  font-weight:bold;
}

.wish{
  position:absolute;
  right:8px;
  top:8px;
  width:32px;
  height:32px;
  border-radius:50%;
  border:0;
  background:white;
  font-size:18px;
}

/* DEAL */
.deal{
  margin:10px 12px;
  padding:16px;
  border-radius:14px;
  background:#222;
  color:white;
}

.deal h2{
  margin:0;
  color:#ffd600;
}

.deal p{
  font-size:13px;
  color:#ddd;
}

/* BOTTOM */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.bottom a{
  text-decoration:none;
  color:#777;
  text-align:center;
  font-size:10px;
}

.bottom a div{
  font-size:21px;
  margin-bottom:3px;
}

.bottom a.active{
  color:#e91e63;
}

.cart{
  position:relative;
}

.badge{
  position:absolute;
  top:-7px;
  right:-9px;
  background:#e91e63;
  color:#fff;
  border-radius:50%;
  min-width:16px;
  height:16px;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

  <div class="logo">
    🛍️ SayonMart
  </div>

  <div class="header-icons">

    <span onclick="location.href='profile.html'">
      ♡
    </span>

    <span onclick="location.href='cart.html'">
      🛒
    </span>

  </div>

</div>


<!-- SEARCH -->

<div class="search-box">

  <input
    class="search"
    id="searchInput"
    type="text"
    placeholder="🔍 Search for products..."
    oninput="searchProducts()"
  >

</div>


<!-- BANNER -->

<div class="banner">

  <div class="banner-content">

    <h1>Big Deals</h1>

    <h1>Big Savings</h1>

    <p>Up to 70% OFF</p>

    <button
      class="shop-btn"
      onclick="location.href='products.html'"
    >
      Shop Now
    </button>

  </div>

</div>


<!-- CATEGORIES -->

<div class="title">

  <h2>Categories</h2>

  <span onclick="location.href='products.html'">
    See All
  </span>

</div>


<div class="categories">

  <div
    class="category"
    onclick="openCategory('Fashion')"
  >
    <div class="cat-icon">👕</div>
    <p>Fashion</p>
  </div>


  <div
    class="category"
    onclick="openCategory('Electronics')"
  >
    <div class="cat-icon">📱</div>
    <p>Electronics</p>
  </div>


  <div
    class="category"
    onclick="openCategory('Home')"
  >
    <div class="cat-icon">🏠</div>
    <p>Home</p>
  </div>


  <div
    class="category"
    onclick="openCategory('Beauty')"
  >
    <div class="cat-icon">💄</div>
    <p>Beauty</p>
  </div>


  <div
    class="category"
    onclick="openCategory('Shoes')"
  >
    <div class="cat-icon">👟</div>
    <p>Shoes</p>
  </div>


  <div
    class="category"
    onclick="openCategory('Mobiles')"
  >
    <div class="cat-icon">📲</div>
    <p>Mobiles</p>
  </div>

</div>


<!-- DEAL -->

<div class="deal">

  <h2>🔥 Today's Top Deals</h2>

  <p>
    Best products at amazing prices.
  </p>

</div>


<!-- PRODUCTS -->

<div class="title">

  <h2>Top Products</h2>

  <span onclick="location.href='products.html'">
    See All
  </span>

</div>


<div
  id="products"
  class="products"
>

  <div style="
    grid-column:1/3;
    text-align:center;
    padding:30px;
  ">
    Loading products...
  </div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <a
    href="index.html"
    class="active"
  >
    <div>⌂</div>
    Home
  </a>


  <a href="products.html">
    <div>▦</div>
    Categories
  </a>


  <a href="cart.html">

    <div class="cart">

      🛒

      <span
        id="cartBadge"
        class="badge"
      >
        0
      </span>

    </div>

    Cart

  </a>


  <a href="order.html">

    <div>📦</div>

    Orders

  </a>


  <a href="profile.html">

    <div>♙</div>

    Profile

  </a>

</nav>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const productsDiv =
document.getElementById("products");


let allProducts=[];


/* LOAD PRODUCTS */

async function loadProducts(){

  try{

    const snapshot =
    await getDocs(
      collection(db,"products")
    );


    allProducts=[];


    snapshot.forEach((doc)=>{

      allProducts.push({
        id:doc.id,
        ...doc.data()
      });

    });


    showProducts(allProducts);

  }catch(error){

    console.error(error);

    productsDiv.innerHTML=`

      <div style="
        grid-column:1/3;
        text-align:center;
        padding:30px;
        color:#e91e63;
      ">

        ❌ Products Load Failed

      </div>

    `;

  }

}


/* SHOW PRODUCTS */

function showProducts(products){

  productsDiv.innerHTML="";


  if(products.length===0){

    productsDiv.innerHTML=`

      <div style="
        grid-column:1/3;
        text-align:center;
        padding:30px;
        color:#777;
      ">

        📭 No Products Found

      </div>

    `;

    return;

  }


  products.slice(0,8).forEach((product)=>{

    const name =
    product.name || "Product";


    const price =
    Number(product.price || 0);


    const image =
    product.image ||
    product.imageUrl ||
    "https://via.placeholder.com/300";


    productsDiv.innerHTML += `

      <div class="card">

        <button
          class="wish"
          onclick="addWishlist('${product.id}')"
        >
          ♡
        </button>


        <img
          src="${image}"
          onerror="
          this.src='https://via.placeholder.com/300'
          "
        >


        <div class="card-info">

          <h3>
            ${name}
          </h3>


          <div class="price">
            ₹${price}
          </div>


          <div class="rating">
            ★ 4.3
          </div>


          <button
            class="add-btn"
            onclick="addToCart(
              '${product.id}',
              '${escapeText(name)}',
              ${price},
              '${image}'
            )"
          >
            Add to Cart
          </button>

        </div>

      </div>

    `;

  });

}


/* SEARCH */

window.searchProducts=function(){

  const text =
  document
  .getElementById("searchInput")
  .value
  .toLowerCase()
  .trim();


  const filtered =
  allProducts.filter(product=>{

    const name =
    String(product.name || "")
    .toLowerCase();


    const category =
    String(product.category || "")
    .toLowerCase();


    return(
      name.includes(text) ||
      category.includes(text)
    );

  });


  showProducts(filtered);

};


/* CATEGORY */

window.openCategory=function(category){

  location.href =
  "products.html?category="+
  encodeURIComponent(category);

};


/* ADD CART */

window.addToCart=function(
  id,
  name,
  price,
  image
){

  let cart =
  JSON.parse(
    localStorage.getItem("cart") || "[]"
  );


  const existing =
  cart.find(item=>item.id===id);


  if(existing){

    existing.quantity =
    (existing.quantity || 1)+1;

  }else{

    cart.push({

      id:id,
      name:name,
      price:price,
      image:image,
      quantity:1

    });

  }


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  updateCart();


  alert(
    "🛒 Added to Cart!"
  );

};


/* WISHLIST */

window.addWishlist=function(id){

  let wishlist =
  JSON.parse(
    localStorage.getItem("wishlist") || "[]"
  );


  if(!wishlist.includes(id)){

    wishlist.push(id);

    localStorage.setItem(
      "wishlist",
      JSON.stringify(wishlist)
    );

    alert("❤️ Added to Wishlist!");

  }else{

    alert("Already in Wishlist!");

  }

};


/* CART COUNT */

function updateCart(){

  const cart =
  JSON.parse(
    localStorage.getItem("cart") || "[]"
  );


  let count=0;


  cart.forEach(item=>{

    count +=
    Number(item.quantity || 1);

  });


  document
  .getElementById("cartBadge")
  .textContent=count;

}


/* ESCAPE */

function escapeText(text){

  return String(text)
  .replace(/'/g,"\\'")
  .replace(/"/g,"&quot;");

}


loadProducts();

updateCart();

</script>

</body>
</html>
