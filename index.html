<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SayonMart</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#4f46e5">
</head>

<body>

<header>
  <h2>SayonMart</h2>
</header>

<div class="banner">
  <img
    id="banner"
    src="https://picsum.photos/800/300?random=1"
    alt="Banner">
</div>

<h3 class="title">Categories</h3>

<div class="categories">
  <div>👕<br>Fashion</div>
  <div>👟<br>Shoes</div>
  <div>📱<br>Mobiles</div>
  <div>⌚<br>Watches</div>
</div>

<h3 class="title">Trending Products</h3>

<div class="search">
  <input
    type="text"
    id="search"
    placeholder="Search Product..."
    onkeyup="searchProduct()">
</div>

<!-- Firebase Products এখানে আসবে -->
<div class="products" id="products">
  <p id="loading">⏳ Products loading...</p>
</div>


<div class="bottom-nav">
  <a href="index.html">🏠<br>Home</a>
  <a href="products.html">🛍️<br>Products</a>
  <a href="cart.html">🛒<br>Cart</a>
  <a href="profile.html">👤<br>Profile</a>
</div>

<button onclick="window.location.href='login.html'">
  Login
</button>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const productsDiv = document.getElementById("products");


/* =========================
   LOAD PRODUCTS FROM FIREBASE
========================= */

async function loadProducts() {

  try {

    productsDiv.innerHTML =
      "<p>⏳ Products loading...</p>";

    const productsQuery = query(
      collection(db, "products"),
      orderBy("createdAt", "desc")
    );

    const snapshot =
      await getDocs(productsQuery);

    productsDiv.innerHTML = "";


    if (snapshot.empty) {

      productsDiv.innerHTML =
        "<p>❌ এখনো কোনো Product যোগ করা হয়নি।</p>";

      return;
    }


    snapshot.forEach((doc) => {

      const product = doc.data();

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `

        <img
          src="${product.image}"
          alt="${product.name}"
          style="
            width:100%;
            height:200px;
            object-fit:cover;
            border-radius:15px;
          "
        >

        <h3>${product.name}</h3>

        <p>
          ₹${product.price}
        </p>

        <p>
          📂 ${product.category}
        </p>

        <button class="wishlist-btn">
          ❤️ Wishlist
        </button>

        <button class="cart-btn">
          🛒 Add to Cart
        </button>

      `;


      /* Wishlist */

      card
        .querySelector(".wishlist-btn")
        .addEventListener("click", () => {

          addWishlist(
            product.name,
            product.price,
            product.image
          );

        });


      /* Cart */

      card
        .querySelector(".cart-btn")
        .addEventListener("click", () => {

          addToCart(
            product.name,
            Number(product.price),
            product.image
          );

        });


      productsDiv.appendChild(card);

    });

  }

  catch (error) {

    console.error(error);

    productsDiv.innerHTML = `
      <p>
        ❌ Product load হচ্ছে না।
        <br>
        Firebase settings/check করো।
      </p>
    `;

  }

}


/* =========================
   SEARCH
========================= */

window.searchProduct = function() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const cards =
    document.querySelectorAll(".products .card");


  cards.forEach(card => {

    const text =
      card.innerText.toLowerCase();

    if (text.includes(search)) {

      card.style.display = "";

    } else {

      card.style.display = "none";

    }

  });

};


/* =========================
   WISHLIST
========================= */

window.addWishlist = function(
  name,
  price,
  image
) {

  let wishlist =
    JSON.parse(
      localStorage.getItem("wishlist") || "[]"
    );

  wishlist.push({
    name: name,
    price: price,
    image: image
  });

  localStorage.setItem(
    "wishlist",
    JSON.stringify(wishlist)
  );

  alert("❤️ Wishlist-এ যোগ হয়েছে");

};


/* =========================
   CART
========================= */

window.addToCart = function(
  name,
  price,
  image
) {

  let cart =
    JSON.parse(
      localStorage.getItem("cart") || "[]"
    );

  cart.push({
    name: name,
    price: price,
    image: image,
    quantity: 1
  });

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  alert("🛒 Cart-এ যোগ হয়েছে");

};


/* Start */

loadProducts();

</script>


<!-- Firebase -->
<script type="module" src="firebase.js"></script>


<!-- Service Worker -->
<script>

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("./service-worker.js")
      .then(() => {
        console.log("Service Worker Registered");
      })
      .catch(error => {
        console.log(error);
      });

  });

}

</script>

</body>
  </html>
