<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:70px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#000;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 8px #000;
}

.logo{
  color:#FFD700;
  font-size:23px;
  font-weight:bold;
}

/* SEARCH */

.search-box{
  padding:10px;
  background:#111;
}

#search{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  outline:none;
  font-size:15px;
}

/* BANNER */

.banner-box{
  width:100%;
  overflow:hidden;
}

#banner{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

/* SECTION */

.section{
  padding:10px;
}

.section-title{
  color:#FFD700;
  font-size:20px;
  font-weight:bold;
  margin:8px 0 12px;
}

/* CATEGORY */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:8px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  min-width:85px;
  background:#222;
  border-radius:10px;
  padding:12px 8px;
  text-align:center;
  color:white;
  cursor:pointer;
}

/* OFFER */

.offer{
  margin:10px;
  padding:15px;
  background:#222;
  border-radius:12px;
  text-align:center;
  color:#FFD700;
  font-size:18px;
  font-weight:bold;
}

/* PRODUCT GRID */

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

/* CARD */

.card{
  background:#1d1d1d;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  box-shadow:0 2px 6px #000;
}

.card img{
  width:100%;
  height:170px;
  object-fit:cover;
  display:block;
  background:#222;
}

.card-content{
  padding:10px;
}

.card h3{
  margin:0 0 6px;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price{
  color:#FFD700;
  font-size:17px;
  font-weight:bold;
}

.discount{
  color:#00e676;
  font-size:13px;
  margin-top:4px;
}

.card-buttons{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.card button{
  flex:1;
  border:none;
  padding:8px 4px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
}

.cart-btn{
  background:#FFD700;
  color:#000;
}

.wish-btn{
  background:#333;
  color:white;
}

/* LOADING */

.loading{
  text-align:center;
  padding:25px;
  color:#aaa;
}

.loader{
  width:35px;
  height:35px;
  border:4px solid #333;
  border-top:4px solid #FFD700;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:10px auto;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

/* EMPTY */

.empty{
  text-align:center;
  padding:30px;
  color:#aaa;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:62px;
  background:#000;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:2000;
  border-top:1px solid #333;
}

.nav-item{
  color:#aaa;
  text-align:center;
  font-size:12px;
  cursor:pointer;
}

.nav-item span{
  display:block;
  font-size:22px;
  margin-bottom:2px;
}

.nav-item.active{
  color:#FFD700;
}

.badge{
  background:red;
  color:white;
  border-radius:50%;
  font-size:10px;
  padding:2px 5px;
  position:absolute;
  margin-left:-8px;
  margin-top:-3px;
}

</style>
</head>

<body>

<!-- HEADER -->

<header>

<div class="logo">
SayonMart
</div>

<div onclick="goSettings()" style="font-size:22px;cursor:pointer;">
⚙️
</div>

</header>


<!-- SEARCH -->

<div class="search-box">

<input
  type="text"
  id="search"
  placeholder="Search Product..."
  onkeyup="searchProduct()"
>

</div>


<!-- BANNER -->

<div class="banner-box">

<img
  id="banner"
  src="https://picsum.photos/800/300?random=1"
  alt="SayonMart Banner"
>

</div>


<!-- CATEGORIES -->

<div class="section">

<div class="section-title">
Categories
</div>

<div class="categories">

<div class="category" onclick="filterCategory('Fashion')">
👕<br>
Fashion
</div>

<div class="category" onclick="filterCategory('Shoes')">
👟<br>
Shoes
</div>

<div class="category" onclick="filterCategory('Mobiles')">
📱<br>
Mobiles
</div>

<div class="category" onclick="filterCategory('Watches')">
⌚<br>
Watches
</div>

</div>

</div>


<!-- OFFER -->

<div class="offer">
🔥 Special Offers Available 🔥
</div>


<!-- TRENDING -->

<div class="section">

<div class="section-title">
🔥 Trending Products
</div>

<div id="trendingProducts" class="products">

<div class="loading">
<div class="loader"></div>
Loading products...
</div>

</div>

</div>


<!-- NEW ARRIVALS -->

<div class="section">

<div class="section-title">
🆕 New Arrivals
</div>

<div id="newProducts" class="products">

</div>

</div>


<!-- BEST DEALS -->

<div class="section">

<div class="section-title">
💥 Best Deals
</div>

<div id="dealProducts" class="products">

</div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

<div
  class="nav-item active"
  onclick="goHome()"
>
<span>🏠</span>
Home
</div>


<div
  class="nav-item"
  onclick="goProducts()"
>
<span>🛍️</span>
Products
</div>


<div
  class="nav-item"
  onclick="goCart()"
  style="position:relative;"
>
<span>🛒</span>
<span id="cartBadge" class="badge">0</span>
Cart
</div>


<div
  class="nav-item"
  onclick="goWishlist()"
  style="position:relative;"
>
<span>❤️</span>
<span id="wishlistBadge" class="badge">0</span>
Wishlist
</div>


<div
  class="nav-item"
  onclick="goSettings()"
>
<span>⚙️</span>
Settings
</div>

</div>


<!-- FIREBASE + JAVASCRIPT -->

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  limit
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   GLOBAL VARIABLES
========================= */

let allProducts = [];


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    /*
      আগের মতো সব product একসাথে
      download না করে শুধু 24টি load করবে।
    */

    const productsQuery = query(
      collection(db,"products"),
      limit(24)
    );

    const snapshot = await getDocs(productsQuery);

    allProducts = [];

    snapshot.forEach((docSnap)=>{

      allProducts.push({
        id:docSnap.id,
        ...docSnap.data()
      });

    });


    displayHomeProducts();

  }catch(error){

    console.error("Product loading error:",error);

    document.getElementById("trendingProducts").innerHTML = `
      <div class="empty">
        Product load করতে সমস্যা হয়েছে।
      </div>
    `;

  }

}


/* =========================
   DISPLAY HOME PRODUCTS
========================= */

function displayHomeProducts(){

  const trending =
    allProducts.slice(0,6);


  const newest =
    [...allProducts]
    .sort((a,b)=>{

      return getTime(b.createdAt) -
             getTime(a.createdAt);

    })
    .slice(0,6);


  const deals =
    allProducts
    .filter(product=>product.discount)
    .sort((a,b)=>{

      return Number(b.discount || 0) -
             Number(a.discount || 0);

    })
    .slice(0,6);


  showProducts(
    trending,
    "trendingProducts"
  );


  showProducts(
    newest,
    "newProducts"
  );


  showProducts(
    deals,
    "dealProducts"
  );

}


/* =========================
   CREATED AT TIME
========================= */

function getTime(value){

  if(!value){
    return 0;
  }

  if(value.seconds){
    return value.seconds * 1000;
  }

  if(value.toMillis){
    return value.toMillis();
  }

  if(typeof value === "number"){
    return value;
  }

  return 0;

}


/* =========================
   SHOW PRODUCTS
========================= */

function showProducts(products,containerId){

  const container =
    document.getElementById(containerId);


  if(!products.length){

    container.innerHTML = `
      <div class="empty">
        No products available
      </div>
    `;

    return;

  }


  container.innerHTML = "";


  products.forEach(product=>{

    const card =
      document.createElement("div");

    card.className = "card";


    const image =
      product.image ||
      product.imageUrl ||
      "https://via.placeholder.com/400x400?text=SayonMart";


    const price =
      product.price || 0;


    const discount =
      product.discount || "";


    card.innerHTML = `

      <img
        src="${image}"
        alt="${escapeHTML(product.name || "Product")}"
        loading="lazy"
        decoding="async"
      >

      <div class="card-content">

        <h3>
          ${escapeHTML(product.name || "Product")}
        </h3>

        <div class="price">
          ₹${price}
        </div>

        ${
          discount
          ?
          `<div class="discount">
            ${discount}% OFF
          </div>`
          :
          ""
        }

        <div class="card-buttons">

          <button
            class="cart-btn"
            onclick="addToCart('${product.id}')"
          >
            🛒 Cart
          </button>

          <button
            class="wish-btn"
            onclick="addToWishlist('${product.id}')"
          >
            ❤️
          </button>

        </div>

      </div>

    `;


    container.appendChild(card);

  });

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   SEARCH
========================= */

window.searchProduct = function(){

  const search =
    document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();


  if(!search){

    displayHomeProducts();

    return;

  }


  const result =
    allProducts.filter(product=>{

      const name =
        String(product.name || "")
        .toLowerCase();

      return name.includes(search);

    });


  showProducts(
    result,
    "trendingProducts"
  );


  document.getElementById(
    "newProducts"
  ).innerHTML = "";


  document.getElementById(
    "dealProducts"
  ).innerHTML = "";

};


/* =========================
   CATEGORY FILTER
========================= */

window.filterCategory = function(category){

  const result =
    allProducts.filter(product=>{

      const productCategory =
        String(
          product.category || ""
        ).toLowerCase();

      return productCategory ===
             category.toLowerCase();

    });


  showProducts(
    result,
    "trendingProducts"
  );


  document.getElementById(
    "newProducts"
  ).innerHTML = "";


  document.getElementById(
    "dealProducts"
  ).innerHTML = "";

};


/* =========================
   CART
========================= */

window.addToCart = function(productId){

  const product =
    allProducts.find(
      p=>p.id === productId
    );


  if(!product){
    return;
  }


  let cart =
    JSON.parse(
      localStorage.getItem("sayonmartCart")
    ) || [];


  const existing =
    cart.find(
      item=>item.id === productId
    );


  if(existing){

    existing.quantity =
      (existing.quantity || 1) + 1;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:product.price,

      image:
        product.image ||
        product.imageUrl ||
        "",

      quantity:1

    });

  }


  localStorage.setItem(
    "sayonmartCart",
    JSON.stringify(cart)
  );


  updateCartBadge();


  alert("🛒 Cart-এ যোগ হয়েছে");

};


/* =========================
   WISHLIST
========================= */

window.addToWishlist = function(productId){

  let wishlist =
    JSON.parse(
      localStorage.getItem("sayonmartWishlist")
    ) || [];


  if(!wishlist.includes(productId)){

    wishlist.push(productId);

    localStorage.setItem(
      "sayonmartWishlist",
      JSON.stringify(wishlist)
    );


    updateWishlistBadge();


    alert("❤️ Wishlist-এ যোগ হয়েছে");

  }else{

    alert("❤️ Wishlist-এ আগেই আছে");

  }

};


/* =========================
   CART BADGE
========================= */

function updateCartBadge(){

  const cart =
    JSON.parse(
      localStorage.getItem("sayonmartCart")
    ) || [];


  let total = 0;


  cart.forEach(item=>{

    total +=
      Number(item.quantity || 1);

  });


  document.getElementById(
    "cartBadge"
  ).textContent = total;

}


/* =========================
   WISHLIST BADGE
========================= */

function updateWishlistBadge(){

  const wishlist =
    JSON.parse(
      localStorage.getItem("sayonmartWishlist")
    ) || [];


  document.getElementById(
    "wishlistBadge"
  ).textContent =
    wishlist.length;

}


/* =========================
   NAVIGATION
========================= */

window.goHome = function(){

  window.location.href =
    "index.html";

};


window.goProducts = function(){

  window.location.href =
    "products.html";

};


window.goCart = function(){

  window.location.href =
    "cart.html";

};


window.goWishlist = function(){

  window.location.href =
    "wishlist.html";

};


window.goSettings = function(){

  window.location.href =
    "settings.html";

};


/* =========================
   BANNER SLIDER
========================= */

const banners = [

  "https://picsum.photos/800/300?random=1",

  "https://picsum.photos/800/300?random=2",

  "https://picsum.photos/800/300?random=3"

];


let bannerIndex = 0;


setInterval(()=>{

  bannerIndex++;

  if(
    bannerIndex >=
    banners.length
  ){

    bannerIndex = 0;

  }


  const banner =
    document.getElementById("banner");


  banner.src =
    banners[bannerIndex];

},4000);


/* =========================
   START
========================= */

updateCartBadge();

updateWishlistBadge();

loadProducts();

</script>

</body>
</html>
