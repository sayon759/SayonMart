<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SayonMart Login</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f7f7f7;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .box{
      width:92%;
      max-width:400px;
      background:#fff;
      padding:28px 22px;
      border-radius:18px;
      box-shadow:0 5px 25px rgba(0,0,0,.1);
    }

    .logo{
      text-align:center;
      color:#e91e63;
      font-size:30px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .subtitle{
      text-align:center;
      color:#777;
      margin-bottom:25px;
    }

    label{
      display:block;
      margin:12px 0 7px;
      font-weight:bold;
      font-size:14px;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      outline:none;
      font-size:15px;
    }

    input:focus{
      border-color:#e91e63;
    }

    .login-btn{
      width:100%;
      margin-top:20px;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#e91e63;
      color:#fff;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .forgot{
      display:block;
      text-align:right;
      margin-top:12px;
      color:#e91e63;
      font-size:13px;
      cursor:pointer;
    }

    .signup{
      text-align:center;
      margin-top:22px;
      color:#777;
    }

    .signup a{
      color:#e91e63;
      font-weight:bold;
      text-decoration:none;
    }

    #message{
      text-align:center;
      margin-top:12px;
      font-size:14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      SayonMart
    </div>

    <p class="subtitle">
      Login to your account
    </p>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      onclick="login()"
    >
      Login
    </button>

    <span
      class="forgot"
      onclick="forgotPassword()"
    >
      Forgot Password?
    </span>

    <div id="message"></div>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </div>

  </div>


  <script type="module">

    import { auth } from "./firebase.js";

    import {
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    window.login = async function(){

      const email =
        document.getElementById("email")
          .value.trim();

      const password =
        document.getElementById("password")
          .value;

      const message =
        document.getElementById("message");


      if(!email || !password){

        message.style.color = "red";
        message.textContent =
          "Email এবং Password দিন।";

        return;

      }


      message.style.color = "#777";
      message.textContent =
        "Login হচ্ছে...";


      try{

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.style.color = "green";
        message.textContent =
          "Login successful!";

        setTimeout(() => {

          location.href = "index.html";

        }, 700);


      }catch(error){

        console.error(error);

        message.style.color = "red";

        if(
          error.code ===
          "auth/invalid-credential"
        ){

          message.textContent =
            "Email অথবা Password ভুল।";

        }else{

          message.textContent =
            "Login করা যায়নি। আবার চেষ্টা করুন।";

        }

      }

    };


    window.forgotPassword = async function(){

      const email =
        document.getElementById("email")
          .value.trim();


      if(!email){

        alert(
          "আগে Email লিখুন।"
        );

        return;

      }


      try{

        await sendPasswordResetEmail(
          auth,
          email
        );

        alert(
          "Password reset email পাঠানো হয়েছে।"
        );

      }catch(error){

        console.error(error);

        alert(
          "Email ঠিক আছে কিনা দেখুন।"
        );

      }

    };

  </script>

</body>
</html>
