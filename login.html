<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f6;
  color:#222;
}

/* TOP BAR */

.header{
  height:58px;
  background:#e91e63;
  color:white;
  display:flex;
  align-items:center;
  padding:0 18px;
  font-size:23px;
  font-weight:bold;
}

/* MAIN */

.container{
  min-height:calc(100vh - 58px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:850px;
  min-height:480px;
  background:white;
  display:flex;
  border-radius:5px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

/* LEFT */

.left{
  width:40%;
  background:#e91e63;
  color:white;
  padding:40px 30px;
}

.left h1{
  font-size:28px;
  margin-top:10px;
}

.left p{
  font-size:17px;
  line-height:1.6;
  color:#ffe4ed;
}

.features{
  margin-top:35px;
}

.features div{
  margin:18px 0;
  font-size:15px;
}

/* RIGHT */

.right{
  width:60%;
  padding:40px;
}

.title{
  font-size:25px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  color:#777;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:14px;
  margin-bottom:6px;
  color:#555;
}

input{
  width:100%;
  height:48px;
  border:1px solid #ddd;
  border-radius:3px;
  padding:0 14px;
  font-size:15px;
  outline:none;
  margin-bottom:18px;
}

input:focus{
  border-color:#e91e63;
}

/* PASSWORD */

.password-box{
  position:relative;
}

.password-box input{
  padding-right:65px;
}

.show{
  position:absolute;
  right:12px;
  top:15px;
  color:#e91e63;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

/* FORGOT */

.forgot{
  text-align:right;
  margin-top:-8px;
  margin-bottom:20px;
}

.forgot button{
  border:0;
  background:none;
  color:#e91e63;
  font-weight:bold;
  cursor:pointer;
}

/* LOGIN */

.login-btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:3px;
  background:#e91e63;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:.6;
}

/* MESSAGE */

#message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  color:#e91e63;
}

/* SIGNUP */

.signup{
  text-align:center;
  margin-top:28px;
  color:#777;
}

.signup button{
  border:0;
  background:none;
  color:#e91e63;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:650px){

  .login-box{
    max-width:430px;
  }

  .left{
    display:none;
  }

  .right{
    width:100%;
    padding:30px 25px;
  }

  .container{
    align-items:flex-start;
    padding-top:35px;
  }

}
</style>
</head>


<body>

<div class="header">
  🛒 SayonMart
</div>


<div class="container">

  <div class="login-box">

    <!-- LEFT SIDE -->

    <div class="left">

      <h1>Welcome to SayonMart</h1>

      <p>
        Login to continue shopping and enjoy
        your SayonMart experience.
      </p>

      <div class="features">

        <div>🛍️ Easy Shopping</div>

        <div>📦 Track Your Orders</div>

        <div>❤️ Save Your Wishlist</div>

        <div>⚡ Fast Checkout</div>

      </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="right">

      <div class="title">
        Login
      </div>

      <div class="subtitle">
        Enter your details to continue
      </div>


      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >


      <label>Password</label>

      <div class="password-box">

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >

        <span
          class="show"
          id="showBtn"
          onclick="showPassword()">
          SHOW
        </span>

      </div>


      <div class="forgot">

        <button onclick="forgotPassword()">
          Forgot Password?
        </button>

      </div>


      <button
        class="login-btn"
        id="loginBtn"
        onclick="login()">

        Login

      </button>


      <div id="message"></div>


      <div class="signup">

        Don't have an account?

        <button onclick="location.href='signup.html'">
          Create New Account
        </button>

      </div>

    </div>

  </div>

</div>


<script type="module">

import { auth } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const message =
  document.getElementById("message");


/* LOGIN */

window.login = async function(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if(!email || !password){

    message.innerText =
      "⚠️ Email এবং Password দাও";

    return;
  }


  try{

    loginBtn.disabled=true;

    loginBtn.innerText="Logging in...";

    message.innerText="";


    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    message.style.color="#008000";

    message.innerText =
      "✅ Login successful";


    setTimeout(()=>{

      location.href="index.html";

    },700);


  }catch(error){

    console.log(error);

    loginBtn.disabled=false;

    loginBtn.innerText="Login";


    if(
      error.code==="auth/invalid-credential" ||
      error.code==="auth/wrong-password" ||
      error.code==="auth/user-not-found"
    ){

      message.innerText =
        "❌ Email অথবা Password ভুল";

    }else{

      message.innerText =
        "❌ Login করা যায়নি";

    }

  }

};


/* SHOW PASSWORD */

window.showPassword = function(){

  const btn =
    document.getElementById("showBtn");


  if(passwordInput.type==="password"){

    passwordInput.type="text";

    btn.innerText="HIDE";

  }else{

    passwordInput.type="password";

    btn.innerText="SHOW";

  }

};


/* FORGOT PASSWORD */

window.forgotPassword = async function(){

  const email =
    emailInput.value.trim();


  if(!email){

    message.innerText =
      "⚠️ আগে Email লিখো";

    return;
  }


  try{

    await sendPasswordResetEmail(
      auth,
      email
    );


    alert(
      "Password reset email পাঠানো হয়েছে। Gmail-এর Inbox/Spam চেক করো।"
    );


  }catch(error){

    console.log(error);

    message.innerText =
      "❌ এই Email-এর জন্য reset করা যায়নি";

  }

};

</script>

</body>
</html>
