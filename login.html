<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SayonMart Login</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
    }

    header {
      background: #000;
      padding: 25px;
    }

    header h2 {
      color: #FFD700;
      margin: 0;
      font-size: 30px;
    }

    .login-box {
      max-width: 400px;
      margin: 50px auto;
      padding: 25px;
    }

    .login-box h2 {
      color: #FFD700;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #FFD700;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #otpSection {
      display: none;
    }

    #message {
      margin-top: 20px;
      font-size: 16px;
    }

    #recaptcha-container {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>
  <h2>🛒 SayonMart</h2>
</header>

<div class="login-box">

  <h2>📱 Mobile Login</h2>

  <!-- Mobile Number -->
  <div id="phoneSection">

    <input
      type="tel"
      id="phoneNumber"
      placeholder="+91XXXXXXXXXX"
    >

    <div id="recaptcha-container"></div>

    <button onclick="sendOTP()">
      📩 Send OTP
    </button>

  </div>


  <!-- OTP -->
  <div id="otpSection">

    <input
      type="number"
      id="otp"
      placeholder="Enter 6 Digit OTP"
    >

    <button onclick="verifyOTP()">
      ✅ Verify OTP & Login
    </button>

  </div>


  <p id="message"></p>

  <button onclick="window.location.href='index.html'">
    🏠 Back Home
  </button>

</div>


<script type="module">

import { auth } from "./firebase.js";

import {
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


let confirmationResult;


// Create reCAPTCHA
window.recaptchaVerifier = new RecaptchaVerifier(
  auth,
  "recaptcha-container",
  {
    size: "normal",
    callback: () => {
      console.log("reCAPTCHA verified");
    }
  }
);


// SEND OTP
window.sendOTP = async function() {

  const phoneNumber =
    document.getElementById("phoneNumber").value.trim();

  const message =
    document.getElementById("message");


  if (!phoneNumber) {
    message.innerText = "❌ Mobile number দাও";
    return;
  }


  if (!phoneNumber.startsWith("+")) {
    message.innerText =
      "❌ Country code সহ নম্বর দাও। যেমন: +919876543210";
    return;
  }


  try {

    message.innerText = "⏳ OTP পাঠানো হচ্ছে...";


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        phoneNumber,
        window.recaptchaVerifier
      );


    document.getElementById("phoneSection").style.display =
      "none";

    document.getElementById("otpSection").style.display =
      "block";

    message.innerText =
      "✅ OTP পাঠানো হয়েছে।";

  } catch (error) {

    console.error(error);

    message.innerText =
      "❌ OTP পাঠানো যায়নি: " + error.message;

    // Reset reCAPTCHA
    if (window.recaptchaVerifier) {
      window.recaptchaVerifier.clear();
    }

    window.recaptchaVerifier = new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {
        size: "normal"
      }
    );

  }

};


// VERIFY OTP
window.verifyOTP = async function() {

  const otp =
    document.getElementById("otp").value.trim();

  const message =
    document.getElementById("message");


  if (!otp) {
    message.innerText = "❌ OTP দাও";
    return;
  }


  try {

    message.innerText =
      "⏳ Login হচ্ছে...";


    const result =
      await confirmationResult.confirm(otp);


    const user = result.user;


    message.innerText =
      "✅ Login সফল হয়েছে!";


    console.log("Logged in user:", user);


    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);


  } catch (error) {

    console.error(error);

    message.innerText =
      "❌ OTP ভুল অথবা OTP-এর মেয়াদ শেষ হয়েছে।";

  }

};

</script>

</body>
      </html>
