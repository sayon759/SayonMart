<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SayonMart Login</title>

  <style>
    *{
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      margin:0;
      background:#f7f7f7;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      width:100%;
      max-width:400px;
      background:white;
      min-height:100vh;
      padding:40px 25px;
    }

    .logo{
      text-align:center;
      font-size:32px;
      font-weight:bold;
      color:#ff3f6c;
      margin-top:40px;
      margin-bottom:50px;
    }

    h2{
      text-align:center;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:15px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
      margin-bottom:15px;
      outline:none;
    }

    button{
      width:100%;
      padding:15px;
      border:0;
      border-radius:8px;
      background:#ff3f6c;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
    }

    #otpBox{
      display:none;
    }

    #changeBtn{
      background:#eee;
      color:#333;
      margin-top:10px;
    }

    #message{
      text-align:center;
      margin-top:18px;
      font-size:14px;
    }

    #recaptcha-container{
      height:0;
      overflow:hidden;
    }
  </style>
</head>

<body>

<div class="login-box">

  <div class="logo">SayonMart</div>

  <h2>Login / Sign up</h2>

  <!-- Mobile -->
  <div id="phoneBox">
    <input
      type="tel"
      id="phone"
      placeholder="Enter mobile number"
      maxlength="10"
    >

    <button id="sendBtn" onclick="sendOTP()">
      Continue
    </button>
  </div>

  <!-- OTP -->
  <div id="otpBox">

    <input
      type="text"
      id="otp"
      placeholder="Enter 6 digit OTP"
      maxlength="6"
      inputmode="numeric"
    >

    <button onclick="verifyOTP()">
      Verify & Login
    </button>

    <button id="changeBtn" onclick="changeNumber()">
      Change Number
    </button>

  </div>

  <div id="recaptcha-container"></div>

  <div id="message"></div>

</div>


<script type="module">

import { auth } from "./firebase.js";

import {
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


let confirmationResult;
let recaptchaVerifier;


/* reCAPTCHA তৈরি */
async function createRecaptcha(){

  if(recaptchaVerifier){
    return;
  }

  recaptchaVerifier = new RecaptchaVerifier(
    auth,
    "recaptcha-container",
    {
      size:"invisible"
    }
  );

  await recaptchaVerifier.render();
}


/* OTP পাঠানো */
window.sendOTP = async function(){

  const number = document.getElementById("phone").value.trim();
  const message = document.getElementById("message");
  const sendBtn = document.getElementById("sendBtn");

  if(number.length !== 10){

    message.innerText =
      "সঠিক 10 digit mobile number দিন";

    return;
  }

  const phone = "+91" + number;

  sendBtn.disabled = true;
  message.innerText = "OTP পাঠানো হচ্ছে...";

  try{

    await createRecaptcha();

    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        phone,
        recaptchaVerifier
      );

    document.getElementById("phoneBox").style.display="none";
    document.getElementById("otpBox").style.display="block";

    message.innerText =
      "আপনার মোবাইলে OTP পাঠানো হয়েছে";

  }catch(error){

    console.log(error);

    message.innerText =
      error.message;

    sendBtn.disabled = false;

    if(recaptchaVerifier){
      recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }
  }
};


/* OTP Verify */
window.verifyOTP = async function(){

  const otp =
    document.getElementById("otp").value.trim();

  const message =
    document.getElementById("message");

  if(otp.length !== 6){

    message.innerText =
      "6 digit OTP দিন";

    return;
  }

  try{

    message.innerText =
      "Login হচ্ছে...";

    await confirmationResult.confirm(otp);

    message.innerText =
      "Login successful ✅";

    setTimeout(()=>{
      window.location.href="index.html";
    },1000);

  }catch(error){

    console.log(error);

    message.innerText =
      "OTP ভুল হয়েছে। আবার চেষ্টা করুন।";
  }
};


/* Number change */
window.changeNumber = function(){

  document.getElementById("otpBox").style.display="none";

  document.getElementById("phoneBox").style.display="block";

  document.getElementById("otp").value="";

  document.getElementById("message").innerText="";
};


</script>

</body>
</html>
