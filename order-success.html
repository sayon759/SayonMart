<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Successful - SayonMart</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

.header{
  background:#111;
  color:#FFD700;
  padding:17px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:550px;
  margin:auto;
  padding:20px 15px;
}

.success-card{
  background:white;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.check{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#20b15a;
  color:white;
  font-size:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 18px;
}

h1{
  font-size:25px;
  margin-bottom:10px;
}

.subtitle{
  color:#666;
  line-height:1.5;
}

.order-box{
  background:#fafafa;
  border-radius:12px;
  padding:15px;
  margin-top:20px;
  text-align:left;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.row:last-child{
  border-bottom:none;
}

.label{
  color:#777;
}

.value{
  font-weight:bold;
  text-align:right;
}

.product{
  display:flex;
  gap:12px;
  align-items:center;
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #eee;
  text-align:left;
}

.product img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}

.product-name{
  font-weight:bold;
  margin-bottom:6px;
}

.buttons{
  margin-top:20px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

.orders{
  background:#111;
  color:#FFD700;
}

.home{
  background:#FFD700;
  color:#111;
}

</style>
</head>

<body>

<div class="header">
  🛍️ SayonMart
</div>

<div class="container">

  <div class="success-card">

    <div class="check">✓</div>

    <h1>Order Placed Successfully!</h1>

    <p class="subtitle">
      আপনার order সফলভাবে নেওয়া হয়েছে। 🎉
    </p>

    <div class="order-box">

      <div class="row">
        <span class="label">Order ID</span>
        <span class="value" id="orderId">Loading...</span>
      </div>

      <div class="row">
        <span class="label">Total</span>
        <span class="value" id="total">₹0</span>
      </div>

      <div class="row">
        <span class="label">Delivery</span>
        <span class="value" id="delivery">-</span>
      </div>

      <div class="row">
        <span class="label">Payment</span>
        <span class="value" id="payment">-</span>
      </div>

      <div class="product">

        <img id="productImage" src="" alt="Product">

        <div>
          <div class="product-name" id="productName">
            Product
          </div>

          <div id="quantity">
            Quantity: 1
          </div>
        </div>

      </div>

    </div>


    <div class="buttons">

      <button
        class="orders"
        onclick="window.location.href='orders.html'">
        📦 My Orders
      </button>

      <button
        class="home"
        onclick="window.location.href='index.html'">
        🏠 Continue Shopping
      </button>

    </div>

  </div>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const params =
  new URLSearchParams(window.location.search);

const orderId =
  params.get("orderId");


const orderIdEl =
  document.getElementById("orderId");

const totalEl =
  document.getElementById("total");

const deliveryEl =
  document.getElementById("delivery");

const paymentEl =
  document.getElementById("payment");

const productNameEl =
  document.getElementById("productName");

const productImageEl =
  document.getElementById("productImage");

const quantityEl =
  document.getElementById("quantity");


function showOrder(data){

  if(!data){
    return;
  }

  orderIdEl.textContent =
    orderId || data.orderId || "-";

  totalEl.textContent =
    "₹" + (data.cartTotal ?? data.total ?? 0);

  const delivery =
    Number(data.delivery || 0);

  deliveryEl.textContent =
    delivery === 0
      ? "FREE"
      : "₹" + delivery;

  paymentEl.textContent =
    data.paymentMethod === "UPI"
      ? "UPI"
      : "Cash on Delivery";

  productNameEl.textContent =
    data.productName || "Product";

  quantityEl.textContent =
    "Quantity: " +
    (data.quantity || 1);

  if(data.productImage){

    productImageEl.src =
      data.productImage;

  }

}


onAuthStateChanged(auth,async(user)=>{

  // First use saved local information
  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "lastSayonMartOrder"
        ) || "null"
      );

    if(saved){
      showOrder(saved);
    }

  }catch(e){}


  // Then get exact order from Firebase
  if(user && orderId){

    try{

      const snap =
        await getDoc(
          doc(db,"orders",orderId)
        );

      if(
        snap.exists() &&
        snap.data().userId === user.uid
      ){

        showOrder({
          ...snap.data(),
          orderId: orderId
        });

      }

    }catch(error){

      console.log(error);

    }

  }

});

</script>

</body>
</html>
