<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart - My Orders</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f7f7;
  color:#171717;
  font-family:Arial,sans-serif;
  padding-bottom:85px;
}

/* HEADER */

.header{
  background:#fff;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.brand-icon{
  width:45px;
  height:45px;
  border-radius:12px;
  background:#FFD21F;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.brand-name{
  font-size:24px;
  font-weight:bold;
}

.brand-name span{
  color:#FFD21F;
}

.header-icons{
  display:flex;
  gap:18px;
  font-size:25px;
}

/* CONTAINER */

.container{
  padding:18px 15px;
  max-width:700px;
  margin:auto;
}

/* TITLE */

.page-title{
  background:linear-gradient(120deg,#fff9dc,#fff);
  border-radius:22px;
  padding:22px 18px;
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.title-icon{
  width:62px;
  height:62px;
  border-radius:50%;
  background:#fff0b0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}

.page-title h1{
  margin:0;
  font-size:30px;
}

.page-title p{
  margin:7px 0 0;
  color:#666;
  font-size:14px;
}

/* FILTER */

.filters{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:18px;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;
  border:0;
  background:#fff;
  padding:12px 17px;
  border-radius:25px;
  font-size:14px;
  font-weight:bold;
  box-shadow:0 2px 10px #ddd;
}

.filter.active{
  background:#FFD21F;
  color:#111;
}

/* ORDER CARD */

.order-card{
  background:#fff;
  border-radius:22px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
  border:1px solid #eee;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.order-id{
  font-size:14px;
  color:#333;
}

.order-id b{
  color:#d89b00;
}

.order-date{
  font-size:12px;
  color:#888;
  margin-top:6px;
}

/* STATUS */

.status{
  padding:9px 13px;
  border-radius:22px;
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
}

.pending{
  background:#fff0bd;
  color:#9a7100;
}

.confirmed{
  background:#ddf8e9;
  color:#129653;
}

.shipped{
  background:#dcefff;
  color:#1476bd;
}

.delivered{
  background:#dff8e8;
  color:#119653;
}

.cancelled{
  background:#ffe1e1;
  color:#d33;
}

/* PRODUCT */

.product{
  display:flex;
  gap:15px;
  align-items:center;
  margin-top:18px;
}

.product img{
  width:105px;
  height:105px;
  object-fit:cover;
  border-radius:17px;
  background:#f3f3f3;
}

.product-info{
  flex:1;
}

.product h3{
  margin:0 0 8px;
  font-size:18px;
}

.product p{
  margin:5px 0;
  color:#666;
  font-size:14px;
}

.price{
  color:#e5a900 !important;
  font-size:19px !important;
  font-weight:bold;
}

/* TRACKING */

.tracking{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #eee;
}

.track-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:20px;
}

.steps{
  display:flex;
  justify-content:space-between;
  position:relative;
}

.steps:before{
  content:"";
  position:absolute;
  top:16px;
  left:10%;
  right:10%;
  height:3px;
  background:#ddd;
  z-index:0;
}

.step{
  text-align:center;
  width:25%;
  position:relative;
  z-index:1;
}

.circle{
  width:33px;
  height:33px;
  border-radius:50%;
  background:#eee;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  color:#aaa;
}

.step.done .circle{
  background:#22c77a;
  color:#fff;
  box-shadow:0 3px 8px rgba(34,199,122,.25);
}

.step p{
  font-size:11px;
  color:#888;
  margin:8px 0 0;
}

.step.done p{
  color:#222;
  font-weight:bold;
}

/* TOTAL + BUTTONS */

.order-bottom{
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.total-label{
  font-size:12px;
  color:#777;
}

.total{
  margin:4px 0 0;
  font-size:23px;
  font-weight:bold;
  color:#111;
}

.details-btn{
  border:1px solid #222;
  background:#fff;
  color:#111;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  font-size:14px;
}

.details-btn:active{
  transform:scale(.97);
}

/* EMPTY */

.empty{
  text-align:center;
  color:#777;
  padding:70px 15px;
}

.empty-icon{
  font-size:55px;
  margin-bottom:15px;
}

.shop-btn{
  padding:13px 25px;
  background:#FFD21F;
  border:0;
  border-radius:12px;
  font-weight:bold;
}

/* LOADING */

.loading{
  text-align:center;
  color:#c49300;
  padding:60px;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
  box-shadow:0 -3px 15px rgba(0,0,0,.06);
}

.bottom a{
  text-decoration:none;
  color:#888;
  text-align:center;
  font-size:11px;
  min-width:55px;
}

.bottom a div{
  font-size:23px;
  margin-bottom:4px;
}

.bottom a.active{
  color:#d99e00;
  font-weight:bold;
}

@media(max-width:380px){

  .page-title h1{
    font-size:25px;
  }

  .product img{
    width:85px;
    height:85px;
  }

  .product h3{
    font-size:16px;
  }

  .order-bottom{
    flex-direction:column;
    align-items:stretch;
  }

  .details-btn{
    width:100%;
  }
}

</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

  <div class="brand">
    <div class="brand-icon">🛍️</div>

    <div class="brand-name">
      <span>Sayon</span>Mart
    </div>
  </div>

  <div class="header-icons">
    🔍
    🔔
  </div>

</header>


<div class="container">

  <!-- PAGE TITLE -->

  <div class="page-title">

    <div class="title-icon">
      📦
    </div>

    <div>
      <h1>My Orders</h1>
      <p>Track your orders and stay updated</p>
    </div>

  </div>


  <!-- FILTER -->

  <div class="filters">

    <button class="filter active">
      ▦ All Orders
    </button>

    <button class="filter">
      ◷ Pending
    </button>

    <button class="filter">
      🚚 Shipped
    </button>

    <button class="filter">
      ✓ Delivered
    </button>

  </div>


  <!-- ORDERS -->

  <div id="orders" class="loading">
    Loading Orders...
  </div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <a href="index.html">
    <div>⌂</div>
    Home
  </a>

  <a href="products.html">
    <div>▦</div>
    Products
  </a>

  <a href="cart.html">
    <div>🛒</div>
    Cart
  </a>

  <a href="order.html" class="active">
    <div>📦</div>
    Orders
  </a>

  <a href="profile.html">
    <div>♙</div>
    Profile
  </a>

</nav>


<script type="module">

import { db, auth } from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const ordersDiv =
document.getElementById("orders");


onAuthStateChanged(auth, async (user)=>{

  if(!user){

    ordersDiv.innerHTML=`

      <div class="empty">

        <div class="empty-icon">🔒</div>

        <h3>Please Login First</h3>

        <p>Login to see your orders.</p>

        <button
          class="shop-btn"
          onclick="location.href='login.html'">
          Login
        </button>

      </div>

    `;

    return;
  }


  loadOrders(user.uid);

});


async function loadOrders(uid){

  try{

    const q = query(
      collection(db,"orders"),
      where("userId","==",uid)
    );


    const snapshot =
    await getDocs(q);


    ordersDiv.innerHTML="";


    if(snapshot.empty){

      ordersDiv.innerHTML=`

        <div class="empty">

          <div class="empty-icon">📦</div>

          <h3>No Orders Yet</h3>

          <p>Your orders will appear here.</p>

          <button
            class="shop-btn"
            onclick="location.href='products.html'">
            Start Shopping
          </button>

        </div>

      `;

      return;
    }


    let orders=[];


    snapshot.forEach((orderDoc)=>{

      orders.push({
        id:orderDoc.id,
        data:orderDoc.data()
      });

    });


    orders.sort((a,b)=>{

      const aTime =
      a.data.createdAt?.seconds || 0;

      const bTime =
      b.data.createdAt?.seconds || 0;

      return bTime-aTime;

    });


    orders.forEach((item)=>{

      const order =
      item.data;

      const id =
      item.id;

      const status =
      order.status || "Pending";

      const productName =
      order.productName || "Product";

      const image =
      order.productImage ||
      "https://via.placeholder.com/200";

      const price =
      Number(order.price || 0);

      const quantity =
      Number(order.quantity || 1);

      const total =
      Number(
        order.total ||
        price * quantity
      );

      const statusClass =
      status.toLowerCase();

      const step =
      getStep(status);


      ordersDiv.innerHTML += `

        <div class="order-card">

          <div class="order-top">

            <div>

              <div class="order-id">
                Order ID:
                <b>#${id.substring(0,8)}</b>
              </div>

              <div class="order-date">
                Your SayonMart order
              </div>

            </div>

            <div class="status ${statusClass}">
              ${status}
            </div>

          </div>


          <div class="product">

            <img
              src="${image}"
              onerror="
              this.src='https://via.placeholder.com/200'
              "
            >

            <div class="product-info">

              <h3>
                ${productName}
              </h3>

              <p>
                Quantity: ${quantity}
              </p>

              <p class="price">
                ₹${price}
              </p>

            </div>

          </div>


          ${
            status === "Cancelled"

            ?

            `

            <div class="tracking">

              <div class="track-title">
                ❌ Order Cancelled
              </div>

            </div>

            `

            :

            `

            <div class="tracking">

              <div class="track-title">
                🚚 Order Tracking
              </div>


              <div class="steps">

                <div class="step ${
                  step >= 1 ? "done" : ""
                }">

                  <div class="circle">
                    ${step >= 1 ? "✓" : "1"}
                  </div>

                  <p>
                    Pending
                  </p>

                </div>


                <div class="step ${
                  step >= 2 ? "done" : ""
                }">

                  <div class="circle">
                    ${step >= 2 ? "✓" : "2"}
                  </div>

                  <p>
                    Confirmed
                  </p>

                </div>


                <div class="step ${
                  step >= 3 ? "done" : ""
                }">

                  <div class="circle">
                    ${step >= 3 ? "✓" : "3"}
                  </div>

                  <p>
                    Shipped
                  </p>

                </div>


                <div class="step ${
                  step >= 4 ? "done" : ""
                }">

                  <div class="circle">
                    ${step >= 4 ? "✓" : "4"}
                  </div>

                  <p>
                    Delivered
                  </p>

                </div>

              </div>

            </div>

            `
          }


          <div class="order-bottom">

            <div>

              <div class="total-label">
                Total Amount
              </div>

              <div class="total">
                ₹${total}
              </div>

            </div>


            <button
              class="details-btn"
              data-id="${id}"
              data-product="${productName}"
              data-customer="${order.name || "N/A"}"
              data-phone="${order.phone || "N/A"}"
              data-address="${order.address || "N/A"}"
              data-status="${status}"
              data-total="${total}"
              onclick="showDetails(this)">

              👁️ View Details

            </button>

          </div>

        </div>

      `;

    });


  }

  catch(error){

    console.error(error);

    ordersDiv.innerHTML=`

      <div class="empty">

        <div class="empty-icon">⚠️</div>

        <h3>Orders Load Failed</h3>

        <p>${error.message}</p>

      </div>

    `;

  }

}


/* TRACKING */

function getStep(status){

  if(status==="Pending"){
    return 1;
  }

  if(status==="Confirmed"){
    return 2;
  }

  if(status==="Shipped"){
    return 3;
  }

  if(status==="Delivered"){
    return 4;
  }

  return 0;

}


/* DETAILS */

window.showDetails =
function(button){

  const id =
  button.dataset.id;

  const product =
  button.dataset.product;

  const customer =
  button.dataset.customer;

  const phone =
  button.dataset.phone;

  const address =
  button.dataset.address;

  const status =
  button.dataset.status;

  const total =
  button.dataset.total;


  alert(

`📦 ORDER DETAILS

Order ID:
${id}

📦 Product:
${product}

👤 Customer:
${customer}

📞 Phone:
${phone}

📍 Address:
${address}

📦 Status:
${status}

💰 Total:
₹${total}`

  );

};

</script>

</body>
</html>
