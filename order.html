<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart - My Orders</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f7f9;
  color:#171717;
  font-family:Arial,sans-serif;
  padding-bottom:82px;
}

/* HEADER */

.header{
  height:72px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:100;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-box{
  width:48px;
  height:48px;
  background:#ffd21f;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#e0a800;
}

.header-icons{
  display:flex;
  gap:18px;
  font-size:25px;
}

/* MAIN */

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:15px;
}

/* PAGE HEADER */

.page-head{
  background:linear-gradient(135deg,#fff8d9,#fff);
  border-radius:22px;
  padding:20px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.page-icon{
  width:58px;
  height:58px;
  background:#ffe98b;
  border-radius:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
}

.page-head h1{
  margin:0;
  font-size:27px;
}

.page-head p{
  margin:5px 0 0;
  color:#777;
  font-size:13px;
}

/* FILTER */

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 2px 10px;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  border:0;
  background:#fff;
  border-radius:22px;
  padding:11px 15px;
  white-space:nowrap;
  font-weight:bold;
  font-size:13px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.filter.active{
  background:#ffd21f;
  color:#111;
}

/* ORDER CARD */

.order-card{
  background:#fff;
  border-radius:22px;
  padding:16px;
  margin-bottom:17px;
  border:1px solid #ededed;
  box-shadow:0 5px 18px rgba(0,0,0,.07);
}

/* TOP */

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.order-id{
  color:#555;
  font-size:13px;
}

.order-id strong{
  color:#d39c00;
  font-size:15px;
}

.order-sub{
  color:#999;
  font-size:11px;
  margin-top:5px;
}

/* STATUS */

.status{
  padding:8px 13px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

.pending{
  background:#fff1bd;
  color:#987300;
}

.confirmed{
  background:#ddf8e8;
  color:#139354;
}

.shipped{
  background:#dcefff;
  color:#1977bd;
}

.delivered{
  background:#d9f7e5;
  color:#119553;
}

.cancelled{
  background:#ffe0e0;
  color:#d33;
}

/* PRODUCT */

.product{
  margin-top:16px;
  padding:11px;
  background:#fafafa;
  border-radius:17px;
  display:flex;
  align-items:center;
  gap:14px;
}

.product img{
  width:92px;
  height:92px;
  object-fit:cover;
  border-radius:15px;
  background:#eee;
}

.product-info{
  flex:1;
  min-width:0;
}

.product-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:7px;
}

.quantity{
  color:#777;
  font-size:13px;
  margin-bottom:6px;
}

.price{
  color:#d49b00;
  font-size:20px;
  font-weight:bold;
}

/* TRACKING */

.tracking{
  margin-top:18px;
  padding-top:17px;
  border-top:1px solid #eee;
}

.track-title{
  text-align:center;
  font-size:17px;
  font-weight:bold;
  margin-bottom:19px;
}

.steps{
  display:flex;
  position:relative;
  justify-content:space-between;
}

.steps:before{
  content:"";
  position:absolute;
  top:15px;
  left:10%;
  right:10%;
  height:3px;
  background:#ddd;
}

.step{
  width:25%;
  text-align:center;
  position:relative;
  z-index:2;
}

.circle{
  width:31px;
  height:31px;
  margin:auto;
  border-radius:50%;
  background:#eee;
  color:#999;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:14px;
  font-weight:bold;
}

.step.done .circle{
  background:#22c77a;
  color:#fff;
  box-shadow:0 3px 9px rgba(34,199,122,.25);
}

.step p{
  margin:8px 0 0;
  color:#888;
  font-size:10px;
}

.step.done p{
  color:#222;
  font-weight:bold;
}

/* BOTTOM AREA */

.order-bottom{
  border-top:1px solid #eee;
  margin-top:17px;
  padding-top:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.amount-label{
  color:#777;
  font-size:12px;
}

.total{
  margin-top:3px;
  font-size:22px;
  font-weight:bold;
}

/* DETAILS BUTTON */

.details-btn{
  background:#fff;
  border:1.5px solid #222;
  border-radius:12px;
  padding:12px 17px;
  font-size:13px;
  font-weight:bold;
}

.details-btn:active{
  transform:scale(.96);
}

/* CANCEL */

.cancel-btn{
  background:#ffd21f;
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font-weight:bold;
}

/* CANCELLED */

.cancelled-box{
  margin-top:18px;
  padding:15px;
  border-radius:13px;
  background:#fff0f0;
  color:#d33;
  text-align:center;
  font-weight:bold;
}

/* EMPTY */

.empty{
  background:#fff;
  border-radius:20px;
  text-align:center;
  padding:65px 20px;
  color:#777;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.empty-icon{
  font-size:52px;
  margin-bottom:12px;
}

.shop-btn{
  margin-top:12px;
  padding:13px 25px;
  border:0;
  border-radius:12px;
  background:#ffd21f;
  font-weight:bold;
}

/* LOADING */

.loading{
  text-align:center;
  padding:55px;
  color:#c29200;
  font-weight:bold;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:#fff;
  border-top:1px solid #e5e5e5;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:200;
  box-shadow:0 -3px 15px rgba(0,0,0,.06);
}

.bottom a{
  text-decoration:none;
  color:#888;
  text-align:center;
  font-size:11px;
  min-width:55px;
}

.bottom a div{
  font-size:22px;
  margin-bottom:4px;
}

.bottom a.active{
  color:#d49b00;
  font-weight:bold;
}

@media(max-width:380px){

  .container{
    padding:12px;
  }

  .page-head h1{
    font-size:24px;
  }

  .product img{
    width:82px;
    height:82px;
  }

  .product-name{
    font-size:16px;
  }

  .order-bottom{
    flex-wrap:wrap;
  }

  .details-btn,
  .cancel-btn{
    flex:1;
  }

}

</style>
</head>


<body>

<!-- HEADER -->

<header class="header">

  <div class="logo-area">

    <div class="logo-box">
      🛍️
    </div>

    <div class="logo">
      <span>Sayon</span>Mart
    </div>

  </div>

  <div class="header-icons">
    🔍
    🔔
  </div>

</header>


<!-- MAIN -->

<div class="container">

  <!-- PAGE TITLE -->

  <div class="page-head">

    <div class="page-icon">
      📦
    </div>

    <div>
      <h1>My Orders</h1>
      <p>Track your orders and stay updated</p>
    </div>

  </div>


  <!-- FILTER -->

  <div class="filters">

    <button class="filter active">
      ▦ All Orders
    </button>

    <button class="filter">
      ◷ Pending
    </button>

    <button class="filter">
      ✓ Confirmed
    </button>

    <button class="filter">
      🚚 Shipped
    </button>

    <button class="filter">
      ✓ Delivered
    </button>

  </div>


  <!-- ORDERS -->

  <div id="orders" class="loading">
    Loading Orders...
  </div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <a href="index.html">
    <div>⌂</div>
    Home
  </a>

  <a href="products.html">
    <div>▦</div>
    Products
  </a>

  <a href="cart.html">
    <div>🛒</div>
    Cart
  </a>

  <a href="order.html" class="active">
    <div>📦</div>
    Orders
  </a>

  <a href="profile.html">
    <div>♙</div>
    Profile
  </a>

</nav>


<script type="module">

import { db, auth } from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const ordersDiv =
document.getElementById("orders");


/* LOGIN CHECK */

onAuthStateChanged(auth, async (user)=>{

  if(!user){

    ordersDiv.innerHTML=`

      <div class="empty">

        <div class="empty-icon">
          🔒
        </div>

        <h3>Please Login First</h3>

        <p>Login to see your orders.</p>

        <button
          class="shop-btn"
          onclick="location.href='login.html'">

          Login

        </button>

      </div>

    `;

    return;
  }

  loadOrders(user.uid);

});


/* LOAD ORDERS */

async function loadOrders(uid){

  try{

    const q = query(
      collection(db,"orders"),
      where("userId","==",uid)
    );


    const snapshot =
    await getDocs(q);


    ordersDiv.innerHTML="";


    if(snapshot.empty){

      ordersDiv.innerHTML=`

        <div class="empty">

          <div class="empty-icon">
            📦
          </div>

          <h3>No Orders Yet</h3>

          <p>Your orders will appear here.</p>

          <button
            class="shop-btn"
            onclick="location.href='products.html'">

            Start Shopping

          </button>

        </div>

      `;

      return;
    }


    let orders=[];


    snapshot.forEach((orderDoc)=>{

      orders.push({
        id:orderDoc.id,
        data:orderDoc.data()
      });

    });


    /* NEWEST FIRST */

    orders.sort((a,b)=>{

      const aTime =
      a.data.createdAt?.seconds || 0;

      const bTime =
      b.data.createdAt?.seconds || 0;

      return bTime-aTime;

    });


    /* DISPLAY */

    orders.forEach((item)=>{

      const order =
      item.data;

      const id =
      item.id;

      const status =
      order.status || "Pending";

      const productName =
      order.productName || "Product";

      const image =
      order.productImage ||
      "https://via.placeholder.com/200";

      const price =
      Number(order.price || 0);

      const quantity =
      Number(order.quantity || 1);

      const total =
      Number(
        order.total ||
        price * quantity
      );

      const statusClass =
      status.toLowerCase();

      const step =
      getStep(status);


      ordersDiv.innerHTML += `

        <div class="order-card">

          <!-- TOP -->

          <div class="order-top">

            <div>

              <div class="order-id">

                Order ID:
                <strong>
                  #${id.substring(0,8)}
                </strong>

              </div>

              <div class="order-sub">
                Your SayonMart order
              </div>

            </div>


            <div class="status ${statusClass}">
              ${status}
            </div>

          </div>


          <!-- PRODUCT -->

          <div class="product">

            <img
              src="${image}"
              onerror="
              this.src='https://via.placeholder.com/200'
              "
            >

            <div class="product-info">

              <div class="product-name">
                ${productName}
              </div>

              <div class="quantity">
                Quantity: ${quantity}
              </div>

              <div class="price">
                ₹${price}
              </div>

            </div>

          </div>


          <!-- TRACKING -->

          ${
            status === "Cancelled"

            ?

            `

            <div class="cancelled-box">
              ❌ This order was cancelled
            </div>

            `

            :

            `

            <div class="tracking">

              <div class="track-title">
                🚚 Order Tracking
              </div>


              <div class="steps">

                <!-- PENDING -->

                <div class="step ${
                  step >= 1 ? "done" : ""
                }">

                  <div class="circle">

                    ${
                      step >= 1
                      ? "✓"
                      : "1"
                    }

                  </div>

                  <p>
                    Pending
                  </p>

                </div>


                <!-- CONFIRMED -->

                <div class="step ${
                  step >= 2 ? "done" : ""
                }">

                  <div class="circle">

                    ${
                      step >= 2
                      ? "✓"
                      : "2"
                    }

                  </div>

                  <p>
                    Confirmed
                  </p>

                </div>


                <!-- SHIPPED -->

                <div class="step ${
                  step >= 3 ? "done" : ""
                }">

                  <div class="circle">

                    ${
                      step >= 3
                      ? "✓"
                      : "3"
                    }

                  </div>

                  <p>
                    Shipped
                  </p>

                </div>


                <!-- DELIVERED -->

                <div class="step ${
                  step >= 4 ? "done" : ""
                }">

                  <div class="circle">

                    ${
                      step >= 4
                      ? "✓"
                      : "4"
                    }

                  </div>

                  <p>
                    Delivered
                  </p>

                </div>

              </div>

            </div>

            `

          }


          <!-- BOTTOM -->

          <div class="order-bottom">

            <div>

              <div class="amount-label">
                Total Amount
              </div>

              <div class="total">
                ₹${total}
              </div>

            </div>


            <button
              class="details-btn"

              data-id="${id}"

              data-product="${productName}"

              data-customer="${order.name || "N/A"}"

              data-phone="${order.phone || "N/A"}"

              data-address="${order.address || "N/A"}"

              data-status="${status}"

              data-total="${total}"

              onclick="showDetails(this)"
            >

              👁️ View Details

            </button>


            ${
              status === "Pending"

              ?

              `

              <button
                class="cancel-btn"
                onclick="cancelMessage()">

                ✕ Cancel

              </button>

              `

              :

              ""

            }

          </div>

        </div>

      `;

    });


  }

  catch(error){

    console.error(error);

    ordersDiv.innerHTML=`

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>Orders Load Failed</h3>

        <p>${error.message}</p>

      </div>

    `;

  }

}


/* TRACKING STEP */

function getStep(status){

  if(status==="Pending"){
    return 1;
  }

  if(status==="Confirmed"){
    return 2;
  }

  if(status==="Shipped"){
    return 3;
  }

  if(status==="Delivered"){
    return 4;
  }

  return 0;

}


/* VIEW DETAILS */

window.showDetails =
function(button){

  const id =
  button.dataset.id;

  const product =
  button.dataset.product;

  const customer =
  button.dataset.customer;

  const phone =
  button.dataset.phone;

  const address =
  button.dataset.address;

  const status =
  button.dataset.status;

  const total =
  button.dataset.total;


  alert(

`📦 ORDER DETAILS

Order ID:
${id}

📦 Product:
${product}

👤 Customer:
${customer}

📞 Phone:
${phone}

📍 Address:
${address}

📦 Status:
${status}

💰 Total:
₹${total}`

  );

};


/* CANCEL BUTTON */

window.cancelMessage =
function(){

  alert(
    "Order cancel করার system এখনো চালু করা হয়নি।"
  );

};

</script>

</body>
</html>
