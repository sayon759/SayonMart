<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart - My Orders</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

.header{
  background:#000;
  color:#FFD700;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #333;
}

.container{
  padding:15px;
}

.order-card{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:16px;
  padding:15px;
  margin-bottom:18px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.order-id{
  color:#FFD700;
  font-size:13px;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#4b3b00;
  color:#FFD700;
}

.confirmed{
  background:#063d25;
  color:#4cff9b;
}

.shipped{
  background:#073b55;
  color:#4dcfff;
}

.delivered{
  background:#183d08;
  color:#7dff4d;
}

.cancelled{
  background:#4a1111;
  color:#ff7070;
}

.product{
  display:flex;
  gap:12px;
  margin-top:14px;
  background:#111;
  padding:10px;
  border-radius:12px;
}

.product img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
}

.product h3{
  margin:5px 0;
  font-size:16px;
}

.product p{
  margin:5px 0;
  color:#bbb;
  font-size:13px;
}

.total{
  color:#FFD700;
  font-size:18px;
  font-weight:bold;
}

/* Tracking */

.tracking{
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid #333;
}

.track-title{
  color:#FFD700;
  font-weight:bold;
  margin-bottom:18px;
}

.steps{
  display:flex;
  justify-content:space-between;
  position:relative;
}

.steps:before{
  content:"";
  position:absolute;
  top:15px;
  left:10%;
  right:10%;
  height:3px;
  background:#444;
  z-index:0;
}

.step{
  text-align:center;
  width:25%;
  position:relative;
  z-index:1;
}

.circle{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#333;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

.step.active .circle{
  background:#FFD700;
  color:#000;
}

.step.done .circle{
  background:#4cff9b;
  color:#000;
}

.step p{
  font-size:10px;
  color:#aaa;
  margin-top:7px;
}

.step.active p,
.step.done p{
  color:#fff;
}

.details-btn{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#333;
  color:#fff;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:50px 10px;
}

.loading{
  text-align:center;
  color:#FFD700;
  padding:40px;
}

/* Bottom navigation */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#000;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.bottom a{
  text-decoration:none;
  color:#888;
  text-align:center;
  font-size:11px;
}

.bottom a div{
  font-size:21px;
  margin-bottom:3px;
}

.bottom a.active{
  color:#FFD700;
}

</style>
</head>


<body>

<div class="header">
📦 My Orders
</div>


<div class="container">

<div id="orders" class="loading">
Loading Orders...
</div>

</div>


<nav class="bottom">

<a href="index.html">
<div>⌂</div>
Home
</a>

<a href="products.html">
<div>▦</div>
Products
</a>

<a href="cart.html">
<div>🛒</div>
Cart
</a>

<a href="order.html" class="active">
<div>📦</div>
Orders
</a>

<a href="profile.html">
<div>♙</div>
Profile
</a>

</nav>


<script type="module">

import { db, auth } from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const ordersDiv =
document.getElementById("orders");


onAuthStateChanged(auth, async (user)=>{

  if(!user){

    ordersDiv.innerHTML=`
      <div class="empty">
        🔒 Please Login First
        <br><br>
        <button
          onclick="location.href='login.html'"
          style="
          padding:12px 25px;
          background:#FFD700;
          border:0;
          border-radius:10px;
          font-weight:bold;
          ">
          Login
        </button>
      </div>
    `;

    return;
  }


  loadOrders(user.uid);

});


async function loadOrders(uid){

  try{

    /*
      Only user's own orders
    */

    const q = query(
      collection(db,"orders"),
      where("userId","==",uid)
    );


    const snapshot =
    await getDocs(q);


    ordersDiv.innerHTML="";


    if(snapshot.empty){

      ordersDiv.innerHTML=`
        <div class="empty">
          📭 No Orders Yet
          <br><br>
          <button
            onclick="location.href='products.html'"
            style="
            padding:12px 25px;
            background:#FFD700;
            border:0;
            border-radius:10px;
            font-weight:bold;
            ">
            Start Shopping
          </button>
        </div>
      `;

      return;
    }


    let orders=[];


    snapshot.forEach((orderDoc)=>{

      orders.push({
        id:orderDoc.id,
        data:orderDoc.data()
      });

    });


    /*
      Newest orders first
    */

    orders.sort((a,b)=>{

      const aTime =
      a.data.createdAt?.seconds || 0;

      const bTime =
      b.data.createdAt?.seconds || 0;

      return bTime-aTime;

    });


    orders.forEach((item)=>{

      const order =
      item.data;

      const id =
      item.id;


      const status =
      order.status || "Pending";


      const productName =
      order.productName || "Product";


      const image =
      order.productImage ||
      "https://via.placeholder.com/100";


      const price =
      Number(order.price || 0);


      const quantity =
      Number(order.quantity || 1);


      const total =
      Number(
        order.total ||
        price * quantity
      );


      const statusClass =
      status.toLowerCase();


      ordersDiv.innerHTML += `

      <div class="order-card">

        <div class="order-top">

          <div class="order-id">
            Order #${id.substring(0,8)}
          </div>

          <div class="status ${statusClass}">
            ${status}
          </div>

        </div>


        <div class="product">

          <img
            src="${image}"
            onerror="
            this.src='https://via.placeholder.com/100'
            "
          >

          <div>

            <h3>
              ${productName}
            </h3>

            <p>
              💰 ₹${price}
            </p>

            <p>
              🔢 Quantity: ${quantity}
            </p>

          </div>

        </div>


        <p class="total">
          Total: ₹${total}
        </p>


        ${
          status === "Cancelled"
          ?

          `
          <div class="tracking">

            <div class="track-title">
              ❌ Order Cancelled
            </div>

          </div>
          `

          :

          `

          <div class="tracking">

            <div class="track-title">
              🚚 Order Tracking
            </div>


            <div class="steps">

              <div class="step ${
                getStep(status)>=1
                ? "done"
                : ""
              }">

                <div class="circle">
                  ✓
                </div>

                <p>
                  Pending
                </p>

              </div>


              <div class="step ${
                getStep(status)>=2
                ? "done"
                : ""
              }">

                <div class="circle">
                  ✓
                </div>

                <p>
                  Confirmed
                </p>

              </div>


              <div class="step ${
                getStep(status)>=3
                ? "done"
                : ""
              }">

                <div class="circle">
                  ✓
                </div>

                <p>
                  Shipped
                </p>

              </div>


              <div class="step ${
                getStep(status)>=4
                ? "done"
                : ""
              }">

                <div class="circle">
                  ✓
                </div>

                <p>
                  Delivered
                </p>

              </div>

            </div>

          </div>

          `

        }


        <button
          class="details-btn"
          onclick="showDetails(
            '${id}',
            '${productName}',
            '${order.name || "N/A"}',
            '${order.phone || "N/A"}',
            '${order.address || "N/A"}',
            '${status}',
            '${total}'
          )"
        >
          👁️ View Order Details
        </button>


      </div>

      `;

    });


  }catch(error){

    console.error(error);

    ordersDiv.innerHTML=`

      <div class="empty">

        ❌ Orders Load Failed

        <br><br>

        ${error.message}

      </div>

    `;

  }

}


/* Tracking step */

function getStep(status){

  if(status==="Pending"){
    return 1;
  }

  if(status==="Confirmed"){
    return 2;
  }

  if(status==="Shipped"){
    return 3;
  }

  if(status==="Delivered"){
    return 4;
  }

  return 0;

}


/* Details */

window.showDetails =
function(
  id,
  product,
  customer,
  phone,
  address,
  status,
  total
){

alert(

`📦 ORDER DETAILS

Order ID:
${id}

📦 Product:
${product}

👤 Customer:
${customer}

📞 Phone:
${phone}

📍 Address:
${address}

📦 Status:
${status}

💰 Total:
₹${total}`

);

};

</script>

</body>
</html>
