<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart - My Orders</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f6f8;
  color:#151515;
  font-family:Arial,sans-serif;
  padding-bottom:85px;
}

/* HEADER */
.header{
  height:68px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:100;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:9px;
}

.logo-box{
  width:43px;
  height:43px;
  border-radius:13px;
  background:#ffd21f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#d99f00;
}

.header-icons{
  display:flex;
  align-items:center;
  gap:16px;
  font-size:22px;
}

.header-icon{
  cursor:pointer;
}

/* CONTAINER */
.container{
  max-width:700px;
  margin:auto;
  padding:14px;
}

/* HERO */
.page-head{
  background:#fff;
  border-radius:22px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
  border:1px solid #eee;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.page-icon{
  width:55px;
  height:55px;
  flex-shrink:0;
  border-radius:17px;
  background:#fff3c2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.page-head h1{
  margin:0;
  font-size:25px;
}

.page-head p{
  margin:5px 0 0;
  color:#777;
  font-size:12px;
}

/* FILTERS */
.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 1px 14px;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  border:1px solid #e8e8e8;
  background:#fff;
  border-radius:20px;
  padding:10px 14px;
  white-space:nowrap;
  font-size:12px;
  font-weight:bold;
  color:#555;
}

.filter.active{
  background:#ffd21f;
  border-color:#ffd21f;
  color:#111;
}

/* ORDER CARD */
.order-card{
  background:#fff;
  border:1px solid #e9e9e9;
  border-radius:20px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}

/* ORDER TOP */
.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.order-id{
  font-size:11px;
  color:#888;
}

.order-id strong{
  color:#b77f00;
  font-size:14px;
}

.order-sub{
  color:#aaa;
  font-size:10px;
  margin-top:4px;
}

/* STATUS */
.status{
  padding:7px 11px;
  border-radius:18px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}

.pending{
  background:#fff4c9;
  color:#9a7400;
}

.confirmed{
  background:#e1f8eb;
  color:#12894e;
}

.shipped{
  background:#e2f2ff;
  color:#1672b5;
}

.delivered{
  background:#dff8e9;
  color:#10874b;
}

.cancelled{
  background:#ffe4e4;
  color:#d32f2f;
}

/* PRODUCT */
.product{
  margin-top:13px;
  background:#f8f8f8;
  border-radius:16px;
  padding:10px;
  display:flex;
  gap:12px;
  align-items:center;
}

.product img{
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:13px;
  background:#eee;
  flex-shrink:0;
}

.product-info{
  min-width:0;
  flex:1;
}

.product-name{
  font-size:16px;
  font-weight:bold;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.quantity{
  font-size:11px;
  color:#777;
  margin-bottom:5px;
}

.price{
  color:#c68d00;
  font-size:18px;
  font-weight:bold;
}

/* TRACKING */
.tracking{
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid #eee;
}

.track-title{
  font-size:13px;
  font-weight:bold;
  margin-bottom:15px;
}

.steps{
  display:flex;
  justify-content:space-between;
  position:relative;
}

.steps:before{
  content:"";
  position:absolute;
  top:13px;
  left:12%;
  right:12%;
  height:3px;
  background:#ddd;
}

.step{
  width:25%;
  text-align:center;
  position:relative;
  z-index:2;
}

.circle{
  width:27px;
  height:27px;
  margin:auto;
  border-radius:50%;
  background:#e9e9e9;
  color:#999;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold;
}

.step.done .circle{
  background:#22bf76;
  color:#fff;
}

.step p{
  margin:6px 0 0;
  font-size:9px;
  color:#999;
}

.step.done p{
  color:#222;
  font-weight:bold;
}

/* BOTTOM */
.order-bottom{
  margin-top:14px;
  padding-top:13px;
  border-top:1px solid #eee;
}

.bottom-info{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
}

.amount-label{
  font-size:10px;
  color:#888;
}

.total{
  margin-top:3px;
  font-size:21px;
  font-weight:800;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:11px;
}

.details-btn,
.cancel-btn{
  flex:1;
  height:42px;
  border-radius:11px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.details-btn{
  background:#fff;
  border:1px solid #222;
  color:#222;
}

.cancel-btn{
  background:#ffd21f;
  border:1px solid #ffd21f;
}

/* CANCELLED */
.cancelled-box{
  margin-top:15px;
  padding:12px;
  border-radius:11px;
  background:#fff0f0;
  color:#d32f2f;
  text-align:center;
  font-size:12px;
  font-weight:bold;
}

/* EMPTY */
.empty{
  background:#fff;
  border-radius:20px;
  padding:55px 20px;
  text-align:center;
  border:1px solid #eee;
}

.empty-icon{
  font-size:48px;
}

.empty h3{
  margin:12px 0 5px;
}

.empty p{
  color:#777;
  font-size:13px;
}

.shop-btn{
  margin-top:10px;
  padding:12px 22px;
  border:0;
  border-radius:11px;
  background:#ffd21f;
  font-weight:bold;
}

/* LOADING */
.loading{
  text-align:center;
  padding:55px 10px;
  color:#c08b00;
  font-weight:bold;
}

/* POPUP */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:500;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:700px;
  background:#fff;
  border-radius:25px 25px 0 0;
  padding:20px;
  animation:up .2s ease;
}

@keyframes up{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.modal-head h2{
  margin:0;
  font-size:20px;
}

.close-btn{
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:#f1f1f1;
  font-size:18px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:11px 0;
  border-bottom:1px solid #eee;
  font-size:13px;
}

.detail-row span:first-child{
  color:#777;
}

.detail-row span:last-child{
  font-weight:bold;
  text-align:right;
  max-width:65%;
  word-break:break-word;
}

/* BOTTOM NAV */
.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:#fff;
  border-top:1px solid #e5e5e5;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:200;
  box-shadow:0 -3px 15px rgba(0,0,0,.06);
}

.bottom a{
  text-decoration:none;
  color:#888;
  text-align:center;
  font-size:10px;
  min-width:55px;
}

.bottom a div{
  font-size:21px;
  margin-bottom:4px;
}

.bottom a.active{
  color:#c28a00;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:380px){

  .container{
    padding:11px;
  }

  .page-head h1{
    font-size:22px;
  }

  .product img{
    width:74px;
    height:74px;
  }

  .product-name{
    font-size:14px;
  }

  .buttons{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="logo-area">

    <div class="logo-box">🛍️</div>

    <div class="logo">
      <span>Sayon</span>Mart
    </div>

  </div>

  <div class="header-icons">

    <span class="header-icon"
      onclick="location.href='notifications.html'">
      🔔
    </span>

  </div>

</header>


<div class="container">

  <!-- PAGE HEADER -->
  <div class="page-head">

    <div class="page-icon">📦</div>

    <div>
      <h1>My Orders</h1>
      <p>Track your orders and stay updated</p>
    </div>

  </div>


  <!-- FILTERS -->
  <div class="filters">

    <button class="filter active"
      data-filter="All"
      onclick="filterOrders('All',this)">
      ▦ All Orders
    </button>

    <button class="filter"
      data-filter="Pending"
      onclick="filterOrders('Pending',this)">
      ◷ Pending
    </button>

    <button class="filter"
      data-filter="Confirmed"
      onclick="filterOrders('Confirmed',this)">
      ✓ Confirmed
    </button>

    <button class="filter"
      data-filter="Shipped"
      onclick="filterOrders('Shipped',this)">
      🚚 Shipped
    </button>

    <button class="filter"
      data-filter="Delivered"
      onclick="filterOrders('Delivered',this)">
      ✓ Delivered
    </button>

  </div>


  <!-- ORDERS -->
  <div id="orders" class="loading">
    Loading Orders...
  </div>

</div>


<!-- DETAILS MODAL -->
<div id="detailModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>📦 Order Details</h2>

      <button
        class="close-btn"
        onclick="closeDetails()">
        ✕
      </button>

    </div>

    <div id="detailContent"></div>

  </div>

</div>


<!-- BOTTOM NAV -->
<nav class="bottom">

  <a href="index.html">
    <div>⌂</div>
    Home
  </a>

  <a href="products.html">
    <div>▦</div>
    Products
  </a>

  <a href="cart.html">
    <div>🛒</div>
    Cart
  </a>

  <a href="order.html" class="active">
    <div>📦</div>
    Orders
  </a>

  <a href="profile.html">
    <div>♙</div>
    Profile
  </a>

</nav>


<script type="module">

import { db, auth } from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const ordersDiv =
document.getElementById("orders");

let allOrders = [];


/* LOGIN CHECK */

onAuthStateChanged(auth, async (user)=>{

  if(!user){

    ordersDiv.innerHTML = `

      <div class="empty">

        <div class="empty-icon">🔒</div>

        <h3>Please Login First</h3>

        <p>Login to see your orders.</p>

        <button
          class="shop-btn"
          onclick="location.href='login.html'">
          Login
        </button>

      </div>

    `;

    return;
  }

  loadOrders(user.uid);

});


/* LOAD ORDERS */

async function loadOrders(uid){

  try{

    const q = query(
      collection(db,"orders"),
      where("userId","==",uid)
    );

    const snapshot =
      await getDocs(q);

    allOrders = [];

    snapshot.forEach((doc)=>{

      allOrders.push({
        id:doc.id,
        data:doc.data()
      });

    });


    allOrders.sort((a,b)=>{

      const aTime =
        a.data.createdAt?.seconds || 0;

      const bTime =
        b.data.createdAt?.seconds || 0;

      return bTime-aTime;

    });


    renderOrders(allOrders);

  }

  catch(error){

    console.error(error);

    ordersDiv.innerHTML = `

      <div class="empty">

        <div class="empty-icon">⚠️</div>

        <h3>Orders Load Failed</h3>

        <p>${error.message}</p>

      </div>

    `;

  }

}


/* RENDER */

function renderOrders(orders){

  ordersDiv.innerHTML = "";

  if(orders.length === 0){

    ordersDiv.innerHTML = `

      <div class="empty">

        <div class="empty-icon">📦</div>

        <h3>No Orders Yet</h3>

        <p>Your orders will appear here.</p>

        <button
          class="shop-btn"
          onclick="location.href='products.html'">
          Start Shopping
        </button>

      </div>

    `;

    return;
  }


  orders.forEach((item)=>{

    const order = item.data;
    const id = item.id;

    const status =
      order.status || "Pending";

    const productName =
      order.productName || "Product";

    const image =
      order.productImage ||
      "https://via.placeholder.com/200";

    const price =
      Number(order.price) || 0;

    const quantity =
      Number(order.quantity) || 1;


    /* CORRECT TOTAL */

    const subtotal =
      Number(order.subtotal) ||
      (price * quantity);

    const delivery =
      Number(order.delivery) || 0;

    const total =
      subtotal + delivery;


    const step =
      getStep(status);


    ordersDiv.innerHTML += `

      <div class="order-card"
        data-status="${status}">

        <div class="order-top">

          <div>

            <div class="order-id">
              Order ID:
              <strong>#${id.substring(0,8)}</strong>
            </div>

            <div class="order-sub">
              SayonMart order
            </div>

          </div>

          <div class="status ${status.toLowerCase()}">
            ${status}
          </div>

        </div>


        <div class="product">

          <img
            src="${image}"
            onerror="this.src='https://via.placeholder.com/200'"
          >

          <div class="product-info">

            <div class="product-name">
              ${productName}
            </div>

            <div class="quantity">
              Quantity: ${quantity}
            </div>

            <div class="price">
              ₹${price}
            </div>

          </div>

        </div>


        ${
          status === "Cancelled"

          ?

          `
          <div class="cancelled-box">
            ❌ This order was cancelled
          </div>
          `

          :

          `
          <div class="tracking">

            <div class="track-title">
              🚚 Order Tracking
            </div>

            <div class="steps">

              <div class="step ${step>=1?"done":""}">

                <div class="circle">
                  ${step>=1?"✓":"1"}
                </div>

                <p>Pending</p>

              </div>


              <div class="step ${step>=2?"done":""}">

                <div class="circle">
                  ${step>=2?"✓":"2"}
                </div>

                <p>Confirmed</p>

              </div>


              <div class="step ${step>=3?"done":""}">

                <div class="circle">
                  ${step>=3?"✓":"3"}
                </div>

                <p>Shipped</p>

              </div>


              <div class="step ${step>=4?"done":""}">

                <div class="circle">
                  ${step>=4?"✓":"4"}
                </div>

                <p>Delivered</p>

              </div>

            </div>

          </div>
          `
        }


        <div class="order-bottom">

          <div class="bottom-info">

            <div>

              <div class="amount-label">
                Total Amount
              </div>

              <div class="total">
                ₹${total}
              </div>

            </div>

            <div class="amount-label">
              ${
                order.paymentMethod ||
                "Payment"
              }
            </div>

          </div>


          <div class="buttons">

            <button
              class="details-btn"
              onclick='showDetails(${JSON.stringify({
                id:id,
                product:productName,
                customer:order.name || "N/A",
                phone:order.phone || "N/A",
                address:order.address || "N/A",
                status:status,
                subtotal:subtotal,
                delivery:delivery,
                total:total
              })})'>
              👁️ View Details
            </button>


            ${
              status === "Pending"

              ?

              `
              <button
                class="cancel-btn"
                onclick="cancelMessage()">
                ✕ Cancel
              </button>
              `

              :

              ""
            }

          </div>

        </div>

      </div>

    `;

  });

}


/* FILTER */

window.filterOrders =
function(status,button){

  document
    .querySelectorAll(".filter")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");


  if(status === "All"){

    renderOrders(allOrders);

  }else{

    const filtered =
      allOrders.filter(item =>
        (item.data.status || "Pending") === status
      );

    renderOrders(filtered);

  }

};


/* TRACKING */

function getStep(status){

  if(status === "Pending") return 1;

  if(status === "Confirmed") return 2;

  if(status === "Shipped") return 3;

  if(status === "Delivered") return 4;

  return 0;
}


/* DETAILS */

window.showDetails =
function(data){

  document.getElementById("detailContent").innerHTML = `

    <div class="detail-row">
      <span>Order ID</span>
      <span>#${data.id}</span>
    </div>

    <div class="detail-row">
      <span>Product</span>
      <span>${data.product}</span>
    </div>

    <div class="detail-row">
      <span>Customer</span>
      <span>${data.customer}</span>
    </div>

    <div class="detail-row">
      <span>Phone</span>
      <span>${data.phone}</span>
    </div>

    <div class="detail-row">
      <span>Address</span>
      <span>${data.address}</span>
    </div>

    <div class="detail-row">
      <span>Status</span>
      <span>${data.status}</span>
    </div>

    <div class="detail-row">
      <span>Subtotal</span>
      <span>₹${data.subtotal}</span>
    </div>

    <div class="detail-row">
      <span>Delivery</span>
      <span>₹${data.delivery}</span>
    </div>

    <div class="detail-row">
      <span>Total</span>
      <span>₹${data.total}</span>
    </div>

  `;

  document
    .getElementById("detailModal")
    .classList.add("show");

};


/* CLOSE */

window.closeDetails =
function(){

  document
    .getElementById("detailModal")
    .classList.remove("show");

};


/* CANCEL */

window.cancelMessage =
function(){

  alert(
    "Order cancel করার system এখনো চালু করা হয়নি।"
  );

};


/* OUTSIDE MODAL CLOSE */

document
  .getElementById("detailModal")
  .addEventListener("click",(e)=>{

    if(e.target.id === "detailModal"){
      closeDetails();
    }

  });

</script>

</body>
</html>
