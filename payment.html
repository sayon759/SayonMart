<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SayonMart Payment</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f5f5f5;
      color:#222;
    }

    header{
      background:#111;
      color:#FFD700;
      padding:16px;
      text-align:center;
      font-size:23px;
      font-weight:bold;
    }

    .container{
      padding:15px;
      max-width:600px;
      margin:auto;
    }

    .card{
      background:white;
      border-radius:14px;
      padding:18px;
      margin-bottom:15px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    h2{
      font-size:19px;
      margin-bottom:15px;
    }

    label{
      display:block;
      margin-top:12px;
      margin-bottom:6px;
      font-weight:bold;
      font-size:14px;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:9px;
      outline:none;
      font-size:15px;
    }

    input:focus{
      border-color:#FFD700;
    }

    .address-buttons{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    button{
      border:none;
      border-radius:9px;
      padding:13px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
    }

    .save-btn{
      background:#111;
      color:#FFD700;
      width:100%;
    }

    .edit-btn{
      background:#eee;
      color:#222;
      flex:1;
    }

    .use-btn{
      background:#FFD700;
      color:#111;
      flex:1;
    }

    .address-box{
      background:#fffbea;
      border:1px solid #ffe58a;
      border-radius:10px;
      padding:12px;
      line-height:1.6;
      display:none;
    }

    .summary-row{
      display:flex;
      justify-content:space-between;
      margin:12px 0;
      font-size:15px;
    }

    .total{
      border-top:1px solid #ddd;
      padding-top:14px;
      font-size:19px;
      font-weight:bold;
    }

    .product{
      display:flex;
      gap:12px;
      padding:10px 0;
      border-bottom:1px solid #eee;
    }

    .product:last-child{
      border-bottom:none;
    }

    .product img{
      width:65px;
      height:65px;
      object-fit:cover;
      border-radius:9px;
      background:#eee;
    }

    .product-info{
      flex:1;
    }

    .product-name{
      font-weight:bold;
      margin-bottom:7px;
    }

    .payment-option{
      border:1px solid #ddd;
      border-radius:10px;
      padding:14px;
      margin:10px 0;
      cursor:pointer;
    }

    .payment-option.active{
      border:2px solid #FFD700;
      background:#fffbea;
    }

    .payment-option input{
      width:auto;
      margin-right:8px;
    }

    .upi-box{
      display:none;
      background:#f8f8f8;
      padding:15px;
      border-radius:10px;
      margin-top:10px;
    }

    .upi-id{
      background:white;
      padding:12px;
      border-radius:8px;
      text-align:center;
      font-weight:bold;
      margin:10px 0;
    }

    .pay-btn{
      width:100%;
      background:#111;
      color:#FFD700;
      margin-top:10px;
    }

    .place-btn{
      width:100%;
      background:#FFD700;
      color:#111;
      font-size:17px;
      padding:16px;
    }

    .place-btn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .note{
      font-size:13px;
      color:#666;
      margin-top:8px;
      line-height:1.5;
    }

    .error{
      color:#d00;
      background:#ffeaea;
      padding:10px;
      border-radius:8px;
      margin-bottom:12px;
      display:none;
    }

    .mode{
      background:#fffbea;
      border:1px solid #ffe58a;
      color:#7a5b00;
      padding:10px;
      border-radius:9px;
      margin-bottom:15px;
      font-size:14px;
      text-align:center;
      font-weight:bold;
    }
  </style>
</head>

<body>

<header>🛍️ SayonMart Payment</header>

<div class="container">

  <div id="errorBox" class="error"></div>

  <div id="checkoutMode" class="mode">
    🛍️ Order Checkout
  </div>

  <!-- ADDRESS -->
  <div class="card">

    <h2>📍 Delivery Address</h2>

    <div id="savedAddress" class="address-box"></div>

    <div id="addressForm">

      <label>Name</label>

      <input
        id="name"
        type="text"
        placeholder="আপনার নাম"
      >

      <label>Mobile Number</label>

      <input
        id="mobile"
        type="tel"
        maxlength="10"
        placeholder="10 digit mobile number"
      >

      <label>PIN Code</label>

      <input
        id="pin"
        type="tel"
        maxlength="6"
        placeholder="PIN Code"
      >

      <label>District</label>

      <input
        id="district"
        type="text"
        placeholder="District"
      >

      <label>Building / House</label>

      <input
        id="building"
        type="text"
        placeholder="House / Building"
      >

      <label>Area / Village</label>

      <input
        id="area"
        type="text"
        placeholder="Area / Village"
      >

      <button
        class="save-btn"
        id="saveAddressBtn">

        💾 Save Address

      </button>

    </div>

    <div class="address-buttons">

      <button
        class="edit-btn"
        id="editAddressBtn">

        ✏️ Edit

      </button>

      <button
        class="use-btn"
        id="useAddressBtn">

        ✅ Use This Address

      </button>

    </div>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>🛒 Order Summary</h2>

    <div id="products"></div>

    <div class="summary-row">

      <span>Subtotal</span>

      <span id="subtotal">₹0</span>

    </div>

    <div class="summary-row">

      <span>Delivery</span>

      <span id="delivery">₹0</span>

    </div>

    <div class="summary-row total">

      <span>Total</span>

      <span id="total">₹0</span>

    </div>

  </div>


  <!-- PAYMENT -->

  <div class="card">

    <h2>💳 Payment Method</h2>

    <div
      class="payment-option active"
      id="codOption">

      <label style="margin:0;">

        <input
          type="radio"
          name="payment"
          value="COD"
          checked
        >

        💵 Cash on Delivery

      </label>

    </div>


    <div
      class="payment-option"
      id="upiOption">

      <label style="margin:0;">

        <input
          type="radio"
          name="payment"
          value="UPI"
        >

        📱 UPI Payment

      </label>

    </div>


    <div
      class="upi-box"
      id="upiBox">

      <b>UPI ID:</b>

      <div class="upi-id">
        8016410311@axl
      </div>

      <button
        class="pay-btn"
        id="upiPayBtn">

        📱 Pay with UPI

      </button>

      <p class="note">

        UPI payment করার পরে নিচের
        বাটনে চাপুন।

      </p>

      <button
        class="pay-btn"
        id="upiDoneBtn">

        ✅ আমি পেমেন্ট করেছি

      </button>

    </div>

  </div>


  <!-- PLACE ORDER -->

  <div class="card">

    <button
      class="place-btn"
      id="placeOrderBtn">

      🛍️ Place Order

    </button>

  </div>

</div>


<script type="module">

import { auth, db } from "./firebase.js";


import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ======================================
// VARIABLES
// ======================================

let currentUser = null;

let cart = [];

let selectedPayment = "COD";

let orderCreating = false;

let upiConfirmed = false;


// ======================================
// CHECKOUT MODE
// ======================================

/*
  buyNow = শুধু একটি product

  cart = Cart-এর product
*/

let checkoutMode = "cart";


// ======================================
// ELEMENTS
// ======================================

const productsDiv =
  document.getElementById("products");


const subtotalEl =
  document.getElementById("subtotal");


const deliveryEl =
  document.getElementById("delivery");


const totalEl =
  document.getElementById("total");


const errorBox =
  document.getElementById("errorBox");


const checkoutModeBox =
  document.getElementById("checkoutMode");


const savedAddressBox =
  document.getElementById("savedAddress");


const addressForm =
  document.getElementById("addressForm");


const nameInput =
  document.getElementById("name");


const mobileInput =
  document.getElementById("mobile");


const pinInput =
  document.getElementById("pin");


const districtInput =
  document.getElementById("district");


const buildingInput =
  document.getElementById("building");


const areaInput =
  document.getElementById("area");


const codOption =
  document.getElementById("codOption");


const upiOption =
  document.getElementById("upiOption");


const upiBox =
  document.getElementById("upiBox");


const placeOrderBtn =
  document.getElementById("placeOrderBtn");


const upiPayBtn =
  document.getElementById("upiPayBtn");


const upiDoneBtn =
  document.getElementById("upiDoneBtn");


// ======================================
// ERROR
// ======================================

function showError(message){

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


function hideError(){

  errorBox.style.display =
    "none";

}


// ======================================
// LOAD CHECKOUT DATA
// ======================================

function loadCheckoutData(){

  /*
    প্রথমে Buy Now check করবে।

    Buy Now থাকলে শুধু ওই product
    payment page-এ যাবে।

    Buy Now না থাকলে Cart load হবে।
  */

  try{

    const buyNowData =
      localStorage.getItem(
        "sayonmartBuyNow"
      );


    if(buyNowData){

      const product =
        JSON.parse(buyNowData);


      if(
        product &&
        product.id &&
        product.name
      ){

        checkoutMode =
          "buyNow";


        cart = [{

          id: product.id,

          name: product.name,

          price:
            Number(product.price) || 0,

          image:
            product.image ||
            product.productImage ||
            "",

          quantity:
            Number(product.quantity) || 1

        }];


        checkoutModeBox.textContent =
          "🟠 Buy Now — শুধু এই Product";


        return true;

      }

    }

  }catch(error){

    console.log(
      "Buy Now data error:",
      error
    );

  }


  /*
    Buy Now না থাকলে Cart।
  */

  checkoutMode =
    "cart";


  try{

    cart =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );

  }catch(error){

    cart = [];

  }


  if(!Array.isArray(cart)){

    cart = [];

  }


  if(cart.length === 0){

    window.location.href =
      "cart.html";

    return false;

  }


  checkoutModeBox.textContent =
    "🛒 Cart Checkout";


  return true;

}


// ======================================
// TOTAL
// ======================================

function getSubtotal(){

  return cart.reduce(
    (sum,item)=>{

      const price =
        Number(item.price) || 0;

      const quantity =
        Number(item.quantity) || 1;


      return sum +
        (price * quantity);

    },
    0
  );

}


function getDelivery(){

  const subtotal =
    getSubtotal();


  return subtotal >= 499
    ? 0
    : 40;

}


function getGrandTotal(){

  return (
    getSubtotal() +
    getDelivery()
  );

}


// ======================================
// SHOW PRODUCTS
// ======================================

function showProducts(){

  productsDiv.innerHTML = "";


  cart.forEach(item=>{

    const quantity =
      Number(item.quantity) || 1;


    const price =
      Number(item.price) || 0;


    const product =
      document.createElement("div");


    product.className =
      "product";


    const img =
      document.createElement("img");


    img.src =
      item.image ||
      item.productImage ||
      "";


    img.alt =
      item.name ||
      item.productName ||
      "Product";


    const info =
      document.createElement("div");


    info.className =
      "product-info";


    const name =
      document.createElement("div");


    name.className =
      "product-name";


    name.textContent =
      item.name ||
      item.productName ||
      "Product";


    const details =
      document.createElement("div");


    details.textContent =
      "₹" +
      price +
      " × " +
      quantity;


    info.appendChild(name);

    info.appendChild(details);

    product.appendChild(img);

    product.appendChild(info);

    productsDiv.appendChild(product);

  });


  const subtotal =
    getSubtotal();


  const delivery =
    getDelivery();


  const total =
    getGrandTotal();


  subtotalEl.textContent =
    "₹" + subtotal;


  deliveryEl.textContent =
    delivery === 0
      ? "FREE"
      : "₹" + delivery;


  totalEl.textContent =
    "₹" + total;

}


// ======================================
// ADDRESS
// ======================================

function getAddress(){

  return {

    name:
      nameInput.value.trim(),

    phone:
      mobileInput.value.trim(),

    pin:
      pinInput.value.trim(),

    district:
      districtInput.value.trim(),

    building:
      buildingInput.value.trim(),

    area:
      areaInput.value.trim()

  };

}


// ======================================
// VALIDATE ADDRESS
// ======================================

function validateAddress(){

  const address =
    getAddress();


  if(!address.name){

    showError(
      "আপনার নাম দিন।"
    );

    return false;

  }


  if(
    !/^[0-9]{10}$/.test(
      address.phone
    )
  ){

    showError(
      "সঠিক 10 digit mobile number দিন।"
    );

    return false;

  }


  if(
    !/^[0-9]{6}$/.test(
      address.pin
    )
  ){

    showError(
      "সঠিক 6 digit PIN Code দিন।"
    );

    return false;

  }


  if(!address.district){

    showError(
      "District দিন।"
    );

    return false;

  }


  if(!address.building){

    showError(
      "House / Building দিন।"
    );

    return false;

  }


  if(!address.area){

    showError(
      "Area / Village দিন।"
    );

    return false;

  }


  return true;

}


// ======================================
// SAVE ADDRESS
// ======================================

function saveAddress(){

  if(!validateAddress()){

    return;

  }


  const address =
    getAddress();


  localStorage.setItem(
    "sayonmartAddress",
    JSON.stringify(address)
  );


  localStorage.setItem(
    "addressSelected",
    "true"
  );


  showSavedAddress();


  alert(
    "✅ Address Saved"
  );

}


// ======================================
// SHOW SAVED ADDRESS
// ======================================

function showSavedAddress(){

  const saved =
    localStorage.getItem(
      "sayonmartAddress"
    );


  if(!saved){

    savedAddressBox.style.display =
      "none";

    return;

  }


  try{

    const address =
      JSON.parse(saved);


    if(
      !address ||
      !address.name
    ){

      return;

    }


    savedAddressBox.textContent =
      address.name +
      " • " +
      address.phone +
      " • " +
      address.building +
      ", " +
      address.area +
      ", " +
      address.district +
      " - " +
      address.pin;


    savedAddressBox.style.display =
      "block";


    nameInput.value =
      address.name || "";


    mobileInput.value =
      address.phone || "";


    pinInput.value =
      address.pin || "";


    districtInput.value =
      address.district || "";


    buildingInput.value =
      address.building || "";


    areaInput.value =
      address.area || "";


  }catch(error){

    console.log(error);

  }

}


// ======================================
// ADDRESS BUTTONS
// ======================================

document
  .getElementById(
    "saveAddressBtn"
  )
  .addEventListener(
    "click",
    saveAddress
  );


document
  .getElementById(
    "editAddressBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      addressForm.style.display =
        "block";


      window.scrollTo({

        top:0,

        behavior:"smooth"

      });

    }
  );


document
  .getElementById(
    "useAddressBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      if(!validateAddress()){

        return;

      }


      localStorage.setItem(
        "sayonmartAddress",
        JSON.stringify(
          getAddress()
        )
      );


      localStorage.setItem(
        "addressSelected",
        "true"
      );


      alert(
        "✅ Address selected"
      );

    }
  );


// ======================================
// PAYMENT METHOD
// ======================================

function selectCOD(){

  selectedPayment =
    "COD";


  codOption.classList.add(
    "active"
  );


  upiOption.classList.remove(
    "active"
  );


  upiBox.style.display =
    "none";

}


function selectUPI(){

  selectedPayment =
    "UPI";


  upiOption.classList.remove(
    "active"
  );


  upiOption.classList.add(
    "active"
  );


  codOption.classList.remove(
    "active"
  );


  upiBox.style.display =
    "block";

}


codOption.addEventListener(
  "click",
  selectCOD
);


upiOption.addEventListener(
  "click",
  selectUPI
);


// ======================================
// UPI PAYMENT
// ======================================

upiPayBtn.addEventListener(
  "click",
  ()=>{

    const total =
      getGrandTotal();


    const upiURL =
      "upi://pay" +
      "?pa=8016410311@axl" +
      "&pn=SayonMart" +
      "&am=" +
      total +
      "&cu=INR";


    window.location.href =
      upiURL;

  }
);


// ======================================
// UPI DONE
// ======================================

upiDoneBtn.addEventListener(
  "click",
  ()=>{

    upiConfirmed =
      true;


    alert(
      "✅ UPI payment confirmation received.\n\nOrder এখন তৈরি করা যাবে।"
    );

  }
);


// ======================================
// CREATE ORDERS
// ======================================

async function createOrders(){

  hideError();


  if(orderCreating){

    return;

  }


  if(!currentUser){

    window.location.href =
      "login.html";

    return;

  }


  /*
    আবার checkout data check।

    Buy Now হলে শুধু Buy Now product।
  */

  if(!loadCheckoutData()){

    return;

  }


  if(!cart.length){

    showError(
      "Order করার জন্য কোনো product নেই।"
    );

    return;

  }


  if(!validateAddress()){

    return;

  }


  if(
    selectedPayment === "UPI" &&
    !upiConfirmed
  ){

    showError(
      "আগে UPI payment করুন এবং 'আমি পেমেন্ট করেছি' বাটনে চাপুন।"
    );

    return;

  }


  orderCreating =
    true;


  placeOrderBtn.disabled =
    true;


  placeOrderBtn.textContent =
    "⏳ Order তৈরি হচ্ছে...";


  const address =
    getAddress();


  const subtotal =
    getSubtotal();


  const delivery =
    getDelivery();


  const total =
    getGrandTotal();


  try{

    const createdOrderIds = [];


    /*
      প্রতিটি cart product-এর জন্য
      আলাদা order document তৈরি হবে।

      Buy Now mode-এ cart-এর মধ্যে
      শুধু ১টা product আছে।

      তাই Buy Now করলে শুধু ১টা order তৈরি হবে।
    */

    for(
      let i = 0;
      i < cart.length;
      i++
    ){

      const item =
        cart[i];


      const quantity =
        Number(
          item.quantity
        ) || 1;


      const price =
        Number(
          item.price
        ) || 0;


      const itemSubtotal =
        price * quantity;


      /*
        Delivery charge শুধু প্রথম
        order-এর সাথে যোগ হবে।
      */

      const itemDelivery =
        i === 0
          ? delivery
          : 0;


      const itemTotal =
        itemSubtotal +
        itemDelivery;


      const orderData = {

        userId:
          currentUser.uid,


        name:
          address.name,


        phone:
          address.phone,


        pin:
          address.pin,


        district:
          address.district,


        building:
          address.building,


        area:
          address.area,


        address:
          address.building +
          ", " +
          address.area +
          ", " +
          address.district +
          " - " +
          address.pin,


        productName:
          item.name ||
          item.productName ||
          "Product",

productId:
  item.id || "",

        productImage:
          item.image ||
          item.productImage ||
          "",


        price:
          price,


        quantity:
          quantity,


        subtotal:
          itemSubtotal,


        delivery:
          itemDelivery,


        total:
          itemTotal,


        cartTotal:
          total,


        paymentMethod:
          selectedPayment,


        paymentStatus:
          selectedPayment === "COD"
            ? "Cash on Delivery"
            : "Awaiting verification",


        status:
          "Pending",


        createdAt:
          serverTimestamp()

      };


      const docRef =
        await addDoc(
          collection(
            db,
            "orders"
          ),
          orderData
        );


      createdOrderIds.push(
        docRef.id
      );

    }


    // ==================================
    // SAVE LAST ORDER
    // ==================================

    localStorage.setItem(
      "lastSayonMartOrder",
      JSON.stringify({

        orderId:
          createdOrderIds[0],

        orderIds:
          createdOrderIds,

        total:
          total,

        subtotal:
          subtotal,

        delivery:
          delivery,

        paymentMethod:
          selectedPayment,

        productName:
          cart[0].name ||
          cart[0].productName ||
          "Product",

        productImage:
          cart[0].image ||
          cart[0].productImage ||
          "",

        quantity:
          Number(
            cart[0].quantity
          ) || 1,

        address:
          address

      })
    );


    // ==================================
    // IMPORTANT: CLEAR ONLY CORRECT DATA
    // ==================================

    if(
      checkoutMode === "buyNow"
    ){

      /*
        Buy Now order হলে
        শুধু Buy Now data মুছবে।

        Cart-এর product থাকবে।
      */

      localStorage.removeItem(
        "sayonmartBuyNow"
      );

    }else{

      /*
        Cart checkout হলে
        পুরো Cart clear হবে।
      */

      localStorage.removeItem(
        "cart"
      );

    }


    // ==================================
    // SUCCESS PAGE
    // ==================================

    window.location.href =
      "order-success.html?orderId=" +
      encodeURIComponent(
        createdOrderIds[0]
      );


  }catch(error){

    console.error(error);


    showError(
      "Order তৈরি করা যায়নি। আবার চেষ্টা করুন।"
    );


    orderCreating =
      false;


    placeOrderBtn.disabled =
      false;


    placeOrderBtn.textContent =
      "🛍️ Place Order";

  }

}


// ======================================
// PLACE ORDER
// ======================================

placeOrderBtn.addEventListener(
  "click",
  createOrders
);


// ======================================
// LOGIN CHECK
// ======================================

onAuthStateChanged(
  auth,
  (user)=>{

    if(!user){

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      user;


    /*
      Login হওয়ার পর checkout data
      load হবে।

      Buy Now থাকলে শুধু Buy Now।
      না থাকলে Cart।
    */

    if(
      loadCheckoutData()
    ){

      showProducts();

      showSavedAddress();

    }

  }
);

</script>
