<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SayonMart - Payment</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
  padding-bottom:40px;
}

header{
  background:#e91e63;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.box{
  background:#1d1d1d;
  border-radius:15px;
  padding:18px;
  margin-bottom:18px;
}

h2{
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:none;
  border-radius:9px;
  background:#292929;
  color:#fff;
  font-size:15px;
}

input:focus,
textarea:focus{
  outline:2px solid #e91e63;
}

textarea{
  min-height:90px;
  resize:none;
}

.summary{
  line-height:2;
  font-size:16px;
}

.total{
  font-size:21px;
  font-weight:bold;
  color:#ff4081;
  border-top:1px solid #444;
  margin-top:10px;
  padding-top:10px;
}

.payment-option{
  background:#292929;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}

.payment-option input{
  width:auto;
  margin-right:8px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  margin-top:12px;
  cursor:pointer;
}

.upi-btn{
  background:#673ab7;
  color:white;
}

.order-btn{
  background:#e91e63;
  color:white;
}

.cancel-btn{
  background:#333;
  color:white;
}

.edit-btn{
  background:#333;
  color:#FFD700;
  border:1px solid #FFD700;
}

.save-btn{
  background:#333;
  color:#FFD700;
  border:1px solid #FFD700;
}

#upiBox{
  display:none;
}

#status{
  text-align:center;
  margin-top:15px;
  color:#00e676;
  font-weight:bold;
}

#savedDeliveryAddress{
  display:none;
  background:#292929;
  padding:15px;
  border-radius:10px;
  line-height:1.8;
}

.address-line{
  margin-bottom:5px;
}

.address-title{
  color:#FFD700;
  font-size:17px;
  font-weight:bold;
  margin-bottom:8px;
}
</style></head><body><header>
  💗 SayonMart Checkout
</header><div class="container">  <!-- DELIVERY -->  <div class="box"><h2>📦 Delivery Details</h2>

<!-- SAVED ADDRESS -->
<div id="savedDeliveryAddress">

  <div class="address-title">
    📍 Saved Address
  </div>

  <div class="address-line">
    👤 <b>Name:</b>
    <span id="savedName"></span>
  </div>

  <div class="address-line">
    📱 <b>Mobile:</b>
    <span id="savedPhone"></span>
  </div>

  <div class="address-line">
    📮 <b>PIN:</b>
    <span id="savedPin"></span>
  </div>

  <div class="address-line">
    🏙️ <b>District:</b>
    <span id="savedDistrict"></span>
  </div>

  <div class="address-line">
    🏠 <b>Building/House:</b>
    <span id="savedBuilding"></span>
  </div>

  <div class="address-line">
    📍 <b>Local Area:</b>
    <span id="savedArea"></span>
  </div>

  <button
    type="button"
    class="edit-btn"
    onclick="editDeliveryAddress()"
  >
    ✏️ Edit Address
  </button>

</div>


<!-- NEW ADDRESS -->
<div id="newDeliveryAddress">

  <label>নাম</label>

  <input
    id="name"
    type="text"
    placeholder="আপনার নাম"
  >


  <label>মোবাইল নম্বর</label>

  <input
    id="phone"
    type="tel"
    placeholder="মোবাইল নম্বর"
    maxlength="10"
  >


  <label>PIN Code</label>

  <input
    id="pin"
    type="text"
    inputmode="numeric"
    placeholder="6 digit PIN Code"
    maxlength="6"
  >


  <label>District</label>

  <input
    id="district"
    type="text"
    placeholder="District"
  >


  <label>Building / House No.</label>

  <input
    id="building"
    type="text"
    placeholder="Building / House No."
  >


  <label>Local Area</label>

  <textarea
    id="area"
    placeholder="Local Area / Village / Road"
  ></textarea>


  <button
    type="button"
    class="save-btn"
    onclick="savePaymentAddress()"
  >
    💾 Save Address
  </button>

</div>

  </div>  <!-- ORDER SUMMARY -->  <div class="box"><h2>🛒 Order Summary</h2>

<div id="cartItems"></div>

<div class="summary">

  <div>
    Subtotal:
    ₹<span id="subtotal">0</span>
  </div>

  <div>
    Delivery:
    ₹<span id="delivery">0</span>
  </div>

  <div class="total">

    Total:
    ₹<span id="total">0</span>

  </div>

</div>

  </div>  <!-- PAYMENT -->  <div class="box"><h2>💳 Payment Method</h2>

<label class="payment-option">

  <input
    type="radio"
    name="payment"
    value="COD"
    checked
    onchange="paymentChanged()"
  >

  Cash on Delivery

</label>


<label class="payment-option">

  <input
    type="radio"
    name="payment"
    value="UPI"
    onchange="paymentChanged()"
  >

  UPI Payment

</label>


<!-- UPI -->
<div id="upiBox">

  <p style="margin-top:15px;">

    UPI ID:
    <b>8016410311@axl</b>

  </p>


  <button
    class="upi-btn"
    onclick="payWithUPI()"
  >

    📱 Pay ₹<span id="upiAmount">0</span> with UPI

  </button>


  <button
    class="order-btn"
    onclick="confirmUPIPayment()"
  >

    ✅ আমি পেমেন্ট করেছি

  </button>

</div>


<!-- COD -->
<button
  id="codButton"
  class="order-btn"
  onclick="placeCODOrder()"
>

  🛍️ Place COD Order

</button>


<button
  class="cancel-btn"
  onclick="history.back()"
>

  ← Back

</button>


<div id="status"></div>

  </div></div><script type="module">

import { auth, db } from "./firebase.js";

import {
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


let currentUser = null;

let cart = [];

const UPI_ID =
  "8016410311@axl";


// ==========================
// LOAD USER
// ==========================

onAuthStateChanged(auth, user => {

  if(!user){

    alert("আগে Login করুন");

    location.href =
      "login.html";

    return;

  }

  currentUser = user;

});


// ==========================
// SAVED ADDRESS
// ==========================

function loadSavedAddress(){

  const saved =
    localStorage.getItem(
      "sayonmartAddress"
    );


  if(!saved){

    document.getElementById(
      "savedDeliveryAddress"
    ).style.display = "none";

    document.getElementById(
      "newDeliveryAddress"
    ).style.display = "block";

    return;

  }


  try{

    const data =
      JSON.parse(saved);


    // Show saved address

    document.getElementById(
      "savedName"
    ).textContent =
      data.name || "";


    document.getElementById(
      "savedPhone"
    ).textContent =
      data.mobile || "";


    document.getElementById(
      "savedPin"
    ).textContent =
      data.pin || "";


    document.getElementById(
      "savedDistrict"
    ).textContent =
      data.district || "";


    document.getElementById(
      "savedBuilding"
    ).textContent =
      data.building || "";


    document.getElementById(
      "savedArea"
    ).textContent =
      data.area || "";


    // Put data into form too

    document.getElementById(
      "name"
    ).value =
      data.name || "";


    document.getElementById(
      "phone"
    ).value =
      data.mobile || "";


    document.getElementById(
      "pin"
    ).value =
      data.pin || "";


    document.getElementById(
      "district"
    ).value =
      data.district || "";


    document.getElementById(
      "building"
    ).value =
      data.building || "";


    document.getElementById(
      "area"
    ).value =
      data.area || "";


    document.getElementById(
      "savedDeliveryAddress"
    ).style.display =
      "block";


    document.getElementById(
      "newDeliveryAddress"
    ).style.display =
      "none";


  }catch(error){

    console.log(
      "Address load error:",
      error
    );

  }

}


// ==========================
// SAVE ADDRESS
// ==========================

window.savePaymentAddress =
function(){

  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const mobile =
    document.getElementById(
      "phone"
    ).value.trim();


  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  const district =
    document.getElementById(
      "district"
    ).value.trim();


  const building =
    document.getElementById(
      "building"
    ).value.trim();


  const area =
    document.getElementById(
      "area"
    ).value.trim();


  if(
    !name ||
    !mobile ||
    !pin ||
    !district ||
    !building ||
    !area
  ){

    alert(
      "⚠️ সব Address তথ্য পূরণ করুন।"
    );

    return;

  }


  if(!/^\d{10}$/.test(mobile)){

    alert(
      "⚠️ সঠিক 10 digit Mobile Number দিন।"
    );

    return;

  }


  if(!/^\d{6}$/.test(pin)){

    alert(
      "⚠️ সঠিক 6 digit PIN Code দিন।"
    );

    return;

  }


  const address = {

    name: name,

    mobile: mobile,

    pin: pin,

    district: district,

    building: building,

    area: area

  };


  localStorage.setItem(
    "sayonmartAddress",
    JSON.stringify(address)
  );


  alert(
    "✅ Address Save হয়েছে!"
  );


  loadSavedAddress();

};


// ==========================
// EDIT ADDRESS
// ==========================

window.editDeliveryAddress =
function(){

  document.getElementById(
    "savedDeliveryAddress"
  ).style.display =
    "none";


  document.getElementById(
    "newDeliveryAddress"
  ).style.display =
    "block";

};


// ==========================
// GET ADDRESS TEXT
// ==========================

function getFullAddress(){

  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  const district =
    document.getElementById(
      "district"
    ).value.trim();


  const building =
    document.getElementById(
      "building"
    ).value.trim();


  const area =
    document.getElementById(
      "area"
    ).value.trim();


  return (
    building +
    ", " +
    area +
    ", " +
    district +
    ", PIN - " +
    pin
  );

}


// ==========================
// LOAD CART
// ==========================

function loadCart(){

  try{

    cart =
      JSON.parse(
        localStorage.getItem("cart")
      ) || [];

  }catch(e){

    cart = [];

  }


  if(!Array.isArray(cart)){

    cart = [];

  }


  let subtotal = 0;


  const box =
    document.getElementById(
      "cartItems"
    );


  box.innerHTML = "";


  if(cart.length === 0){

    box.innerHTML =
      "<p>আপনার Cart খালি।</p>";

    return;

  }


  cart.forEach(item => {

    const price =
      Number(item.price) || 0;


    const quantity =
      Number(item.quantity) || 1;


    const amount =
      price * quantity;


    subtotal += amount;


    const div =
      document.createElement(
        "div"
      );


    div.style.padding =
      "8px 0";


    div.innerHTML = `
      ${escapeHTML(item.name || "Product")}
      × ${quantity}
      = ₹${amount}
    `;


    box.appendChild(div);

  });


  const delivery =
    subtotal >= 499
      ? 0
      : 40;


  const total =
    subtotal + delivery;


  document.getElementById(
    "subtotal"
  ).textContent =
    subtotal;


  document.getElementById(
    "delivery"
  ).textContent =
    delivery;


  document.getElementById(
    "total"
  ).textContent =
    total;


  document.getElementById(
    "upiAmount"
  ).textContent =
    total;

}


// ==========================
// ESCAPE TEXT
// ==========================

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ==========================
// PAYMENT CHANGE
// ==========================

window.paymentChanged =
function(){

  const method =
    document.querySelector(
      'input[name="payment"]:checked'
    ).value;


  const upiBox =
    document.getElementById(
      "upiBox"
    );


  const codButton =
    document.getElementById(
      "codButton"
    );


  if(method === "UPI"){

    upiBox.style.display =
      "block";


    codButton.style.display =
      "none";

  }else{

    upiBox.style.display =
      "none";


    codButton.style.display =
      "block";

  }

};


// ==========================
// VALIDATE
// ==========================

function validateDetails(){

  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  const district =
    document.getElementById(
      "district"
    ).value.trim();


  const building =
    document.getElementById(
      "building"
    ).value.trim();


  const area =
    document.getElementById(
      "area"
    ).value.trim();


  if(!name){

    alert("নাম লিখুন");

    return false;

  }


  if(!/^\d{10}$/.test(phone)){

    alert(
      "সঠিক 10 digit Mobile Number দিন"
    );

    return false;

  }


  if(!/^\d{6}$/.test(pin)){

    alert(
      "সঠিক 6 digit PIN Code দিন"
    );

    return false;

  }


  if(!district){

    alert(
      "District লিখুন"
    );

    return false;

  }


  if(!building){

    alert(
      "Building / House No. লিখুন"
    );

    return false;

  }


  if(!area){

    alert(
      "Local Area লিখুন"
    );

    return false;

  }


  if(cart.length === 0){

    alert(
      "Cart খালি"
    );

    return false;

  }


  if(!currentUser){

    alert(
      "আগে Login করুন"
    );

    return false;

  }


  // Save address automatically
  const address = {

    name: name,

    mobile: phone,

    pin: pin,

    district: district,

    building: building,

    area: area

  };


  localStorage.setItem(
    "sayonmartAddress",
    JSON.stringify(address)
  );


  return true;

}


// ==========================
// CALCULATE TOTAL
// ==========================

function getTotals(){

  let subtotal = 0;


  cart.forEach(item => {

    const price =
      Number(item.price) || 0;


    const quantity =
      Number(item.quantity) || 1;


    subtotal +=
      price * quantity;

  });


  const delivery =
    subtotal >= 499
      ? 0
      : 40;


  const total =
    subtotal + delivery;


  return {

    subtotal,
    delivery,
    total

  };

}


// ==========================
// UPI PAYMENT
// ==========================

window.payWithUPI =
function(){

  if(!validateDetails()){

    return;

  }


  const totals =
    getTotals();


  const amount =
    totals.total;


  const name =
    "SayonMart";


  const note =
    "SayonMart Order";


  const upiURL =
    "upi://pay" +
    "?pa=" +
    encodeURIComponent(UPI_ID) +
    "&pn=" +
    encodeURIComponent(name) +
    "&am=" +
    encodeURIComponent(amount) +
    "&cu=INR" +
    "&tn=" +
    encodeURIComponent(note);


  document.getElementById(
    "status"
  ).textContent =
    "UPI App খোলা হচ্ছে...";


  window.location.href =
    upiURL;

};


// ==========================
// COD ORDER
// ==========================

window.placeCODOrder =
async function(){

  if(!validateDetails()){

    return;

  }


  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const address =
    getFullAddress();


  const totals =
    getTotals();


  try{

    document.getElementById(
      "status"
    ).textContent =
      "Order তৈরি হচ্ছে...";


    for(
      const item of cart
    ){

      const price =
        Number(item.price) || 0;


      const quantity =
        Number(item.quantity) || 1;


      const subtotal =
        price * quantity;


      await addDoc(
        collection(
          db,
          "orders"
        ),
        {

          userId:
            currentUser.uid,

          name:
            name,

          phone:
            phone,

          address:
            address,

          pin:
            document.getElementById(
              "pin"
            ).value.trim(),

          district:
            document.getElementById(
              "district"
            ).value.trim(),

          building:
            document.getElementById(
              "building"
            ).value.trim(),

          area:
            document.getElementById(
              "area"
            ).value.trim(),

          productName:
            item.name ||
            "Product",

          productImage:
            item.image ||
            "",

          price:
            price,

          quantity:
            quantity,

          subtotal:
            subtotal,

          delivery:
            totals.delivery,

          total:
            totals.total,

          paymentMethod:
            "COD",

          paymentStatus:
            "Cash on Delivery",

          status:
            "Pending",

          createdAt:
            serverTimestamp()

        }
      );

    }


    localStorage.removeItem(
      "cart"
    );


    alert(
      "✅ Order সফলভাবে তৈরি হয়েছে!"
    );


    location.href =
      "order.html";


  }catch(error){

    console.error(error);


    alert(
      "❌ Order তৈরি হয়নি: " +
      error.message
    );


    document.getElementById(
      "status"
    ).textContent =
      "";

  }

};


// ==========================
// CONFIRM UPI
// ==========================

window.confirmUPIPayment =
async function(){

  if(!validateDetails()){

    return;

  }


  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const address =
    getFullAddress();


  const totals =
    getTotals();


  const confirmPay =
    confirm(
      "আপনি কি UPI পেমেন্ট সম্পন্ন করেছেন?"
    );


  if(!confirmPay){

    return;

  }


  try{

    document.getElementById(
      "status"
    ).textContent =
      "Order তৈরি হচ্ছে...";


    for(
      const item of cart
    ){

      const price =
        Number(item.price) || 0;


      const quantity =
        Number(item.quantity) || 1;


      const subtotal =
        price * quantity;


      await addDoc(
        collection(
          db,
          "orders"
        ),
        {

          userId:
            currentUser.uid,

          name:
            name,

          phone:
            phone,

          address:
            address,

          pin:
            document.getElementById(
              "pin"
            ).value.trim(),

          district:
            document.getElementById(
              "district"
            ).value.trim(),

          building:
            document.getElementById(
              "building"
            ).value.trim(),

          area:
            document.getElementById(
              "area"
            ).value.trim(),

          productName:
            item.name ||
            "Product",

          productImage:
            item.image ||
            "",

          price:
            price,

          quantity:
            quantity,

          subtotal:
            subtotal,

          delivery:
            totals.delivery,

          total:
            totals.total,

          paymentMethod:
            "UPI",

          paymentStatus:
            "Awaiting verification",

          status:
            "Pending",

          createdAt:
            serverTimestamp()

        }
      );

    }


    localStorage.removeItem(
      "cart"
    );


    alert(
      "✅ Order তৈরি হয়েছে।\n\nUPI payment verification pending."
    );


    location.href =
      "order.html";


  }catch(error){

    console.error(error);


    alert(
      "❌ Order তৈরি হয়নি: " +
      error.message
    );


    document.getElementById(
      "status"
    ).textContent =
      "";

  }

};


// ==========================
// START
// ==========================

loadCart();

loadSavedAddress();

</script></body>
</html>
