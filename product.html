<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SayonMart Product</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
  padding-bottom:75px;
}
header{
  height:58px;
  background:#e91e63;
  color:white;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:15px;
  position:sticky;
  top:0;
  z-index:20;
}
header button{
  background:none;
  border:0;
  color:white;
  font-size:25px;
}
.logo{
  font-size:21px;
  font-weight:bold;
  flex:1;
}
.box{
  background:white;
  margin-bottom:10px;
  padding:14px;
}
.mainImg{
  width:100%;
  height:330px;
  object-fit:contain;
  background:#fafafa;
  border-radius:10px;
}
.thumbs{
  display:flex;
  gap:8px;
  margin-top:10px;
  overflow-x:auto;
}
.thumbs img{
  width:65px;
  height:65px;
  object-fit:contain;
  border:2px solid #ddd;
  border-radius:7px;
}
.title{
  font-size:21px;
  font-weight:bold;
}
.rating{
  color:#ff9800;
  margin:8px 0;
}
.price{
  color:#e91e63;
  font-size:28px;
  font-weight:bold;
}
.old{
  color:#888;
  text-decoration:line-through;
  margin-left:8px;
}
.discount{
  background:#e91e63;
  color:white;
  padding:5px 8px;
  border-radius:5px;
  margin-left:7px;
}
.desc{
  line-height:1.6;
  color:#555;
}
.benefits{
  display:flex;
  justify-content:space-around;
  text-align:center;
  font-size:13px;
}
.benefits div{
  flex:1;
}
.sectionTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}
.recommend{
  display:flex;
  gap:10px;
  overflow-x:auto;
}
.recCard{
  min-width:165px;
  width:165px;
  background:white;
  border:1px solid #eee;
  border-radius:10px;
  padding:8px;
}
.recCard img{
  width:100%;
  height:145px;
  object-fit:contain;
  background:#fafafa;
  border-radius:8px;
}
.recName{
  font-weight:bold;
  height:38px;
  overflow:hidden;
  margin-top:7px;
}
.recPrice{
  color:#e91e63;
  font-weight:bold;
  font-size:18px;
  margin-top:5px;
}
.recCard button{
  width:100%;
  margin-top:8px;
  padding:8px;
  border:0;
  border-radius:7px;
  background:#e91e63;
  color:white;
}
.actionBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:8px;
  display:flex;
  gap:8px;
  z-index:30;
  box-shadow:0 -2px 8px #ddd;
}
.actionBar button{
  flex:1;
  padding:13px 5px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  font-size:15px;
}
.cartBtn{
  background:white;
  color:#e91e63;
  border:2px solid #e91e63 !important;
}
.buyBtn{
  background:#e91e63;
  color:white;
}
.loading{
  text-align:center;
  padding:60px 20px;
  color:#777;
}
.error{
  text-align:center;
  padding:60px 20px;
}
</style>
</head>

<body>

<header>
  <button onclick="history.back()">‹</button>
  <div class="logo">SayonMart</div>
  <button onclick="location.href='cart.html'">🛒</button>
</header>

<div id="product">
  <div class="loading">Product loading...</div>
</div>

<div class="actionBar" id="actions" style="display:none">
  <button class="cartBtn" onclick="addCurrentCart()">
    🛒 Add to Cart
  </button>

  <button class="buyBtn" onclick="buyNow()">
    ⚡ Buy Now
  </button>
</div>

<script type="module">

import {db} from "./firebase.js";

import {
  doc,
  getDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const productBox =
  document.getElementById("product");

const productId =
  new URLSearchParams(location.search).get("id");

let currentProduct = null;


// ==========================
// IMAGE
// ==========================

function getImage(product){

  if(product.image)
    return product.image;

  if(Array.isArray(product.images) &&
     product.images.length)
    return product.images[0];

  return "https://via.placeholder.com/500?text=SayonMart";
}


// ==========================
// SAFE
// ==========================

function safe(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// ==========================
// LOAD PRODUCT
// ==========================

async function loadProduct(){

  if(!productId){

    productBox.innerHTML =
      `<div class="error">
        Product পাওয়া যায়নি।
      </div>`;

    return;
  }


  try{

    const ref =
      doc(db,"products",productId);

    const snap =
      await getDoc(ref);


    if(!snap.exists()){

      productBox.innerHTML =
        `<div class="error">
          Product পাওয়া যায়নি।
        </div>`;

      return;
    }


    currentProduct = {
      id:snap.id,
      ...snap.data()
    };


    showProduct(currentProduct);

    loadRecommendations();

  }catch(error){

    console.error(error);

    productBox.innerHTML =
      `<div class="error">
        Product load করা যাচ্ছে না।
      </div>`;

  }

}


// ==========================
// SHOW PRODUCT
// ==========================

function showProduct(product){

  const image =
    getImage(product);

  const name =
    product.name || "Product";

  const price =
    Number(product.price || 0);

  const oldPrice =
    Number(product.oldPrice || 0);

  const discount =
    oldPrice > price
    ? Math.round((oldPrice-price)/oldPrice*100)
    : 0;

  const rating =
    product.rating || "4.5";

  const description =
    product.description ||
    "এই Product সম্পর্কে বিস্তারিত তথ্য এখানে দেখতে পারবেন।";


  let images = [];

  if(Array.isArray(product.images))
    images = product.images;

  if(product.image &&
     !images.includes(product.image))
    images.unshift(product.image);

  if(!images.length)
    images = [image];


  productBox.innerHTML = `

    <div class="box">

      <img
        id="mainImage"
        class="mainImg"
        src="${safe(image)}"
        alt="${safe(name)}"
      >

      <div class="thumbs">

        ${images.map(img=>`

          <img
            src="${safe(img)}"
            loading="lazy"
            onclick="changeImage('${safe(img)}')"
          >

        `).join("")}

      </div>

    </div>


    <div class="box">

      <div class="title">
        ${safe(name)}
      </div>

      <div class="rating">
        ⭐ ${safe(rating)}
        <span style="color:#888">
          | Customer Reviews
        </span>
      </div>

      <div>

        <span class="price">
          ₹${price}
        </span>

        ${
          oldPrice > price
          ? `<span class="old">₹${oldPrice}</span>`
          : ""
        }

        ${
          discount
          ? `<span class="discount">
               ${discount}% OFF
             </span>`
          : ""
        }

      </div>

    </div>


    <div class="box">

      <div class="sectionTitle">
        Product Details
      </div>

      <div class="desc">
        ${safe(description)}
      </div>

    </div>


    <div class="box">

      <div class="benefits">

        <div>
          🔄<br>
          Easy Return
        </div>

        <div>
          💵<br>
          Cash on Delivery
        </div>

        <div>
          🚚<br>
          Fast Delivery
        </div>

      </div>

    </div>


    <div class="box">

      <div class="sectionTitle">
        🔥 আরও Product দেখুন
      </div>

      <div
        id="recommendations"
        class="recommend">

        <div class="loading">
          Loading...
        </div>

      </div>

    </div>

  `;


  document.getElementById("actions")
    .style.display = "flex";

}


// ==========================
// CHANGE IMAGE
// ==========================

window.changeImage =
function(image){

  document.getElementById("mainImage")
    .src = image;

};


// ==========================
// ADD CART
// ==========================

function addCart(product){

  let cart =
    JSON.parse(
      localStorage.getItem("cart") || "[]"
    );


  const found =
    cart.find(item =>
      String(item.id) === String(product.id)
    );


  if(found){

    found.quantity =
      Number(found.quantity || 1) + 1;

  }else{

    cart.push({

      id:product.id,

      name:product.name || "Product",

      price:Number(product.price || 0),

      image:getImage(product),

      quantity:1

    });

  }


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  alert("🛒 Product Cart-এ যোগ হয়েছে!");

}


window.addCurrentCart =
function(){

  if(currentProduct)
    addCart(currentProduct);

};


window.buyNow =
function(){

  if(!currentProduct)
    return;

  addCart(currentProduct);

  location.href =
    "payment.html";

};


// ==========================
// RECOMMENDATIONS
// ==========================

async function loadRecommendations(){

  const box =
    document.getElementById(
      "recommendations"
    );

  if(!box) return;


  try{

    const snapshot =
      await getDocs(
        collection(db,"products")
      );


    const products = [];


    snapshot.forEach(doc=>{

      if(doc.id !== productId){

        products.push({

          id:doc.id,
          ...doc.data()

        });

      }

    });


    // সর্বোচ্চ ১০টা product
    const list =
      products.slice(0,10);


    if(!list.length){

      box.innerHTML =
        "<div>আরও Product নেই</div>";

      return;

    }


    box.innerHTML =
      list.map(product=>{

        const image =
          getImage(product);

        const name =
          product.name || "Product";

        const price =
          Number(product.price || 0);


        return `

          <div
            class="recCard"
            onclick="openRecommended('${product.id}')"
          >

            <img
              src="${safe(image)}"
              loading="lazy"
              decoding="async"
            >

            <div class="recName">
              ${safe(name)}
            </div>

            <div class="recPrice">
              ₹${price}
            </div>

            <button
              onclick="event.stopPropagation();
              addRecommended('${product.id}')">

              🛒 Add to Cart

            </button>

          </div>

        `;

      }).join("");


  }catch(error){

    console.error(error);

    box.innerHTML =
      "<div>Product load করা যায়নি</div>";

  }

}


// ==========================
// OPEN RECOMMENDED
// ==========================

window.openRecommended =
function(id){

  location.href =
    "product.html?id=" +
    encodeURIComponent(id);

};


// ==========================
// ADD RECOMMENDED
// ==========================

window.addRecommended =
async function(id){

  try{

    const snap =
      await getDoc(
        doc(db,"products",id)
      );


    if(!snap.exists())
      return;


    const product = {
      id:snap.id,
      ...snap.data()
    };


    addCart(product);

  }catch(error){

    console.error(error);

  }

};


// START
loadProduct();

</script>

</body>
</html>
