<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details - SayonMart</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#222;
  padding-bottom:80px;
}

header{
  height:58px;
  background:#111;
  color:#FFD700;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:20;
}

.back{
  position:absolute;
  left:15px;
  color:white;
  text-decoration:none;
  font-size:28px;
}

.container{
  max-width:900px;
  margin:auto;
}

/* IMAGE */

.image-box{
  background:white;
  padding:10px;
}

.main-img{
  width:100%;
  height:390px;
  object-fit:contain;
  background:#fff;
}

.thumbs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 2px;
}

.thumb{
  width:65px;
  height:65px;
  object-fit:cover;
  border:2px solid #ddd;
  border-radius:8px;
  flex-shrink:0;
  cursor:pointer;
}

.thumb.active{
  border:3px solid #111;
}

/* RATING */

.rating-box{
  padding:10px 18px;
  border-bottom:8px solid #f5f5f5;
}

.rating{
  display:inline-block;
  background:#008a45;
  color:white;
  padding:5px 9px;
  border-radius:5px;
  font-weight:bold;
}

.review-count{
  color:#777;
  margin-left:8px;
}

/* PRODUCT */

.product-info{
  padding:15px 18px;
  border-bottom:8px solid #f5f5f5;
}

.seller{
  color:#777;
  font-size:14px;
  margin-bottom:8px;
}

.title{
  font-size:21px;
  line-height:1.4;
  margin-bottom:12px;
}

.price-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.price{
  font-size:29px;
  font-weight:bold;
}

.old-price{
  font-size:19px;
  color:#888;
  text-decoration:line-through;
}

.discount{
  color:#008a45;
  font-size:18px;
  font-weight:bold;
}

.offer{
  margin-top:15px;
  background:#e5f8ed;
  border-radius:10px;
  padding:12px;
  font-weight:bold;
}

/* COLOR */

.section{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.section-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:12px;
}

.color-name{
  font-weight:normal;
}

.color-list{
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.color-btn{
  min-width:70px;
  padding:7px;
  background:white;
  border:2px solid #ddd;
  border-radius:10px;
  cursor:pointer;
}

.color-btn.selected{
  border:3px solid #111;
}

.color-btn img{
  width:60px;
  height:70px;
  object-fit:cover;
  border-radius:7px;
}

.color-text{
  font-size:12px;
  margin-top:4px;
}

/* SIZE */

.size-list{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.size-btn{
  min-width:75px;
  height:52px;
  background:white;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:17px;
  cursor:pointer;
}

.size-btn.selected{
  border:3px solid #111;
  font-weight:bold;
}

.size-chart{
  color:#1769d1;
  font-weight:bold;
  margin-left:10px;
  cursor:pointer;
}

/* DELIVERY */

.delivery{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.delivery-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px;
}

.delivery-box{
  background:#f5f7f9;
  padding:15px;
  border-radius:10px;
}

.delivery-row{
  padding:8px 0;
  font-size:16px;
}

/* SELLER */

.seller-box{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.seller-name{
  font-size:18px;
  font-weight:bold;
}

.seller-rating{
  margin-top:7px;
  color:#008a45;
}

/* DESCRIPTION */

.description{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.description p{
  line-height:1.6;
  color:#555;
}

/* BENEFITS */

.benefits{
  padding-left:22px;
  line-height:2;
}

/* RECOMMEND */

.more{
  padding:18px;
}

.recommendations{
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.rec{
  min-width:155px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:8px;
  background:white;
  cursor:pointer;
}

.rec img{
  width:100%;
  height:140px;
  object-fit:contain;
}

.rec-name{
  font-size:14px;
  height:38px;
  overflow:hidden;
}

.rec-price{
  font-weight:bold;
  font-size:17px;
  margin-top:5px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:white;
  display:flex;
  gap:8px;
  padding:10px;
  box-shadow:0 -2px 10px #aaa;
  z-index:30;
}

.bottom button{
  flex:1;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.cart{
  background:#fff;
  border:2px solid #111 !important;
  color:#111;
}

.buy{
  background:#FFD700;
  color:#111;
}

.loading{
  text-align:center;
  padding:50px;
}

.error{
  text-align:center;
  padding:40px 20px;
  color:#d00000;
}

/* SIZE POPUP */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:100;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:white;
  width:90%;
  max-width:450px;
  border-radius:12px;
  padding:20px;
  max-height:80vh;
  overflow:auto;
}

.modal-close{
  float:right;
  font-size:25px;
  cursor:pointer;
}

.size-table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

.size-table th,
.size-table td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="back">←</a>
  SayonMart
</header>

<div id="content" class="container">
  <div class="loading">Product loading...</div>
</div>

<!-- SIZE CHART -->
<div id="sizeModal" class="modal">
  <div class="modal-box">

    <span class="modal-close" onclick="closeSizeChart()">×</span>

    <h2>Size Chart</h2>

    <table class="size-table">
      <tr>
        <th>Size</th>
        <th>Chest</th>
        <th>Length</th>
      </tr>

      <tr>
        <td>M</td>
        <td>38</td>
        <td>28</td>
      </tr>

      <tr>
        <td>L</td>
        <td>40</td>
        <td>29</td>
      </tr>

      <tr>
        <td>XL</td>
        <td>42</td>
        <td>30</td>
      </tr>

      <tr>
        <td>XXL</td>
        <td>44</td>
        <td>31</td>
      </tr>
    </table>

  </div>
</div>

<!-- BOTTOM BUTTON -->
<div class="bottom" id="bottomBar" style="display:none">

  <button class="cart" id="cartBtn">
    🛒 Add to Cart
  </button>

  <button class="buy" id="buyBtn">
    Buy Now
  </button>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const content = document.getElementById("content");
const bottomBar = document.getElementById("bottomBar");

const params = new URLSearchParams(location.search);

const productId = params.get("id");

let currentProduct = null;

let selectedSize = "";

let selectedColor = "";


/* MONEY */

function money(value){

  const n = Number(value);

  if(isNaN(n)){
    return "₹" + value;
  }

  return "₹" + n;
}


/* SECURITY */

function escapeHTML(value){

  return String(value ?? "")

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ADD CART */

function addToCart(product){

  let cart =
    JSON.parse(localStorage.getItem("cart") || "[]");


  const old =
    cart.find(x => x.id === product.id);


  if(old){

    old.quantity =
      (old.quantity || 1) + 1;

  }else{

    cart.push({

      id: product.id,

      name: product.name || "Product",

      price: Number(product.price) || 0,

      image:
        product.image ||
        product.imageUrl ||
        "",

      quantity: 1,

      size: selectedSize,

      color: selectedColor

    });

  }


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  alert("Product cart-এ যোগ হয়েছে!");

}


/* BUY NOW */

function buyNow(product){

  addToCart(product);

  location.href = "payment.html";

}


/* IMAGE */

window.changeImage = function(src,element){

  document.getElementById("mainImage").src = src;

  document
    .querySelectorAll(".thumb")
    .forEach(x => x.classList.remove("active"));

  if(element){

    element.classList.add("active");

  }

};


/* SIZE */

window.selectSize = function(size){

  selectedSize = size;

  document
    .querySelectorAll(".size-btn")
    .forEach(btn => {

      btn.classList.remove("selected");

      if(btn.dataset.size === size){

        btn.classList.add("selected");

      }

    });

};


/* COLOR */

window.selectColor = function(color,image){

  selectedColor = color;

  document.getElementById("selectedColor").innerText = color;

  if(image){

    document.getElementById("mainImage").src = image;

  }

  document
    .querySelectorAll(".color-btn")
    .forEach(btn => {

      btn.classList.remove("selected");

      if(btn.dataset.color === color){

        btn.classList.add("selected");

      }

    });

};


/* SIZE CHART */

window.openSizeChart = function(){

  document.getElementById("sizeModal").style.display = "flex";

};


window.closeSizeChart = function(){

  document.getElementById("sizeModal").style.display = "none";

};


/* SHOW PRODUCT */

function showProduct(product,allProducts){

  currentProduct = product;


  const image =
    product.image ||
    product.imageUrl ||
    "https://via.placeholder.com/500";


  const name =
    product.name ||
    "Product";


  const price =
    product.price ?? 0;


  const oldPrice =
    product.oldPrice;


  const discount =
    product.discount;


  const rating =
    product.rating || "4.5";


  const reviews =
    product.reviews || "0";


  const description =
    product.description ||
    "এই পণ্যের কোনো বিবরণ দেওয়া হয়নি।";


  const seller =
    product.seller ||
    "SayonMart Seller";


  const sellerRating =
    product.sellerRating ||
    "4.2";


  const delivery =
    product.delivery ||
    "5-7 দিনের মধ্যে";


  const benefits =
    Array.isArray(product.benefits)

      ? product.benefits

      : [

          "ভালো মানের পণ্য",

          "সহজে অর্ডার করুন",

          "SayonMart থেকে কিনুন"

        ];


  /* IMAGES */

  let images = [];

  if(Array.isArray(product.images)){

    images = product.images;

  }


  images = [
    image,
    ...images
  ];


  images =
    [...new Set(images)]
    .filter(Boolean);


  /* COLORS */

  let colors =
    Array.isArray(product.colors)
      ? product.colors
      : ["Grey","Green","Pink"];


  /* SIZES */

  let sizes =
    Array.isArray(product.sizes)
      ? product.sizes
      : ["M","L","XL","XXL"];


  selectedColor =
    colors[0] || "";


  /* RELATED */

  const related =
    allProducts

      .filter(p => p.id !== product.id)

      .slice(0,10);


  content.innerHTML = `

    <!-- IMAGE -->

    <div class="image-box">

      <img
        id="mainImage"
        class="main-img"
        src="${escapeHTML(images[0])}"
        alt="${escapeHTML(name)}"
      >

      <div class="thumbs">

        ${images.map((img,index)=>`

          <img

            class="thumb ${index === 0 ? "active" : ""}"

            src="${escapeHTML(img)}"

            onclick="changeImage(
              '${escapeHTML(img)}',
              this
            )"

          >

        `).join("")}

      </div>

    </div>


    <!-- RATING -->

    <div class="rating-box">

      <span class="rating">
        ★ ${escapeHTML(rating)}
      </span>

      <span class="review-count">
        ${escapeHTML(reviews)} Ratings & Reviews
      </span>

    </div>


    <!-- PRODUCT INFO -->

    <div class="product-info">

      <div class="seller">
        ${escapeHTML(seller)}
      </div>

      <div class="title">
        ${escapeHTML(name)}
      </div>


      <div class="price-row">

        <span class="price">
          ${money(price)}
        </span>

        ${
          oldPrice
          ?
          `<span class="old-price">
            ${money(oldPrice)}
          </span>`
          :
          ""
        }

        ${
          discount
          ?
          `<span class="discount">
            ↓${escapeHTML(discount)}%
          </span>`
          :
          ""
        }

      </div>


      <div class="offer">
        🏷️ Special offer available for you
      </div>

    </div>


    <!-- COLOR -->

    <div class="section">

      <div class="section-title">

        Selected Color:
        <span
          class="color-name"
          id="selectedColor"
        >
          ${escapeHTML(selectedColor)}
        </span>

      </div>


      <div class="color-list">

        ${colors.map((color,index)=>{

          const colorImage =
            images[index] || image;

          return `

            <button

              class="color-btn ${
                index === 0 ? "selected" : ""
              }"

              data-color="${escapeHTML(color)}"

              onclick="selectColor(
                '${escapeHTML(color)}',
                '${escapeHTML(colorImage)}'
              )"

            >

              <img
                src="${escapeHTML(colorImage)}"
              >

              <div class="color-text">
                ${escapeHTML(color)}
              </div>

            </button>

          `;

        }).join("")}

      </div>

    </div>


    <!-- SIZE -->

    <div class="section">

      <div class="section-title">

        Select Size

        <span
          class="size-chart"
          onclick="openSizeChart()"
        >
          Size Chart
        </span>

      </div>


      <div class="size-list">

        ${sizes.map(size=>`

          <button

            class="size-btn"

            data-size="${escapeHTML(size)}"

            onclick="selectSize(
              '${escapeHTML(size)}'
            )"

          >

            ${escapeHTML(size)}

          </button>

        `).join("")}

      </div>

    </div>


    <!-- DELIVERY -->

    <div class="delivery">

      <div class="delivery-title">
        Delivery details
      </div>

      <div class="delivery-box">

        <div class="delivery-row">
          📍 Enter your delivery address
        </div>

        <div class="delivery-row">
          🚚 Delivery by ${escapeHTML(delivery)}
        </div>

        <div class="delivery-row">
          💵 Cash on Delivery available
        </div>

      </div>

    </div>


    <!-- SELLER -->

    <div class="seller-box">

      <div class="seller-name">
        🏪 Fulfilled by ${escapeHTML(seller)}
      </div>

      <div class="seller-rating">
        ★ ${escapeHTML(sellerRating)}
        Seller Rating
      </div>

    </div>


    <!-- DESCRIPTION -->

    <div class="description">

      <h3>Product Description</h3>

      <p>
        ${escapeHTML(description)}
      </p>


      <h3>Benefits</h3>

      <ul class="benefits">

        ${benefits.map(b=>`

          <li>
            ${escapeHTML(b)}
          </li>

        `).join("")}

      </ul>

    </div>


    <!-- MORE PRODUCTS -->

    <div class="more">

      <h3>More Products</h3>

      <div class="recommendations">

        ${
          related.length

          ?

          related.map(p=>{

            const img =
              p.image ||
              p.imageUrl ||
              "https://via.placeholder.com/300";


            return `

              <div
                class="rec"
                data-id="${escapeHTML(p.id)}"
              >

                <img
                  src="${escapeHTML(img)}"
                >

                <div class="rec-name">

                  ${escapeHTML(
                    p.name || "Product"
                  )}

                </div>

                <div class="rec-price">

                  ${money(
                    p.price ?? 0
                  )}

                </div>

              </div>

            `;

          }).join("")

          :

          "<p>আর কোনো product নেই।</p>"
        }

      </div>

    </div>

  `;


  /* RELATED CLICK */

  document
    .querySelectorAll(".rec")
    .forEach(card=>{

      card.addEventListener(
        "click",
        ()=>{

          location.href =
            "product.html?id=" +
            encodeURIComponent(
              card.dataset.id
            );

        }
      );

    });


  /* BUTTONS */

  document.getElementById(
    "cartBtn"
  ).onclick = ()=>{

    addToCart(currentProduct);

  };


  document.getElementById(
    "buyBtn"
  ).onclick = ()=>{

    buyNow(currentProduct);

  };


  bottomBar.style.display = "flex";

}


/* LOAD */

async function load(){

  if(!productId){

    content.innerHTML = `

      <div class="error">

        Product ID পাওয়া যায়নি।

        <br><br>

        Home থেকে আবার product-এ চাপুন।

      </div>

    `;

    return;

  }


  try{

    const snapshot =
      await getDocs(
        collection(db,"products")
      );


    const allProducts =
      snapshot.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    const product =
      allProducts.find(
        p => p.id === productId
      );


    if(!product){

      content.innerHTML = `

        <div class="error">

          Product পাওয়া যায়নি।

        </div>

      `;

      return;

    }


    showProduct(
      product,
      allProducts
    );


  }catch(error){

    console.error(error);


    content.innerHTML = `

      <div class="error">

        Product load হয়নি।

        <br><br>

        Internet/Firebase connection
        check করুন।

      </div>

    `;

  }

}


load();

</script>

</body>
</html>
