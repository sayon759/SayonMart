<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product - SayonMart</title><style>

body{

  font-family:Arial,sans-serif;

}

header{

}

.container{
  max-width:900px;

}

.image-box{padding:10px}

.main-img{
  width:100%;

.thumbs{

.seller{

}

.title{
  font-size:21px;

  margin-bottom:12px;
}

.price-row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.price{
  font-size:29px;
  font-weight:bold;
}

.old-price{
  color:#888;
  text-decoration:line-through;
  font-size:18px;
}

.discount{

}

.offer{

.section{

}

.section-title{

}

.color-list{
  display:flex;

  overflow-x:auto;
}

.color-btn{
  min-width:70px;
  background:#fff;

  border-radius:9px;

}

.color-btn.selected{border:3px solid #111}

.color-btn img{
  width:58px;
  height:65px;
  object-fit:cover;
  border-radius:6px;
}

.color-text{

}

.size-list{
  display:flex;

  flex-wrap:wrap;
}

.size-btn{

  background:#fff;
  border:2px solid #ddd;
  border-radius:8px;

}

.size-btn.selected{
  border:3px solid #111;
  font-weight:bold;
}

.size-chart{
  float:right;
  color:#1769d1;
  font-size:14px;
  cursor:pointer;
}

.delivery{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.delivery-box{
  background:#f5f7f9;
  padding:14px;
  border-radius:10px;
}

.delivery-row{padding:7px 0}

.seller-box{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.seller-name{
  font-size:18px;
  font-weight:bold;
}

.seller-rating{
  margin-top:7px;
  color:#008a45;
}

.description{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.description p{
  color:#555;
  line-height:1.6;
}

.benefits{line-height:2}

.more{padding:18px}

.recommendations{
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.rec{
  min-width:150px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:8px;
}

.rec img{
  width:100%;
  height:130px;
  object-fit:contain;
}

.rec-name{
  font-size:14px;
  height:38px;
  overflow:hidden;
}

.rec-price{
  font-weight:bold;
  margin-top:5px;
}

/* REVIEWS */

.reviews-section{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.review-summary{
  background:#f5f7f9;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  gap:15px;
}

.average-rating{
  font-size:32px;
  font-weight:bold;
}

.average-stars{
  color:#f5b400;
  font-size:22px;
}

.total-reviews{
  color:#777;
  margin-top:3px;
}

.review-card{
  border-bottom:1px solid #ddd;
  padding:15px 0;
}

.review-card:last-child{
  border-bottom:0;
}

.review-user{
  font-weight:bold;
  margin-bottom:5px;
}

.review-stars{
  color:#f5b400;
  font-size:18px;
  margin-bottom:7px;
}

.review-text{
  color:#444;
  line-height:1.5;
  margin-bottom:10px;
  word-break:break-word;
}

.review-photos{
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.review-photo{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
}

.no-reviews{
  text-align:center;
  color:#777;
  padding:20px 5px;
}

.review-loading{
  text-align:center;
  color:#777;
  padding:15px;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:#fff;
  display:flex;
  gap:8px;
  padding:10px;
  box-shadow:0 -2px 10px #aaa;
  z-index:30;
}

.bottom button{
  flex:1;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
}

.cart{
  background:#fff;
  border:2px solid #111 !important;
}

.buy{background:#FFD700}

.loading{
  text-align:center;
  padding:50px;
}

.error{
  text-align:center;
  padding:40px 20px;
  color:red;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:100;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:white;
  width:90%;
  max-width:430px;
  padding:20px;
  border-radius:12px;
}

.close{
  float:right;
  font-size:25px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #ddd;
  padding:9px;
  text-align:center;
}
</style></head><body><header>
<a href="index.html" class="back">←</a>
SayonMart
</header><div id="content" class="container">
  <div class="loading">Product loading...</div>
</div><div id="sizeModal" class="modal">
  <div class="modal-box"><span class="close" onclick="closeSizeChart()">×</span>

<h2>Size Chart</h2>

<table>
  <tr>
    <th>Size</th>
    <th>Chest</th>
    <th>Length</th>
  </tr>
  <tr>
    <td>M</td>
    <td>38</td>
    <td>28</td>
  </tr>
  <tr>
    <td>L</td>
    <td>40</td>
    <td>29</td>
  </tr>
  <tr>
    <td>XL</td>
    <td>42</td>
    <td>30</td>
  </tr>
  <tr>
    <td>XXL</td>
    <td>44</td>
    <td>31</td>
  </tr>
</table>

  </div>
</div><div class="bottom" id="bottomBar" style="display:none"><button class="cart" id="cartBtn">
🛒 Add to Cart
</button><button class="buy" id="buyBtn">
Buy Now
</button></div><script type="module">

import {db} from "./firebase.js";

import {
collection,
getDocs,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const content=document.getElementById("content");
const bottomBar=document.getElementById("bottomBar");

const productId=
new URLSearchParams(location.search).get("id");

let currentProduct=null;
let selectedSize="";
let selectedColor="";


function money(value){

let n=Number(value);

return isNaN(n) ? "₹"+value : "₹"+n;

}


function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function getCategory(product){

return String(
product.category ||
product.type ||
""
).toLowerCase();

}


function hasSize(category){

return (
category.includes("fashion") ||
category.includes("shirt") ||
category.includes("tshirt") ||
category.includes("t-shirt") ||
category.includes("dress") ||
category.includes("pant") ||
category.includes("clothing") ||
category.includes("জামা") ||
category.includes("পোশাক") ||
category.includes("shoe") ||
category.includes("shoes") ||
category.includes("জুতা")
);

}


function getSizes(product,category){

if(
category.includes("shoe") ||
category.includes("shoes") ||
category.includes("জুতা")
){

return ["6","7","8","9","10"];

}

if(hasSize(category)){

return ["M","L","XL","XXL"];

}

return [];

}


/* REVIEW STAR */

function getStars(rating){

let r=Number(rating)||0;

let html="";

for(let i=1;i<=5;i++){

html += i<=r ? "★" : "☆";

}

return html;

}


/* LOAD REVIEWS */

async function loadReviews(){

const section=
document.getElementById("reviewsSection");

if(!section || !productId) return;

section.innerHTML=`
<div class="review-loading">
Reviews loading...
</div>
`;

try{

const snapshot=
await getDocs(
query(
collection(db,"reviews"),
where("productId","==",productId)
)
);

let reviews=
snapshot.docs.map(doc=>({
id:doc.id,
...doc.data()
}));

reviews.sort((a,b)=>{

const aTime=
a.createdAt?.seconds ||
0;

const bTime=
b.createdAt?.seconds ||
0;

return bTime-aTime;

});


let total=reviews.length;

let average=0;

if(total){

average=
reviews.reduce(
(sum,r)=>sum+(Number(r.rating)||0),
0
)/total;

}


const roundedAverage=
total ? average.toFixed(1) : "0.0";


section.innerHTML=`

<h3>Customer Reviews</h3>

<div class="review-summary">

<div>

<div class="average-rating">
${roundedAverage} ★
</div>

<div class="average-stars">
${getStars(Math.round(average))}
</div>

</div>

<div>

<div class="total-reviews">
${total} Customer Review${total===1?"":"s"}
</div>

<div style="color:#777;margin-top:5px">
Verified customer reviews
</div>

</div>

</div>

${
total===0
?
`
<div class="no-reviews">
এই পণ্যের কোনো review এখনো নেই।
</div>
`
:
reviews.map(review=>{

const userName=
escapeHTML(
review.userName ||
"Customer"
);

const comment=
escapeHTML(
review.comment ||
""
);

const rating=
Number(review.rating)||0;

const photos=
Array.isArray(review.photos)
?
review.photos
:
[];


return `

<div class="review-card">

<div class="review-user">
👤 ${userName}
</div>

<div class="review-stars">
${getStars(rating)}
</div>

${
comment
?
`
<div class="review-text">
${comment}
</div>
`
:
""
}

${
photos.length
?
`
<div class="review-photos">

${photos.map(photo=>`

<img
class="review-photo"
src="${escapeHTML(photo)}"
loading="lazy"
>

`).join("")}

</div>
`
:
""
}

</div>

`;

}).join("")

}
`;

}catch(error){

console.error("Review load error:",error);

section.innerHTML=`

<h3>Customer Reviews</h3>

<div class="no-reviews">
Review load করা যায়নি।
</div>

`;

}

}


/* PRODUCT */

function showProduct(product,allProducts){

currentProduct=product;

const category=getCategory(product);

const image=
product.image ||
product.imageUrl ||
product.productImage ||
(
Array.isArray(product.images)
?
product.images[0]
:
""
) ||
"https://via.placeholder.com/500";

const name=
product.name ||
product.productName ||
"Product";

const price=
product.price ?? 0;

const oldPrice=
product.oldPrice;

const discount=
product.discount;

const rating=
product.rating || "4.5";

const reviews=
product.reviews || "0";

const description=
product.description ||
"এই পণ্যের কোনো বিবরণ দেওয়া হয়নি।";

const seller=
product.seller ||
"SayonMart Seller";

const delivery=
product.delivery ||
"5-7 দিনের মধ্যে";


let images=[];

if(Array.isArray(product.images)){
images=product.images;
}

images=[image,...images];

images=[...new Set(images)];


let colors=[];

if(Array.isArray(product.colors)){
colors=product.colors;
}


let sizes=
getSizes(product,category);


if(
Array.isArray(product.sizes) &&
product.sizes.length>0 &&
hasSize(category)
){

sizes=product.sizes;

}


const related=
allProducts
.filter(p=>p.id!==product.id)
.slice(0,8);


selectedColor=
colors.length ? colors[0] : "";


content.innerHTML=`

<div class="image-box">

<img
id="mainImage"
class="main-img"
src="${escapeHTML(images[0])}"
>

<div class="thumbs">

${images.map((img,i)=>`

<img
class="thumb ${i===0?"active":""}"
src="${escapeHTML(img)}"
onclick="changeImage('${escapeHTML(img)}',this)"
>

`).join("")}

</div>

</div>


<div class="rating-box">

<span class="rating">
★ ${escapeHTML(rating)}
</span>

<span class="review-count">
${escapeHTML(reviews)} Ratings & Reviews
</span>

</div>


<div class="product-info">

<div class="seller">
${escapeHTML(seller)}
</div>

<div class="title">
${escapeHTML(name)}
</div>

<div class="price-row">

<span class="price">
${money(price)}
</span>

${
oldPrice
?
`<span class="old-price">
${money(oldPrice)}
</span>`
:""
}

${
discount
?
`<span class="discount">
${escapeHTML(discount)}% OFF
</span>`
:""
}

</div>

<div class="offer">
🏷️ Special offer available
</div>

</div>


${
colors.length
?
`

<div class="section">

<div class="section-title">
Color:
<span id="selectedColor">
${escapeHTML(selectedColor)}
</span>
</div>

<div class="color-list">

${colors.map((color,i)=>`

<button
class="color-btn ${i===0?"selected":""}"
data-color="${escapeHTML(color)}"
onclick="selectColor('${escapeHTML(color)}','${escapeHTML(images[i]||image)}')"
>

<img src="${escapeHTML(images[i]||image)}">

<div class="color-text">
${escapeHTML(color)}
</div>

</button>

`).join("")}

</div>

</div>

`
:""
}


${
sizes.length
?
`

<div class="section">

<div class="section-title">

Select Size

<span
class="size-chart"
onclick="openSizeChart()"
>
Size Chart
</span>

</div>

<div class="size-list">

${sizes.map(size=>`

<button
class="size-btn"
data-size="${escapeHTML(size)}"
onclick="selectSize('${escapeHTML(size)}')"
>

${escapeHTML(size)}

</button>

`).join("")}

</div>

</div>

`
:""
}


<div class="delivery">

<h3>Delivery Details</h3>

<div class="delivery-box">

<div class="delivery-row">
📍 Delivery address
</div>

<div class="delivery-row">
🚚 Delivery by ${escapeHTML(delivery)}
</div>

<div class="delivery-row">
💵 Cash on Delivery available
</div>

</div>

</div>


<div class="seller-box">

<div class="seller-name">
🏪 ${escapeHTML(seller)}
</div>

<div class="seller-rating">
★ 4.2 Seller Rating
</div>

</div>


<div class="description">

<h3>Product Description</h3>

<p>
${escapeHTML(description)}
</p>

<h3>Benefits</h3>

<ul class="benefits">

<li>ভালো মানের পণ্য</li>
<li>সহজে অর্ডার করুন</li>
<li>SayonMart থেকে কিনুন</li>

</ul>

</div>


<div
id="reviewsSection"
class="reviews-section"
>

<div class="review-loading">
Reviews loading...
</div>

</div>


<div class="more">

<h3>More Products</h3>

<div class="recommendations">

${related.map(p=>{

const img=
p.image ||
p.imageUrl ||
p.productImage ||
(
Array.isArray(p.images)
?
p.images[0]
:
""
) ||
"https://via.placeholder.com/300";

return `

<div
class="rec"
onclick="openProduct('${escapeHTML(p.id)}')"
>

<img src="${escapeHTML(img)}">

<div class="rec-name">
${escapeHTML(p.name||p.productName||"Product")}
</div>

<div class="rec-price">
${money(p.price??0)}
</div>

</div>

`;

}).join("")}

</div>

</div>

`;


bottomBar.style.display="flex";


document.getElementById("cartBtn").onclick=()=>{

addToCart(currentProduct);

};


/* ================================
   FIXED BUY NOW
================================ */

document.getElementById("buyBtn").onclick=()=>{

try{

const buyNowProduct={

id:
currentProduct.id ||
productId ||
"",

name:
currentProduct.name ||
currentProduct.productName ||
"Product",

price:
Number(currentProduct.price) || 0,

image:
currentProduct.image ||
currentProduct.imageUrl ||
currentProduct.productImage ||
(
Array.isArray(currentProduct.images)
?
currentProduct.images[0]
:
""
) ||
"",

quantity:1,

size:selectedSize || "",

color:selectedColor || ""

};


if(!buyNowProduct.id){

alert("Product ID পাওয়া যায়নি।");

return;

}


if(
!buyNowProduct.name ||
buyNowProduct.name==="Product"
){

alert("Product name পাওয়া যায়নি।");

return;

}


if(
isNaN(Number(buyNowProduct.price))
){

alert("Product price পাওয়া যায়নি।");

return;

}


/* Save ONLY selected product */

localStorage.setItem(
"sayonmartBuyNow",
JSON.stringify(buyNowProduct)
);


/* Go directly to payment */

location.href="payment.html";

}catch(error){

console.error("Buy Now Error:",error);

alert("Buy Now কাজ করছে না। আবার চেষ্টা করুন।");

}

};


loadReviews();

}


/* IMAGE */

window.changeImage=function(src,element){

document.getElementById("mainImage").src=src;

document
.querySelectorAll(".thumb")
.forEach(x=>x.classList.remove("active"));

element.classList.add("active");

};


/* SIZE */

window.selectSize=function(size){

selectedSize=size;

document
.querySelectorAll(".size-btn")
.forEach(btn=>{

btn.classList.remove("selected");

if(btn.dataset.size===size){

btn.classList.add("selected");

}

});

};


/* COLOR */

window.selectColor=function(color,image){

selectedColor=color;

document.getElementById(
"selectedColor"
).innerText=color;

document.getElementById(
"mainImage"
).src=image;

document
.querySelectorAll(".color-btn")
.forEach(btn=>{

btn.classList.remove("selected");

if(btn.dataset.color===color){

btn.classList.add("selected");

}

});

};


/* SIZE CHART */

window.openSizeChart=function(){

document.getElementById(
"sizeModal"
).style.display="flex";

};


window.closeSizeChart=function(){

document.getElementById(
"sizeModal"
).style.display="none";

};


/* RELATED */

window.openProduct=function(id){

location.href=
"product.html?id="+
encodeURIComponent(id);

};


/* CART */

function addToCart(product){

let cart=
JSON.parse(
localStorage.getItem("cart")||"[]"
);

let item=
cart.find(x=>x.id===product.id);

if(item){

item.quantity=
(item.quantity||1)+1;

}else{

cart.push({

id:product.id,

name:
product.name ||
product.productName ||
"Product",

price:
Number(product.price)||0,

image:
product.image ||
product.imageUrl ||
product.productImage ||
(
Array.isArray(product.images)
?
product.images[0]
:
""
) ||
"",

quantity:1,

size:selectedSize,

color:selectedColor

});

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert("Product cart-এ যোগ হয়েছে!");

}


/* LOAD */

async function loadProduct(){

if(!productId){

content.innerHTML=`

<div class="error">

Product ID পাওয়া যায়নি।

</div>

`;

return;

}


try{

const snapshot=
await getDocs(
collection(db,"products")
);


const products=
snapshot.docs.map(doc=>({

id:doc.id,
...doc.data()

}));


const product=
products.find(
p=>p.id===productId
);


if(!product){

content.innerHTML=`

<div class="error">
