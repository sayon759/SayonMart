<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - SayonMart</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222;padding-bottom:75px}
header{background:#e91e63;color:white;padding:15px;text-align:center;font-size:21px;font-weight:bold;position:sticky;top:0;z-index:10}
.back{position:absolute;left:15px;top:15px;color:white;text-decoration:none;font-size:18px}
.container{max-width:900px;margin:auto}
.card{background:white;margin:12px;border-radius:10px;padding:14px}
.main-img{width:100%;height:330px;object-fit:contain;border-radius:8px;background:#fff}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.thumbs img{width:65px;height:65px;object-fit:cover;border:2px solid #ddd;border-radius:6px;cursor:pointer}
.title{font-size:21px;font-weight:bold;margin:10px 0}
.price{font-size:25px;font-weight:bold;color:#e91e63}
.old{text-decoration:line-through;color:#888;margin-left:8px}
.discount{color:green;font-weight:bold;margin-left:8px}
.rating{display:inline-block;background:#168a43;color:white;padding:5px 8px;border-radius:5px;margin:8px 0}
h3{margin-bottom:8px}
.benefits{padding-left:20px;line-height:1.8}
.recommendations{display:flex;gap:10px;overflow-x:auto}
.rec{min-width:155px;background:white;border:1px solid #ddd;border-radius:8px;padding:8px;cursor:pointer}
.rec img{width:100%;height:140px;object-fit:contain}
.rec-name{font-size:14px;height:38px;overflow:hidden;margin:5px 0}
.rec-price{font-weight:bold;color:#e91e63}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;display:flex;gap:8px;box-shadow:0 -2px 8px #aaa;z-index:20}
.bottom button{flex:1;border:0;padding:14px;border-radius:7px;font-size:16px;font-weight:bold;cursor:pointer}
.cart{background:#ff9800;color:white}
.buy{background:#e91e63;color:white}
.loading{text-align:center;padding:40px}
.error{text-align:center;padding:30px;color:#d00}
</style>
</head>
<body>

<header>
<a class="back" href="index.html">←</a>
SayonMart
</header>

<div id="content" class="container">
  <div class="loading">Product loading...</div>
</div>

<div class="bottom" id="bottomBar" style="display:none">
  <button class="cart" id="cartBtn">🛒 Add to Cart</button>
  <button class="buy" id="buyBtn">⚡ Buy Now</button>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const content = document.getElementById("content");
const bottomBar = document.getElementById("bottomBar");

const params = new URLSearchParams(location.search);
const productId = params.get("id");

let currentProduct = null;

function money(value){
  const n = Number(value);
  return "₹" + (isNaN(n) ? value : n);
}

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function addToCart(product){
  let cart = JSON.parse(localStorage.getItem("cart") || "[]");
  const old = cart.find(x => x.id === product.id);

  if(old){
    old.quantity = (old.quantity || 1) + 1;
  }else{
    cart.push({
      id: product.id,
      name: product.name || "Product",
      price: Number(product.price) || 0,
      image: product.image || "",
      quantity: 1
    });
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Product cart-এ যোগ হয়েছে!");
}

function buyNow(product){
  addToCart(product);
  location.href = "payment.html";
}

function showProduct(product, allProducts){
  currentProduct = product;

  const image = product.image || product.imageUrl || "https://via.placeholder.com/500";
  const name = product.name || "Product";
  const price = product.price ?? 0;
  const oldPrice = product.oldPrice;
  const discount = product.discount;
  const rating = product.rating || "4.5";
  const description = product.description || "এই পণ্যের কোনো বিবরণ দেওয়া হয়নি।";

  const benefits = Array.isArray(product.benefits)
    ? product.benefits
    : ["ভালো মানের পণ্য","সহজে অর্ডার করুন","SayonMart থেকে কিনুন"];

  const related = allProducts
    .filter(p => p.id !== product.id)
    .slice(0,10);

  content.innerHTML = `
    <div class="card">
      <img id="mainImage" class="main-img" src="${escapeHTML(image)}" alt="${escapeHTML(name)}">
      <div class="thumbs">
        <img src="${escapeHTML(image)}" onclick="document.getElementById('mainImage').src=this.src">
        ${(product.images || []).map(img =>
          `<img src="${escapeHTML(img)}" onclick="document.getElementById('mainImage').src=this.src">`
        ).join("")}
      </div>
    </div>

    <div class="card">
      <div class="title">${escapeHTML(name)}</div>
      <span class="rating">★ ${escapeHTML(rating)}</span>
      <div>
        <span class="price">${money(price)}</span>
        ${oldPrice ? `<span class="old">${money(oldPrice)}</span>` : ""}
        ${discount ? `<span class="discount">${escapeHTML(discount)}% OFF</span>` : ""}
      </div>

      <h3>Product Description</h3>
      <p>${escapeHTML(description)}</p>

      <h3>Benefits</h3>
      <ul class="benefits">
        ${benefits.map(b => `<li>${escapeHTML(b)}</li>`).join("")}
      </ul>
    </div>

    <div class="card">
      <h3>More Products</h3>
      <div class="recommendations">
        ${
          related.length
          ? related.map(p => {
              const img = p.image || p.imageUrl || "https://via.placeholder.com/300";
              return `
                <div class="rec" data-id="${escapeHTML(p.id)}">
                  <img src="${escapeHTML(img)}" alt="${escapeHTML(p.name || "Product")}">
                  <div class="rec-name">${escapeHTML(p.name || "Product")}</div>
                  <div class="rec-price">${money(p.price ?? 0)}</div>
                </div>
              `;
            }).join("")
          : "<p>আর কোনো product নেই।</p>"
        }
      </div>
    </div>
  `;

  document.querySelectorAll(".rec").forEach(card => {
    card.addEventListener("click", () => {
      location.href = "product.html?id=" + encodeURIComponent(card.dataset.id);
    });
  });

  document.getElementById("cartBtn").onclick = () => addToCart(currentProduct);
  document.getElementById("buyBtn").onclick = () => buyNow(currentProduct);
  bottomBar.style.display = "flex";
}

async function load(){
  if(!productId){
    content.innerHTML = `<div class="error">Product ID পাওয়া যায়নি। Home থেকে product-এ আবার চাপুন।</div>`;
    return;
  }

  try{
    const snapshot = await getDocs(collection(db,"products"));
    const allProducts = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
    const product = allProducts.find(p => p.id === productId);

    if(!product){
      content.innerHTML = `<div class="error">Product পাওয়া যায়নি।</div>`;
      return;
    }

    showProduct(product, allProducts);
  }catch(error){
    console.error(error);
    content.innerHTML = `<div class="error">Product load হয়নি। Internet/Firebase connection check করুন।</div>`;
  }
}

load();
</script>

</body>
</html>
