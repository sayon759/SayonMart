<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SayonMart Product</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  padding-bottom:80px;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

/* ================= HEADER ================= */

.header{
  height:58px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:10px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.back-btn{
  border:0;
  background:none;
  font-size:32px;
  width:40px;
  cursor:pointer;
}

.logo{
  flex:1;
  color:#e91e63;
  font-size:20px;
  font-weight:bold;
}

.header-btn{
  border:0;
  background:none;
  font-size:23px;
  cursor:pointer;
}

.cart-number{
  font-size:12px;
  color:#e91e63;
  font-weight:bold;
}

/* ================= LOADING ================= */

.loading{
  text-align:center;
  padding:100px 20px;
  color:#777;
  font-size:16px;
}

/* ================= IMAGE ================= */

.gallery{
  background:#fff;
  padding:10px;
  position:relative;
}

.main-image{
  width:100%;
  height:350px;
  object-fit:contain;
  background:#f2f2f2;
  border-radius:8px;
}

.discount{
  position:absolute;
  top:20px;
  left:20px;
  background:#e91e63;
  color:#fff;
  padding:8px 14px;
  border-radius:5px;
  font-weight:bold;
  z-index:5;
}

.image-number{
  position:absolute;
  right:20px;
  bottom:85px;
  background:rgba(0,0,0,.65);
  color:white;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
}

/* ================= THUMBNAILS ================= */

.thumbnails{
  display:flex;
  gap:8px;
  margin-top:8px;
  overflow-x:auto;
  padding-bottom:3px;
}

.thumbnail{
  width:65px;
  height:65px;
  min-width:65px;
  object-fit:cover;
  border:2px solid #ddd;
  border-radius:7px;
  background:#eee;
  cursor:pointer;
}

.thumbnail.active{
  border:2px solid #e91e63;
}

/* ================= PRODUCT INFO ================= */

.product-info{
  background:#fff;
  margin-top:8px;
  padding:15px;
}

.product-title{
  margin:0;
  font-size:21px;
  line-height:1.35;
}

.description{
  color:#666;
  font-size:14px;
  line-height:1.5;
  margin-top:8px;
}

/* ================= RATING ================= */

.rating-box{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.rating{
  background:#198754;
  color:white;
  padding:5px 9px;
  border-radius:5px;
  font-weight:bold;
}

.reviews{
  color:#777;
  font-size:14px;
}

/* ================= PRICE ================= */

.price-box{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:10px;
}

.current-price{
  color:#e91e63;
  font-size:29px;
  font-weight:bold;
}

.old-price{
  color:#888;
  text-decoration:line-through;
  font-size:17px;
}

.discount-text{
  background:#e91e63;
  color:#fff;
  padding:6px 9px;
  border-radius:5px;
  font-size:13px;
  font-weight:bold;
}

/* ================= BENEFITS ================= */

.benefits{
  display:flex;
  background:#fff0f6;
  margin-top:15px;
  padding:12px 5px;
  border-radius:8px;
}

.benefit{
  flex:1;
  text-align:center;
  font-size:12px;
  border-right:1px solid #eee;
}

.benefit:last-child{
  border-right:0;
}

.benefit-icon{
  display:block;
  font-size:24px;
  margin-bottom:5px;
}

/* ================= OPTION ================= */

.option{
  background:#fff;
  margin-top:8px;
  padding:15px;
}

.option-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:12px;
}

/* ================= COLORS ================= */

.colors{
  display:flex;
  gap:13px;
}

.color{
  width:36px;
  height:36px;
  border-radius:50%;
  border:3px solid #fff;
  box-shadow:0 0 0 1px #bbb;
  cursor:pointer;
}

.color.selected{
  box-shadow:0 0 0 2px #e91e63;
}

/* ================= SIZE ================= */

.sizes{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.size{
  min-width:50px;
  padding:10px 13px;
  background:#fff;
  border:1px solid #ccc;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.size.selected{
  border:2px solid #e91e63;
  color:#e91e63;
}

/* ================= QUANTITY ================= */

.quantity{
  display:flex;
  align-items:center;
}

.quantity button{
  width:42px;
  height:40px;
  border:1px solid #ddd;
  background:#f5f5f5;
  font-size:22px;
  cursor:pointer;
}

.quantity-number{
  width:55px;
  height:40px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
  font-weight:bold;
}

/* ================= DETAILS ================= */

.details{
  background:#fff;
  margin-top:8px;
  padding:15px;
}

.details-title{
  margin:0 0 12px;
  font-size:19px;
}

.detail-row{
  display:flex;
  padding:9px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.detail-label{
  width:40%;
  color:#777;
}

.detail-value{
  width:60%;
  font-weight:500;
}

/* ================= BOTTOM ================= */

.bottom-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:#fff;
  display:flex;
  gap:8px;
  padding:8px;
  box-shadow:0 -2px 10px rgba(0,0,0,.18);
  z-index:2000;
}

.cart-button{
  flex:1;
  border:2px solid #e91e63;
  background:#fff;
  color:#e91e63;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
}

.buy-button{
  flex:1;
  border:2px solid #e91e63;
  background:#e91e63;
  color:#fff;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:12px 20px;
  border-radius:25px;
  display:none;
  z-index:3000;
  font-size:14px;
  white-space:nowrap;
}

/* ================= ERROR ================= */

.error{
  background:#fff;
  margin-top:10px;
  padding:70px 20px;
  text-align:center;
}

.error button{
  border:0;
  background:#e91e63;
  color:#fff;
  padding:12px 20px;
  border-radius:7px;
}

/* ================= DESKTOP ================= */

@media(min-width:700px){

  .main-image{
    height:500px;
  }

  .gallery,
  .product-info,
  .option,
  .details{
    max-width:1000px;
    margin-left:auto;
    margin-right:auto;
  }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div class="header">

  <button
    class="back-btn"
    onclick="goBack()">
    ‹
  </button>

  <div class="logo">
    🛍️ SayonMart
  </div>

  <button
    class="header-btn"
    onclick="addWishlist()">
    ♡
  </button>

  <button
    class="header-btn"
    onclick="goCart()">
    🛒
    <span
      id="cartCount"
      class="cart-number">
      0
    </span>
  </button>

</div>


<!-- ================= PRODUCT CONTAINER ================= -->

<div id="productContainer">

  <div class="loading">
    ⏳ Product Details লোড হচ্ছে...
  </div>

</div>


<!-- ================= TOAST ================= -->

<div
  id="toast"
  class="toast">
</div>


<!-- ================= BOTTOM BUTTONS ================= -->

<div class="bottom-bar">

  <button
    class="cart-button"
    onclick="addCurrentToCart()">

    🛒 কার্টে যোগ করুন

  </button>


  <button
    class="buy-button"
    onclick="buyNow()">

    ⚡ এখনই কিনুন

  </button>

</div>



<script type="module">


/* ================= FIREBASE ================= */

import { db } from "./firebase.js";


import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* ================= PRODUCT ID ================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const productId =
  urlParams.get("id");



/* ================= VARIABLES ================= */

let currentProduct = null;

let currentImages = [];

let currentImageIndex = 0;

let quantity = 1;



/* ================= TOAST ================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.innerText =
    message;

  toast.style.display =
    "block";


  setTimeout(function(){

    toast.style.display =
      "none";

  },2000);

}



/* ================= LOAD PRODUCT ================= */

async function loadProduct(){

  if(!productId){

    showError();

    return;

  }


  try{

    const productRef =
      doc(
        db,
        "products",
        productId
      );


    const productSnap =
      await getDoc(
        productRef
      );


    if(!productSnap.exists()){

      showError();

      return;

    }


    currentProduct = {

      id:productSnap.id,

      ...productSnap.data()

    };


    prepareImages();

    displayProduct();

    updateCartCount();

  }


  catch(error){

    console.error(
      "Product error:",
      error
    );

    showError();

  }

}



/* ================= PREPARE IMAGES ================= */

function prepareImages(){

  currentImages = [];


  if(
    Array.isArray(
      currentProduct.images
    )
  ){

    currentProduct.images.forEach(
      function(image){

        if(
          typeof image === "string" &&
          image.trim() !== ""
        ){

          currentImages.push(
            image
          );

        }

      }
    );

  }


  if(
    currentProduct.image &&
    typeof currentProduct.image === "string"
  ){

    if(
      !currentImages.includes(
        currentProduct.image
      )
    ){

      currentImages.unshift(
        currentProduct.image
      );

    }

  }


  if(currentImages.length === 0){

    currentImages.push(
      "https://via.placeholder.com/600x600?text=SayonMart"
    );

  }


  currentImageIndex = 0;

}



/* ================= DISPLAY PRODUCT ================= */

function displayProduct(){

  const product =
    currentProduct;


  const container =
    document.getElementById(
      "productContainer"
    );


  const name =
    product.name ||
    product.title ||
    "Product";


  const price =
    Number(
      product.price || 0
    );


  const oldPrice =
    Number(
      product.oldPrice ||
      product.mrp ||
      0
    );


  const rating =
    product.rating ||
    "4.5";


  const reviewCount =
    product.reviewCount ||
    product.reviews ||
    "0";


  const description =
    product.description ||
    "এই Product সম্পর্কে বিস্তারিত তথ্য এখানে পাবেন।";


  let discount = 0;


  if(
    oldPrice > price &&
    oldPrice > 0
  ){

    discount =
      Math.round(
        (
          (oldPrice - price)
          / oldPrice
        ) * 100
      );

  }



  /* ================= THUMBNAILS ================= */

  let thumbnailHTML = "";


  currentImages.forEach(
    function(image,index){

      thumbnailHTML += `

        <img
          class="thumbnail ${index === 0 ? "active" : ""}"
          src="${safe(image)}"
          onclick="changeImage(${index})"
          onerror="this.src='https://via.placeholder.com/100x100?text=Image'"
        >

      `;

    }
  );



  /* ================= DETAILS ================= */

  const brand =
    product.brand ||
    "SayonMart";


  const category =
    product.category ||
    "General";


  const material =
    product.material ||
    "Premium Quality";


  const stock =
    product.stock !== undefined
      ? product.stock
      : "Available";



  container.innerHTML = `


    <!-- IMAGE GALLERY -->

    <div class="gallery">


      ${
        discount > 0
        ? `

          <div class="discount">
            -${discount}%
          </div>

        `
        : ""
      }


      <img
        id="mainImage"
        class="main-image"
        src="${safe(currentImages[0])}"
        onerror="this.src='https://via.placeholder.com/600x600?text=SayonMart'"
      >


      <div
        id="imageNumber"
        class="image-number">

        1 / ${currentImages.length}

      </div>


      <div class="thumbnails">

        ${thumbnailHTML}

      </div>


    </div>



    <!-- PRODUCT INFORMATION -->

    <div class="product-info">


      <h1 class="product-title">

        ${safe(name)}

      </h1>


      <div class="description">

        ${safe(description)}

      </div>


      <!-- RATING -->

      <div class="rating-box">

        <span class="rating">

          ⭐ ${safe(String(rating))}

        </span>


        <span class="reviews">

          (${safe(String(reviewCount))}
          রিভিউ)

        </span>

      </div>



      <!-- PRICE -->

      <div class="price-box">


        <span class="current-price">

          ₹${price}

        </span>


        ${
          oldPrice > price
          ? `

            <span class="old-price">

              ₹${oldPrice}

            </span>


            <span class="discount-text">

              ${discount}% ছাড়

            </span>

          `
          : ""
        }


      </div>



      <!-- BENEFITS -->

      <div class="benefits">


        <div class="benefit">

          <span class="benefit-icon">
            🚚
          </span>

          Free Delivery

        </div>


        <div class="benefit">

          <span class="benefit-icon">
            🔄
          </span>

          7 Days Return

        </div>


        <div class="benefit">

          <span class="benefit-icon">
            🛡️
          </span>

          Original

        </div>


      </div>


    </div>



    <!-- COLOR -->

    <div class="option">


      <div class="option-title">

        Color:

      </div>


      <div class="colors">


        <div
          class="color selected"
          style="background:#222"
          onclick="selectColor(this)">
        </div>


        <div
          class="color"
          style="background:#fff"
          onclick="selectColor(this)">
        </div>


        <div
          class="color"
          style="background:#24477a"
          onclick="selectColor(this)">
        </div>


        <div
          class="color"
          style="background:#777"
          onclick="selectColor(this)">
        </div>


      </div>


    </div>



    <!-- SIZE -->

    <div class="option">


      <div class="option-title">

        Size:

      </div>


      <div class="sizes">


        <button
          class="size"
          onclick="selectSize(this)">

          S

        </button>


        <button
          class="size selected"
          onclick="selectSize(this)">

          M

        </button>


        <button
          class="size"
          onclick="selectSize(this)">

          L

        </button>


        <button
          class="size"
          onclick="selectSize(this)">

          XL

        </button>


        <button
          class="size"
          onclick="selectSize(this)">

          XXL

        </button>


      </div>


    </div>



    <!-- QUANTITY -->

    <div class="option">


      <div class="option-title">

        Quantity:

      </div>


      <div class="quantity">


        <button
          onclick="changeQuantity(-1)">

          −

        </button>


        <div
          id="quantityNumber"
          class="quantity-number">

          1

        </div>


        <button
          onclick="changeQuantity(1)">

          +

        </button>


      </div>


    </div>



    <!-- PRODUCT DETAILS -->

    <div class="details">


      <h2 class="details-title">

        📋 Product Details

      </h2>


      <div class="detail-row">


        <div class="detail-label">
          Brand
        </div>


        <div class="detail-value">

          ${safe(String(brand))}

        </div>


      </div>


      <div class="detail-row">


        <div class="detail-label">
          Category
        </div>


        <div class="detail-value">

          ${safe(String(category))}

        </div>


      </div>


      <div class="detail-row">


        <div class="detail-label">
          Material
        </div>


        <div class="detail-value">

          ${safe(String(material))}

        </div>


      </div>


      <div class="detail-row">


        <div class="detail-label">
          Stock
        </div>


        <div class="detail-value">

          ${safe(String(stock))}

        </div>


      </div>


      <div class="detail-row">


        <div class="detail-label">
          Delivery
        </div>


        <div class="detail-value">

          Available

        </div>


      </div>


    </div>


  `;

}



/* ================= CHANGE IMAGE ================= */

window.changeImage =
function(index){

  if(
    !currentImages[index]
  ){

    return;

  }


  currentImageIndex =
    index;


  const mainImage =
    document.getElementById(
      "mainImage"
    );


  mainImage.src =
    currentImages[index];


  const number =
    document.getElementById(
      "imageNumber"
    );


  number.innerText =
    `${index + 1} / ${currentImages.length}`;


  document
  .querySelectorAll(".thumbnail")
  .forEach(
    function(item,i){

      item.classList.toggle(
        "active",
        i === index
      );

    }
  );

};



/* ================= COLOR ================= */

window.selectColor =
function(element){

  document
  .querySelectorAll(".color")
  .forEach(
    function(item){

      item.classList.remove(
        "selected"
      );

    }
  );


  element.classList.add(
    "selected"
  );

};



/* ================= SIZE ================= */

window.selectSize =
function(element){

  document
  .querySelectorAll(".size")
  .forEach(
    function(item){

      item.classList.remove(
        "selected"
      );

    }
  );


  element.classList.add(
    "selected"
  );

};



/* ================= QUANTITY ================= */

window.changeQuantity =
function(amount){

  quantity =
    quantity + amount;


  if(quantity < 1){

    quantity = 1;

  }


  if(quantity > 20){

    quantity = 20;

  }


  document.getElementById(
    "quantityNumber"
  ).innerText =
    quantity;

};



/* ================= ADD TO CART ================= */

window.addCurrentToCart =
function(){

  if(!currentProduct){

    return;

  }


  let cart =
    JSON.parse(
      localStorage.getItem("cart") ||
      "[]"
    );


  const id =
    currentProduct.id;


  const name =
    currentProduct.name ||
    currentProduct.title ||
    "Product";


  const price =
    Number(
      currentProduct.price || 0
    );


  const image =
    currentImages[0] ||
    currentProduct.image ||
    "";


  const existing =
    cart.find(
      function(item){

        return item.id === id;

      }
    );


  if(existing){

    existing.quantity =
      Number(
        existing.quantity || 1
      ) + quantity;

  }
  else{

    cart.push({

      id:id,

      name:name,

      price:price,

      image:image,

      quantity:quantity

    });

  }


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  updateCartCount();


  showToast(
    "✅ Product cart-এ যোগ হয়েছে!"
  );

};



/* ================= BUY NOW ================= */

window.buyNow =
function(){

  if(!currentProduct){

    return;

  }


  addCurrentToCart();


  setTimeout(
    function(){

      window.location.href =
        "payment.html";

    },
    300
  );

};



/* ================= WISHLIST ================= */

window.addWishlist =
function(){

  if(!currentProduct){

    return;

  }


  let wishlist =
    JSON.parse(
      localStorage.getItem("wishlist") ||
      "[]"
    );


  const id =
    currentProduct.id;


  const exists =
    wishlist.some(
      function(item){

        return item.id === id;

      }
    );


  if(exists){

    showToast(
      "❤️ Wishlist-এ আগে থেকেই আছে"
    );

    return;

  }


  wishlist.push({

    id:id,

    name:
      currentProduct.name ||
      currentProduct.title ||
      "Product",

    price:
      Number(
        currentProduct.price || 0
      ),

    image:
      currentImages[0] || ""

  });


  localStorage.setItem(
    "wishlist",
    JSON.stringify(wishlist)
  );


  showToast(
    "❤️ Wishlist-এ যোগ হয়েছে"
  );

};



/* ================= CART COUNT ================= */

function updateCartCount(){

  const cart =
    JSON.parse(
      localStorage.getItem("cart") ||
      "[]"
    );


  let count = 0;


  cart.forEach(
    function(item){

      count +=
        Number(
          item.quantity || 1
        );

    }
  );


  document.getElementById(
    "cartCount"
  ).innerText =
    count;

}



/* ================= GO BACK ================= */

window.goBack =
function(){

  history.back();

};



/* ================= GO CART ================= */

window.goCart =
function(){

  window.location.href =
    "cart.html";

};



/* ================= ERROR ================= */

function showError(){

  document.getElementById(
    "productContainer"
  ).innerHTML = `

    <div class="error">

      <h2>
        😔 Product পাওয়া যায়নি
      </h2>

      <p>
        Product টি খুঁজে পাওয়া যাচ্ছে না।
      </p>

      <button onclick="goBack()">

        ← ফিরে যান

      </button>

    </div>

  `;

}



/* ================= SAFE TEXT ================= */

function safe(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}
