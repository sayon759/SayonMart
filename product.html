<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product - SayonMart</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#222;
  padding-bottom:75px;
}

header{
  height:58px;
  background:#111;
  color:#FFD700;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:20;
}

.back{
  position:absolute;
  left:15px;
  color:white;
  text-decoration:none;
  font-size:28px;
}

.container{
  max-width:900px;
  margin:auto;
}

.image-box{
  padding:10px;
}

.main-img{
  width:100%;
  height:390px;
  object-fit:contain;
}

.thumbs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 0;
}

.thumb{
  width:65px;
  height:65px;
  object-fit:cover;
  border:2px solid #ddd;
  border-radius:8px;
}

.thumb.active{
  border:3px solid #111;
}

.rating-box{
  padding:12px 18px;
  border-bottom:8px solid #f5f5f5;
}

.rating{
  background:#008a45;
  color:#fff;
  padding:5px 9px;
  border-radius:5px;
  font-weight:bold;
}

.review-count{
  color:#777;
  margin-left:8px;
}

.product-info{
  padding:15px 18px;
  border-bottom:8px solid #f5f5f5;
}

.seller{
  color:#777;
  font-size:14px;
  margin-bottom:8px;
}

.title{
  font-size:21px;
  line-height:1.4;
  margin-bottom:12px;
}

.price-row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.price{
  font-size:29px;
  font-weight:bold;
}

.old-price{
  color:#888;
  text-decoration:line-through;
  font-size:18px;
}

.discount{
  color:#008a45;
  font-weight:bold;
}

.offer{
  margin-top:15px;
  padding:12px;
  background:#e5f8ed;
  border-radius:10px;
  font-weight:bold;
}

.section{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.section-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:12px;
}

.color-list{
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.color-btn{
  min-width:70px;
  background:#fff;
  border:2px solid #ddd;
  border-radius:9px;
  padding:6px;
}

.color-btn.selected{
  border:3px solid #111;
}

.color-btn img{
  width:58px;
  height:65px;
  object-fit:cover;
  border-radius:6px;
}

.color-text{
  font-size:12px;
  margin-top:4px;
}

.size-list{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.size-btn{
  min-width:65px;
  height:48px;
  background:#fff;
  border:2px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

.size-btn.selected{
  border:3px solid #111;
  font-weight:bold;
}

.size-chart{
  float:right;
  color:#1769d1;
  font-size:14px;
  cursor:pointer;
}

.delivery{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.delivery-box{
  background:#f5f7f9;
  padding:14px;
  border-radius:10px;
}

.delivery-row{
  padding:7px 0;
}

.seller-box{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.seller-name{
  font-size:18px;
  font-weight:bold;
}

.seller-rating{
  margin-top:7px;
  color:#008a45;
}

.description{
  padding:18px;
  border-bottom:8px solid #f5f5f5;
}

.description p{
  color:#555;
  line-height:1.6;
}

.benefits{
  line-height:2;
}

.more{
  padding:18px;
}

.recommendations{
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.rec{
  min-width:150px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:8px;
}

.rec img{
  width:100%;
  height:130px;
  object-fit:contain;
}

.rec-name{
  font-size:14px;
  height:38px;
  overflow:hidden;
}

.rec-price{
  font-weight:bold;
  margin-top:5px;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:#fff;
  display:flex;
  gap:8px;
  padding:10px;
  box-shadow:0 -2px 10px #aaa;
  z-index:30;
}

.bottom button{
  flex:1;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
}

.cart{
  background:#fff;
  border:2px solid #111 !important;
}

.buy{
  background:#FFD700;
}

.loading{
  text-align:center;
  padding:50px;
}

.error{
  text-align:center;
  padding:40px 20px;
  color:red;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:100;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:white;
  width:90%;
  max-width:430px;
  padding:20px;
  border-radius:12px;
}

.close{
  float:right;
  font-size:25px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #ddd;
  padding:9px;
  text-align:center;
}
</style>
</head>

<body>

<header>
<a href="index.html" class="back">←</a>
SayonMart
</header>

<div id="content" class="container">
  <div class="loading">Product loading...</div>
</div>

<div id="sizeModal" class="modal">
  <div class="modal-box">

    <span class="close" onclick="closeSizeChart()">×</span>

    <h2>Size Chart</h2>

    <table>
      <tr>
        <th>Size</th>
        <th>Chest</th>
        <th>Length</th>
      </tr>
      <tr>
        <td>M</td>
        <td>38</td>
        <td>28</td>
      </tr>
      <tr>
        <td>L</td>
        <td>40</td>
        <td>29</td>
      </tr>
      <tr>
        <td>XL</td>
        <td>42</td>
        <td>30</td>
      </tr>
      <tr>
        <td>XXL</td>
        <td>44</td>
        <td>31</td>
      </tr>
    </table>

  </div>
</div>

<div class="bottom" id="bottomBar" style="display:none">

<button class="cart" id="cartBtn">
🛒 Add to Cart
</button>

<button class="buy" id="buyBtn">
Buy Now
</button>

</div>

<script type="module">

import {db} from "./firebase.js";

import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const content =
document.getElementById("content");

const bottomBar =
document.getElementById("bottomBar");

const productId =
new URLSearchParams(location.search).get("id");

let currentProduct=null;

let selectedSize="";

let selectedColor="";


function money(value){

let n=Number(value);

return isNaN(n) ? "₹"+value : "₹"+n;

}


function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* CATEGORY */

function getCategory(product){

return String(
product.category ||
product.type ||
""
).toLowerCase();

}


/* কোন product-এ size লাগবে */

function hasSize(category){

return (
category.includes("fashion") ||
category.includes("shirt") ||
category.includes("tshirt") ||
category.includes("t-shirt") ||
category.includes("dress") ||
category.includes("pant") ||
category.includes("clothing") ||
category.includes("জামা") ||
category.includes("পোশাক") ||
category.includes("shoe") ||
category.includes("shoes") ||
category.includes("জুতা")
);

}


/* Shoes না জামা */

function getSizes(product,category){

if(
category.includes("shoe") ||
category.includes("shoes") ||
category.includes("জুতা")
){

return ["6","7","8","9","10"];

}

if(hasSize(category)){

return ["M","L","XL","XXL"];

}

return [];

}


/* PRODUCT */

function showProduct(product,allProducts){

currentProduct=product;

const category=getCategory(product);

const image=
product.image ||
product.imageUrl ||
"https://via.placeholder.com/500";


const name=
product.name ||
"Product";


const price=
product.price ?? 0;


const oldPrice=
product.oldPrice;


const discount=
product.discount;


const rating=
product.rating || "4.5";


const reviews=
product.reviews || "0";


const description=
product.description ||
"এই পণ্যের কোনো বিবরণ দেওয়া হয়নি।";


const seller=
product.seller ||
"SayonMart Seller";


const delivery=
product.delivery ||
"5-7 দিনের মধ্যে";


/* IMAGES */

let images=[];

if(Array.isArray(product.images)){

images=product.images;

}

images=[
image,
...images
];

images=[
...new Set(images)
];


/* COLORS */

let colors=[];

if(Array.isArray(product.colors)){

colors=product.colors;

}


/* SIZES */

let sizes=
getSizes(product,category);


/* যদি Firebase-এ custom size থাকে */

if(
Array.isArray(product.sizes) &&
product.sizes.length>0 &&
hasSize(category)
){

sizes=product.sizes;

}


/* RELATED */

const related=
allProducts
.filter(p=>p.id!==product.id)
.slice(0,8);


/* COLOR */

selectedColor=
colors.length ? colors[0] : "";


/* HTML */

content.innerHTML=`

<div class="image-box">

<img
id="mainImage"
class="main-img"
src="${escapeHTML(images[0])}"
>

<div class="thumbs">

${images.map((img,i)=>`

<img
class="thumb ${i===0?"active":""}"
src="${escapeHTML(img)}"
onclick="changeImage('${escapeHTML(img)}',this)"
>

`).join("")}

</div>

</div>


<div class="rating-box">

<span class="rating">
★ ${escapeHTML(rating)}
</span>

<span class="review-count">
${escapeHTML(reviews)} Ratings & Reviews
</span>

</div>


<div class="product-info">

<div class="seller">
${escapeHTML(seller)}
</div>

<div class="title">
${escapeHTML(name)}
</div>

<div class="price-row">

<span class="price">
${money(price)}
</span>

${
oldPrice
?
`<span class="old-price">
${money(oldPrice)}
</span>`
:""
}

${
discount
?
`<span class="discount">
${escapeHTML(discount)}% OFF
</span>`
:""
}

</div>

<div class="offer">
🏷️ Special offer available
</div>

</div>


${
colors.length
?
`

<div class="section">

<div class="section-title">
Color:
<span id="selectedColor">
${escapeHTML(selectedColor)}
</span>
</div>

<div class="color-list">

${colors.map((color,i)=>`

<button
class="color-btn ${i===0?"selected":""}"
data-color="${escapeHTML(color)}"
onclick="selectColor('${escapeHTML(color)}','${escapeHTML(images[i]||image)}')"
>

<img src="${escapeHTML(images[i]||image)}">

<div class="color-text">
${escapeHTML(color)}
</div>

</button>

`).join("")}

</div>

</div>

`
:""
}


/* SIZE ONLY IF NEEDED */

${
sizes.length
?
`

<div class="section">

<div class="section-title">

Select Size

<span
class="size-chart"
onclick="openSizeChart()"
>
Size Chart
</span>

</div>

<div class="size-list">

${sizes.map(size=>`

<button
class="size-btn"
data-size="${escapeHTML(size)}"
onclick="selectSize('${escapeHTML(size)}')"
>

${escapeHTML(size)}

</button>

`).join("")}

</div>

</div>

`
:""
}


<div class="delivery">

<h3>Delivery Details</h3>

<div class="delivery-box">

<div class="delivery-row">
📍 Delivery address
</div>

<div class="delivery-row">
🚚 Delivery by ${escapeHTML(delivery)}
</div>

<div class="delivery-row">
💵 Cash on Delivery available
</div>

</div>

</div>


<div class="seller-box">

<div class="seller-name">
🏪 ${escapeHTML(seller)}
</div>

<div class="seller-rating">
★ 4.2 Seller Rating
</div>

</div>


<div class="description">

<h3>Product Description</h3>

<p>
${escapeHTML(description)}
</p>

<h3>Benefits</h3>

<ul class="benefits">

<li>ভালো মানের পণ্য</li>

<li>সহজে অর্ডার করুন</li>

<li>SayonMart থেকে কিনুন</li>

</ul>

</div>


<div class="more">

<h3>More Products</h3>

<div class="recommendations">

${related.map(p=>{

const img=
p.image ||
p.imageUrl ||
"https://via.placeholder.com/300";

return `

<div
class="rec"
onclick="openProduct('${escapeHTML(p.id)}')"
>

<img src="${escapeHTML(img)}">

<div class="rec-name">
${escapeHTML(p.name||"Product")}
</div>

<div class="rec-price">
${money(p.price??0)}
</div>

</div>

`;

}).join("")}

</div>

</div>

`;


bottomBar.style.display="flex";


document.getElementById("cartBtn").onclick=()=>{

addToCart(currentProduct);

};


document.getElementById("buyBtn").onclick=()=>{

addToCart(currentProduct);

location.href="payment.html";

};

}


/* IMAGE */

window.changeImage=function(src,element){

document.getElementById("mainImage").src=src;

document
.querySelectorAll(".thumb")
.forEach(x=>x.classList.remove("active"));

element.classList.add("active");

};


/* SIZE */

window.selectSize=function(size){

selectedSize=size;

document
.querySelectorAll(".size-btn")
.forEach(btn=>{

btn.classList.remove("selected");

if(btn.dataset.size===size){

btn.classList.add("selected");

}

});

};


/* COLOR */

window.selectColor=function(color,image){

selectedColor=color;

document.getElementById(
"selectedColor"
).innerText=color;

document.getElementById(
"mainImage"
).src=image;

document
.querySelectorAll(".color-btn")
.forEach(btn=>{

btn.classList.remove("selected");

if(btn.dataset.color===color){

btn.classList.add("selected");

}

});

};


/* SIZE CHART */

window.openSizeChart=function(){

document.getElementById(
"sizeModal"
).style.display="flex";

};


window.closeSizeChart=function(){

document.getElementById(
"sizeModal"
).style.display="none";

};


/* RELATED */

window.openProduct=function(id){

location.href=
"product.html?id="+
encodeURIComponent(id);

};


/* CART */

function addToCart(product){

let cart=
JSON.parse(
localStorage.getItem("cart")||"[]"
);


let item=
cart.find(x=>x.id===product.id);


if(item){

item.quantity=
(item.quantity||1)+1;

}else{

cart.push({

id:product.id,

name:product.name||"Product",

price:Number(product.price)||0,

image:
product.image||
product.imageUrl||
"",

quantity:1,

size:selectedSize,

color:selectedColor

});

}


localStorage.setItem(
"cart",
JSON.stringify(cart)
);


alert("Product cart-এ যোগ হয়েছে!");

}


/* LOAD */

async function loadProduct(){

if(!productId){

content.innerHTML=`

<div class="error">

Product ID পাওয়া যায়নি।

</div>

`;

return;

}


try{

const snapshot=
await getDocs(
collection(db,"products")
);


const products=
snapshot.docs.map(doc=>({

id:doc.id,
...doc.data()

}));


const product=
products.find(
p=>p.id===productId
);


if(!product){

content.innerHTML=`

<div class="error">

Product পাওয়া যায়নি।

</div>

`;

return;

}


showProduct(
product,
products
);


}catch(error){

console.error(error);

content.innerHTML=`

<div class="error">

Product load হয়নি।

<br><br>

Internet/Firebase connection check করুন।

</div>

`;

}

}


loadProduct();

</script>

</body>
</html>
