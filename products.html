<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SayonMart - Products</title>

<link rel="stylesheet" href="style.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

/* Header */
.header{
  background:#ffffff;
  padding:12px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.header h2{
  margin:0 0 10px;
  color:#e91e63;
  text-align:center;
}

.search-box{
  width:100%;
  padding:12px 15px;
  border:1px solid #ddd;
  border-radius:25px;
  outline:none;
  font-size:15px;
}

/* Categories */
.categories{
  display:flex;
  gap:8px;
  padding:12px;
  overflow-x:auto;
  background:#fff;
}

.category{
  border:1px solid #e91e63;
  color:#e91e63;
  background:white;
  padding:8px 15px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
}

.category.active,
.category:hover{
  background:#e91e63;
  color:white;
}

/* Products */
.title{
  padding:15px 12px 5px;
  font-size:20px;
  font-weight:bold;
}

.products{
  padding:12px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding-bottom:90px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  position:relative;
  cursor:pointer;
  transition:.2s;
}

.card:active{
  transform:scale(.98);
}

.product-image{
  width:100%;
  height:170px;
  object-fit:cover;
  background:#eee;
}

.heart{
  position:absolute;
  right:8px;
  top:8px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:white;
  font-size:19px;
  cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.info{
  padding:10px;
}

.product-name{
  font-size:15px;
  font-weight:bold;
  margin:0 0 6px;
  min-height:38px;
}

.price{
  color:#e91e63;
  font-size:18px;
  font-weight:bold;
}

.old-price{
  color:#888;
  text-decoration:line-through;
  font-size:13px;
  margin-left:5px;
}

.add-btn{
  width:100%;
  margin-top:9px;
  padding:10px;
  border:0;
  border-radius:8px;
  background:#e91e63;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.buy-btn{
  width:100%;
  margin-top:7px;
  padding:9px;
  border:1px solid #e91e63;
  border-radius:8px;
  background:white;
  color:#e91e63;
  font-weight:bold;
  cursor:pointer;
}

/* Loading */
.loading{
  text-align:center;
  padding:40px;
  color:#777;
}

/* Bottom navigation */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -2px 10px rgba(0,0,0,.15);
  z-index:200;
}

.nav-item{
  text-align:center;
  color:#666;
  font-size:12px;
  cursor:pointer;
}

.nav-item span{
  display:block;
  font-size:23px;
  margin-bottom:2px;
}

.nav-item.active{
  color:#e91e63;
}

/* Toast */
.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 20px;
  border-radius:25px;
  display:none;
  z-index:500;
  font-size:14px;
}

/* Empty */
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px 10px;
  color:#777;
}

@media(min-width:700px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }

  .product-image{
    height:220px;
  }
}
</style>
</head>

<body>

<!-- Header -->
<div class="header">
  <h2>🛍️ SayonMart</h2>

  <input
    type="text"
    id="searchInput"
    class="search-box"
    placeholder="🔍 Product search করুন..."
  >
</div>

<!-- Categories -->
<div class="categories">

  <button class="category active" data-category="all">
    সব
  </button>

  <button class="category" data-category="Fashion">
    👕 Fashion
  </button>

  <button class="category" data-category="Shoes">
    👟 Shoes
  </button>

  <button class="category" data-category="Mobiles">
    📱 Mobiles
  </button>

  <button class="category" data-category="Watches">
    ⌚ Watches
  </button>

</div>

<div class="title">
  🛒 All Products
</div>

<!-- Products -->
<div id="products" class="products">
  <div class="loading">
    Product লোড হচ্ছে...
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Bottom Navigation -->
<div class="bottom-nav">

  <div class="nav-item" onclick="goHome()">
    <span>🏠</span>
    Home
  </div>

  <div class="nav-item active">
    <span>🛍️</span>
    Products
  </div>

  <div class="nav-item" onclick="goCart()">
    <span>🛒</span>
    Cart
    <b id="cartCount"></b>
  </div>

  <div class="nav-item" onclick="goOrders()">
    <span>📦</span>
    Orders
  </div>

  <div class="nav-item" onclick="goProfile()">
    <span>👤</span>
    Profile
  </div>

</div>


<!-- Firebase -->
<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const productsBox = document.getElementById("products");

const searchInput = document.getElementById("searchInput");

let allProducts = [];

let selectedCategory = "all";


/* =========================
   TOAST
========================= */

window.showToast = function(message){

  const toast = document.getElementById("toast");

  toast.innerText = message;

  toast.style.display = "block";

  setTimeout(()=>{
    toast.style.display = "none";
  },2000);

};


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    const snapshot = await getDocs(
      collection(db,"products")
    );

    allProducts = [];

    snapshot.forEach(doc => {

      allProducts.push({

        id:doc.id,

        ...doc.data()

      });

    });

    displayProducts(allProducts);

    updateCartCount();

  }
  catch(error){

    console.error(error);

    productsBox.innerHTML = `
      <div class="empty">
        ❌ Product লোড করা যায়নি।
        <br><br>
        Internet অথবা Firebase check করুন।
      </div>
    `;

  }

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(products){

  productsBox.innerHTML = "";

  if(products.length === 0){

    productsBox.innerHTML = `
      <div class="empty">
        😔 কোনো Product পাওয়া যায়নি।
      </div>
    `;

    return;
  }


  products.forEach(product => {

    const id = product.id;

    const name =
      product.name ||
      product.title ||
      "Product";


    const price =
      Number(product.price || 0);


    const oldPrice =
      Number(
        product.oldPrice ||
        product.mrp ||
        0
      );


    let image =
      product.image ||
      "";


    if(
      !image &&
      Array.isArray(product.images) &&
      product.images.length > 0
    ){

      image = product.images[0];

    }


    if(!image){

      image =
        "https://via.placeholder.com/500x500?text=SayonMart";

    }


    const category =
      product.category ||
      "";


    const card =
      document.createElement("div");

    card.className = "card";


    /* Card click → Product Details */

    card.addEventListener(
      "click",
      function(){

        openProduct(id);

      }
    );


    /* Image */

    const img =
      document.createElement("img");

    img.className = "product-image";

    img.src = image;

    img.alt = name;

    img.onerror = function(){

      this.src =
        "https://via.placeholder.com/500x500?text=SayonMart";

    };


    /* Info */

    const info =
      document.createElement("div");

    info.className = "info";


    /* Name */

    const productName =
      document.createElement("p");

    productName.className =
      "product-name";

    productName.innerText =
      name;


    /* Price */

    const priceDiv =
      document.createElement("div");

    priceDiv.className =
      "price";

    priceDiv.innerText =
      "₹" + price;


    if(oldPrice > price){

      const old =
        document.createElement("span");

      old.className =
        "old-price";

      old.innerText =
        "₹" + oldPrice;

      priceDiv.appendChild(old);

    }


    /* Heart */

    const heart =
      document.createElement("button");

    heart.className =
      "heart";

    heart.innerHTML =
      "♡";


    heart.addEventListener(
      "click",
      function(event){

        event.stopPropagation();

        addWishlist(
          id,
          name,
          price,
          image
        );

      }
    );


    /* Add Cart */

    const addButton =
      document.createElement("button");

    addButton.className =
      "add-btn";

    addButton.innerText =
      "🛒 Add to Cart";


    addButton.addEventListener(
      "click",
      function(event){

        event.stopPropagation();

        addToCart(
          id,
          name,
          price,
          image
        );

      }
    );


    /* Buy Now */

    const buyButton =
      document.createElement("button");

    buyButton.className =
      "buy-btn";

    buyButton.innerText =
      "⚡ এখনই কিনুন";


    buyButton.addEventListener(
      "click",
      function(event){

        event.stopPropagation();

        addToCart(
          id,
          name,
          price,
          image
        );

        window.location.href =
          "payment.html";

      }
    );


    info.appendChild(productName);

    info.appendChild(priceDiv);

    info.appendChild(addButton);

    info.appendChild(buyButton);


    card.appendChild(img);

    card.appendChild(heart);

    card.appendChild(info);


    productsBox.appendChild(card);

  });

}


/* =========================
   OPEN PRODUCT DETAILS
========================= */

window.openProduct = function(id){

  if(!id){

    alert("Product ID পাওয়া যায়নি।");

    return;

  }


  window.location.href =
    "product.html?id=" +
    encodeURIComponent(id);

};


/* =========================
   ADD TO CART
========================= */

window.addToCart = function(
  id,
  name,
  price,
  image
){

  let cart =
    JSON.parse(
      localStorage.getItem("cart") ||
      "[]"
    );


  const existing =
    cart.find(
      item =>
        item.id === id ||
        (
          !item.id &&
          item.name === name
        )
    );


  if(existing){

    existing.quantity =
      Number(existing.quantity || 1) + 1;

  }
  else{

    cart.push({

      id:id,

      name:name,

      price:Number(price),

      image:image,

      quantity:1

    });

  }


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  updateCartCount();

  showToast(
    "✅ Product cart-এ যোগ হয়েছে!"
  );

};


/* =========================
   WISHLIST
========================= */

window.addWishlist = function(
  id,
  name,
  price,
  image
){

  let wishlist =
    JSON.parse(
      localStorage.getItem("wishlist") ||
      "[]"
    );


  const exists =
    wishlist.some(
      item => item.id === id
    );


  if(!exists){

    wishlist.push({

      id:id,

      name:name,

      price:Number(price),

      image:image

    });


    localStorage.setItem(
      "wishlist",
      JSON.stringify(wishlist)
    );


    showToast(
      "❤️ Wishlist-এ যোগ হয়েছে"
    );

  }
  else{

    showToast(
      "❤️ Wishlist-এ আছে"
    );

  }

};


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

  const cart =
    JSON.parse(
      localStorage.getItem("cart") ||
      "[]"
    );


  let count = 0;


  cart.forEach(item => {

    count +=
      Number(item.quantity || 1);

  });


  const badge =
    document.getElementById("cartCount");


  if(count > 0){

    badge.innerText =
      " (" + count + ")";

  }
  else{

    badge.innerText = "";

  }

}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
  "input",
  function(){

    const text =
      this.value
      .trim()
      .toLowerCase();


    filterProducts(text);

  }
);


function filterProducts(text){

  let filtered =
    allProducts.filter(product => {

      const name =
        (
          product.name ||
          product.title ||
          ""
        ).toLowerCase();


      const category =
        (
          product.category ||
          ""
        ).toLowerCase();


      const matchSearch =
        name.includes(text);


      const matchCategory =
        selectedCategory === "all" ||
        category ===
        selectedCategory.toLowerCase();


      return (
        matchSearch &&
        matchCategory
      );

    });


  displayProducts(filtered);

}


/* =========================
   CATEGORY
========================= */

document
.querySelectorAll(".category")
.forEach(button => {

  button.addEventListener(
    "click",
    function(){

      document
      .querySelectorAll(".category")
      .forEach(btn =>
        btn.classList.remove("active")
      );


      this.classList.add("active");


      selectedCategory =
        this.dataset.category;


      const text =
        searchInput.value
        .trim()
        .toLowerCase();


      filterProducts(text);

    }
  );

});


/* =========================
   NAVIGATION
========================= */

window.goHome = function(){

  window.location.href =
    "index.html";

};


window.goCart = function(){

  window.location.href =
    "cart.html";

};


window.goOrders = function(){

  window.location.href =
    "order.html";

};


window.goProfile = function(){

  window.location.href =
    "profile.html";

};


/* START */

loadProducts();

</script>

</body>
</html>
