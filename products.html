<script>
function addToCart(name, price, image) {

  let cart = JSON.parse(
    localStorage.getItem("cart") || "[]"
  );

  const existing = cart.find(
    item => item.name === name
  );

  if (existing) {
    existing.quantity =
      (existing.quantity || 1) + 1;
  } else {
    cart.push({
      name: name,
      price: Number(price),
      image: image,
      quantity: 1
    });
  }

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  alert("✅ " + name + " Cart-এ যোগ হয়েছে!");

}
</script>
