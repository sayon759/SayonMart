<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>SayonMart Products</title>

<link rel="stylesheet" href="style.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:90px;
}

/* HEADER */

header{
  background:#050505;
  padding:20px;
  text-align:center;
  border-bottom:1px solid #292929;
}

header h2{
  margin:0;
  color:#ffd000;
  font-size:27px;
}

/* SEARCH */

.search{
  margin:18px;
  background:#1b1b1f;
  border:1px solid #303035;
  border-radius:15px;
  display:flex;
  align-items:center;
  padding:0 14px;
}

.search span{
  font-size:20px;
}

.search input{
  width:100%;
  padding:15px 10px;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  font-size:16px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:0 18px 15px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex-shrink:0;
  padding:10px 15px;
  background:#1b1b1f;
  border:1px solid #303035;
  border-radius:20px;
  color:#ddd;
  cursor:pointer;
}

.category.active{
  background:#ffd000;
  color:#000;
  font-weight:bold;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
  padding:10px 18px;
}

.card{
  background:#19191c;
  border:1px solid #303035;
  border-radius:17px;
  overflow:hidden;
  position:relative;
  padding-bottom:12px;
}

.card img{
  width:100%;
  height:155px;
  object-fit:cover;
  display:block;
  background:#111;
}

.heart{
  position:absolute;
  right:9px;
  top:9px;
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:white;
  font-size:18px;
  cursor:pointer;
}

.info{
  padding:10px;
}

.info h3{
  margin:0 0 6px;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.category-name{
  color:#999;
  font-size:12px;
}

.rating{
  color:#ffd000;
  font-size:12px;
  margin-top:6px;
}

.price{
  color:#ffd000;
  font-size:18px;
  font-weight:bold;
  margin:7px 0;
}

/* ADD TO CART */

.add{
  width:calc(100% - 20px);
  margin:0 10px;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#ffd000;
  color:#000;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

.add:active{
  transform:scale(.96);
}

/* LOADING / EMPTY */

.loading,
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 10px;
  color:#aaa;
}

/* BOTTOM NAVIGATION */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:#0b0b0d;
  border-top:1px solid #29292d;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom a{
  color:#aaa;
  text-decoration:none;
  text-align:center;
  font-size:11px;
}

.bottom a div{
  font-size:23px;
  margin-bottom:3px;
}

.bottom a.active{
  color:#ffd000;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:88px;
  left:50%;
  transform:translateX(-50%);
  background:#ffd000;
  color:#000;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  display:none;
  z-index:50;
  white-space:nowrap;
}

@media(min-width:700px){

  .products{
    grid-template-columns:repeat(4,1fr);
  }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

  <h2>🛍️ SayonMart</h2>

</header>


<!-- SEARCH -->

<div class="search">

  <span>🔍</span>

  <input
    type="text"
    id="search"
    placeholder="Search products..."
    oninput="filterProducts()"
  >

</div>


<!-- CATEGORIES -->

<div class="categories">

  <button
    class="category active"
    onclick="setCategory('',this)"
  >
    All
  </button>

  <button
    class="category"
    onclick="setCategory('Fashion',this)"
  >
    👕 Fashion
  </button>

  <button
    class="category"
    onclick="setCategory('Shoes',this)"
  >
    👟 Shoes
  </button>

  <button
    class="category"
    onclick="setCategory('Mobiles',this)"
  >
    📱 Mobiles
  </button>

  <button
    class="category"
    onclick="setCategory('Watches',this)"
  >
    ⌚ Watches
  </button>

</div>


<!-- PRODUCTS -->

<div
  class="products"
  id="products"
>

  <div class="loading">
    ⏳ Products loading...
  </div>

</div>


<!-- BOTTOM NAVIGATION -->

<div class="bottom">

  <a href="index.html">

    <div>⌂</div>

    Home

  </a>


  <a
    href="products.html"
    class="active"
  >

    <div>▦</div>

    Products

  </a>


  <a href="cart.html">

    <div>🛒</div>

    Cart

  </a>


  <a href="order.html">

    <div>▤</div>

    Orders

  </a>


  <a href="profile.html">

    <div>♙</div>

    Profile

  </a>

</div>


<!-- TOAST -->

<div
  class="toast"
  id="toast"
>
  ✅ Added to Cart
</div>


<!-- FIREBASE + JAVASCRIPT -->

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


let allProducts = [];

let selectedCategory = "";


/* =========================
   GET CART
========================= */

function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem("cart") || "[]"
    );

  }catch(error){

    console.error("Cart error:",error);

    return [];

  }

}


/* =========================
   ADD TO CART
========================= */

window.addToCart = function(
  name,
  price,
  image
){

  try{

    let cart = getCart();

    price = Number(price) || 0;

    image = image || "";


    /* Check product already exists */

    const existingProduct =
      cart.find(function(item){

        return item.name === name;

      });


    if(existingProduct){

      existingProduct.quantity =
        Number(existingProduct.quantity || 1) + 1;

    }else{

      cart.push({

        name:name,

        price:price,

        image:image,

        quantity:1

      });

    }


    /* SAVE CART */

    localStorage.setItem(
      "cart",
      JSON.stringify(cart)
    );


    /* SHOW MESSAGE */

    const toast =
      document.getElementById("toast");


    toast.textContent =
      "✅ Added to Cart";


    toast.style.display =
      "block";


    setTimeout(function(){

      toast.style.display =
        "none";

    },1500);


    console.log(
      "Cart saved:",
      cart
    );


  }catch(error){

    console.error(
      "Add to cart error:",
      error
    );

    alert(
      "Cart-এ product যোগ করা যায়নি।"
    );

  }

};


/* =========================
   WISHLIST
========================= */

window.addWishlist = function(){

  let count =
    Number(
      localStorage.getItem(
        "wishlistCount"
      ) || 0
    );


  count++;


  localStorage.setItem(
    "wishlistCount",
    count
  );


  const toast =
    document.getElementById("toast");


  toast.textContent =
    "❤️ Wishlist-এ যোগ হয়েছে";


  toast.style.display =
    "block";


  setTimeout(function(){

    toast.style.display =
      "none";

  },1500);

};


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

  const searchInput =
    document.getElementById("search");


  const searchText =
    searchInput
      ? searchInput.value
          .toLowerCase()
          .trim()
      : "";


  const filtered =
    allProducts.filter(function(product){


      const name =
        String(
          product.name || ""
        ).toLowerCase();


      const category =
        String(
          product.category || ""
        ).toLowerCase();


      const searchOK =
        !searchText ||
        name.includes(searchText);


      const categoryOK =
        !selectedCategory ||
        category ===
        selectedCategory.toLowerCase();


      return (
        searchOK &&
        categoryOK
      );

    });


  const box =
    document.getElementById(
      "products"
    );


  if(filtered.length === 0){

    box.innerHTML = `

      <div class="empty">

        😕<br><br>

        কোনো Product পাওয়া যায়নি।

      </div>

    `;

    return;

  }


  box.innerHTML = "";


  filtered.forEach(function(product){


    const name =
      String(
        product.name || "Product"
      );


    const price =
      Number(
        product.price || 0
      );


    const image =
      product.image ||
      (
        Array.isArray(product.images)
          ? product.images[0]
          : ""
      ) ||
      "https://picsum.photos/300?random=99";


    const category =
      String(
        product.category || "Product"
      );


    /* CARD */

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    /* HEART */

    const heart =
      document.createElement(
        "button"
      );


    heart.className =
      "heart";


    heart.textContent =
      "♡";


    heart.type =
      "button";


    heart.addEventListener(
      "click",
      function(){

        window.addWishlist();

      }
    );


    /* IMAGE */

    const img =
      document.createElement(
        "img"
      );


    img.src =
      image;


    img.alt =
      name;


    /* INFO */

    const info =
      document.createElement(
        "div"
      );


    info.className =
      "info";


    /* NAME */

    const title =
      document.createElement(
        "h3"
      );


    title.textContent =
      name;


    /* CATEGORY */

    const cat =
      document.createElement(
        "div"
      );


    cat.className =
      "category-name";


    cat.textContent =
      "📂 " + category;


    /* RATING */

    const rating =
      document.createElement(
        "div"
      );


    rating.className =
      "rating";


    rating.textContent =
      "★★★★★ 4.5";


    /* PRICE */

    const priceBox =
      document.createElement(
        "div"
      );


    priceBox.className =
      "price";


    priceBox.textContent =
      "₹" +
      price.toLocaleString(
        "en-IN"
      );


    /* ADD BUTTON */

    const addButton =
      document.createElement(
        "button"
      );


    addButton.className =
      "add";


    addButton.type =
      "button";


    addButton.textContent =
      "🛒 Add to Cart";


    addButton.addEventListener(
      "click",
      function(){

        window.addToCart(
          name,
          price,
          image
        );

      }
    );


    /* PUT INFO TOGETHER */

    info.appendChild(title);

    info.appendChild(cat);

    info.appendChild(rating);

    info.appendChild(priceBox);


    /* PUT CARD TOGETHER */

    card.appendChild(heart);

    card.appendChild(img);

    card.appendChild(info);

    card.appendChild(addButton);


    box.appendChild(card);

  });

}


/* =========================
   SEARCH
========================= */

window.filterProducts =
  function(){

    renderProducts();

  };


/* =========================
   CATEGORY
========================= */

window.setCategory =
  function(
    category,
    button
  ){

    selectedCategory =
      category;


    document
      .querySelectorAll(
        ".category"
      )
      .forEach(function(btn){

        btn.classList.remove(
          "active"
        );

      });


    button.classList.add(
      "active"
    );


    renderProducts();

  };


/* =========================
   LOAD PRODUCTS FROM FIREBASE
========================= */

async function loadProducts(){

  const box =
    document.getElementById(
      "products"
    );


  try{


    const snapshot =
      await getDocs(
        collection(
          db,
          "products"
        )
      );


    allProducts = [];


    snapshot.forEach(
      function(doc){

        allProducts.push({

          id:doc.id,

          ...doc.data()

        });

      }
    );


    console.log(
      "Products loaded:",
      allProducts
    );


    renderProducts();


  }catch(error){


    console.error(
      "Firebase error:",
      error
    );


    box.innerHTML = `

      <div class="empty">

        ⚠️ Products load হচ্ছে না।

        <br><br>

        Firebase check করো।

      </div>

    `;

  }

}


/* START */

loadProducts();

</script>


</body>

</html>
