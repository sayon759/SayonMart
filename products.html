<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SayonMart Products</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
  padding-bottom:70px;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#e91e63;
  padding:12px;
  color:white;
}

.top{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:10px 12px;
  border:0;
  border-radius:8px;
  outline:none;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px;
  background:white;
}

.categories button{
  border:1px solid #ddd;
  background:white;
  padding:8px 14px;
  border-radius:20px;
  white-space:nowrap;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 1px 5px #ddd;
  position:relative;
  cursor:pointer;
}

.card img{
  width:100%;
  height:180px;
  object-fit:contain;
  background:#fafafa;
}

.info{
  padding:10px;
}

.name{
  font-size:15px;
  font-weight:bold;
  height:38px;
  overflow:hidden;
}

.price{
  font-size:19px;
  font-weight:bold;
  color:#e91e63;
  margin:6px 0;
}

.old{
  color:#888;
  text-decoration:line-through;
  font-size:13px;
}

.actions{
  display:flex;
  gap:6px;
}

.actions button{
  flex:1;
  border:0;
  padding:9px 4px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.cartBtn{
  background:#e91e63;
  color:white;
}

.buyBtn{
  background:#ff9800;
  color:white;
}

.heart{
  position:absolute;
  right:8px;
  top:8px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:white;
  font-size:19px;
  cursor:pointer;
}

.loading{
  text-align:center;
  padding:40px;
  color:#777;
  grid-column:1/-1;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:9px 0;
  z-index:20;
}

.bottom a{
  text-decoration:none;
  color:#555;
  font-size:13px;
  text-align:center;
}

.badge{
  background:#e91e63;
  color:white;
  border-radius:20px;
  padding:2px 6px;
  font-size:11px;
}

.toast{
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:8px;
  display:none;
  z-index:50;
  white-space:nowrap;
}
</style>
</head>

<body>

<header>
  <div class="top">

    <div class="logo">
      SayonMart
    </div>

    <div class="search">
      <input
        id="search"
        type="search"
        placeholder="Product খুঁজুন..."
        autocomplete="off">
    </div>

  </div>
</header>


<div class="categories">

  <button onclick="filterCategory('all')">
    সব
  </button>

  <button onclick="filterCategory('Fashion')">
    Fashion
  </button>

  <button onclick="filterCategory('Shoes')">
    Shoes
  </button>

  <button onclick="filterCategory('Mobiles')">
    Mobiles
  </button>

  <button onclick="filterCategory('Watches')">
    Watches
  </button>

</div>


<div id="products" class="grid">

  <div class="loading">
    Product loading...
  </div>

</div>


<div id="toast" class="toast"></div>


<div class="bottom">

  <a href="index.html">
    🏠<br>Home
  </a>

  <a href="products.html">
    🛍️<br>Products
  </a>

  <a href="cart.html">
    🛒 <span id="cartCount" class="badge">0</span><br>Cart
  </a>

  <a href="order.html">
    📦<br>Orders
  </a>

  <a href="profile.html">
    👤<br>Profile
  </a>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const box =
  document.getElementById("products");

const searchBox =
  document.getElementById("search");


let allProducts = [];

let currentCategory = "all";


// ======================================
// CART COUNT
// ======================================

function updateCartCount(){

  try{

    const cart =
      JSON.parse(
        localStorage.getItem("cart") || "[]"
      );

    let total = 0;

    cart.forEach(item => {

      total +=
        Number(item.quantity || 1);

    });

    document.getElementById(
      "cartCount"
    ).textContent = total;

  }catch(error){

    document.getElementById(
      "cartCount"
    ).textContent = "0";

  }

}


updateCartCount();


// ======================================
// IMAGE
// ======================================

function getImage(product){

  if(product.image){

    return product.image;

  }

  if(
    Array.isArray(product.images) &&
    product.images.length > 0
  ){

    return product.images[0];

  }

  return "https://via.placeholder.com/500x500?text=SayonMart";

}


// ======================================
// SAFE TEXT
// ======================================

function safe(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// ======================================
// TOAST
// ======================================

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(()=>{

      toast.style.display =
        "none";

    },1800);

}


// ======================================
// ADD TO CART
// ======================================

window.addToCart =
function(
  id,
  name,
  price,
  image
){

  let cart =
    JSON.parse(
      localStorage.getItem("cart") || "[]"
    );


  const existing =
    cart.find(
      item =>
        String(item.id) === String(id)
    );


  if(existing){

    existing.quantity =
      Number(existing.quantity || 1) + 1;

  }else{

    cart.push({

      id:id,

      name:name,

      price:Number(price) || 0,

      image:image,

      quantity:1

    });

  }


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  updateCartCount();


  showToast(
    "🛒 Cart-এ যোগ হয়েছে"
  );

};


// ======================================
// WISHLIST
// ======================================

window.addWishlist =
function(
  id,
  name,
  price,
  image
){

  let list =
    JSON.parse(
      localStorage.getItem("wishlist") || "[]"
    );


  const exists =
    list.some(
      item =>
        String(item.id) === String(id)
    );


  if(!exists){

    list.push({

      id:id,

      name:name,

      price:Number(price) || 0,

      image:image

    });


    localStorage.setItem(
      "wishlist",
      JSON.stringify(list)
    );


    showToast(
      "❤️ Wishlist-এ যোগ হয়েছে"
    );

  }else{

    showToast(
      "❤️ আগে থেকেই Wishlist-এ আছে"
    );

  }

};


// ======================================
// OPEN PRODUCT
// ======================================

window.openProduct =
function(id){

  if(!id) return;

  location.href =
    "product.html?id=" +
    encodeURIComponent(id);

};


// ======================================
// BUY NOW
// ======================================

window.buyNow =
function(
  id,
  name,
  price,
  image
){

  /*
    IMPORTANT:

    Buy Now-এর product আলাদা করে
    sayonmartBuyNow নামে save হচ্ছে।

    তাই Cart-এর অন্য product
    payment.html-এ যাবে না।
  */


  const buyNowProduct = {

    id:id,

    name:name,

    price:Number(price) || 0,

    image:image,

    quantity:1

  };


  localStorage.setItem(
    "sayonmartBuyNow",
    JSON.stringify(buyNowProduct)
  );


  location.href =
    "payment.html";

};


// ======================================
// SHOW PRODUCTS
// ======================================

function showProducts(list){

  if(!list.length){

    box.innerHTML = `

      <div class="loading">

        Product পাওয়া যায়নি

      </div>

    `;

    return;

  }


  const fragment =
    document.createDocumentFragment();


  list.forEach(product=>{

    const id =
      product.id;


    const name =
      product.name || "Product";


    const price =
      Number(product.price || 0);


    const oldPrice =
      Number(product.oldPrice || 0);


    const image =
      getImage(product);


    const card =
      document.createElement("div");


    card.className =
      "card";


    card.innerHTML = `

      <button
        class="heart"
        type="button">
        ♡
      </button>


      <img
        src="${safe(image)}"
        loading="lazy"
        decoding="async"
        alt="${safe(name)}"
      >


      <div class="info">

        <div class="name">
          ${safe(name)}
        </div>


        <div class="price">
          ₹${price}
        </div>


        ${
          oldPrice > price
          ?
          `<span class="old">
             ₹${oldPrice}
           </span>`
          :
          ""
        }


        <div class="actions">

          <button
            class="cartBtn"
            type="button">

            🛒 Cart

          </button>


          <button
            class="buyBtn"
            type="button">

            Buy Now

          </button>

        </div>

      </div>

    `;


    // =================================
    // PRODUCT DETAILS
    // =================================

    card.addEventListener(
      "click",
      ()=>{

        openProduct(id);

      }
    );


    // =================================
    // CART BUTTON
    // =================================

    card
      .querySelector(".cartBtn")
      .addEventListener(
        "click",
        event=>{

          event.stopPropagation();


          addToCart(
            id,
            name,
            price,
            image
          );

        }
      );


    // =================================
    // BUY NOW BUTTON
    // =================================

    card
      .querySelector(".buyBtn")
      .addEventListener(
        "click",
        event=>{

          event.stopPropagation();


          /*
            এখানে আর addToCart()
            করা হচ্ছে না।

            তাই Cart-এর পুরোনো product
            Buy Now-এর সাথে যাবে না।
          */

          buyNow(
            id,
            name,
            price,
            image
          );

        }
      );


    // =================================
    // WISHLIST BUTTON
    // =================================

    card
      .querySelector(".heart")
      .addEventListener(
        "click",
        event=>{

          event.stopPropagation();


          addWishlist(
            id,
            name,
            price,
            image
          );

        }
      );


    fragment.appendChild(card);

  });


  box.innerHTML = "";

  box.appendChild(fragment);

}


// ======================================
// LOAD FIREBASE PRODUCTS
// ======================================

async function loadProducts(){

  try{

    // আগে cache দেখাও

    const cached =
      localStorage.getItem(
        "sayonmart_products"
      );


    if(cached){

      allProducts =
        JSON.parse(cached);


      showProducts(
        getFilteredProducts()
      );

    }


    // Firebase থেকে update

    const snapshot =
      await getDocs(
        collection(
          db,
          "products"
        )
      );


    const products = [];


    snapshot.forEach(doc=>{

      products.push({

        id:doc.id,

        ...doc.data()

      });

    });


    allProducts =
      products;


    // Cache save

    localStorage.setItem(
      "sayonmart_products",
      JSON.stringify(products)
    );


    showProducts(
      getFilteredProducts()
    );


  }catch(error){

    console.error(error);


    if(!allProducts.length){

      box.innerHTML = `

        <div class="loading">

          Product load হচ্ছে না।<br>

          Internet check করুন।

        </div>

      `;

    }

  }

}


// ======================================
// FILTER
// ======================================

function getFilteredProducts(){

  const text =
    searchBox.value
      .trim()
      .toLowerCase();


  return allProducts.filter(
    product=>{

      const name =
        String(
          product.name || ""
        ).toLowerCase();


      const category =
        String(
          product.category || ""
        );


      const matchSearch =
        !text ||
        name.includes(text);


      const matchCategory =
        currentCategory === "all" ||
        category === currentCategory;


      return (
        matchSearch &&
        matchCategory
      );

    }
  );

}


// ======================================
// CATEGORY
// ======================================

window.filterCategory =
function(category){

  currentCategory =
    category;


  showProducts(
    getFilteredProducts()
  );

};


// ======================================
// SEARCH
// ======================================

searchBox.addEventListener(
  "input",
  ()=>{

    showProducts(
      getFilteredProducts()
    );

  }
);


// ======================================
// START
// ======================================

loadProducts();

</script>

</body>
</html>
