<script type="module">

  import { auth } from "./firebase.js";

  import {
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  onAuthStateChanged(auth, (user) => {

    const adminPanel =
      document.getElementById("adminPanel");

    const adminOrders =
      document.getElementById("adminOrders");


    // সবাই Admin Panel দেখতে পারবে
    if (user) {
      adminPanel.style.display = "flex";
    } else {
      adminPanel.style.display = "none";
    }

    // Admin Orders শুধু Admin দেখতে পারবে
    if (
      user &&
      user.uid === "fqQpbMgWScgUbu5Vco4dJ6WuBVL2"
    ) {
      adminOrders.style.display = "flex";
    } else {
      adminOrders.style.display = "none";
    }

  });


  window.logout = async function(){

    const ok =
      confirm("আপনি কি Logout করতে চান?");

    if(!ok) return;

    try {

      await signOut(auth);

      localStorage.removeItem("user");
      localStorage.removeItem("cart");

      location.href = "login.html";

    } catch(error) {

      alert("Logout হয়নি। আবার চেষ্টা করুন।");

      console.error(error);

    }

  };

</script>
