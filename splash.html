<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SayonMart</title>

<style>
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#000;
  color:#FFD700;
  font-family:Arial,sans-serif;
  flex-direction:column;
}

img{
  width:140px;
  height:140px;
  border-radius:20px;
}

h1{
  margin-top:20px;
}

.loader{
  width:40px;
  height:40px;
  border:4px solid #333;
  border-top:4px solid #FFD700;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin-top:25px;
}

.loading{
  color:#aaa;
  font-size:14px;
  margin-top:12px;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<img src="logo.png" alt="SayonMart Logo">

<h1>SayonMart</h1>

<div class="loader"></div>

<div class="loading">Loading...</div>

<script>
setTimeout(()=>{
  window.location.href="index.html";
},3000);
</script>

</body>
</html>
